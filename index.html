<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LT Soluções</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#171717}.wrap{max-width:720px;margin:auto;padding:24px 14px}.brand{text-align:center;margin:34px 0 24px}.brand b{font-size:29px}.brand div{color:#777;margin-top:5px}.card{background:#fff;border:1px solid #e1e4e8;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.05)}label{font-size:13px;font-weight:700;display:block;margin:12px 0 5px}input{width:100%;min-height:48px;border:1px solid #cbd0d6;border-radius:11px;padding:11px;font-size:16px}.btn{display:block;width:100%;border:0;border-radius:11px;background:#111;color:#fff;padding:14px;font-size:16px;font-weight:800;text-decoration:none;text-align:center;margin-top:14px}.app{display:flex;align-items:center;gap:13px}.ico{font-size:30px;width:45px}.grow{flex:1}.appname{font-size:18px;font-weight:800}.muted{font-size:13px;color:#777;margin-top:4px}.hidden{display:none}.logout{background:#eceef1;color:#222}.section-title{margin:24px 4px 8px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#666}.status{display:inline-block;font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;margin-top:7px}.active{background:#e7f7ed;color:#18733a}.demo{background:#fff4d6;color:#8a5b00}.admin{background:#e9eef8;color:#40577c}</style></head><body><main class="wrap"><div class="brand"><b>LT SOLUÇÕES</b><div>Para seu empreendimento.</div></div>
<section id="login" class="card"><h2>Acesso</h2><div class="muted">Entre com o usuário e a senha fornecidos pela LT Soluções.</div><label>Usuário</label><input id="user" autocomplete="username"><label>Senha</label><input id="pass" type="password" autocomplete="current-password"><button class="btn" onclick="enter()">Entrar</button><div id="err" class="muted" style="color:#a11;margin-top:10px"></div></section>
<section id="panel" class="hidden"><div class="card"><b>Painel LT Soluções</b><div class="muted">Gerencie produtos ativos, demonstrações e solicitações.</div></div><div id="apps"></div><button class="btn logout" onclick="logout()">Sair</button></section></main>
<script>
var USERS={admin:{p:'lt2026',apps:['distribui','barbearia','demoDistribui','demoBarbearia','solicitacoes']},marcio:{p:'marcio2026',apps:['distribui']},barbearia:{p:'maeefilho2026',apps:['barbearia']}};
var APPS={distribui:{name:'Marcio Bebidas',desc:'Distribuidora · pedidos, clientes, produtos, estoque e financeiro',icon:'📦',url:'./distribui.html'},barbearia:{name:'Barbearia Mãe e Filho',desc:'Agenda, barbeiros, serviços e agendamentos',icon:'✂️',url:'./clientes/barbearia-01/?v=20260928-59'},demoDistribui:{name:'Demo Distribuidora',desc:'Demonstração comercial · produtos, pedidos, estoque e financeiro',icon:'🧪',url:'./demo/distribuidora/'},demoBarbearia:{name:'Demo Barbearia',desc:'Demonstração comercial · agenda, serviços e agendamentos',icon:'🧪',url:'./demo/barbearia/'},solicitacoes:{name:'Solicitações de Sistemas',desc:'Questionários recebidos de novos clientes · acesso administrativo',icon:'📋',url:'./solicitacoes-admin.html?from=admin'}};
function enter(){var u=user.value.trim().toLowerCase(),x=USERS[u];if(!x||pass.value!==x.p){err.textContent='Usuário ou senha incorretos.';return}sessionStorage.setItem('lt_user',u);show(u)}
function appCard(k,status,cls){var a=APPS[k];return '<div class="card app"><div class="ico">'+a.icon+'</div><div class="grow"><div class="appname">'+a.name+'</div><div class="muted">'+a.desc+'</div><span class="status '+cls+'">'+status+'</span><a class="btn" href="'+a.url+'">Acessar</a></div></div>'}function show(u){var x=USERS[u];if(!x)return;login.classList.add('hidden');panel.classList.remove('hidden');if(u==='admin'){apps.innerHTML='<div class="section-title">Produtos ativos</div>'+appCard('distribui','ATIVO','active')+appCard('barbearia','ATIVO','active')+'<div class="section-title">Produtos para demonstração</div>'+appCard('demoDistribui','DEMONSTRAÇÃO','demo')+appCard('demoBarbearia','DEMONSTRAÇÃO','demo')+'<div class="section-title">Administração</div>'+appCard('solicitacoes','ADMINISTRATIVO','admin')}else{apps.innerHTML=x.apps.map(function(k){return appCard(k,'ATIVO','active')}).join('')}}
function logout(){sessionStorage.removeItem('lt_user');location.reload()}var current=sessionStorage.getItem('lt_user');if(current&&USERS[current])show(current);
</script></body></html>
