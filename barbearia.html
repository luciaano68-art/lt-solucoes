<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LT Agenda Barbearia</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#15171a}header{background:#101820;color:white;padding:18px}.wrap{max-width:1180px;margin:auto}.brand{font-size:22px;font-weight:900}.tag{font-size:12px;opacity:.7;margin-top:3px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:#101820;color:#fff}.btn.soft{background:#e9edf1;color:#15171a}.btn.ok{background:#e8f7ee;color:#176b39}.btn.danger{background:#fdeaea;color:#a92323}.card{background:white;border:1px solid #e1e4e8;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #1018200c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric b{display:block;font-size:24px;margin-top:8px}.muted{color:#69717a}.hero{display:flex;justify-content:space-between;gap:14px;align-items:center}.public{max-width:680px;margin:22px auto}.service{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin:8px 0}.slots{display:flex;gap:8px;flex-wrap:wrap}.slot{border:1px solid #ccd2d8;background:#fff;border-radius:9px;padding:9px 11px;cursor:pointer}.slot.sel{background:#101820;color:white}.slot.busy{opacity:.35;cursor:not-allowed}input,select{width:100%;padding:11px;border:1px solid #d7dce1;border-radius:9px;margin:5px 0 12px}label{font-size:12px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left}th{font-size:11px;text-transform:uppercase;color:#6b7280}.modalbg{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:12px;border-radius:10px;background:#eef8f2;color:#176b39;margin:10px 0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}.wrap{padding-left:13px;padding-right:13px}table{font-size:13px}}
</style></head><body>
<header><div class="wrap"><div class="brand">LT AGENDA · BARBEARIA</div><div class="tag">LT Soluções · Para seu empreendimento.</div></div></header>
<div class="wrap" id="app"></div><div id="modal"></div>
<script>
const KEY='lt_agenda_barbearia_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 business:{name:'Barbearia Modelo',phone:'(49) 99999-9999',address:'Centro',open:'09:00',close:'19:00',interval:30},
 barbers:[{id:1,name:'Carlos',active:true},{id:2,name:'Rafael',active:true}],
 services:[{id:1,name:'Corte',duration:30,price:40,active:true},{id:2,name:'Barba',duration:30,price:30,active:true},{id:3,name:'Corte + Barba',duration:60,price:65,active:true}],
 appointments:[],clients:[],blocks:[]
};
if(!db.business.days) db.business.days=[1,2,3,4,5,6];
if(!db.business.lunchStart) db.business.lunchStart='12:00';
if(!db.business.lunchEnd) db.business.lunchEnd='13:30';
db.barbers.forEach(b=>{if(!b.schedule)b.schedule={days:null,open:'',lunchStart:'',lunchEnd:'',close:''}});
let view='admin',tab='today',selectedSlot='';
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const money=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>new Date().toISOString().slice(0,10);
function nav(){return '<div class="tabs"><button class="btn '+(view==='admin'?'':'soft')+'" onclick="view=\'admin\';render()">Painel do barbeiro</button><button class="btn '+(view==='public'?'':'soft')+'" onclick="view=\'public\';render()">Página do cliente</button></div>'}
function render(){app.innerHTML=nav()+(view==='public'?publicPage():adminPage())}
function adminPage(){let t=today(),aps=db.appointments.filter(a=>a.date===t&&a.status!=='Cancelado'),done=aps.filter(a=>a.status==='Atendido'),rev=done.reduce((s,a)=>s+a.price,0);
return '<div class="hero"><div><h1>'+db.business.name+'</h1><div class="muted">Agenda e gestão da barbearia</div></div><button class="btn" onclick="manualBooking()">+ Agendamento</button></div>'+
'<div class="grid"><div class="card metric">Agendamentos hoje<b>'+aps.length+'</b></div><div class="card metric">Atendidos<b>'+done.length+'</b></div><div class="card metric">Faturamento hoje<b>'+money(rev)+'</b></div><div class="card metric">Clientes<b>'+db.clients.length+'</b></div></div>'+
'<div class="tabs"><button class="btn '+(tab==='today'?'':'soft')+'" onclick="tab=\'today\';render()">Agenda</button><button class="btn '+(tab==='services'?'':'soft')+'" onclick="tab=\'services\';render()">Serviços</button><button class="btn '+(tab==='barbers'?'':'soft')+'" onclick="tab=\'barbers\';render()">Barbeiros</button><button class="btn '+(tab==='clients'?'':'soft')+'" onclick="tab=\'clients\';render()">Clientes</button><button class="btn '+(tab==='settings'?'':'soft')+'" onclick="tab=\'settings\';render()">Configurações</button></div>'+({today:agenda,services,barbers,clients,settings}[tab])()}
function agenda(){let a=db.appointments.slice().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));return '<div class="card"><div class="hero"><div><h2>Agenda</h2><div class="muted">Próximos horários</div></div><button class="btn soft" onclick="blockTime()">Bloquear horário</button></div><table><tr><th>Data</th><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Barbeiro</th><th>Status</th><th>Ações</th></tr>'+ (a.length?a.map(x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+x.time+'</td><td>'+x.client+'</td><td>'+x.service+'</td><td>'+x.barber+'</td><td>'+x.status+'</td><td><select onchange="setStatus('+x.id+',this.value)"><option>'+x.status+'</option>'+['Agendado','Confirmado','Atendido','Cancelado','Não compareceu'].filter(s=>s!==x.status).map(s=>'<option>'+s+'</option>').join('')+'</select></td></tr>').join(''):'<tr><td colspan="7">Nenhum agendamento ainda.</td></tr>')+'</table></div>'}
function services(){return '<div class="hero"><div><h2>Serviços</h2><div class="muted">Preço e duração definem os horários disponíveis.</div></div><button class="btn" onclick="editService()">+ Serviço</button></div><div class="card">'+db.services.filter(s=>s.active).map(s=>'<div class="service"><div><b>'+s.name+'</b><div class="muted">'+s.duration+' min · '+money(s.price)+'</div></div><div><button class="btn soft" onclick="editService('+s.id+')">Editar</button> <button class="btn danger" onclick="disableService('+s.id+')">Inativar</button></div></div>').join('')+'</div>'}
function barbers(){let active=db.barbers.filter(b=>b.active!==false),inactive=db.barbers.filter(b=>b.active===false);return '<div class="hero"><div><h2>Barbeiros</h2><div class="muted">Cada profissional pode ter sua própria jornada e agenda.</div></div><button class="btn" onclick="editBarber()">+ Barbeiro</button></div><div class="card">'+active.map(b=>'<div class="service"><div><b>'+b.name+'</b><div class="muted">'+barberScheduleText(b)+'</div></div><div><button class="btn soft" onclick="editBarber('+b.id+')">Editar</button> <button class="btn danger" onclick="disableBarber('+b.id+')">Inativar</button> <button class="btn danger" onclick="deleteBarber('+b.id+')">Excluir</button></div></div>').join('')+(inactive.length?'<h3>Inativos</h3>'+inactive.map(b=>'<div class="service"><b>'+b.name+'</b><div><button class="btn ok" onclick="reactivateBarber('+b.id+')">Reativar</button> <button class="btn soft" onclick="editBarber('+b.id+')">Editar</button> <button class="btn danger" onclick="deleteBarber('+b.id+')">Excluir</button></div></div>').join(''):'')+'</div>'}
function clients(){return '<div class="card"><h2>Clientes</h2><table><tr><th>Nome</th><th>WhatsApp</th><th>Visitas</th><th>Último atendimento</th></tr>'+db.clients.map(c=>{let a=db.appointments.filter(x=>x.phone===c.phone),last=a.length?a.slice().sort((x,y)=>y.date.localeCompare(x.date))[0].date:'-';return '<tr><td>'+c.name+'</td><td>'+c.phone+'</td><td>'+a.length+'</td><td>'+(last==='-'?'-':fmtDate(last))+'</td></tr>'}).join('')+'</table></div>'}
function settings(){let b=db.business,days=[['Dom',0],['Seg',1],['Ter',2],['Qua',3],['Qui',4],['Sex',5],['Sáb',6]];return '<div class="card"><h2>Configurações da barbearia</h2><div class="row"><div><label>Nome da barbearia</label><input id="bn" value="'+b.name+'"></div><div><label>WhatsApp</label><input id="bp" value="'+b.phone+'"></div><div><label>Endereço</label><input id="ba" value="'+b.address+'"></div><div><label>Intervalo para formar horários (min)</label><input id="bi" type="number" value="'+b.interval+'"></div></div><h3>Dias de atendimento</h3><div class="tabs">'+days.map(d=>'<label class="btn soft"><input style="width:auto;margin:0 6px 0 0" type="checkbox" class="workday" value="'+d[1]+'" '+(b.days.includes(d[1])?'checked':'')+'>'+d[0]+'</label>').join('')+'</div><h3>Horário padrão</h3><div class="row"><div><label>Abre</label><input id="bo" type="time" value="'+b.open+'"></div><div><label>Fecha para almoço</label><input id="bls" type="time" value="'+b.lunchStart+'"></div><div><label>Retorna do almoço</label><input id="ble" type="time" value="'+b.lunchEnd+'"></div><div><label>Fecha o expediente</label><input id="bc" type="time" value="'+b.close+'"></div></div><p class="muted">Cada barbeiro também pode ter horários próprios. Se não preencher no barbeiro, será usado este horário padrão.</p><button class="btn" onclick="saveSettings()">Salvar configurações</button></div>'}
function publicPage(){let b=db.business;return '<div class="public"><div class="card"><h1>'+b.name+'</h1><div class="muted">'+b.address+' · '+b.phone+'</div><h2>Agende seu horário</h2><p class="muted">Escolha o serviço, profissional e horário. Cadastro rápido, sem senha.</p><label>Seu nome</label><input id="pubName" placeholder="Nome"><label>WhatsApp</label><input id="pubPhone" placeholder="(00) 00000-0000"><label>Serviço</label><select id="pubService" onchange="selectedSlot=\'\';drawSlots()">'+db.services.filter(s=>s.active).map(s=>'<option value="'+s.id+'">'+s.name+' · '+s.duration+' min · '+money(s.price)+'</option>').join('')+'</select><label>Barbeiro</label><select id="pubBarber" onchange="selectedSlot=\'\';drawSlots()">'+db.barbers.filter(b=>b.active).map(b=>'<option value="'+b.id+'">'+b.name+'</option>').join('')+'</select><label>Data</label><input id="pubDate" type="date" min="'+today()+'" value="'+today()+'" onchange="selectedSlot=\'\';drawSlots()"><label>Horários disponíveis</label><div id="slots" class="slots"></div><button class="btn" style="width:100%;margin-top:18px" onclick="bookPublic()">Confirmar agendamento</button></div></div>'}
function drawSlots(){let el=document.getElementById('slots');if(!el)return;let date=pubDate.value,barber=db.barbers.find(b=>b.id==pubBarber.value),service=db.services.find(s=>s.id==pubService.value);if(!barber||!service)return;let sch=getSchedule(barber),dow=new Date(date+'T12:00:00').getDay();if(!sch.days.includes(dow)){el.innerHTML='<span class="muted">Não há atendimento neste dia.</span>';return}let slots=makeDaySlots(sch,service.duration);el.innerHTML=slots.length?slots.map(t=>{let busy=isBusy(date,t,barber.id,service.duration);return '<button class="slot '+(busy?'busy ':'')+(selectedSlot===t?'sel':'')+'" '+(busy?'disabled':'onclick="selectedSlot=\''+t+'\';drawSlots()"')+'>'+t+'</button>'}).join(''):'<span class="muted">Nenhum horário disponível.</span>'}
function isBusy(date,time,barber,duration){let start=min(time),end=start+duration;return db.appointments.some(a=>a.date===date&&a.barberId===barber&&a.status!=='Cancelado'&&overlap(start,end,min(a.time),min(a.time)+a.duration))||db.blocks.some(b=>b.date===date&&b.barberId===barber&&overlap(start,end,min(b.start),min(b.end)))}
function overlap(a,b,c,d){return a<d&&c<b}function min(t){let x=t.split(':').map(Number);return x[0]*60+x[1]}function hm(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function getSchedule(b){let x=b.schedule||{},g=db.business;return {days:Array.isArray(x.days)?x.days:g.days,open:x.open||g.open,lunchStart:x.lunchStart||g.lunchStart,lunchEnd:x.lunchEnd||g.lunchEnd,close:x.close||g.close,interval:+g.interval||30}}
function makeDaySlots(sch,duration){let r=[],step=sch.interval||30;for(let n=min(sch.open);n+duration<=min(sch.close);n+=step){let e=n+duration;if(sch.lunchStart&&sch.lunchEnd&&overlap(n,e,min(sch.lunchStart),min(sch.lunchEnd)))continue;r.push(hm(n))}return r}
function barberScheduleText(b){let s=getSchedule(b);return s.open+'–'+s.lunchStart+' / '+s.lunchEnd+'–'+s.close}
function bookPublic(){let name=pubName.value.trim(),phone=pubPhone.value.trim(),s=db.services.find(x=>x.id==pubService.value),b=db.barbers.find(x=>x.id==pubBarber.value),date=pubDate.value;if(!name||!phone||!selectedSlot)return alert('Informe nome, WhatsApp e escolha um horário.');if(isBusy(date,selectedSlot,b.id,s.duration))return alert('Esse horário acabou de ficar indisponível. Escolha outro.');addAppointment(name,phone,s,b,date,selectedSlot);selectedSlot='';render();setTimeout(()=>{view='public';render();alert('Agendamento confirmado para '+fmtDate(date)+' às '+db.appointments.at(-1).time+'.');},0)}
function addAppointment(name,phone,s,b,date,time){if(!db.clients.some(c=>c.phone===phone))db.clients.push({id:Date.now(),name,phone});db.appointments.push({id:Date.now()+1,client:name,phone,serviceId:s.id,service:s.name,barberId:b.id,barber:b.name,date,time,duration:s.duration,price:s.price,status:'Agendado'});save()}
function manualBooking(){openM('<h2>Novo agendamento</h2><label>Cliente</label><input id="mn"><label>WhatsApp</label><input id="mp"><label>Serviço</label><select id="ms">'+db.services.filter(s=>s.active).map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('')+'</select><label>Barbeiro</label><select id="mb">'+db.barbers.filter(b=>b.active).map(b=>'<option value="'+b.id+'">'+b.name+'</option>').join('')+'</select><div class="row"><div><label>Data</label><input id="md" type="date" value="'+today()+'"></div><div><label>Hora</label><input id="mt" type="time"></div></div><button class="btn" onclick="saveManual()">Salvar</button>')}
function saveManual(){let s=db.services.find(x=>x.id==ms.value),b=db.barbers.find(x=>x.id==mb.value);if(!mn.value||!mp.value||!mt.value)return alert('Preencha os dados.');if(isBusy(md.value,mt.value,b.id,s.duration))return alert('Horário indisponível para este barbeiro.');addAppointment(mn.value,mp.value,s,b,md.value,mt.value);closeM();render()}
function blockTime(){openM('<h2>Bloquear horário</h2><label>Barbeiro</label><select id="bb">'+db.barbers.filter(b=>b.active).map(b=>'<option value="'+b.id+'">'+b.name+'</option>').join('')+'</select><label>Data</label><input id="bd" type="date" value="'+today()+'"><div class="row"><div><label>Início</label><input id="bs" type="time"></div><div><label>Fim</label><input id="be" type="time"></div></div><label>Motivo</label><input id="br" placeholder="Almoço, folga, compromisso..."><button class="btn" onclick="saveBlock()">Bloquear</button>')}
function saveBlock(){if(!bs.value||!be.value)return alert('Informe início e fim.');db.blocks.push({id:Date.now(),barberId:+bb.value,date:bd.value,start:bs.value,end:be.value,reason:br.value});save();closeM();render()}
function setStatus(id,s){db.appointments.find(a=>a.id===id).status=s;save();render()}
function editService(id){let s=id?db.services.find(x=>x.id===id):{name:'',duration:30,price:0};openM('<h2>Serviço</h2><label>Nome</label><input id="sn" value="'+s.name+'"><label>Duração (min)</label><input id="sd" type="number" value="'+s.duration+'"><label>Preço</label><input id="sp" type="number" step=".01" value="'+s.price+'"><button class="btn" onclick="saveService('+(id||0)+')">Salvar</button>')}
function saveService(id){let o={name:sn.value,duration:+sd.value,price:+sp.value};if(id)Object.assign(db.services.find(x=>x.id===id),o);else db.services.push({id:Date.now(),...o,active:true});save();closeM();render()}function disableService(id){db.services.find(x=>x.id===id).active=false;save();render()}
function editBarber(id){let b=id?db.barbers.find(x=>x.id===id):{name:'',schedule:{days:null,open:'',lunchStart:'',lunchEnd:'',close:''}},sc=b.schedule||{},days=[['Dom',0],['Seg',1],['Ter',2],['Qua',3],['Qui',4],['Sex',5],['Sáb',6]],own=Array.isArray(sc.days);openM('<h2>'+(id?'Editar':'Novo')+' barbeiro</h2><label>Nome</label><input id="barbn" value="'+b.name+'"><h3>Horários próprios</h3><p class="muted">Deixe os horários vazios para usar o padrão da barbearia.</p><div class="tabs">'+days.map(d=>'<label class="btn soft"><input style="width:auto;margin:0 6px 0 0" type="checkbox" class="barberday" value="'+d[1]+'" '+((own?sc.days:db.business.days).includes(d[1])?'checked':'')+'>'+d[0]+'</label>').join('')+'</div><div class="row"><div><label>Abre</label><input id="barbo" type="time" value="'+(sc.open||'')+'"></div><div><label>Fecha para almoço</label><input id="barbls" type="time" value="'+(sc.lunchStart||'')+'"></div><div><label>Retorna do almoço</label><input id="barble" type="time" value="'+(sc.lunchEnd||'')+'"></div><div><label>Fecha expediente</label><input id="barbc" type="time" value="'+(sc.close||'')+'"></div></div><button class="btn" onclick="saveBarber('+(id||0)+')">Salvar</button>')}
function saveBarber(id){let days=[...document.querySelectorAll('.barberday:checked')].map(x=>+x.value),o={name:barbn.value,schedule:{days,open:barbo.value,lunchStart:barbls.value,lunchEnd:barble.value,close:barbc.value}};if(id)Object.assign(db.barbers.find(x=>x.id===id),o);else db.barbers.push({id:Date.now(),...o,active:true});save();closeM();render()}
function disableBarber(id){db.barbers.find(x=>x.id===id).active=false;save();render()}
function reactivateBarber(id){db.barbers.find(x=>x.id===id).active=true;save();render()}
function deleteBarber(id){let b=db.barbers.find(x=>x.id===id),has=db.appointments.some(a=>a.barberId===id);if(has)return alert('Este barbeiro possui histórico de agendamentos. Para preservar o histórico, use Inativar.');if(confirm('Excluir '+b.name+' definitivamente?')){db.barbers=db.barbers.filter(x=>x.id!==id);save();render()}}
function saveSettings(){db.business={...db.business,name:bn.value,phone:bp.value,address:ba.value,interval:+bi.value,open:bo.value,lunchStart:bls.value,lunchEnd:ble.value,close:bc.value,days:[...document.querySelectorAll('.workday:checked')].map(x=>+x.value)};save();render()}
function fmtDate(d){if(!d)return '';let [y,m,dd]=d.split('-');return dd+'/'+m+'/'+y}
function openM(h){modal.innerHTML='<div class="modalbg" onclick="if(event.target===this)closeM()"><div class="modal">'+h+'<div style="margin-top:12px"><button class="btn soft" onclick="closeM()">Fechar</button></div></div></div>'}function closeM(){modal.innerHTML=''}
render();setTimeout(drawSlots,0);
</script></body></html>
