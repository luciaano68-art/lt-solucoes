<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marcio Bebidas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f7fb;color:#111827}header{background:#111827;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px}.sub{font-size:11px;opacity:.7}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 67px)}nav{background:#fff;border-right:1px solid #e5e7eb;padding:12px}nav button{width:100%;padding:11px;border:0;background:transparent;text-align:left;border-radius:9px;font-weight:700}nav button:hover{background:#eef2f7}main{padding:22px;max-width:1300px;width:100%}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric b{display:block;font-size:22px;margin-top:8px}.muted{color:#6b7280}.btn{border:0;background:#111827;color:#fff;padding:10px 13px;border-radius:9px;font-weight:800;cursor:pointer}.soft{background:#eef2f7;color:#111827}.danger{background:#fee2e2;color:#b91c1c}.ok{background:#ecfdf5;color:#166534}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}th{font-size:11px;color:#6b7280;text-transform:uppercase}.actions{display:flex;gap:6px;flex-wrap:wrap}.modalbg{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#fff;border-radius:15px;padding:18px;width:min(620px,100%);max-height:90vh;overflow:auto}input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:4px 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:800px){.layout{display:block}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid #ddd}nav button{min-width:120px}.grid{grid-template-columns:1fr 1fr}main{padding:14px}.hero{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}}
</style></head><body>
<header><div><div class="brand">MARCIO BEBIDAS</div><div class="sub">LT Soluções · Para seu empreendimento</div></div><div id="company"></div></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div><div id="modal"></div>
<script>
const K='lt_distribui_online_test_v1';let db=JSON.parse(localStorage.getItem(K)||'null')||{company:'Marcio Bebidas',customers:[{id:1,name:'Mercado Avenida',area:'Centro',phone:'(49) 99999-1001',active:true},{id:2,name:'Bar do João',area:'Centro',phone:'(49) 99999-1002',active:true}],products:[{id:1,name:'Coca-Cola 2L',sku:'COCA2L',cost:6.2,price:9,stock:52,active:true},{id:2,name:'Heineken Long Neck',sku:'HEI330',cost:5.1,price:7.5,stock:48,active:true}],orders:[],payables:[],receivables:[]};let page='home';
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),save=()=>localStorage.setItem(K,JSON.stringify(db)),ac=()=>db.customers.filter(x=>x.active!==false),ap=()=>db.products.filter(x=>x.active!==false);
const pages=[['home','Início'],['orders','Pedidos'],['customers','Clientes'],['products','Produtos'],['stock','Estoque'],['finance','Financeiro']];
function go(p){page=p;render()}function render(){company.textContent=db.company;nav.innerHTML=pages.map(x=>'<button onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');main.innerHTML=({home,orders,customers,products,stock,finance}[page])()}
function home(){let sales=db.orders.reduce((s,o)=>s+o.total,0),cost=db.orders.reduce((s,o)=>s+o.cost,0);return '<div class="hero"><div><h1>Início</h1><div class="muted">Ambiente online de testes</div></div><button class="btn" onclick="go(\'orders\')">+ Novo pedido</button></div><div class="grid"><div class="card metric"><span>Vendas</span><b>'+R(sales)+'</b></div><div class="card metric"><span>Lucro bruto</span><b>'+R(sales-cost)+'</b></div><div class="card metric"><span>Clientes ativos</span><b>'+ac().length+'</b></div><div class="card metric"><span>Produtos ativos</span><b>'+ap().length+'</b></div></div><div class="card"><b>LT Soluções online</b><p class="muted">Teste separado do Tessaro Cotações. Os dados desta primeira publicação ficam neste navegador enquanto conectamos o banco LT Soluções.</p></div>'}
function customers(){return '<div class="hero"><div><h1>Clientes</h1><div class="muted">Ativos: '+ac().length+'</div></div><div class="actions"><button class="btn soft" onclick="inactiveCustomers()">Inativos ('+db.customers.filter(x=>x.active===false).length+')</button><button class="btn" onclick="editCustomer()">+ Cliente</button></div></div><div class="card"><table><tr><th>Cliente</th><th>Praça</th><th>Telefone</th><th>Ações</th></tr>'+ac().map(c=>'<tr><td>'+c.name+'</td><td>'+c.area+'</td><td>'+c.phone+'</td><td><div class="actions"><button class="btn soft" onclick="editCustomer('+c.id+')">Editar</button><button class="btn danger" onclick="deactivateCustomer('+c.id+')">Inativar</button></div></td></tr>').join('')+'</table></div>'}
function editCustomer(id){let c=id?db.customers.find(x=>x.id===id):{name:'',area:'',phone:'',active:true};openM('<h2>'+(id?'Editar':'Novo')+' cliente</h2><label>Nome</label><input id="cn" value="'+c.name+'"><label>Praça</label><input id="ca" value="'+c.area+'"><label>Telefone</label><input id="cp" value="'+c.phone+'"><button class="btn" onclick="saveCustomer('+(id||0)+')">Salvar</button>')}
function saveCustomer(id){let o={name:cn.value,area:ca.value,phone:cp.value};if(id)Object.assign(db.customers.find(x=>x.id===id),o);else db.customers.push({id:Date.now(),...o,active:true});save();closeM();render()}
function deactivateCustomer(id){let c=db.customers.find(x=>x.id===id);if(confirm('Inativar '+c.name+'? O histórico será mantido.')){c.active=false;save();render()}}
function inactiveCustomers(){let a=db.customers.filter(x=>x.active===false);openM('<h2>Clientes inativos</h2>'+(a.length?a.map(c=>'<div class="card"><b>'+c.name+'</b><div class="actions" style="margin-top:8px"><button class="btn ok" onclick="reactCustomer('+c.id+')">Reativar</button><button class="btn soft" onclick="editCustomer('+c.id+')">Editar</button></div></div>').join(''):'<p>Nenhum cliente inativo.</p>'))}
function reactCustomer(id){db.customers.find(x=>x.id===id).active=true;save();closeM();render()}
function products(){return '<div class="hero"><div><h1>Produtos</h1><div class="muted">Cadastro e preços</div></div><div class="actions"><button class="btn soft" onclick="inactiveProducts()">Inativos ('+db.products.filter(x=>x.active===false).length+')</button><button class="btn" onclick="editProduct()">+ Produto</button></div></div><div class="card"><table><tr><th>Produto</th><th>SKU</th><th>Custo</th><th>Venda</th><th>Estoque</th><th>Ações</th></tr>'+ap().map(p=>'<tr><td>'+p.name+'</td><td>'+p.sku+'</td><td>'+R(p.cost)+'</td><td>'+R(p.price)+'</td><td>'+p.stock+'</td><td><div class="actions"><button class="btn soft" onclick="editProduct('+p.id+')">Editar</button><button class="btn danger" onclick="deactivateProduct('+p.id+')">Inativar</button></div></td></tr>').join('')+'</table></div>'}
function editProduct(id){let p=id?db.products.find(x=>x.id===id):{name:'',sku:'',cost:0,price:0,stock:0};openM('<h2>'+(id?'Editar':'Novo')+' produto</h2><div class="row"><div><label>Produto</label><input id="pn" value="'+p.name+'"></div><div><label>SKU</label><input id="ps" value="'+p.sku+'"></div><div><label>Custo</label><input id="pc" type="number" step=".01" value="'+p.cost+'"></div><div><label>Venda</label><input id="pp" type="number" step=".01" value="'+p.price+'"></div><div><label>Estoque</label><input id="pe" type="number" value="'+p.stock+'"></div></div><button class="btn" onclick="saveProduct('+(id||0)+')">Salvar</button>')}
function saveProduct(id){let o={name:pn.value,sku:ps.value,cost:+pc.value,price:+pp.value,stock:+pe.value};if(id)Object.assign(db.products.find(x=>x.id===id),o);else db.products.push({id:Date.now(),...o,active:true});save();closeM();render()}
function deactivateProduct(id){let p=db.products.find(x=>x.id===id);if(confirm('Inativar '+p.name+'? O histórico será mantido.')){p.active=false;save();render()}}
function inactiveProducts(){let a=db.products.filter(x=>x.active===false);openM('<h2>Produtos inativos</h2>'+(a.length?a.map(p=>'<div class="card"><b>'+p.name+'</b><div class="actions" style="margin-top:8px"><button class="btn ok" onclick="reactProduct('+p.id+')">Reativar</button><button class="btn soft" onclick="editProduct('+p.id+')">Editar</button></div></div>').join(''):'<p>Nenhum produto inativo.</p>'))}
function reactProduct(id){db.products.find(x=>x.id===id).active=true;save();closeM();render()}
function orders(){return '<div class="hero"><div><h1>Pedidos</h1><div class="muted">Venda rápida</div></div><button class="btn" onclick="newOrder()">+ Novo pedido</button></div><div class="card"><table><tr><th>#</th><th>Cliente</th><th>Total</th><th>Data</th></tr>'+(db.orders.length?db.orders.slice().reverse().map(o=>'<tr><td>'+o.id+'</td><td>'+o.customer+'</td><td>'+R(o.total)+'</td><td>'+o.date+'</td></tr>').join(''):'<tr><td colspan="4">Nenhum pedido.</td></tr>')+'</table></div>'}
function newOrder(){if(!ac().length||!ap().length)return alert('Cadastre cliente e produto ativos.');openM('<h2>Novo pedido</h2><label>Cliente</label><select id="oc">'+ac().map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select><label>Produto</label><select id="op">'+ap().map(p=>'<option value="'+p.id+'">'+p.name+' - '+R(p.price)+'</option>').join('')+'</select><label>Quantidade</label><input id="oq" type="number" value="1" min="1"><label>Desconto %</label><input id="od" type="number" value="0"><button class="btn" onclick="finishOrder()">Finalizar pedido</button>')}
function finishOrder(){let c=db.customers.find(x=>x.id==oc.value),p=db.products.find(x=>x.id==op.value),q=+oq.value,d=+od.value;if(q<=0||q>p.stock)return alert('Quantidade inválida ou estoque insuficiente.');let total=p.price*q*(1-d/100),cost=p.cost*q;p.stock-=q;db.orders.push({id:Date.now(),customer:c.name,total,cost,date:new Date().toLocaleString('pt-BR')});save();closeM();render();alert('Pedido finalizado.')}
function stock(){return '<div class="hero"><div><h1>Estoque</h1><div class="muted">Produtos ativos</div></div><button class="btn" onclick="stockEntry()">+ Entrada</button></div><div class="card"><table><tr><th>Produto</th><th>Estoque</th><th>Custo</th></tr>'+ap().map(p=>'<tr><td>'+p.name+'</td><td>'+p.stock+'</td><td>'+R(p.cost)+'</td></tr>').join('')+'</table></div>'}
function stockEntry(){openM('<h2>Entrada de estoque</h2><label>Produto</label><select id="sp">'+ap().map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'</select><label>Quantidade</label><input id="sq" type="number" value="1"><button class="btn" onclick="saveStock()">Salvar entrada</button>')}
function saveStock(){let p=db.products.find(x=>x.id==sp.value);p.stock+=+sq.value;save();closeM();render()}
function finance(){let sales=db.orders.reduce((s,o)=>s+o.total,0),cost=db.orders.reduce((s,o)=>s+o.cost,0);return '<div class="hero"><div><h1>Financeiro</h1><div class="muted">Resumo de testes</div></div></div><div class="grid"><div class="card metric"><span>Faturamento</span><b>'+R(sales)+'</b></div><div class="card metric"><span>Custo</span><b>'+R(cost)+'</b></div><div class="card metric"><span>Lucro bruto</span><b>'+R(sales-cost)+'</b></div><div class="card metric"><span>Margem</span><b>'+(sales?((sales-cost)/sales*100).toFixed(1):0)+'%</b></div></div>'}
function openM(h){modal.innerHTML='<div class="modalbg" onclick="if(event.target===this)closeM()"><div class="modal">'+h+'<div style="margin-top:12px"><button class="btn soft" onclick="closeM()">Fechar</button></div></div></div>'}function closeM(){modal.innerHTML=''}render();
</script></body></html>
