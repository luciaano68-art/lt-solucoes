function go(p){page=p;render()}function render(){company.textContent=db.company;nav.innerHTML=pages.map(x=>'<button onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');main.innerHTML=({home,orders,customers,routes,priceTables,products,categories,stock,finance}[page])()}
const weekDays=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function todaySent(customerId){let d=new Date().toISOString().slice(0,10);return (db.sentLinks||[]).some(x=>String(x.customerId)===String(customerId)&&(x.sentAt||'').slice(0,10)===d)}
function todayBought(name){let d=new Date().toLocaleDateString('en-CA');return (db.remoteOrders||[]).some(o=>o.client_name===name&&(o.created_at||'').slice(0,10)===d)}

if(!db.areas){let names=[...new Set(db.customers.map(x=>(x.area||'').trim()).filter(Boolean))];db.areas=names.map((name,i)=>({id:Date.now()+i,name,active:true}));db.customers.forEach(x=>{let a=db.areas.find(y=>y.name.toLowerCase()===(x.area||'').trim().toLowerCase());x.areaId=a?a.id:null});save()}

function buildOrderPdf(id){let o=db.orders.find(x=>x.id===id);if(!o||!window.jspdf)return null;let {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),y=16;doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('MARCIO BEBIDAS',14,y);y+=7;doc.setFontSize(11);doc.text('PEDIDO #'+o.id,14,y);y+=7;doc.setFont('helvetica','normal');doc.text('Cliente: '+o.customer,14,y);y+=5;if(o.area){doc.text('Praca: '+o.area,14,y);y+=5}doc.text('Data: '+(o.date||''),14,y);y+=8;doc.setFont('helvetica','bold');doc.text('Produto',14,y);doc.text('Qtd.',125,y);doc.text('Unit.',145,y);doc.text('Total',175,y,{align:'right'});y+=3;doc.line(14,y,196,y);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(9);(o.items||[]).forEach(i=>{if(y>275){doc.addPage();y=16}let name=doc.splitTextToSize(i.name+' ('+(i.unit||'')+')',105);doc.text(name,14,y);doc.text(String(i.qty),128,y,{align:'right'});doc.text(R(i.unitPrice),160,y,{align:'right'});doc.text(R(i.qty*i.unitPrice),196,y,{align:'right'});y+=Math.max(5,name.length*4)});y+=3;doc.line(14,y,196,y);y+=7;doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('TOTAL: '+R(o.total),196,y,{align:'right'});if(o.notes){y+=8;doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize('Observacao: '+o.notes,180),14,y)}return {doc,name:'pedido-marcio-'+o.id+'.pdf',order:o}}

async function shareOrderPdf(id){let x=buildOrderPdf(id);if(!x)return alert('Não foi possível gerar o PDF.');let blob=x.doc.output('blob'),file=new File([blob],x.name,{type:'application/pdf'}),cl=db.customers.find(z=>String(z.id)===String(x.order.customerId)),phone=String(cl&&cl.phone||'').replace(/\D/g,'');if(phone.length===10||phone.length===11)phone='55'+phone;try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Pedido Marcio Bebidas',text:orderShareText(x.order)});closeM();return}}catch(e){if(e&&e.name==='AbortError')return}x.doc.save(x.name);closeM();if(phone)window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(orderShareText(x.order)),'_blank');else alert('PDF baixado. O cliente não possui WhatsApp cadastrado.');setTimeout(()=>alert('O PDF foi baixado. Anexe o arquivo '+x.name+' na conversa do WhatsApp.'),250)}

function changeOrderStatus(id,status){let o=db.orders.find(x=>x.id===id);if(!o)return;if(status==='Entregue'&&!o.stockApplied){for(let i of (o.items||[])){let p=db.products.find(x=>String(x.id)===String(i.productId));if(p){if(p.stock<i.qty){render();return alert('Estoque insuficiente para '+p.name+'. Ajuste o estoque antes de entregar.')}p.stock-=i.qty}}o.stockApplied=true;o.deliveredAt=new Date().toISOString()}if(o.stockApplied&&status!=='Entregue'){if(!confirm('Este pedido já baixou estoque. Deseja alterar o status mesmo assim? O estoque continuará baixado.')){render();return}}o.status=status;save();render()}
function viewOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;openM('<h2>Pedido #'+o.id+'</h2><p><b>'+o.customer+'</b> · '+(o.area||'')+'</p><p class="muted">'+(o.date||'')+' · '+(o.source||'Gestor')+' · '+(o.priceTable||'')+'</p><table><tr><th>Produto</th><th>Qtd.</th><th>Unit.</th><th>Total</th></tr>'+((o.items||[]).map(x=>'<tr><td>'+x.name+'</td><td>'+x.qty+'</td><td>'+R(x.unitPrice)+'</td><td>'+R(x.qty*x.unitPrice)+'</td></tr>').join('')||'<tr><td colspan="4">Pedido antigo sem itens detalhados.</td></tr>')+'</table><p>Subtotal: '+R(o.subtotal||o.total)+'</p><p>Desconto: '+(o.discount||0)+'%</p><h2>Total: '+R(o.total)+'</h2>'+(o.notes?'<p><b>Observação:</b> '+o.notes+'</p>':'')+'<p><b>Status:</b> '+(o.status||'Novo')+'</p>')}
function printLocalOrder(id){choosePrint('local',id)}
function stock(){return '<div class="hero"><div><h1>Estoque</h1><div class="muted">Produtos ativos</div></div><button class="btn" onclick="stockEntry()">+ Entrada</button></div><div class="card"><table><tr><th>Produto</th><th>Estoque</th><th>Custo</th></tr>'+ap().map(p=>'<tr><td>'+p.name+'</td><td>'+p.stock+'</td><td>'+R(p.cost)+'</td></tr>').join('')+'</table></div>'}
function stockEntry(){openM('<h2>Entrada de estoque</h2><label>Produto</label><select id="sp">'+ap().map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'</select><label>Quantidade</label><input id="sq" type="number" value="1"><button class="btn" onclick="saveStock()">Salvar entrada</button>')}
function saveStock(){let p=db.products.find(x=>x.id==sp.value);p.stock+=+sq.value;save();closeM();render()}
function finance(){let sales=db.orders.reduce((s,o)=>s+o.total,0),cost=db.orders.reduce((s,o)=>s+o.cost,0);return '<div class="hero"><div><h1>Financeiro</h1><div class="muted">Resumo de testes</div></div></div><div class="grid"><div class="card metric"><span>Faturamento</span><b>'+R(sales)+'</b></div><div class="card metric"><span>Custo</span><b>'+R(cost)+'</b></div><div class="card metric"><span>Lucro bruto</span><b>'+R(sales-cost)+'</b></div><div class="card metric"><span>Margem</span><b>'+(sales?((sales-cost)/sales*100).toFixed(1):0)+'%</b></div></div>'}
setInterval(syncCustomerOrders,15000);syncCustomerOrders();
function openM(h){modal.innerHTML='<div class="modalbg" onclick="if(event.target===this)closeM()"><div class="modal">'+h+'<div style="margin-top:12px"><button class="btn soft" onclick="closeM()">Fechar</button></div></div></div>'}function closeM(){modal.innerHTML=''}render();
</script></body></html>
