<header><div><div class="brand">MARCIO BEBIDAS</div><div class="sub">LT Soluções · Para seu empreendimento</div></div><div id="company"></div></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div><div id="modal"></div>
<script>
const K='lt_distribui_online_test_v1';let db=JSON.parse(localStorage.getItem(K)||'null')||{company:'Marcio Bebidas',customers:[{id:1,name:'Mercado Avenida',area:'Centro',phone:'(49) 99999-1001',active:true},{id:2,name:'Bar do João',area:'Centro',phone:'(49) 99999-1002',active:true}],products:[{id:1,name:'Coca-Cola 2L',sku:'COCA2L',cost:6.2,price:9,stock:52,active:true},{id:2,name:'Heineken Long Neck',sku:'HEI330',cost:5.1,price:7.5,stock:48,active:true}],orders:[],payables:[],receivables:[]};let page='home';
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),save=()=>localStorage.setItem(K,JSON.stringify(db)),ac=()=>db.customers.filter(x=>x.active!==false),ap=()=>db.products.filter(x=>x.active!==false);

const cocaTable=[["Coca 2 litros",80.8,"Fardo"],["Coca 2,5 litros",67.8,"Fardo"],["Coca 3 litros",51.5,"Fardo"],["Coca 1,5 litros",67.98,"Fardo"],["Sprite/Fanta 2 litros",66.4,"Fardo"],["Kuat 2 litros",49.8,"Fardo"],["Coca LS 1 L",72,"Caixa"],["Coca KS",67.9,"Caixa"],["Coca 600 ml",59.2,"Dúzia"],["Sprite/Fanta/Kuat 600 ml",57.8,"Dúzia"],["Coca lata",44.7,"Dúzia"],["Sprite/Fanta/Kuat lata",40.4,"Dúzia"],["Coca lata 310 ml",41.6,"Dúzia"],["Coca lata 220 ml",31,"Dúzia"],["Coca Mini Pet",23.3,"Dúzia"],["Sprite/Fanta/Guaraná Pet 200 ml",22.3,"Dúzia"],["Tônica Schweppes lata",43.6,"Dúzia"],["Citrus Schweppes lata",43.6,"Dúzia"],["Citrus Schweppes 1,5 litros",47.9,"Fardo"],["Malta Malz lata",45.5,"Dúzia"],["Monster 473 ml",51.3,"Pacote"],["Suco Del Valle",20.7,"Pacote"],["Passaporte",48.9,"Unitário"],["Natu Nobilis",47.9,"Unitário"],["Drurys",36,"Unitário"],["Dreher",21.9,"Unitário"],["Catuaba Cristal",10.99,"Unitário"],["Limão Pitola",10.9,"Unitário"],["Raiz Amarga Pitola",11.9,"Unitário"],["São João da Barra",26.8,"Unitário"],["Bitter Águia",38.9,"Unitário"],["51 C Troca",11.9,"Unitário"],["Velho Barreiro",13.5,"Unitário"],["Vinho Bordô Seco 2 L",68,"Caixa"],["Vinho Bordô Suave 2 L",68,"Caixa"],["Vinho Branco Seco 2 L",68,"Caixa"],["Vinho Branco Suave 2 L",68,"Caixa"],["Vinho Pêssego 2 L",68,"Caixa"],["Cachaça Branca e Amarela V Vale",62,"Unitário"],["Engenho Bravo Branca",76.8,"Unitário"],["Cachaça 3 Pipas Branca e Amarela 1,5 L",65.8,"Unitário"],["Vodka Kostoff Sabor",54,"Fardo"],["Vodka Kostoff Original",56,"Fardo"],["Sol Long Neck",131.8,"Caixa"],["Budweiser Long Neck",131.9,"Caixa"],["Heineken Long Neck",149.8,"Caixa"],["Skol Beats Sense Long Neck",163.8,"Caixa"],["Skol Beats Caipirinha Long Neck",163.8,"Caixa"],["Skol Beats Red",163.8,"Caixa"],["Original lata",50.9,"Dúzia"],["Brahma lata",39,"Dúzia"],["Skol lata",39,"Dúzia"],["Antártica lata",38.9,"Dúzia"],["Sub Zero lata",37.8,"Dúzia"],["Budweiser lata",49.8,"Dúzia"],["Schin lata",33.5,"Dúzia"],["Kaiser lata",32,"Dúzia"],["Brahma Zero lata",44.9,"Dúzia"],["Brahma Malz lata",53.9,"Dúzia"],["Amstel lata",37.9,"Dúzia"]];if(!db.cocaTableLoaded){db.products=db.products.filter(p=>![1,2].includes(p.id));cocaTable.forEach((x,i)=>db.products.push({id:1000+i,name:x[0],sku:'',cost:x[1],price:x[1],stock:0,saleType:x[2],active:true}));db.cocaTableLoaded=true;save();}
const pages=[['home','Início'],['orders','Pedidos'],['customers','Clientes'],['routes','Praças / Rotas'],['priceTables','Tabelas de Preço'],['products','Produtos'],['categories','Categorias'],['stock','Estoque'],['finance','Financeiro']];
function go(p){page=p;render()}function render(){company.textContent=db.company;nav.innerHTML=pages.map(x=>'<button onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');main.innerHTML=({home,orders,customers,routes,priceTables,products,categories,stock,finance}[page])()}
const weekDays=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function todaySent(customerId){let d=new Date().toISOString().slice(0,10);return (db.sentLinks||[]).some(x=>String(x.customerId)===String(customerId)&&(x.sentAt||'').slice(0,10)===d)}
function todayBought(name){let d=new Date().toLocaleDateString('en-CA');return (db.remoteOrders||[]).some(o=>o.client_name===name&&(o.created_at||'').slice(0,10)===d)}
function home(){let sales=db.orders.reduce((s,o)=>s+o.total,0),cost=db.orders.reduce((s,o)=>s+o.cost,0),day=new Date().getDay(),today=(db.areas||[]).filter(a=>a.active!==false&&(a.days||[]).includes(day));let routesHtml=today.length?today.map(a=>{let cs=ac().filter(x=>String(x.areaId)===String(a.id)),sent=cs.filter(x=>todaySent(x.id)).length,bought=cs.filter(x=>todayBought(x.name)).length;return '<div class="card"><div class="hero"><div><h2 style="margin:0">'+a.name+'</h2><div class="muted"><b>'+(a.days&&a.days.length?a.days.map(d=>weekDays[d]).join(', '):'Sem dias definidos')+'</b> · '+cs.length+' clientes · '+sent+' contatados hoje · '+bought+' pedidos hoje · <b>'+(cs.length-sent)+' faltam contatar</b></div></div><button class="btn" onclick="go(\'routes\')">Abrir rota</button></div></div>'}).join(''):'<div class="card"><b>Nenhuma rota programada para hoje.</b><div class="muted">Cadastre os dias em Praças / Rotas.</div></div>';return '<div class="hero"><div><h1>Início</h1><div class="muted">'+weekDays[day]+' · Gestão Marcio Bebidas</div></div><button class="btn" onclick="go(\'orders\')">+ Novo pedido</button></div><div class="grid"><div class="card metric"><span>Vendas</span><b>'+R(sales)+'</b></div><div class="card metric"><span>Lucro bruto</span><b>'+R(sales-cost)+'</b></div><div class="card metric"><span>Clientes ativos</span><b>'+ac().length+'</b></div><div class="card metric"><span>Produtos ativos</span><b>'+ap().length+'</b></div></div><h2>Rotas de hoje</h2>'+routesHtml}
if(!db.priceTables){db.priceTables=[{id:1,name:'Tabela Padrão',prices:{},active:true}];db.customers.forEach(x=>{x.priceTableId=x.priceTableId||1});save()}
function tableName(id){let t=db.priceTables.find(x=>String(x.id)===String(id));return t?t.name:'Tabela Padrão'}
if(!db.areas){let names=[...new Set(db.customers.map(x=>(x.area||'').trim()).filter(Boolean))];db.areas=names.map((name,i)=>({id:Date.now()+i,name,active:true}));db.customers.forEach(x=>{let a=db.areas.find(y=>y.name.toLowerCase()===(x.area||'').trim().toLowerCase());x.areaId=a?a.id:null});save()}
function areaName(c){let a=db.areas.find(x=>String(x.id)===String(c.areaId));return a?a.name:(c.area||'Sem praça')}
function customers(){return '<div class="hero"><div><h1>Clientes</h1><div class="muted">Ativos: '+ac().length+'</div></div><div class="actions"><button class="btn soft" onclick="inactiveCustomers()">Inativos ('+db.customers.filter(x=>x.active===false).length+')</button><button class="btn" onclick="editCustomer()">+ Cliente</button></div></div><div class="card"><table><tr><th>Cliente</th><th>Praça</th><th>Telefone</th><th>Tabela</th><th>Ações</th></tr>'+ac().map(x=>'<tr><td>'+x.name+'</td><td>'+areaName(x)+'</td><td>'+x.phone+'</td><td>'+tableName(x.priceTableId)+'</td><td><div class="actions"><button class="btn ok" onclick="sendOrderLink('+x.id+')">WhatsApp / Pedido</button><button class="btn soft" onclick="editCustomer('+x.id+')">Editar</button><button class="btn danger" onclick="removeCustomer('+x.id+')">'+(db.orders.some(o=>String(o.customerId)===String(x.id)||o.customer===x.name)?'Inativar':'Excluir')+'</button></div></td></tr>').join('')+'</table></div>'}
function editCustomer(id){let x=id?db.customers.find(c=>c.id===id):{name:'',area:'',phone:'',active:true,priceTableId:1};openM('<h2>'+(id?'Editar':'Novo')+' cliente</h2><label>Nome</label><input id="cn" value="'+x.name+'"><label>Praça</label><select id="ca"><option value="">Selecione...</option>'+db.areas.filter(a=>a.active!==false).map(a=>'<option value="'+a.id+'" '+(String(x.areaId)===String(a.id)?'selected':'')+'>'+a.name+'</option>').join('')+'</select><label>Telefone</label><input id="cp" value="'+x.phone+'"><label>Tabela de preço</label><select id="ct">'+db.priceTables.filter(t=>t.active!==false).map(t=>'<option value="'+t.id+'" '+(String(x.priceTableId||1)===String(t.id)?'selected':'')+'>'+t.name+'</option>').join('')+'</select><button class="btn" onclick="saveCustomer('+(id||0)+')">Salvar</button>')}
function saveCustomer(id){let ar=db.areas.find(a=>String(a.id)===String(ca.value));let o={name:cn.value.trim(),areaId:ca.value?+ca.value:null,area:ar?ar.name:'',phone:cp.value.trim(),priceTableId:+ct.value};if(!o.name)return alert('Informe o nome.');if(id)Object.assign(db.customers.find(x=>x.id===id),o);else db.customers.push({id:Date.now(),...o,active:true});save();closeM();render()}
function removeCustomer(id){let x=db.customers.find(c=>c.id===id),has=db.orders.some(o=>String(o.customerId)===String(id)||o.customer===x.name);if(has){if(confirm('Este cliente possui histórico. Ele não pode ser excluído. Deseja inativá-lo?')){x.active=false;save();render()}}else if(confirm('Excluir definitivamente '+x.name+'?')){db.customers=db.customers.filter(c=>c.id!==id);save();render()}}
function inactiveCustomers(){let a=db.customers.filter(x=>x.active===false);openM('<h2>Clientes inativos</h2>'+(a.length?a.map(x=>'<div class="card"><b>'+x.name+'</b><div class="muted">'+tableName(x.priceTableId)+'</div><div class="actions" style="margin-top:8px"><button class="btn ok" onclick="reactCustomer('+x.id+')">Reativar</button><button class="btn soft" onclick="editCustomer('+x.id+')">Editar</button></div></div>').join(''):'<p>Nenhum cliente inativo.</p>'))}
function reactCustomer(id){db.customers.find(x=>x.id===id).active=true;save();closeM();render()}
function routes(){let areas=db.areas.filter(a=>a.active!==false);return '<div class="hero"><div><h1>Praças / Rotas</h1><div class="muted">Cadastro e acompanhamento das praças</div></div><div class="actions"><button class="btn soft" onclick="inactiveAreas()">Inativas ('+db.areas.filter(a=>a.active===false).length+')</button><button class="btn" onclick="editArea()">+ Nova praça</button></div></div>'+areas.map(a=>{let cs=ac().filter(x=>String(x.areaId)===String(a.id)||(!x.areaId&&(x.area||'').trim()===a.name)),links=(db.sentLinks||[]).filter(x=>x.area===a.name),orders=(db.remoteOrders||[]);let sent=cs.filter(x=>links.some(l=>String(l.customerId)===String(x.id))).length,bought=cs.filter(x=>orders.some(o=>o.client_name===x.name)).length;return '<div class="card"><div class="hero"><div><h2 style="margin:0">'+a.name+'</h2><div class="muted">'+cs.length+' clientes · '+sent+' links enviados · '+bought+' com pedido</div></div><div class="actions"><button class="btn soft" onclick="editArea('+a.id+')">Editar praça</button><button class="btn danger" onclick="deactivateArea('+a.id+')">Inativar</button></div></div><table><tr><th>Cliente</th><th>WhatsApp</th><th>Link</th><th>Pedido</th><th>Ação</th></tr>'+cs.map(x=>{let s=links.some(l=>String(l.customerId)===String(x.id)),b=orders.some(o=>o.client_name===x.name);return '<tr><td><b>'+x.name+'</b></td><td>'+x.phone+'</td><td>'+(s?'✅ Enviado':'⚠️ Não enviado')+'</td><td>'+(b?'✅ Comprou':'— Sem pedido')+'</td><td><button class="btn '+(s?'soft':'ok')+'" onclick="sendOrderLink('+x.id+')">WhatsApp / Pedido</button></td></tr>'}).join('')+'</table></div>'}).join('')}
function editArea(id){let a=id?db.areas.find(x=>x.id===id):{name:'',days:[]};a.days=a.days||[];openM('<h2>'+(id?'Editar':'Nova')+' praça</h2><label>Nome da praça / cidade</label><input id="an" value="'+a.name+'"><label>Dias de atendimento / rota</label><div class="card">'+weekDays.map((d,i)=>'<label style="display:inline-flex;align-items:center;gap:5px;margin:6px 12px 6px 0"><input class="areaDay" type="checkbox" value="'+i+'" '+(a.days.includes(i)?'checked':'')+' style="width:auto;margin:0">'+d+'</label>').join('')+'</div><button class="btn" onclick="saveArea('+(id||0)+')">Salvar</button>')}
function saveArea(id){let name=an.value.trim(),days=[...document.querySelectorAll('.areaDay:checked')].map(x=>+x.value);if(!name)return alert('Informe o nome da praça.');if(db.areas.some(a=>a.name.toLowerCase()===name.toLowerCase()&&a.id!==id))return alert('Esta praça já existe.');if(id){let a=db.areas.find(x=>x.id===id),old=a.name;a.name=name;a.days=days;db.customers.filter(x=>String(x.areaId)===String(id)).forEach(x=>x.area=name)}else db.areas.push({id:Date.now(),name,days,active:true});save();closeM();render()}
function deactivateArea(id){let a=db.areas.find(x=>x.id===id),n=ac().filter(x=>String(x.areaId)===String(id)).length;if(n&&!confirm('Esta praça possui '+n+' cliente(s). Ela será apenas inativada e o histórico será mantido. Continuar?'))return;a.active=false;save();render()}
function inactiveAreas(){let a=db.areas.filter(x=>x.active===false);openM('<h2>Praças inativas</h2>'+(a.length?a.map(x=>'<div class="card"><b>'+x.name+'</b><button class="btn ok" style="margin-top:8px" onclick="reactArea('+x.id+')">Reativar</button></div>').join(''):'<p>Nenhuma praça inativa.</p>'))}

function priceTables(){return '<div class="hero"><div><h1>Tabelas de Preço</h1><div class="muted">Cada tabela pode ter um preço diferente para cada produto</div></div><button class="btn" onclick="editPriceTable()">+ Nova tabela</button></div><div class="card"><table><tr><th>Tabela</th><th>Produtos com preço próprio</th><th>Clientes</th><th>Ações</th></tr>'+db.priceTables.map(t=>'<tr><td><b>'+t.name+'</b></td><td>'+Object.keys(t.prices||{}).length+'</td><td>'+db.customers.filter(x=>String(x.priceTableId)===String(t.id)).length+'</td><td><button class="btn soft" onclick="editPriceTable('+t.id+')">Editar preços</button> '+(t.id!==1?'<button class="btn danger" onclick="deletePriceTable('+t.id+')">Excluir</button>':'')+'</td></tr>').join('')+'</table></div>'}

function inferCategory(p){let n=p.name.toLowerCase();if(/sol long|budweiser long|heineken long|beats.*long/.test(n))return'Cervejas Long Neck';if(/original lata|brahma lata|skol lata|antártica lata|sub zero lata|budweiser lata|schin lata|kaiser lata|brahma zero lata|brahma malz lata|amstel lata/.test(n))return'Cervejas lata';if(/monster/.test(n))return'Energéticos';if(/suco|del valle/.test(n))return'Sucos';if(/vinho|bordô|branco seco|branco suave|pêssego/.test(n))return'Vinhos';if(/passaporte|natu nobilis|drurys|dreher|catuaba|pitola|são joão|bitter|51 c troca|velho barreiro|cachaça|engenho|vodka/.test(n))return'Destilados e cachaças';if(/600/.test(n))return'Refrigerantes 600 ml';if(/lata/.test(n))return'Refrigerantes lata';if(/2 litros|2,5 litros|3 litros|1,5 litros/.test(n))return'Refrigerantes garrafa';if(/mini pet|200 ml/.test(n))return'Refrigerantes pequenos';if(/1 l|ks/.test(n))return'Refrigerantes retornáveis';return'Outros'}

iv><p>Status: '+status+'</p><button class="noPrint" onclick="print()">Imprimir</button></body></html>');w.document.close()}

function searchOrderProducts(q){orderDraft.search=q;let cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId));document.getElementById('orderGrid').innerHTML=orderGridHtml(q,cl)}
function manualProductPrice(id,val){let cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId)),p=db.products.find(x=>String(x.id)===String(id));if(!p||!cl)return;let price=parseFloat(String(val).replace(/\./g,'').replace(',','.'));if(isNaN(price)||price<0){alert('Informe um preço válido.');renderOrderDraft();return}let it=orderDraft.items.find(x=>String(x.productId)===String(id)),base=customerProductPrice(cl,p);if(!it){orderDraft.items.push({productId:p.id,name:p.name,unit:p.saleType||'Unitário',qty:0,unitPrice:price,baseUnitPrice:base,priceChanged:Math.abs(price-base)>.009,cost:+p.cost})}else{if(it.baseUnitPrice==null)it.baseUnitPrice=base;it.unitPrice=price;it.priceChanged=Math.abs(price-it.baseUnitPrice)>.009}let s=document.getElementById('orderSummary');if(s)s.innerHTML=orderSummaryHtml()}
function manualProductQty(id,val){let q=Math.max(0,parseInt(val,10)||0),cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId)),p=db.products.find(x=>String(x.id)===String(id)),i=orderDraft.items.findIndex(x=>String(x.productId)===String(id));if(q===0&&i>=0)orderDraft.items.splice(i,1);else if(i>=0)orderDraft.items[i].qty=q;else if(q>0)orderDraft.items.push({productId:p.id,name:p.name,unit:p.saleType||'Unitário',qty:q,unitPrice:customerProductPrice(cl,p),cost:+p.cost});let s=document.getElementById('orderSummary');if(s)s.innerHTML=orderSummaryHtml()}
function changeProductQty(id,delta){let it=orderDraft.items.find(x=>String(x.productId)===String(id)),q=Math.max(0,(it?it.qty:0)+delta);setDraftProductQty(id,q);let cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId));document.getElementById('orderGrid').innerHTML=orderGridHtml(orderDraft.search||'',cl)}
function setDraftProductQty(id,val){let q=Math.max(0,+val||0),cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId)),p=db.products.find(x=>String(x.id)===String(id)),i=orderDraft.items.findIndex(x=>String(x.productId)===String(id));if(q===0&&i>=0)orderDraft.items.splice(i,1);else if(i>=0)orderDraft.items[i].qty=q;else if(q>0)orderDraft.items.push({productId:p.id,name:p.name,unit:p.saleType||'Unitário',qty:q,unitPrice:customerProductPrice(cl,p),cost:+p.cost});document.getElementById('orderSummary').innerHTML=orderSummaryHtml()}
function orderSummaryHtml(){let subtotal=orderDraft.items.reduce((s,x)=>s+x.unitPrice*x.qty,0),disc=Math.max(0,+orderDraft.discount||0),total=subtotal*(1-disc/100),vol=orderDraft.items.reduce((s,x)=>s+x.qty,0);return '<div class="card order-summary-card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><div class="order-count">'+orderDraft.items.length+' produto(s) · '+vol+' volume(s)'+(disc?' · desconto '+disc+'%':'')+'</div><div class="order-total">'+R(total)+'</div></div><div class="actions"><button class="btn soft" onclick="orderOptions()">Obs. / desconto</button><button class="btn" style="padding:12px 18px" onclick="finishOrder()">✓ Salvar pedido</button></div></div></div>'}
function orderOptions(){openM('<h2>Opções do pedido</h2><label>Desconto geral %</label><input id="draftDisc" type="number" min="0" max="100" step=".01" value="'+(orderDraft.discount||0)+'"><label>Observação</label><input id="draftNotes" value="'+(orderDraft.notes||'')+'"><button class="btn" onclick="orderDraft.discount=+draftDisc.value||0;orderDraft.notes=draftNotes.value;renderOrderDraft()">Aplicar e voltar</button>')}
function finishOrder(){let cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId));if(!cl||!orderDraft.items.length)return alert('Adicione pelo menos um produto.');let subtotal=orderDraft.items.reduce((s,x)=>s+x.unitPrice*x.qty,0),discount=Math.max(0,Math.min(100,+orderDraft.discount||0)),total=subtotal*(1-discount/100),cost=orderDraft.items.reduce((s,x)=>s+x.cost*x.qty,0);db.orders.push({id:Date.now(),customerId:cl.id,customer:cl.name,area:areaName(cl),priceTableId:cl.priceTableId,priceTable:tableName(cl.priceTableId),items:orderDraft.items,subtotal,discount,total,cost,status:'Novo',source:'Gestor',notes:orderDraft.notes||'',stockApplied:false,date:new Date().toLocaleString('pt-BR'),createdAt:new Date().toISOString()});save();orderDraft=null;closeM();render();alert('Pedido salvo como Novo.')}
function changeOrderStatus(id,status){let o=db.orders.find(x=>x.id===id);if(!o)return;if(status==='Entregue'&&!o.stockApplied){for(let i of (o.items||[])){let p=db.products.find(x=>String(x.id)===String(i.productId));if(p){if(p.stock<i.qty){render();return alert('Estoque insuficiente para '+p.name+'. Ajuste o estoque antes de entregar.')}p.stock-=i.qty}}o.stockApplied=true;o.deliveredAt=new Date().toISOString()}if(o.stockApplied&&status!=='Entregue'){if(!confirm('Este pedido já baixou estoque. Deseja alterar o status mesmo assim? O estoque continuará baixado.')){render();return}}o.status=status;save();render()}
function viewOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;openM('<h2>Pedido #'+o.id+'</h2><p><b>'+o.customer+'</b> · '+(o.area||'')+'</p><p class="muted">'+(o.date||'')+' · '+(o.source||'Gestor')+' · '+(o.priceTable||'')+'</p><table><tr><th>Produto</th><th>Qtd.</th><th>Unit.</th><th>Total</th></tr>'+((o.items||[]).map(x=>'<tr><td>'+x.name+'</td><td>'+x.qty+'</td><td>'+R(x.unitPrice)+'</td><td>'+R(x.qty*x.unitPrice)+'</td></tr>').join('')||'<tr><td colspan="4">Pedido antigo sem itens detalhados.</td></tr>')+'</table><p>Subtotal: '+R(o.subtotal||o.total)+'</p><p>Desconto: '+(o.discount||0)+'%</p><h2>Total: '+R(o.total)+'</h2>'+(o.notes?'<p><b>Observação:</b> '+o.notes+'</p>':'')+'<p><b>Status:</b> '+(o.status||'Novo')+'</p>')}
function printLocalOrder(id){choosePrint('local',id)}
function stock(){return '<div class="hero"><div><h1>Estoque</h1><div class="muted">Produtos ativos</div></div><button class="btn" onclick="stockEntry()">+ Entrada</button></div><div class="card"><table><tr><th>Produto</th><th>Estoque</th><th>Custo</th></tr>'+ap().map(p=>'<tr><td>'+p.name+'</td><td>'+p.stock+'</td><td>'+R(p.cost)+'</td></tr>').join('')+'</table></div>'}
function stockEntry(){openM('<h2>Entrada de estoque</h2><label>Produto</label><select id="sp">'+ap().map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'</select><label>Quantidade</label><input id="sq" type="number" value="1"><button class="btn" onclick="saveStock()">Salvar entrada</button>')}
function saveStock(){let p=db.products.find(x=>x.id==sp.value);p.stock+=+sq.value;save();closeM();render()}
function finance(){let sales=db.orders.reduce((s,o)=>s+o.total,0),cost=db.orders.reduce((s,o)=>s+o.cost,0);return '<div class="hero"><div><h1>Financeiro</h1><div class="muted">Resumo de testes</div></div></div><div class="grid"><div class="card metric"><span>Faturamento</span><b>'+R(sales)+'</b></div><div class="card metric"><span>Custo</span><b>'+R(cost)+'</b></div><div class="card metric"><span>Lucro bruto</span><b>'+R(sales-cost)+'</b></div><div class="card metric"><span>Margem</span><b>'+(sales?((sales-cost)/sales*100).toFixed(1):0)+'%</b></div></div>'}
setInterval(syncCustomerOrders,15000);syncCustomerOrders();
function openM(h){modal.innerHTML='<div class="modalbg" onclick="if(event.target===this)closeM()"><div class="modal">'+h+'<div style="margin-top:12px"><button class="btn soft" onclick="closeM()">Fechar</button></div></div></div>'}function closeM(){modal.innerHTML=''}render();
</script></body></html>
