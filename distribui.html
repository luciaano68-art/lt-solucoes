<style>

ow{grid-template-columns:1fr}}
</style></head><body>
<header><div><div class="brand">MARCIO BEBIDAS</div><div class="sub">LT Soluções · Para seu empreendimento</div></div><div id="company"></div></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div><div id="modal"></div>
<script>
const K='lt_distribui_online_test_v1';let db=JSON.parse(localStorage.getItem(K)||'null')||{company:'Marcio Bebidas',customers:[{id:1,name:'Mercado Avenida',area:'Centro',phone:'(49) 99999-1001',active:true},{id:2,name:'Bar do João',area:'Centro',phone:'(49) 99999-1002',active:true}],products:[{id:1,name:'Coca-Cola 2L',sku:'COCA2L',cost:6.2,price:9,stock:52,active:true},{id:2,name:'Heineken Long Neck',sku:'HEI330',cost:5.1,price:7.5,stock:48,active:true}],orders:[],payables:[],receivables:[]};let page='home';
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),save=()=>localStorage.setItem(K,JSON.stringify(db)),ac=()=>db.customers.filter(x=>x.active!==false),ap=()=>db.products.filter(x=>x.active!==false);

const cocaTable=[["Coca 2 litros",80.8,"Fardo"],["Coca 2,5 litros",67.8,"Fardo"],["Coca 3 litros",51.5,"Fardo"],["Coca 1,5 litros",67.98,"Fardo"],["Sprite/Fanta 2 litros",66.4,"Fardo"],["Kuat 2 litros",49.8,"Fardo"],["Coca LS 1 L",72,"Caixa"],["Coca KS",67.9,"Caixa"],["Coca 600 ml",59.2,"Dúzia"],["Sprite/Fanta/Kuat 600 ml",57.8,"Dúzia"],["Coca lata",44.7,"Dúzia"],["Sprite/Fanta/Kuat lata",40.4,"Dúzia"],["Coca lata 310 ml",41.6,"Dúzia"],["Coca lata 220 ml",31,"Dúzia"],["Coca Mini Pet",23.3,"Dúzia"],["Sprite/Fanta/Guaraná Pet 200 ml",22.3,"Dúzia"],["Tônica Schweppes lata",43.6,"Dúzia"],["Citrus Schweppes lata",43.6,"Dúzia"],["Citrus Schweppes 1,5 litros",47.9,"Fardo"],["Malta Malz lata",45.5,"Dúzia"],["Monster 473 ml",51.3,"Pacote"],["Suco Del Valle",20.7,"Pacote"],["Passaporte",48.9,"Unitário"],["Natu Nobilis",47.9,"Unitário"],["Drurys",36,"Unitário"],["Dreher",21.9,"Unitário"],["Catuaba Cristal",10.99,"Unitário"],["Limão Pitola",10.9,"Unitário"],["Raiz Amarga Pitola",11.9,"Unitário"],["São João da Barra",26.8,"Unitário"],["Bitter Águia",38.9,"Unitário"],["51 C Troca",11.9,"Unitário"],["Velho Barreiro",13.5,"Unitário"],["Vinho Bordô Seco 2 L",68,"Caixa"],["Vinho Bordô Suave 2 L",68,"Caixa"],["Vinho Branco Seco 2 L",68,"Caixa"],["Vinho Branco Suave 2 L",68,"Caixa"],["Vinho Pêssego 2 L",68,"Caixa"],["Cachaça Branca e Amarela V Vale",62,"Unitário"],["Engenho Bravo Branca",76.8,"Unitário"],["Cachaça 3 Pipas Branca e Amarela 1,5 L",65.8,"Unitário"],["Vodka Kostoff Sabor",54,"Fardo"],["Vodka Kostoff Original",56,"Fardo"],["Sol Long Neck",131.8,"Caixa"],["Budweiser Long Neck",131.9,"Caixa"],["Heineken Long Neck",149.8,"Caixa"],["Skol Beats Sense Long Neck",163.8,"Caixa"],["Skol Beats Caipirinha Long Neck",163.8,"Caixa"],["Skol Beats Red",163.8,"Caixa"],["Original lata",50.9,"Dúzia"],["Brahma lata",39,"Dúzia"],["Skol lata",39,"Dúzia"],["Antártica lata",38.9,"Dúzia"],["Sub Zero lata",37.8,"Dúzia"],["Budweiser lata",49.8,"Dúzia"],["Schin lata",33.5,"Dúzia"],["Kaiser lata",32,"Dúzia"],["Brahma Zero lata",44.9,"Dúzia"],["Brahma Malz lata",53.9,"Dúzia"],["Amstel lata",37.9,"Dúzia"]];if(!db.cocaTableLoaded){db.products=db.products.filter(p=>![1,2].includes(p.id));cocaTable.forEach((x,i)=>db.products.push({id:1000+i,name:x[0],sku:'',cost:x[1],price:x[1],stock:0,saleType:x[2],active:true}));db.cocaTableLoaded=true;save();}
const pages=[['home','Início'],['orders','Pedidos'],['customers','Clientes'],['priceTables','Tabelas de Preço'],['products','Produtos'],['categories','Categorias'],['stock','Estoque'],['finance','Financeiro']];
function go(p){page=p;render()}function render(){company.textContent=db.company;nav.innerHTML=pages.map(x=>'<button onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');main.innerHTML=({home,orders,customers,priceTables,products,categories,stock,finance}[page])()}
function home(){let sales=db.orders.reduce((s,o)=>s+o.total,0),cost=db.orders.reduce((s,o)=>s+o.cost,0);return '<div class="hero"><div><h1>Início</h1><div class="muted">Ambiente online de testes</div></div><button class="btn" onclick="go(\'orders\')">+ Novo pedido</button></div><div class="grid"><div class="card metric"><span>Vendas</span><b>'+R(sales)+'</b></div><div class="card metric"><span>Lucro bruto</span><b>'+R(sales-cost)+'</b></div><div class="card metric"><span>Clientes ativos</span><b>'+ac().length+'</b></div><div class="card metric"><span>Produtos ativos</span><b>'+ap().length+'</b></div></div>'}
if(!db.priceTables){db.priceTables=[{id:1,name:'Tabela Padrão',prices:{},active:true}];db.customers.forEach(x=>{x.priceTableId=x.priceTableId||1});save()}
function tableName(id){let t=db.priceTables.find(x=>String(x.id)===String(id));return t?t.name:'Tabela Padrão'}
function customers(){return '<div class="hero"><div><h1>Clientes</h1><div class="muted">Ativos: '+ac().length+'</div></div><div class="actions"><button class="btn soft" onclick="inactiveCustomers()">Inativos ('+db.customers.filter(x=>x.active===false).length+')</button><button class="btn" onclick="editCustomer()">+ Cliente</button></div></div><div class="card"><table><tr><th>Cliente</th><th>Praça</th><th>Telefone</th><th>Tabela</th><th>Ações</th></tr>'+ac().map(x=>'<tr><td>'+x.name+'</td><td>'+x.area+'</td><td>'+x.phone+'</td><td>'+tableName(x.priceTableId)+'</td><td><div class="actions"><button class="btn soft" onclick="editCustomer('+x.id+')">Editar</button><button class="btn danger" onclick="removeCustomer('+x.id+')">'+(db.orders.some(o=>String(o.customerId)===String(x.id)||o.customer===x.name)?'Inativar':'Excluir')+'</button></div></td></tr>').join('')+'</table></div>'}
function editCustomer(id){let x=id?db.customers.find(c=>c.id===id):{name:'',area:'',phone:'',active:true,priceTableId:1};openM('<h2>'+(id?'Editar':'Novo')+' cliente</h2><label>Nome</label><input id="cn" value="'+x.name+'"><label>Praça</label><input id="ca" value="'+x.area+'"><label>Telefone</label><input id="cp" value="'+x.phone+'"><label>Tabela de preço</label><select id="ct">'+db.priceTables.filter(t=>t.active!==false).map(t=>'<option value="'+t.id+'" '+(String(x.priceTableId||1)===String(t.id)?'selected':'')+'>'+t.name+'</option>').join('')+'</select><button class="btn" onclick="saveCustomer('+(id||0)+')">Salvar</button>')}
function saveCustomer(id){let o={name:cn.value.trim(),area:ca.value.trim(),phone:cp.value.trim(),priceTableId:+ct.value};if(!o.name)return alert('Informe o nome.');if(id)Object.assign(db.customers.find(x=>x.id===id),o);else db.customers.push({id:Date.now(),...o,active:true});save();closeM();render()}
function removeCustomer(id){let x=db.customers.find(c=>c.id===id),has=db.orders.some(o=>String(o.customerId)===String(id)||o.customer===x.name);if(has){if(confirm('Este cliente possui histórico. Ele não pode ser excluído. Deseja inativá-lo?')){x.active=false;save();render()}}else if(confirm('Excluir definitivamente '+x.name+'?')){db.customers=db.customers.filter(c=>c.id!==id);save();render()}}
function inactiveCustomers(){let a=db.customers.filter(x=>x.active===false);openM('<h2>Clientes inativos</h2>'+(a.length?a.map(x=>'<div class="card"><b>'+x.name+'</b><div class="muted">'+tableName(x.priceTableId)+'</div><div class="actions" style="margin-top:8px"><button class="btn ok" onclick="reactCustomer('+x.id+')">Reativar</button><button class="btn soft" onclick="editCustomer('+x.id+')">Editar</button></div></div>').join(''):'<p>Nenhum cliente inativo.</p>'))}
function reactCustomer(id){db.customers.find(x=>x.id===id).active=true;save();closeM();render()}
function priceTables(){return '<div class="hero"><div><h1>Tabelas de Preço</h1><div class="muted">Cada tabela pode ter um preço diferente para cada produto</div></div><button class="btn" onclick="editPriceTable()">+ Nova tabela</button></div><div class="card"><table><tr><th>Tabela</th><th>Produtos com preço próprio</th><th>Clientes</th><th>Ações</th></tr>'+db.priceTables.map(t=>'<tr><td><b>'+t.name+'</b></td><td>'+Object.keys(t.prices||{}).length+'</td><td>'+db.customers.filter(x=>String(x.priceTableId)===String(t.id)).length+'</td><td><button class="btn soft" onclick="editPriceTable('+t.id+')">Editar preços</button> '+(t.id!==1?'<button class="btn danger" onclick="deletePriceTable('+t.id+')">Excluir</button>':'')+'</td></tr>').join('')+'</table></div>'}
function editPriceTable(id){let t=id?db.priceTables.find(x=>x.id===id):{name:'',prices:{}};t.prices=t.prices||{};openM('<h2>'+(id?'Editar':'Nova')+' tabela de preço</h2><label>Nome da tabela</label><input id="tn" value="'+t.name+'"><h3 style="margin-top:18px">Preço de cada produto</h3><p class="muted">Deixe em branco para usar o preço padrão cadastrado no produto.</p>'+ap().map(p=>'<div class="row" style="align-items:end"><div><label>'+p.name+' <span class="muted">Padrão: '+R(p.price)+'</span></label><input class="tablePrice" data-pid="'+p.id+'" type="number" step=".01" min="0" value="'+(t.prices[p.id]??'')+'" placeholder="'+p.price.toFixed(2)+'"></div></div>').join('')+'<button class="btn" onclick="savePriceTable('+(id||0)+')">Salvar tabela</button>')}
function savePriceTable(id){let name=tn.value.trim();if(!name)return alert('Informe o nome da tabela.');let prices={};document.querySelectorAll('.tablePrice').forEach(el=>{if(el.value!=='')prices[el.dataset.pid]=+el.value});if(id){let t=db.priceTables.find(x=>x.id===id);t.name=name;t.prices=prices}else db.priceTables.push({id:Date.now(),name,prices,active:true});save();closeM();render()}
function deletePriceTable(id){if(db.customers.some(x=>String(x.priceTableId)===String(id)))return alert('Esta tabela está vinculada a clientes. Troque a tabela deles antes de excluir.');if(confirm('Excluir esta tabela de preço?')){db.priceTables=db.priceTables.filter(x=>x.id!==id);save();render()}}
function customerProductPrice(customer,product){let t=db.priceTables.find(x=>String(x.id)===String(customer.priceTableId));return t&&t.prices&&t.prices[product.id]!=null?+t.prices[product.id]:+product.price}
function inferCategory(p){let n=p.name.toLowerCase();if(/sol long|budweiser long|heineken long|beats.*long/.test(n))return'Cervejas Long Neck';if(/original lata|brahma lata|skol lata|antártica lata|sub zero lata|budweiser lata|schin lata|kaiser lata|brahma zero lata|brahma malz lata|amstel lata/.test(n))return'Cervejas lata';if(/monster/.test(n))return'Energéticos';if(/suco|del valle/.test(n))return'Sucos';if(/vinho|bordô|branco seco|branco suave|pêssego/.test(n))return'Vinhos';if(/passaporte|natu nobilis|drurys|dreher|catuaba|pitola|são joão|bitter|51 c troca|velho barreiro|cachaça|engenho|vodka/.test(n))return'Destilados e cachaças';if(/600/.test(n))return'Refrigerantes 600 ml';if(/lata/.test(n))return'Refrigerantes lata';if(/2 litros|2,5 litros|3 litros|1,5 litros/.test(n))return'Refrigerantes garrafa';if(/mini pet|200 ml/.test(n))return'Refrigerantes pequenos';if(/1 l|ks/.test(n))return'Refrigerantes retornáveis';return'Outros'}
if(!db.categories){let names=[];db.products.forEach(p=>{let n=inferCategory(p);if(!names.includes(n))names.push(n)});db.categories=names.map((name,i)=>({id:Date.now()+i,name}));db.products.forEach(p=>{let n=inferCategory(p),cat=db.categories.find(x=>x.name===n);p.categoryId=cat?cat.id:null});save()}
function categoryName(p){let x=db.categories.find(c=>String(c.id)===String(p.categoryId));return x?x.name:'Sem categoria'}
function categories(){return `<div class="hero"><div><h1>Categorias</h1><div class="muted">Cadastro de categorias de produtos</div></div><button class="btn" onclick="editCategory()">+ Nova categoria</button></div><div class="card"><table><tr><th>Categoria</th><th>Produtos</th><th>Ações</th></tr>${db.categories.map(cat=>`<tr><td><b>${cat.name}</b></td><td>${db.products.filter(x=>String(x.categoryId)===String(cat.id)).length}</td><td><button class="btn soft" onclick="editCategory(${cat.id})">Editar</button> <button class="btn danger" onclick="deleteCategory(${cat.id})">Excluir</button></td></tr>`).join('')}</table></div>`}
function manageCategories(){openM('<h2>Categorias</h2><button class="btn" onclick="editCategory()">+ Nova categoria</button><div style="margin-top:14px">'+(db.categories.length?db.categories.map(c=>'<div class="card"><b>'+c.name+'</b><div class="actions" style="margin-top:8px"><button class="btn soft" onclick="editCategory('+c.id+')">Editar</button><button class="btn danger" onclick="deleteCategory('+c.id+')">Excluir</button></div></div>').join(''):'<p>Nenhuma categoria cadastrada.</p>')+'</div>')}
function editCategory(id){let c=id?db.categories.find(x=>x.id===id):null;openM('<h2>'+(c?'Editar':'Nova')+' categoria</h2><label>Nome da categoria</label><input id="catName" value="'+(c?c.name:'')+'"><button class="btn" onclick="saveCategory('+(id||0)+')">Salvar</button>')}
function saveCategory(id){let name=catName.value.trim();if(!name)return alert('Informe o nome da categoria.');if(db.categories.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==id))return alert('Esta categoria já existe.');if(id)db.categories.find(x=>x.id===id).name=name;else db.categories.push({id:Date.now(),name});save();closeM();render()}
function deleteCategory(id){let cat=db.categories.find(x=>x.id===id),used=db.products.filter(p=>String(p.categoryId)===String(id)).length;if(used)return alert('Não é possível excluir "'+cat.name+'" porque existem '+used+' produto(s) nesta categoria. Mova os produtos para outra categoria primeiro.');if(confirm('Excluir a categoria '+cat.name+'?')){db.categories=db.categories.filter(x=>x.id!==id);save();closeM();render()}}
function products(){let cats={};ap().forEach(p=>{let k=categoryName(p);(cats[k]||(cats[k]=[])).push(p)});return '<div class="hero"><div><h1>Produtos</h1><div class="muted">Catálogo separado por categoria</div></div><div class="actions"><button class="btn soft" onclick="manageCategories()">Categorias</button><button class="btn soft" onclick="inactiveProducts()">Inativos ('+db.products.filter(x=>x.active===false).length+')</button><button class="btn" onclick="editProduct()">+ Produto</button></div></div>'+Object.keys(cats).sort().map(k=>'<div class="card"><h2>'+k+'</h2><table><tr><th>Produto</th><th>Tipo</th><th>Custo</th><th>Venda</th><th>Estoque</th><th>Ações</th></tr>'+cats[k].map(p=>'<tr><td>'+p.name+'</td><td>'+(p.saleType||'Unitário')+'</td><td>'+R(p.cost)+'</td><td>'+R(p.price)+'</td><td>'+p.stock+'</td><td><div class="actions"><button class="btn soft" onclick="editProduct('+p.id+')">Editar</button><button class="btn danger" onclick="deactivateProduct('+p.id+')">Inativar</button></div></td></tr>').join('')+'</table></div>').join('')}
function editProduct(id){let p=id?db.products.find(x=>x.id===id):{name:'',sku:'',cost:0,price:0,stock:0,saleType:'Unitário',categoryId:''};openM('<h2>'+(id?'Editar':'Novo')+' produto</h2><div class="row"><div><label>Produto</label><input id="pn" value="'+p.name+'"></div><div><label>Categoria</label><select id="pcat"><option value="">Selecione...</option>'+db.categories.map(c=>'<option value="'+c.id+'" '+(String(p.categoryId)===String(c.id)?'selected':'')+'>'+c.name+'</option>').join('')+'</select></div><div><label>SKU</label><input id="ps" value="'+p.sku+'"></div><div><label>Custo</label><input id="pc" type="number" step=".01" value="'+p.cost+'"></div><div><label>Venda</label><input id="pp" type="number" step=".01" value="'+p.price+'"></div><div><label>Estoque</label><input id="pe" type="number" value="'+p.stock+'"></div><div><label>Forma de venda</label><select id="pt"><option value="Unitário" '+((p.saleType||"Unitário")==="Unitário"?"selected":"")+'>Unitário</option><option value="Fardo" '+(p.saleType==="Fardo"?"selected":"")+'>Fardo</option><option value="Caixa" '+(p.saleType==="Caixa"?"selected":"")+'>Caixa</option><option value="Dúzia" '+(p.saleType==="Dúzia"?"selected":"")+'>Dúzia</option><option value="Pacote" '+(p.saleType==="Pacote"?"selected":"")+'>Pacote</option></select></div></div><button class="btn" onclick="saveProduct('+(id||0)+')">Salvar</button>')}
function saveProduct(id){if(!pcat.value)return alert('Selecione a categoria.');let o={name:pn.value.trim(),sku:ps.value,cost:+pc.value,price:+pp.value,stock:+pe.value,saleType:pt.value,categoryId:+pcat.value};if(!o.name)return alert('Informe o produto.');if(id)Object.assign(db.products.find(x=>x.id===id),o);else db.products.push({id:Date.now(),...o,active:true});save();closeM();render()}
function deactivateProduct(id){let p=db.products.find(x=>x.id===id);if(confirm('Inativar '+p.name+'? O histórico será mantido.')){p.active=false;save();render()}}
function inactiveProducts(){let a=db.products.filter(x=>x.active===false);openM('<h2>Produtos inativos</h2>'+(a.length?a.map(p=>'<div class="card"><b>'+p.name+'</b><div class="actions" style="margin-top:8px"><button class="btn ok" onclick="reactProduct('+p.id+')">Reativar</button><button class="btn soft" onclick="editProduct('+p.id+')">Editar</button></div></div>').join(''):'<p>Nenhum produto inativo.</p>'))}
function reactProduct(id){db.products.find(x=>x.id===id).active=true;save();closeM();render()}
const SB='https://wwietlvweqsxfpejhhis.supabase.co',SBK='sb_publishable_dArUUh2qpDqbzvjxXAEbNQ_hT6Y0y5y';async function sb(path,opt={}){let r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{apikey:SBK,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function createOrderLink(){let clientId=+prompt('ID do cliente para gerar o link:\n'+ac().map(x=>x.id+' - '+x.name).join('\n'));let cl=db.customers.find(x=>x.id===clientId);if(!cl)return alert('Cliente não encontrado.');let hours=+prompt('Validade do link em horas:','24');if(!hours||hours<=0)return;let token=crypto.randomUUID().replaceAll('-',''),catalog=ap().map(p=>({id:p.id,name:p.name,category:categoryName(p),unit:p.saleType||'Unitário',price:customerProductPrice(cl,p),stock:p.stock}));try{await sb('marcio_order_links',{method:'POST',body:JSON.stringify({token,client_name:cl.name,price_table_name:tableName(cl.priceTableId),expires_at:new Date(Date.now()+hours*3600000).toISOString(),catalog})});let link=new URL('./pedido-marcio.html',location.href);link.searchParams.set('t',token);openM('<h2>Link do pedido</h2><p><b>'+cl.name+'</b></p><p class="muted">Válido por '+hours+' hora(s).</p><input id="shareLink" value="'+link.href+'" readonly><div class="actions" style="margin-top:12px"><button class="btn" onclick="navigator.clipboard.writeText(shareLink.value);alert(\'Link copiado.\')">Copiar link</button><a class="btn ok" style="text-decoration:none" target="_blank" href="https://wa.me/?text='+encodeURIComponent('Olá! Faça seu pedido Marcio Bebidas por este link: '+link.href)+'">Enviar WhatsApp</a></div>')}catch(e){alert('Não foi possível gerar o link: '+e.message)}}
return '<div class="hero"><div><h1>Pedidos</h1><div class="muted">Venda rápida</div></div><div class="actions"><button class="btn soft" onclick="createOrderLink()">🔗 Gerar link para cliente</button><button class="btn" onclick="newOrder()">+ Novo pedido</button></div></div><div class="card"><h2>Pedidos recebidos dos clientes</h2><table><tr><th>#</th><th>Cliente</th><th>Total</th><th>Status</th><th>Ação</th></tr>'+ (ro.length?ro.map(o=>'<tr><td>'+o.id+'</td><td>'+o.client_name+'</td><td>'+R(o.total)+'</td><td>'+o.status+'</td><td><button class="btn soft" onclick="printRemoteOrder('+o.id+')">🖨️ Imprimir</button></td></tr>').join(''):'<tr><td colspan="5">Nenhum pedido recebido.</td></tr>')+'</table></div><div class="card"><h2>Pedidos lançados pelo gestor</h2><table><tr><th>#</th><th>Cliente</th><th>Total</th><th>Data</th></tr>'+(db.orders.length?db.orders.slice().reverse().map(o=>'<tr><td>'+o.id+'</td><td>'+o.customer+'</td><td>'+R(o.total)+'</td><td>'+o.date+'</td></tr>').join(''):'<tr><td colspan="4">Nenhum pedido.</td></tr>')+'</table></div>'}
function newOrder(){if(!ac().length||!ap().length)return alert('Cadastre cliente e produto ativos.');openM('<h2>Novo pedido</h2><label>Cliente</label><select id="oc">'+ac().map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('')+'</select><label>Produto</label><select id="op">'+ap().map(p=>'<option value="'+p.id+'">'+p.name+' - '+R(p.price)+'</option>').join('')+'</select><label>Quantidade</label><input id="oq" type="number" value="1" min="1"><label>Desconto %</label><input id="od" type="number" value="0"><button class="btn" onclick="finishOrder()">Finalizar pedido</button>')}
function finishOrder(){let c=db.customers.find(x=>x.id==oc.value),p=db.products.find(x=>x.id==op.value),q=+oq.value,d=+od.value;if(q<=0||q>p.stock)return alert('Quantidade inválida ou estoque insuficiente.');let total=p.price*q*(1-d/100),cost=p.cost*q;p.stock-=q;db.orders.push({id:Date.now(),customer:c.name,total,cost,date:new Date().toLocaleString('pt-BR')});save();closeM();render();alert('Pedido finalizado.')}
function stock(){return '<div class="hero"><div><h1>Estoque</h1><div class="muted">Produtos ativos</div></div><button class="btn" onclick="stockEntry()">+ Entrada</button></div><div class="card"><table><tr><th>Produto</th><th>Estoque</th><th>Custo</th></tr>'+ap().map(p=>'<tr><td>'+p.name+'</td><td>'+p.stock+'</td><td>'+R(p.cost)+'</td></tr>').join('')+'</table></div>'}
function stockEntry(){openM('<h2>Entrada de estoque</h2><label>Produto</label><select id="sp">'+ap().map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'</select><label>Quantidade</label><input id="sq" type="number" value="1"><button class="btn" onclick="saveStock()">Salvar entrada</button>')}
function saveStock(){let p=db.products.find(x=>x.id==sp.value);p.stock+=+sq.value;save();closeM();render()}
function finance(){let sales=db.orders.reduce((s,o)=>s+o.total,0),cost=db.orders.reduce((s,o)=>s+o.cost,0);return '<div class="hero"><div><h1>Financeiro</h1><div class="muted">Resumo de testes</div></div></div><div class="grid"><div class="card metric"><span>Faturamento</span><b>'+R(sales)+'</b></div><div class="card metric"><span>Custo</span><b>'+R(cost)+'</b></div><div class="card metric"><span>Lucro bruto</span><b>'+R(sales-cost)+'</b></div><div class="card metric"><span>Margem</span><b>'+(sales?((sales-cost)/sales*100).toFixed(1):0)+'%</b></div></div>'}
setInterval(syncCustomerOrders,15000);syncCustomerOrders();
function openM(h){modal.innerHTML='<div class="modalbg" onclick="if(event.target===this)closeM()"><div class="modal">'+h+'<div style="margin-top:12px"><button class="btn soft" onclick="closeM()">Fechar</button></div></div></div>'}function closeM(){modal.innerHTML=''}render();
</script></body></html>
