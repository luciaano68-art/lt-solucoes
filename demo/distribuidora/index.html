Dúzia"],["Brahma Zero lata",44.9,"Dúzia"],["Brahma Malz lata",53.9,"Dúzia"],["Amstel lata",37.9,"Dúzia"]];if(!db.cocaTableLoaded){db.products=db.products.filter(p=>![1,2].includes(p.id));cocaTable.forEach((x,i)=>db.products.push({id:1000+i,name:x[0],sku:'',cost:x[1],price:x[1],stock:0,saleType:x[2],active:true}));db.cocaTableLoaded=true;save();}
const pages=[['home','Início'],['orders','Pedidos'],['customers','Clientes'],['routes','Praças / Rotas'],['priceTables','Tabelas de Preço'],['products','Produtos'],['categories','Categorias'],['stock','Estoque'],['finance','Financeiro']];
function toggleSideMenu(){document.body.classList.toggle('menu-open')}function closeSideMenu(){document.body.classList.remove('menu-open')}function go(p){page=p;closeSideMenu();render()}const MARCIO_PUSH_URL='about:blank';
function b64urlToUint8(s){let p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function updatePushButton(){let b=document.getElementById('pushBtn');if(!b)return;if(!('serviceWorker'in navigator)||!('PushManager'in window)){b.textContent='🔕 Indisponível';b.disabled=true;return}try{let reg=await navigator.serviceWorker.getRegistration('./');let sub=reg&&await reg.pushManager.getSubscription();if(sub&&Notification.permission==='granted'){b.textContent='🔔 Ativadas · Testar';b.classList.add('on');b.title='Toque uma vez para testar';b.onclick=testPushNotification;b.ondblclick=null}else{b.textContent='🔔 Ativar';b.onclick=enablePushNotifications}}catch(e){}}
async function enablePushNotifications(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window))return alert('Este navegador não oferece notificações push. No iPhone/iPad, adicione o sistema à Tela de Início e abra por lá.');let perm=await Notification.requestPermission();if(perm!=='granted')return alert('A permissão de notificações não foi liberada.');let reg=await navigator.serviceWorker.register('./sw-marcio.js?v=5',{scope:'./',updateViaCache:'none'});await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub){let r=await fetch(MARCIO_PUSH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'publicKey'})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Falha ao obter chave');sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlToUint8(j.publicKey)})}let r=await fetch(MARCIO_PUSH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'subscribe',subscription:sub.toJSON()})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Falha ao registrar aparelho');updatePushButton();alert('Notificações ativadas neste aparelho.')}catch(e){alert('Não foi possível ativar as notificações: '+e.message)}}
async function testPushNotification(){try{if(Notification.permission!=='granted')return alert('O tablet não está com permissão de notificação liberada. Permissão atual: '+Notification.permission);let reg=await navigator.serviceWorker.ready;await reg.update();let active=reg.active||reg.waiting||reg.installing;if(active)active.postMessage({type:'SHOW_TEST_NOTIFICATION'});else await reg.showNotification('🔔 Teste — Distribuidora Demonstração',{body:'Notificação visual do Distribuidora Demonstração funcionando.',tag:'marcio-visual-'+Date.now(),renotify:true,requireInteraction:true,silent:false,vibrate:[400,150,400],data:{url:location.href}});let r=await fetch(MARCIO_PUSH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'test'})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Falha no teste');alert('Teste executado. O servidor aceitou '+j.sent+' envio(s). Veja se apareceu a notificação nativa do Distribuidora Demonstração.')}catch(e){alert('Falha ao testar notificação: '+e.message)}}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw-marcio.js?v=5',{scope:'./',updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}
function render(){company.innerHTML='<div style="display:flex;align-items:center;gap:8px"><span>'+db.company+'</span><button id="pushBtn" class="push-mini" onclick="enablePushNotifications()">🔔 Ativar</button></div>';updatePushButton();nav.innerHTML=pages.map(x=>'<button onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');main.innerHTML=({home,orders,customers,routes,priceTables,products,categories,stock,finance}[page])()}
const weekDays=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function todaySent(customerId){let d=new Date().toISOString().slice(0,10);return (db.sentLinks||[]).some(x=>String(x.customerId)===String(customerId)&&(x.sentAt||'').slice(0,10)===d)}
function todayBought(name){let d=new Date().toLocaleDateString('en-CA');return (db.remoteOrders||[]).some(o=>o.client_name===name&&(o.created_at||'').slice(0,10)===d)}
function home(){let sales=db.orders.reduce((s,o)=>s+o.total,0),cost=db.orders.reduce((s,o)=>s+o.cost,0),day=new Date().getDay(),today=(db.areas||[]).filter(a=>a.active!==false&&(a.days||[]).includes(day));let routesHtml=today.length?today.map(a=>{let cs=ac().filter(x=>String(x.areaId)===String(a.id)),sent=cs.filter(x=>todaySent(x.id)).length,bought=cs.filter(x=>todayBought(x.name)).length;return '<div class="card"><div class="hero"><div><h2 style="margin:0">'+a.name+'</h2><div class="muted"><b>'+(a.days&&a.days.length?a.days.map(d=>weekDays[d]).join(', '):'Sem dias definidos')+'</b> · '+cs.length+' clientes · '+sent+' contatados hoje · '+bought+' pedidos hoje · <b>'+(cs.length-sent)+' faltam contatar</b></div></div><button class="btn" onclick="go(\'routes\')">Abrir rota</button></div></div>'}).join(''):'<div class="card"><b>Nenhuma rota programada para hoje.</b><div class="muted">Cadastre os dias em Praças / Rotas.</div></div>';return '<div class="hero"><div><h1>Início</h1><div class="muted">'+weekDays[day]+' · Gestão Distribuidora Demonstração</div></div><button class="btn" onclick="go(\'orders\')">+ Novo pedido</button></div><div class="grid"><div class="card metric"><span>Vendas</span><b>'+R(sales)+'</b></div><div class="card metric"><span>Lucro bruto</span><b>'+R(sales-cost)+'</b></div><div class="card metric"><span>Clientes ativos</span><b>'+ac().length+'</b></div><div class="card metric"><span>Produtos ativos</span><b>'+ap().length+'</b></div></div><h2>Rotas de hoje</h2>'+routesHtml}
if(!db.priceTables){db.priceTables=[{id:1,name:'Tabela Padrão',prices:{},active:true}];db.customers.forEach(x=>{x.priceTableId=x.priceTableId||1});save()}
function tableName(id){let t=db.priceTables.find(x=>String(x.id)===String(id));return t?t.name:'Tabela Padrão'}
if(!db.areas){let names=[...new Set(db.customers.map(x=>(x.area||'').trim()).filter(Boolean))];db.areas=names.map((name,i)=>({id:Date.now()+i,name,active:true}));db.customers.forEach(x=>{let a=db.areas.find(y=>y.name.toLowerCase()===(x.area||'').trim().toLowerCase());x.areaId=a?a.id:null});save()}
function areaName(c){let a=db.areas.find(x=>String(x.id)===String(c.areaId));return a?a.name:(c.area||'Sem praça')}
function customers(){return '<div class="hero"><div><h1>Clientes</h1><div class="muted">Ativos: '+ac().length+'</div></div><div class="actions"><button class="btn soft" onclick="inactiveCustomers()">Inativos ('+db.customers.filter(x=>x.active===false).length+')</button><button class="btn" onclick="editCustomer()">+ Cliente</button></div></div><div class="card"><table><tr><th>Cliente</th><th>Praça</th><th>Telefone</th><th>Tabela</th><th>Ações</th></tr>'+ac().map(x=>'<tr><td>'+x.name+'</td><td>'+areaName(x)+'</td><td>'+x.phone+'</td><td>'+tableName(x.priceTableId)+'</td><td><div class="actions"><button class="btn ok" onclick="sendOrderLink('+x.id+')">WhatsApp / Pedido</button><button class="btn soft" onclick="editCustomer('+x.id+')">Editar</button><button class="btn danger" onclick="removeCustomer('+x.id+')">'+(db.orders.some(o=>String(o.customerId)===String(x.id)||o.customer===x.name)?'Inativar':'Excluir')+'</button></div></td></tr>').join('')+'</table></div>'}
function editCustomer(id){let x=id?db.customers.find(c=>c.id===id):{name:'',area:'',phone:'',active:true,priceTableId:1};openM('<h2>'+(id?'Editar':'Novo')+' cliente</h2><label>Nome</label><input id="cn" value="'+x.name+'"><label>Praça</label><select id="ca"><option value="">Selecione...</option>'+db.areas.filter(a=>a.active!==false).map(a=>'<option value="'+a.id+'" '+(String(x.areaId)===String(a.id)?'selected':'')+'>'+a.name+'</option>').join('')+'</select><label>Telefone</label><input id="cp" value="'+x.phone+'"><label>Tabela de preço</label><select id="ct">'+db.priceTables.filter(t=>t.active!==false).map(t=>'<option value="'+t.id+'" '+(String(x.priceTableId||1)===String(t.id)?'selected':'')+'>'+t.name+'</option>').join('')+'</select><button class="btn" onclick="saveCustomer('+(id||0)+')">Salvar</button>')}
function saveCustomer(id){let ar=db.areas.find(a=>String(a.id)===String(ca.value));let o={name:cn.value.trim(),areaId:ca.value?+ca.value:null,area:ar?ar.name:'',phone:cp.value.trim(),priceTableId:+ct.value};if(!o.name)return alert('Informe o nome.');if(id)Object.assign(db.customers.find(x=>x.id===id),o);else db.customers.push({id:Date.now(),...o,active:true});save();closeM();render()}
function removeCustomer(id){let x=db.customers.find(c=>c.id===id),has=db.orders.some(o=>String(o.customerId)===String(id)||o.customer===x.name);if(has){if(confirm('Este cliente possui histórico. Ele não pode ser excluído. Deseja inativá-lo?')){x.active=false;save();render()}}else if(confirm('Excluir definitivamente '+x.name+'?')){db.customers=db.customers.filter(c=>c.id!==id);save();render()}}
function inactiveCustomers(){let a=db.customers.filter(x=>x.active===false);openM('<h2>Clientes inativos</h2>'+(a.length?a.map(x=>'<div class="card"><b>'+x.name+'</b><div class="muted">'+tableName(x.priceTableId)+'</div><div class="actions" style="margin-top:8px"><button class="btn ok" onclick="reactCustomer('+x.id+')">Reativar</button><button class="btn soft" onclick="editCustomer('+x.id+')">Editar</button></div></div>').join(''):'<p>Nenhum cliente inativo.</p>'))}
function reactCustomer(id){db.customers.find(x=>x.id===id).active=true;save();closeM();render()}
function routes(){let areas=db.areas.filter(a=>a.active!==false);return '<div class="hero"><div><h1>Praças / Rotas</h1><div class="muted">Cadastro e acompanhamento das praças</div></div><div class="actions"><button class="btn soft" onclick="inactiveAreas()">Inativas ('+db.areas.filter(a=>a.active===false).length+')</button><button class="btn" onclick="editArea()">+ Nova praça</button></div></div>'+areas.map(a=>{let cs=ac().filter(x=>String(x.areaId)===String(a.id)||(!x.areaId&&(x.area||'').trim()===a.name)),links=(db.sentLinks||[]).filter(x=>x.area===a.name),orders=(db.remoteOrders||[]);let sent=cs.filter(x=>links.some(l=>String(l.customerId)===String(x.id))).length,bought=cs.filter(x=>orders.some(o=>o.client_name===x.name)).length;return '<div class="card"><div class="hero"><div><h2 style="margin:0">'+a.name+'</h2><div class="muted">'+cs.length+' clientes · '+sent+' links enviados · '+bought+' com pedido</div></div><div class="actions"><button class="btn soft" onclick="editArea('+a.id+')">Editar praça</button><button class="btn danger" onclick="deactivateArea('+a.id+')">Inativar</button></div></div><table><tr><th>Cliente</th><th>WhatsApp</th><th>Link</th><th>Pedido</th><th>Ação</th></tr>'+cs.map(x=>{let s=links.some(l=>String(l.customerId)===String(x.id)),b=orders.some(o=>o.client_name===x.name);return '<tr><td><b>'+x.name+'</b></td><td>'+x.phone+'</td><td>'+(s?'✅ Enviado':'⚠️ Não enviado')+'</td><td>'+(b?'✅ Comprou':'— Sem pedido')+'</td><td><button class="btn '+(s?'soft':'ok')+'" onclick="sendOrderLink('+x.id+')">WhatsApp / Pedido</button></td></tr>'}).join('')+'</table></div>'}).join('')}
function editArea(id){let a=id?db.areas.find(x=>x.id===id):{name:'',days:[]};a.days=a.days||[];openM('<h2>'+(id?'Editar':'Nova')+' praça</h2><label>Nome da praça / cidade</label><input id="an" value="'+a.name+'"><label>Dias de atendimento / rota</label><div class="card">'+weekDays.map((d,i)=>'<label style="display:inline-flex;align-items:center;gap:5px;margin:6px 12px 6px 0"><input class="areaDay" type="checkbox" value="'+i+'" '+(a.days.includes(i)?'checked':'')+' style="width:auto;margin:0">'+d+'</label>').join('')+'</div><button class="btn" onclick="saveArea('+(id||0)+')">Salvar</button>')}
function saveArea(id){let name=an.value.trim(),days=[...document.querySelectorAll('.areaDay:checked')].map(x=>+x.value);if(!name)return alert('Informe o nome da praça.');if(db.areas.some(a=>a.name.toLowerCase()===name.toLowerCase()&&a.id!==id))return alert('Esta praça já existe.');if(id){let a=db.areas.find(x=>x.id===id),old=a.name;a.name=name;a.days=days;db.customers.filter(x=>String(x.areaId)===String(id)).forEach(x=>x.area=name)}else db.areas.push({id:Date.now(),name,days,active:true});save();closeM();render()}
function deactivateArea(id){let a=db.areas.find(x=>x.id===id),n=ac().filter(x=>String(x.areaId)===String(id)).length;if(n&&!confirm('Esta praça possui '+n+' cliente(s). Ela será apenas inativada e o histórico será mantido. Continuar?'))return;a.active=false;save();render()}
function inactiveAreas(){let a=db.areas.filter(x=>x.active===false);openM('<h2>Praças inativas</h2>'+(a.length?a.map(x=>'<div class="card"><b>'+x.name+'</b><button class="btn ok" style="margin-top:8px" onclick="reactArea('+x.id+')">Reativar</button></div>').join(''):'<p>Nenhuma praça inativa.</p>'))}
function reactArea(id){db.areas.find(x=>x.id===id).active=true;save();closeM();render()}
function priceTables(){return '<div class="hero"><div><h1>Tabelas de Preço</h1><div class="muted">Cada tabela pode ter um preço diferente para cada produto</div></div><button class="btn" onclick="editPriceTable()">+ Nova tabela</button></div><div class="card"><table><tr><th>Tabela</th><th>Produtos com preço próprio</th><th>Clientes</th><th>Ações</th></tr>'+db.priceTables.map(t=>'<tr><td><b>'+t.name+'</b></td><td>'+Object.keys(t.prices||{}).length+'</td><td>'+db.customers.filter(x=>String(x.priceTableId)===String(t.id)).length+'</td><td><button class="btn soft" onclick="editPriceTable('+t.id+')">Editar preços</button> '+(t.id!==1?'<button class="btn danger" onclick="deletePriceTable('+t.id+')">Excluir</button>':'')+'</td></tr>').join('')+'</table></div>'}
function editPriceTable(id){let t=id?db.priceTables.find(x=>x.id===id):{name:'',prices:{}};t.prices=t.prices||{};openM('<h2>'+(id?'Editar':'Nova')+' tabela de preço</h2><label>Nome da tabela</label><input id="tn" value="'+t.name+'"><h3 style="margin-top:18px">Preço de cada produto</h3><p class="muted">Deixe em branco para usar o preço padrão cadastrado no produto.</p>'+ap().map(p=>'<div class="row" style="align-items:end"><div><label>'+p.name+' <span class="muted">Padrão: '+R(p.price)+'</span></label><input class="tablePrice" data-pid="'+p.id+'" type="number" step=".01" min="0" value="'+(t.prices[p.id]??'')+'" placeholder="'+p.price.toFixed(2)+'"></div></div>').join('')+'<button class="btn" onclick="savePriceTable('+(id||0)+')">Salvar tabela</button>')}
function savePriceTable(id){let name=tn.value.trim();if(!name)return alert('Informe o nome da tabela.');let prices={};document.querySelectorAll('.tablePrice').forEach(el=>{if(el.value!=='')prices[el.dataset.pid]=+el.value});if(id){let t=db.priceTables.find(x=>x.id===id);t.name=name;t.prices=prices}else db.priceTables.push({id:Date.now(),name,prices,active:true});save();closeM();render()}
function deletePriceTable(id){if(db.customers.some(x=>String(x.priceTableId)===String(id)))return alert('Esta tabela está vinculada a clientes. Troque a tabela deles antes de excluir.');if(confirm('Excluir esta tabela de preço?')){db.priceTables=db.priceTables.filter(x=>x.id!==id);save();render()}}
function customerProductPrice(customer,product){let t=db.priceTables.find(x=>String(x.id)===String(customer.priceTableId));return t&&t.prices&&t.prices[product.id]!=null?+t.prices[product.id]:+product.price}
function inferCategory(p){let n=p.name.toLowerCase();if(/sol long|budweiser long|heineken long|beats.*long/.test(n))return'Cervejas Long Neck';if(/original lata|brahma lata|skol lata|antártica lata|sub zero lata|budweiser lata|schin lata|kaiser lata|brahma zero lata|brahma malz lata|amstel lata/.test(n))return'Cervejas lata';if(/monster/.test(n))return'Energéticos';if(/suco|del valle/.test(n))return'Sucos';if(/vinho|bordô|branco seco|branco suave|pêssego/.test(n))return'Vinhos';if(/passaporte|natu nobilis|drurys|dreher|catuaba|pitola|são joão|bitter|51 c troca|velho barreiro|cachaça|engenho|vodka/.test(n))return'Destilados e cachaças';if(/600/.test(n))return'Refrigerantes 600 ml';if(/lata/.test(n))return'Refrigerantes lata';if(/2 litros|2,5 litros|3 litros|1,5 litros/.test(n))return'Refrigerantes garrafa';if(/mini pet|200 ml/.test(n))return'Refrigerantes pequenos';if(/1 l|ks/.test(n))return'Refrigerantes retornáveis';return'Outros'}
if(!db.categories){let names=[];db.products.forEach(p=>{let n=inferCategory(p);if(!names.includes(n))names.push(n)});db.categories=names.map((name,i)=>({id:Date.now()+i,name}));db.products.forEach(p=>{let n=inferCategory(p),cat=db.categories.find(x=>x.name===n);p.categoryId=cat?cat.id:null});save()}
function categoryName(p){let x=db.categories.find(c=>String(c.id)===String(p.categoryId));return x?x.name:'Sem categoria'}
function categories(){return `<div class="hero"><div><h1>Categorias</h1><div class="muted">Cadastro de categorias de produtos</div></div><button class="btn" onclick="editCategory()">+ Nova categoria</button></div><div class="card"><table><tr><th>Categoria</th><th>Produtos</th><th>Ações</th></tr>${db.categories.map(cat=>`<tr><td><b>${cat.name}</b></td><td>${db.products.filter(x=>String(x.categoryId)===String(cat.id)).length}</td><td><button class="btn soft" onclick="editCategory(${cat.id})">Editar</button> <button class="btn danger" onclick="deleteCategory(${cat.id})">Excluir</button></td></tr>`).join('')}</table></div>`}

function editProduct(id){let p=id?db.products.find(x=>x.id===id):{name:'',sku:'',cost:0,price:0,stock:0,saleType:'Unitário',categoryId:''};openM('<h2>'+(id?'Editar':'Novo')+' produto</h2><div class="row"><div><label>Produto</label><input id="pn" value="'+p.name+'"></div><div><label>Categoria</label><select id="pcat"><option value="">Selecione...</option>'+db.categories.map(c=>'<option value="'+c.id+'" '+(String(p.categoryId)===String(c.id)?'selected':'')+'>'+c.name+'</option>').join('')+'</select></div><div><label>SKU</label><input id="ps" value="'+p.sku+'"></div><div><label>Custo</label><input id="pc" type="number" step=".01" value="'+p.cost+'"></div><div><label>Venda</label><input id="pp" type="number" step=".01" value="'+p.price+'"></div><div><label>Estoque</label><input id="pe" type="number" value="'+p.stock+'"></div><div><label>Forma de venda</label><select id="pt"><option value="Unitário" '+((p.saleType||"Unitário")==="Unitário"?"selected":"")+'>Unitário</option><option value="Fardo" '+(p.saleType==="Fardo"?"selected":"")+'>Fardo</option><option value="Caixa" '+(p.saleType==="Caixa"?"selected":"")+'>Caixa</option><option value="Dúzia" '+(p.saleType==="Dúzia"?"selected":"")+'>Dúzia</option><option value="Pacote" '+(p.saleType==="Pacote"?"selected":"")+'>Pacote</option></select></div></div><button class="btn" onclick="saveProduct('+(id||0)+')">Salvar</button>')}

function managedOrderCard(o){let st=o.status||'Novo',open=st!=='Entregue'&&st!=='Cancelado',canDelete=st==='Novo'&&!o.stockApplied;return '<div class="manage-order"><div class="manage-order-top"><div><b>'+o.customer+'</b><div class="muted">'+(o.area||'Sem praça')+' · Pedido #'+o.id+'</div></div><div><span class="muted">Volumes</span><br><b>'+((o.items||[]).reduce((s,x)=>s+x.qty,0)||0)+'</b></div><div><span class="muted">Total</span><div class="manage-order-total">'+R(o.total)+'</div></div><div>'+orderStatusBadge(st)+'</div></div><div class="manage-order-actions"><button class="btn soft" onclick="viewOrder('+o.id+')">👁 Ver</button>'+(open?'<button class="btn soft" onclick="editOrder('+o.id+')">✎ Editar</button><button class="btn ok" onclick="finishManagedOrder('+o.id+')">✓ Finalizar</button>':'')+'<button class="btn soft" onclick="printLocalOrder('+o.id+')">🖨 Imprimir</button><button class="btn soft" onclick="pdfOrderMenu('+o.id+')">📄 PDF</button>'+(canDelete?'<button class="btn danger" onclick="deleteOrder('+o.id+')">🗑 Excluir</button>':(st!=='Cancelado'?'<button class="btn danger" onclick="cancelManagedOrder('+o.id+')">✕ Cancelar</button>':''))+'</div></div>'}
function remoteOrderCard(o){let st=o.status||'Novo',open=st!=='Entregue'&&st!=='Cancelado';return '<div class="manage-order"><div class="manage-order-top"><div><b>'+o.client_name+'</b><div class="muted">Pedido online #'+o.id+' · '+new Date(o.created_at).toLocaleString('pt-BR')+'</div></div><div><span class="muted">Itens</span><br><b>'+((o.items||[]).reduce((s,x)=>s+(+x.qty||0),0)||0)+'</b></div><div><span class="muted">Total</span><div class="manage-order-total">'+R(o.total)+'</div></div><div>'+orderStatusBadge(st)+'</div></div><div style="margin:10px 0"><label style="font-size:11px;font-weight:800">ANDAMENTO DO PEDIDO</label><select onchange="changeRemoteOrderStatus('+o.id+',this.value)">'+orderStatusOptions(st)+'</select></div><div class="manage-order-actions"><button class="btn soft" onclick="viewRemoteOrder('+o.id+')">👁 Ver</button>'+(open?'<button class="btn soft" onclick="editRemoteOrder('+o.id+')">✎ Editar</button><button class="btn ok" onclick="finishRemoteOrder('+o.id+')">✓ Finalizar</button>':'')+'<button class="btn soft" onclick="printRemoteOrder('+o.id+')">🖨 Imprimir</button><button class="btn soft" onclick="remotePdfMenu('+o.id+')">📄 PDF</button><button class="btn danger" onclick="deleteRemoteOrder('+o.id+')">🗑 Excluir</button></div></div>'}
async function deleteRemoteOrder(id){let o=(db.remoteOrders||[]).find(x=>x.id===id);if(!o)return;if(!confirm('Excluir definitivamente o pedido #'+id+' de '+o.client_name+'? Esta ação não pode ser desfeita.'))return;try{await sb('marcio_customer_orders?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=representation'}});db.remoteOrders=(db.remoteOrders||[]).filter(x=>x.id!==id);save();render();alert('Pedido excluído.')}catch(e){alert('Não foi possível excluir o pedido. '+e.message);await syncCustomerOrders()}}
async function changeRemoteOrderStatus(id,status){try{await sb('marcio_customer_orders?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({status:status})});let o=(db.remoteOrders||[]).find(x=>x.id===id);if(o)o.status=status;save();render()}catch(e){alert('Não foi possível alterar o andamento do pedido. '+e.message);await syncCustomerOrders()}}
function viewRemoteOrder(id){let o=(db.remoteOrders||[]).find(x=>x.id===id);if(!o)return;openM('<h2>Pedido #'+o.id+'</h2><p><b>'+o.client_name+'</b></p><p>'+orderStatusBadge(o.status||'Novo')+'</p><table><tr><th>Produto</th><th>Qtd.</th><th>Unit.</th><th>Total</th></tr>'+((o.items||[]).map(x=>'<tr><td>'+x.name+'</td><td>'+x.qty+'</td><td>'+R(x.unit_price||x.unitPrice||0)+'</td><td>'+R(x.total||x.qty*(x.unit_price||x.unitPrice||0))+'</td></tr>').join(''))+'</table><h2>Total: '+R(o.total)+'</h2>')}
function editRemoteOrder(id){let o=(db.remoteOrders||[]).find(x=>x.id===id);if(!o)return;if(o.status==='Entregue'||o.status==='Cancelado')return alert('Este pedido não pode mais ser editado.');openM('<h2>Editar pedido online #'+o.id+'</h2><p class="muted">'+o.client_name+'</p><div id="remoteEditItems">'+(o.items||[]).map((x,i)=>'<div class="card" style="margin:7px 0"><b>'+x.name+'</b><div class="row"><div><label>Quantidade</label><input id="req'+i+'" type="number" min="0" value="'+(+x.qty||0)+'"></div><div><label>Preço unitário</label><input id="rep'+i+'" inputmode="decimal" value="'+(+x.unit_price||+x.unitPrice||0).toFixed(2).replace('.',',')+'"></div></div></div>').join('')+'</div><button class="btn full" onclick="saveRemoteOrderEdit('+o.id+')">Salvar alterações</button>')}
async function saveRemoteOrderEdit(id){let o=(db.remoteOrders||[]).find(x=>x.id===id);if(!o)return;let items=(o.items||[]).map((x,i)=>{let q=Math.max(0,+document.getElementById('req'+i).value||0),p=parseFloat(String(document.getElementById('rep'+i).value).replace(/./g,'').replace(',','.'))||0;return {...x,qty:q,unit_price:p,unitPrice:p,total:q*p}}).filter(x=>x.qty>0);if(!items.length)return alert('O pedido precisa ter pelo menos um item.');let total=items.reduce((s,x)=>s+(+x.total||0),0);try{let rows=await sb('marcio_customer_orders?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({items:items,total:total})});let updated=Array.isArray(rows)&&rows[0]?rows[0]:null;if(updated)Object.assign(o,updated);else{o.items=items;o.total=total}save();closeM();render();alert('Pedido atualizado.')}catch(e){alert('Não foi possível editar o pedido. '+e.message)}}
async function finishRemoteOrder(id){let o=(db.remoteOrders||[]).find(x=>x.id===id);if(!o)return;if(!confirm('Finalizar este pedido como entregue?'))return;await changeRemoteOrderStatus(id,'Entregue')}
function buildRemoteOrderPdf(id){let o=(db.remoteOrders||[]).find(x=>x.id===id);if(!o||!window.jspdf)return null;let {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),y=16;doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('DISTRIBUIDORA DEMONSTRAÇÃO',14,y);y+=7;doc.setFontSize(11);doc.text('PEDIDO ONLINE #'+o.id,14,y);y+=7;doc.setFont('helvetica','normal');doc.text('Cliente: '+o.client_name,14,y);y+=5;doc.text('Data: '+new Date(o.created_at).toLocaleString('pt-BR'),14,y);y+=8;doc.setFont('helvetica','bold');doc.text('Produto',14,y);doc.text('Qtd.',125,y);doc.text('Unit.',145,y);doc.text('Total',196,y,{align:'right'});y+=3;doc.line(14,y,196,y);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(9);(o.items||[]).forEach(i=>{if(y>275){doc.addPage();y=16}let u=+i.unit_price||+i.unitPrice||0,name=doc.splitTextToSize(i.name,105);doc.text(name,14,y);doc.text(String(i.qty),128,y,{align:'right'});doc.text(R(u),160,y,{align:'right'});doc.text(R(+i.total||(+i.qty||0)*u),196,y,{align:'right'});y+=Math.max(5,name.length*4)});y+=3;doc.line(14,y,196,y);y+=7;doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('TOTAL: '+R(o.total),196,y,{align:'right'});return{doc,name:'pedido-marcio-online-'+o.id+'.pdf',order:o}}
function remotePdfMenu(id){openM('<h2>Cópia do pedido em PDF</h2><div class="muted" style="margin-bottom:16px">Pedido recebido pelo link do cliente</div><div style="display:grid;gap:10px"><button class="btn" style="padding:15px" onclick="downloadRemoteOrderPdf('+id+')">⬇ Baixar PDF</button><button class="btn ok" style="padding:15px" onclick="shareRemoteOrderPdf('+id+')">📲 Compartilhar PDF</button></div>')}
function downloadRemoteOrderPdf(id){let x=buildRemoteOrderPdf(id);if(!x)return alert('Não foi possível gerar o PDF.');x.doc.save(x.name);closeM()}
async function shareRemoteOrderPdf(id){let x=buildRemoteOrderPdf(id);if(!x)return alert('Não foi possível gerar o PDF.');let blob=x.doc.output('blob'),file=new File([blob],x.name,{type:'application/pdf'});try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({files:[file],title:'Pedido Distribuidora Demonstração #'+id});closeM();return}}catch(e){if(e&&e.name==='AbortError')return}x.doc.save(x.name);closeM();alert('PDF baixado.')}
function orderStatusBadge(s){let labels={'Novo':'🟡 Novo','Confirmado':'🔵 Confirmado','Separando':'🟠 Separando','Saiu para entrega':'🚚 Em entrega','Entregue':'🟢 Finalizado','Cancelado':'🔴 Cancelado'};return labels[s]||s}
function editOrder(id){let o=db.orders.find(x=>x.id===id);if(!o||o.status==='Entregue'||o.status==='Cancelado')return alert('Este pedido não pode mais ser editado.');orderDraft={editingId:o.id,customerId:o.customerId,items:(o.items||[]).map(x=>({...x})),discount:o.discount||0,notes:o.notes||'',manualTotal:o.manualTotal!=null?o.manualTotal:null,search:'',category:''};renderOrderDraft()}
function finishManagedOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;if(!confirm('Finalizar este pedido como entregue? Isso fará a baixa do estoque.'))return;changeOrderStatus(id,'Entregue')}
function deleteOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;if((o.status||'Novo')!=='Novo'||o.stockApplied)return alert('Pedido com movimentação não pode ser excluído. Cancele para preservar o histórico.');if(!confirm('Excluir definitivamente este pedido?'))return;db.orders=db.orders.filter(x=>x.id!==id);save();render()}
function cancelManagedOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;if(!confirm('Cancelar este pedido e manter no histórico?'))return;changeOrderStatus(id,'Cancelado')}
function newOrder(){if(!ac().length||!ap().length)return alert('Cadastre cliente e produto ativos.');orderDraft={customerId:null,items:[],discount:0,notes:'',search:'',category:''};renderOrderDraft()}
function renderOrderDraft(){if(!orderDraft.customerId){openM('<h2>Novo pedido</h2><p class="muted">Selecione o cliente.</p><input id="clientSearch" autofocus placeholder="🔎 Buscar cliente ou praça..." oninput="filterOrderClients(this.value)"><div id="orderClients">'+orderClientButtons('')+'</div>');return}let cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId));openM('<div class="order-shell"><div class="order-clientbar"><div><div class="sub">NOVO PEDIDO</div><h2 style="margin:2px 0">'+cl.name+'</h2><div class="muted">'+areaName(cl)+' · '+tableName(cl.priceTableId)+'</div></div><button class="btn" onclick="orderDraft.customerId=null;orderDraft.items=[];renderOrderDraft()">Trocar</button></div><input class="order-search" id="productSearch" placeholder="🔎 Buscar produto em todas as categorias..." oninput="searchOrderProducts(this.value)"><div class="order-workspace"><aside><div class="muted" style="font-weight:900;margin:8px 0">CATEGORIAS</div><div id="orderCategories" class="order-categories">'+orderCategoryButtons()+'</div></aside><section class="order-products"><div id="orderGrid">'+orderGridHtml('',cl)+'</div></section></div><div id="orderSummary">'+orderSummaryHtml()+'</div></div>')}
function orderClientButtons(q){q=(q||'').toLowerCase();let list=ac().filter(x=>!q||x.name.toLowerCase().includes(q)||areaName(x).toLowerCase().includes(q));return list.map(x=>'<button class="card" style="width:100%;text-align:left;cursor:pointer;margin:5px 0" onclick="selectOrderCustomer('+x.id+')"><b>'+x.name+'</b><div class="muted">'+areaName(x)+' · '+tableName(x.priceTableId)+'</div></button>').join('')||'<p class="muted">Nenhum cliente encontrado.</p>'}
function filterOrderClients(q){document.getElementById('orderClients').innerHTML=orderClientButtons(q)}
function selectOrderCustomer(id){orderDraft.customerId=id;renderOrderDraft()}
function orderCategoryButtons(){let cats=[...new Set(ap().map(p=>categoryName(p)))].sort();return cats.map((x,i)=>'<button class="btn '+(orderDraft.category===x?'ok':'soft')+'" onclick="selectOrderCategoryByIndex('+i+')">'+x+'</button>').join('')}
function selectOrderCategoryByIndex(i){let cats=[...new Set(ap().map(p=>categoryName(p)))].sort();selectOrderCategory(cats[i])}
function selectOrderCategory(cat){orderDraft.category=cat;orderDraft.search='';let s=document.getElementById('productSearch');if(s)s.value='';let cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId));document.getElementById('orderCategories').innerHTML=orderCategoryButtons();document.getElementById('orderGrid').innerHTML=orderGridHtml('',cl)}
function orderGridHtml(q,cl){q=(q||'').toLowerCase();if(!orderDraft.category&&!q)return '<div class="card" style="text-align:center;padding:28px"><b>Escolha uma categoria</b><div class="muted">Os produtos aparecerão aqui.</div></div>';let list=ap().filter(p=>(q||categoryName(p)===orderDraft.category)&&(!q||p.name.toLowerCase().includes(q)||categoryName(p).toLowerCase().includes(q)));return '<div class="card" style="padding:0;max-height:500px;overflow-y:auto;overflow-x:hidden"><div style="padding:10px 12px;font-weight:800;background:#f8fafc;position:sticky;top:0;z-index:2">'+(q?'Resultado da busca':orderDraft.category)+'</div>'+list.map(p=>{let it=orderDraft.items.find(x=>String(x.productId)===String(p.id)),qty=it?it.qty:0;return '<div class="order-item '+(qty>0?'hasqty':'')+'"><div class="order-item-name"><b>'+p.name+'</b><div class="order-item-unit">'+(p.saleType||'Unitário')+'</div></div><div class="order-item-price"><input class="order-price-input '+(it&&it.priceChanged?'changed':'')+'" inputmode="decimal" value="'+((it?it.unitPrice:customerProductPrice(cl,p)).toFixed(2).replace('.',','))+'" title="Preço deste pedido" onchange="manualProductPrice('+p.id+',this.value)"></div><div class="order-qty"><button class="btn soft" onclick="changeProductQty('+p.id+',-1)">−</button><input inputmode="numeric" type="number" min="0" value="'+qty+'" oninput="manualProductQty('+p.id+',this.value)" onfocus="this.select()"><button class="btn ok" onclick="changeProductQty('+p.id+',1)">＋</button></div></div>'}).join('')+'</div>'}
function searchOrderProducts(q){orderDraft.search=q;let cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId));document.getElementById('orderGrid').innerHTML=orderGridHtml(q,cl)}
function manualProductPrice(id,val){let cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId)),p=db.products.find(x=>String(x.id)===String(id));if(!p||!cl)return;let price=parseFloat(String(val).replace(/\./g,'').replace(',','.'));if(isNaN(price)||price<0){alert('Informe um preço válido.');renderOrderDraft();return}let it=orderDraft.items.find(x=>String(x.productId)===String(id)),base=customerProductPrice(cl,p);if(!it){orderDraft.items.push({productId:p.id,name:p.name,unit:p.saleType||'Unitário',qty:0,unitPrice:price,baseUnitPrice:base,priceChanged:Math.abs(price-base)>.009,cost:+p.cost})}else{if(it.baseUnitPrice==null)it.baseUnitPrice=base;it.unitPrice=price;it.priceChanged=Math.abs(price-it.baseUnitPrice)>.009}let s=document.getElementById('orderSummary');if(s)s.innerHTML=orderSummaryHtml()}
function manualProductQty(id,val){let q=Math.max(0,parseInt(val,10)||0),cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId)),p=db.products.find(x=>String(x.id)===String(id)),i=orderDraft.items.findIndex(x=>String(x.productId)===String(id));if(q===0&&i>=0)orderDraft.items.splice(i,1);else if(i>=0)orderDraft.items[i].qty=q;else if(q>0)orderDraft.items.push({productId:p.id,name:p.name,unit:p.saleType||'Unitário',qty:q,unitPrice:customerProductPrice(cl,p),cost:+p.cost});let s=document.getElementById('orderSummary');if(s)s.innerHTML=orderSummaryHtml()}
function changeProductQty(id,delta){let it=orderDraft.items.find(x=>String(x.productId)===String(id)),q=Math.max(0,(it?it.qty:0)+delta);setDraftProductQty(id,q);let cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId));document.getElementById('orderGrid').innerHTML=orderGridHtml(orderDraft.search||'',cl)}
function setDraftProductQty(id,val){let q=Math.max(0,+val||0),cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId)),p=db.products.find(x=>String(x.id)===String(id)),i=orderDraft.items.findIndex(x=>String(x.productId)===String(id));if(q===0&&i>=0)orderDraft.items.splice(i,1);else if(i>=0)orderDraft.items[i].qty=q;else if(q>0)orderDraft.items.push({productId:p.id,name:p.name,unit:p.saleType||'Unitário',qty:q,unitPrice:customerProductPrice(cl,p),cost:+p.cost});document.getElementById('orderSummary').innerHTML=orderSummaryHtml()}
function orderCalc(){let subtotal=orderDraft.items.reduce((s,x)=>s+x.unitPrice*x.qty,0),disc=Math.max(0,Math.min(100,+orderDraft.discount||0)),calculated=subtotal*(1-disc/100),total=orderDraft.manualTotal!=null?Math.max(0,+orderDraft.manualTotal||0):calculated;return {subtotal,disc,calculated,total,vol:orderDraft.items.reduce((s,x)=>s+x.qty,0)}}
function orderSummaryHtml(){let x=orderCalc();return '<div class="card order-summary-card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><div class="order-count">'+orderDraft.items.length+' produto(s) · '+x.vol+' volume(s)'+(x.disc?' · desconto '+x.disc+'%':'')+(orderDraft.manualTotal!=null?' · total ajustado':'')+'</div><div class="order-total">'+R(x.total)+'</div></div><div class="actions"><button class="btn soft" onclick="orderOptions()">✎ Valor / observação</button><button class="btn soft" onclick="finishOrder(\'print\')">🖨 Salvar e imprimir</button><button class="btn soft" onclick="finishOrder(\'share\')">📄 Salvar e gerar PDF</button><button class="btn" onclick="finishOrder(\'save\')">✓ Salvar</button></div></div></div>'}
function orderOptions(){let x=orderCalc();openM('<h2>Opções do pedido</h2><label>Desconto geral %</label><input id="draftDisc" type="number" min="0" max="100" step=".01" value="'+(orderDraft.discount||0)+'"><label>Total negociado do pedido</label><input id="draftTotal" inputmode="decimal" value="'+(orderDraft.manualTotal!=null?Number(orderDraft.manualTotal).toFixed(2).replace('.',','):x.calculated.toFixed(2).replace('.',','))+'"><div class="muted">Altere somente se quiser negociar o valor final. Para voltar ao cálculo automático, deixe em branco.</div><label>Observação</label><input id="draftNotes" value="'+(orderDraft.notes||'')+'"><button class="btn" onclick="applyOrderOptions()">Aplicar e voltar</button>')}
function applyOrderOptions(){orderDraft.discount=+draftDisc.value||0;orderDraft.notes=draftNotes.value;let v=draftTotal.value.trim();if(!v)orderDraft.manualTotal=null;else{let n=parseFloat(v.replace(/\./g,'').replace(',','.'));if(isNaN(n)||n<0)return alert('Informe um total válido.');let subtotal=orderDraft.items.reduce((s,x)=>s+x.unitPrice*x.qty,0),calc=subtotal*(1-Math.max(0,Math.min(100,+orderDraft.discount||0))/100);orderDraft.manualTotal=Math.abs(n-calc)>.009?n:null}renderOrderDraft()}
function orderShareText(o){return 'Olá, '+o.customer+'! Segue a cópia em PDF do seu pedido Distribuidora Demonstração nº '+o.id+'.'}
function buildOrderPdf(id){let o=db.orders.find(x=>x.id===id);if(!o||!window.jspdf)return null;let {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),y=16;doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('DISTRIBUIDORA DEMONSTRAÇÃO',14,y);y+=7;doc.setFontSize(11);doc.text('PEDIDO #'+o.id,14,y);y+=7;doc.setFont('helvetica','normal');doc.text('Cliente: '+o.customer,14,y);y+=5;if(o.area){doc.text('Praca: '+o.area,14,y);y+=5}doc.text('Data: '+(o.date||''),14,y);y+=8;doc.setFont('helvetica','bold');doc.text('Produto',14,y);doc.text('Qtd.',125,y);doc.text('Unit.',145,y);doc.text('Total',175,y,{align:'right'});y+=3;doc.line(14,y,196,y);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(9);(o.items||[]).forEach(i=>{if(y>275){doc.addPage();y=16}let name=doc.splitTextToSize(i.name+' ('+(i.unit||'')+')',105);doc.text(name,14,y);doc.text(String(i.qty),128,y,{align:'right'});doc.text(R(i.unitPrice),160,y,{align:'right'});doc.text(R(i.qty*i.unitPrice),196,y,{align:'right'});y+=Math.max(5,name.length*4)});y+=3;doc.line(14,y,196,y);y+=7;doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('TOTAL: '+R(o.total),196,y,{align:'right'});if(o.notes){y+=8;doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize('Observacao: '+o.notes,180),14,y)}return {doc,name:'pedido-marcio-'+o.id+'.pdf',order:o}}
function downloadOrderPdf(id){let x=buildOrderPdf(id);if(!x)return alert('Não foi possível gerar o PDF.');x.doc.save(x.name);closeM()}
function pdfOrderMenu(id){openM('<h2>Cópia do pedido em PDF</h2><div class="muted" style="margin-bottom:16px">O que deseja fazer?</div><div style="display:grid;gap:10px"><button class="btn" style="padding:15px" onclick="downloadOrderPdf('+id+')">⬇ Baixar PDF</button><button class="btn ok" style="padding:15px" onclick="shareOrderPdf('+id+')">📲 Enviar via WhatsApp</button><button class="btn soft" onclick="closeM()">Voltar</button></div>')}
async function shareOrderPdf(id){let x=buildOrderPdf(id);if(!x)return alert('Não foi possível gerar o PDF.');let blob=x.doc.output('blob'),file=new File([blob],x.name,{type:'application/pdf'}),cl=db.customers.find(z=>String(z.id)===String(x.order.customerId)),phone=String(cl&&cl.phone||'').replace(/\D/g,'');if(phone.length===10||phone.length===11)phone='55'+phone;try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Pedido Distribuidora Demonstração',text:orderShareText(x.order)});closeM();return}}catch(e){if(e&&e.name==='AbortError')return}x.doc.save(x.name);closeM();if(phone)window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(orderShareText(x.order)),'_blank');else alert('PDF baixado. O cliente não possui WhatsApp cadastrado.');setTimeout(()=>alert('O PDF foi baixado. Anexe o arquivo '+x.name+' na conversa do WhatsApp.'),250)}
function generateOrderPdf(id){downloadOrderPdf(id)}
function shareLocalOrder(id){shareOrderPdf(id)}
function finishOrder(action){let cl=db.customers.find(x=>String(x.id)===String(orderDraft.customerId));if(!cl||!orderDraft.items.length)return alert('Adicione pelo menos um produto.');let x=orderCalc(),cost=orderDraft.items.reduce((s,i)=>s+i.cost*i.qty,0),editing=orderDraft.editingId!=null,old=editing?db.orders.find(o=>o.id===orderDraft.editingId):null,id=editing?orderDraft.editingId:Date.now(),o={id,customerId:cl.id,customer:cl.name,area:areaName(cl),priceTableId:cl.priceTableId,priceTable:tableName(cl.priceTableId),items:orderDraft.items,subtotal:x.subtotal,discount:x.disc,calculatedTotal:x.calculated,manualTotal:orderDraft.manualTotal,total:x.total,cost,status:old?old.status:'Novo',source:'Gestor',notes:orderDraft.notes||'',stockApplied:old?old.stockApplied:false,date:old?old.date:new Date().toLocaleString('pt-BR'),createdAt:old?old.createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(editing){let i=db.orders.findIndex(z=>z.id===id);db.orders[i]=o}else db.orders.push(o);save();orderDraft=null;closeM();render();if(action==='print')return printLocalOrder(id);if(action==='share')return shareLocalOrder(id);alert(editing?'Pedido atualizado.':'Pedido salvo como Novo.')}
function changeOrderStatus(id,status){let o=db.orders.find(x=>x.id===id);if(!o)return;if(status==='Entregue'&&!o.stockApplied){for(let i of (o.items||[])){let p=db.products.find(x=>String(x.id)===String(i.productId));if(p){if(p.stock<i.qty){render();return alert('Estoque insuficiente para '+p.name+'. Ajuste o estoque antes de entregar.')}p.stock-=i.qty}}o.stockApplied=true;o.deliveredAt=new Date().toISOString()}if(o.stockApplied&&status!=='Entregue'){if(!confirm('Este pedido já baixou estoque. Deseja alterar o status mesmo assim? O estoque continuará baixado.')){render();return}}o.status=status;save();render()}
function viewOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;openM('<h2>Pedido #'+o.id+'</h2><p><b>'+o.customer+'</b> · '+(o.area||'')+'</p><p class="muted">'+(o.date||'')+' · '+(o.source||'Gestor')+' · '+(o.priceTable||'')+'</p><table><tr><th>Produto</th><th>Qtd.</th><th>Unit.</th><th>Total</th></tr>'+((o.items||[]).map(x=>'<tr><td>'+x.name+'</td><td>'+x.qty+'</td><td>'+R(x.unitPrice)+'</td><td>'+R(x.qty*x.unitPrice)+'</td></tr>').join('')||'<tr><td colspan="4">Pedido antigo sem itens detalhados.</td></tr>')+'</table><p>Subtotal: '+R(o.subtotal||o.total)+'</p><p>Desconto: '+(o.discount||0)+'%</p><h2>Total: '+R(o.total)+'</h2>'+(o.notes?'<p><b>Observação:</b> '+o.notes+'</p>':'')+'<p><b>Status:</b> '+(o.status||'Novo')+'</p>')}
function printLocalOrder(id){choosePrint('local',id)}
function stock(){return '<div class="hero"><div><h1>Estoque</h1><div class="muted">Produtos ativos</div></div><button class="btn" onclick="stockEntry()">+ Entrada</button></div><div class="card"><table><tr><th>Produto</th><th>Estoque</th><th>Custo</th></tr>'+ap().map(p=>'<tr><td>'+p.name+'</td><td>'+p.stock+'</td><td>'+R(p.cost)+'</td></tr>').join('')+'</table></div>'}
function stockEntry(){openM('<h2>Entrada de estoque</h2><label>Produto</label><select id="sp">'+ap().map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'</select><label>Quantidade</label><input id="sq" type="number" value="1"><button class="btn" onclick="saveStock()">Salvar entrada</button>')}
function saveStock(){let p=db.products.find(x=>x.id==sp.value);p.stock+=+sq.value;save();closeM();render()}
function finance(){let sales=db.orders.reduce((s,o)=>s+o.total,0),cost=db.orders.reduce((s,o)=>s+o.cost,0);return '<div class="hero"><div><h1>Financeiro</h1><div class="muted">Resumo de testes</div></div></div><div class="grid"><div class="card metric"><span>Faturamento</span><b>'+R(sales)+'</b></div><div class="card metric"><span>Custo</span><b>'+R(cost)+'</b></div><div class="card metric"><span>Lucro bruto</span><b>'+R(sales-cost)+'</b></div><div class="card metric"><span>Margem</span><b>'+(sales?((sales-cost)/sales*100).toFixed(1):0)+'%</b></div></div>'}
setInterval(syncCustomerOrders,15000);syncCustomerOrders();
function openM(h){modal.innerHTML='<div class="modalbg" onclick="if(event.target===this)closeM()"><div class="modal">'+h+'<div style="margin-top:12px"><button class="btn soft" onclick="closeM()">Fechar</button></div></div></div>'}function closeM(){modal.innerHTML=''}render();
</script><script>
(() => {
  let installPrompt;
  const installed = () => window.matchMedia('(display-mode: standalone)').matches;
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'btn soft'; button.textContent = 'Instalar aplicativo';
  button.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:45;max-width:calc(100vw - 32px)';
  button.hidden = installed(); document.body.appendChild(button);
  const style = document.createElement('style'); style.textContent = '@media print{#marcioInstall{display:none!important}}';
  document.head.appendChild(style); button.id = 'marcioInstall';
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; button.hidden = false; });
  window.addEventListener('appinstalled', () => { installPrompt = null; button.hidden = true; });
  button.addEventListener('click', async () => {
    if (installPrompt) { const prompt = installPrompt; installPrompt = null; await prompt.prompt(); const result = await prompt.userChoice; if (result.outcome === 'accepted') button.hidden = true; }
    else alert('Para instalar no Android, abra este link no Google Chrome. Toque no menu ⋮ e em “Adicionar à tela inicial” ou “Instalar aplicativo”. Depois confirme a instalação.');
  });
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./marcio-sw.js').catch(console.error));
})();
</script></body></html>
