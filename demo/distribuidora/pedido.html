tedCategory]||[];return '<div class="products"><div class="products-title">'+selectedCategory+'</div>'+ps.map(p=>productRow(p)).join('')+'</div>'}function productRow(p){let n=cart[p.id]||0;return '<div class="item '+(n>0?'selected':'')+'" id="row'+p.id+'"><div><div class="name">'+p.name+'</div><div class="muted">'+p.unit+'</div></div><div class="price">'+R(p.price)+'</div><div class="qty"><button onclick="q('+p.id+',-1)">−</button><input id="q'+p.id+'" inputmode="numeric" type="number" min="0" value="'+n+'" oninput="setQ('+p.id+',this.value)" onfocus="this.select()"><button onclick="q('+p.id+',1)">+</button></div></div>'}function q(id,d){setQ(id,(cart[id]||0)+d,true)}function setQ(id,val,refresh){let n=Math.max(0,parseInt(val,10)||0);cart[id]=n;let el=document.getElementById('q'+id);if(el&&refresh)el.value=n;let row=document.getElementById('row'+id);if(row)row.classList.toggle('selected',n>0);sum()}function sum(){let v=link.catalog.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0);total.textContent=R(v)}async function confirmOrder(){let items=link.catalog.filter(p=>cart[p.id]>0).map(p=>({product_id:p.id,name:p.name,unit:p.unit,qty:cart[p.id],unit_price:p.price,total:cart[p.id]*p.price}));if(!items.length)return alert('Adicione pelo menos um produto.');let v=items.reduce((s,x)=>s+x.total,0);if(!confirm('Confirmar pedido no valor de '+R(v)+'?'))return;try{let o=await api('marcio_customer_orders',{method:'POST',body:JSON.stringify({token,client_name:link.client_name,items,total:v,status:'Novo'})});fetch('https://wwietlvweqsxfpejhhis.supabase.co/functions/v1/marcio-push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'notifyOrder',orderId:o[0].id,token:token})}).catch(()=>{});app.innerHTML='<div class="card"><h2>Pedido enviado! ✅</h2><p>Seu pedido foi enviado para o Distribuidora Demonstração.</p><p><b>Total: '+R(v)+'</b></p><p class="muted">Pedido #'+o[0].id+'</p></div>';bottom.style.display='none'}catch(e){alert('Não foi possível enviar o pedido. Tente novamente.')}}load();
