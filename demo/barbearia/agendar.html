<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar | Barbearia Demonstração</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#171717}.w{max-width:520px;margin:auto;padding:16px}.hero{background:#111;color:#fff;padding:22px;border-radius:0 0 20px 20px}.c{background:#fff;border:1px solid #ddd;border-radius:14px;padding:15px;margin:12px 0}label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}input,select,button{width:100%;min-height:48px;border-radius:10px;font-size:16px}input,select{border:1px solid #bbb;padding:10px}button{border:0;background:#111;color:#fff;font-weight:800;margin-top:10px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{background:#fff;color:#111;border:1px solid #999}.msg{padding:12px;border-radius:10px;background:#eee;margin-top:10px}</style></head><body><div class="hero"><b>Barbearia Demonstração</b><h2>Agende seu horário</h2><div>Escolha o serviço, profissional e horário disponível.</div></div><main class="w"><div class="c"><label>Seu nome</label><input id="name"><label>WhatsApp</label><input id="phone"><label>Serviço</label><select id="service"><option value="1|Corte|40|30">Corte · R$ 40,00 · 30 min</option><option value="2|Barba|30|20">Barba · R$ 30,00 · 20 min</option><option value="3|Corte + Barba|65|50">Corte + Barba · R$ 65,00 · 50 min</option></select><label>Barbeiro</label><select id="barber"><option value="1|Profissional 1">Profissional 1</option><option value="2|Profissional 2">Profissional 2</option></select><label>Data</label><input id="date" type="date"><button id="search">Ver horários</button><div id="out"></div></div></main><script>
const URL='https://wwietlvweqsxfpejhhis.supabase.co',KEY='sb_publishable_dArUUh2qpDqbzvjxXAEbNQ_hT6Y0y5y';const $=x=>document.getElementById(x);let chosen=null;function today(){let d=new Date;return d.toISOString().slice(0,10)}$('date').min=today();$('date').value=today();function mi(t){let p=t.slice(0,5).split(':');return +p[0]*60 + +p[1]}function tm(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}async function rows(date,bid){let q=URL+'/rest/v1/barbershop_public_bookings?select=start_time,duration_minutes,status&booking_date=eq.'+date+'&barber_id=eq.'+bid+'&status=in.(Agendado,Confirmado,Atendido)';let r=await fetch(q,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Accept':'application/json'}});if(!r.ok)throw Error('Não foi possível consultar a agenda.');return r.json()}async function slots(){chosen=null;$('out').innerHTML='<div class="msg">Consultando agenda...</div>';try{let s=$('service').value.split('|'),b=$('barber').value.split('|'),date=$('date').value,used=await rows(date,+b[0]),dur=+s[3],day=new Date(date+'T12:00:00').getDay();if(day===0){$('out').innerHTML='<div class="msg">Não há atendimento neste dia.</div>';return}let a=[],now=new Date(),minToday=now.getHours()*60+now.getMinutes()+30;for(let n=540;n+dur<=1140;n+=30){if(n<810&&n+dur>720)continue;if(date===today()&&n<minToday)continue;let busy=used.some(x=>n<mi(x.start_time)+x.duration_minutes&&n+dur>mi(x.start_time));if(!busy)a.push(tm(n))}$('out').innerHTML='<h3>Horários disponíveis</h3><div class="slots">'+a.map(t=>'<button class="slot" data-t="'+t+'">'+t+'</button>').join('')+'</div>';document.querySelectorAll('.slot').forEach(x=>x.onclick=()=>review(x.dataset.t))}catch(e){$('out').innerHTML='<div class="msg">'+e.message+'</div>'}}function review(t){let n=$('name').value.trim(),p=$('phone').value.trim();if(!n||!p){alert('Informe nome e WhatsApp.');return}let s=$('service').value.split('|'),b=$('barber').value.split('|');chosen=t;$('out').innerHTML='<div class="c"><h3>Confirme seu horário</h3><p><b>'+n+'</b><br>'+s[1]+' com '+b[1]+'<br><b>'+$('date').value+' às '+t+'</b><br>'+s[3]+' min · R$ '+Number(s[2]).toFixed(2).replace('.',',')+'</p><button id="confirmBooking">Confirmar agendamento</button><button id="changeBooking" class="slot">Escolher outro horário</button></div>';$('confirmBooking').onclick=()=>reserve(t);$('changeBooking').onclick=slots}async function reserve(t){let n=$('name').value.trim(),p=$('phone').value.trim();if(!n||!p){alert('Informe nome e WhatsApp.');return}let s=$('service').value.split('|'),b=$('barber').value.split('|'),fresh=await rows($('date').value,+b[0]),start=mi(t),dur=+s[3];if(fresh.some(x=>start<mi(x.start_time)+x.duration_minutes&&start+dur>mi(x.start_time))){alert('Este horário acabou de ser reservado. A agenda será atualizada.');await slots();return}let body={barber_id:+b[0],service_id:+s[0],client_name:n,client_phone:p,service_name:s[1],barber_name:b[1],booking_date:$('date').value,start_time:t,duration_minutes:+s[3],price:+s[2],status:'Agendado'};let r=await fetch(URL+'/rest/v1/barbershop_public_bookings',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Accept':'application/json','Prefer':'return=representation'},body:JSON.stringify(body)});if(r.ok){let created=await r.json();if(created&&created[0]&&created[0].id)fetch('about:blank',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'notifyBooking',bookingId:created[0].id})}).catch(()=>{});$('out').innerHTML='<div class="msg"><b>Horário agendado!</b><br>'+$('date').value+' às '+t+'<br>'+s[1]+' com '+b[1]+'</div>'}else{let e=await r.text();if(e.includes('no_overlapping_public_bookings')||r.status===409){alert('Este horário acabou de ser reservado por outra pessoa. Escolha outro horário.');slots()}else $('out').innerHTML='<div class="msg"><b>Erro ao agendar.</b><br>'+r.status+' · '+e.replace(/[<>]/g,'')+'</div>'}}$('search').onclick=slots;
</script></body></html>
