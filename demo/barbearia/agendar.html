<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar | Barbearia Demonstração</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#171717}.w{max-width:520px;margin:auto;padding:16px}.hero{background:#111;color:#fff;padding:22px;border-radius:0 0 20px 20px}.c{background:#fff;border:1px solid #ddd;border-radius:14px;padding:15px;margin:12px 0}label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}input,select,button{width:100%;min-height:48px;border-radius:10px;font-size:16px}input,select{border:1px solid #bbb;padding:10px}button{border:0;background:#111;color:#fff;font-weight:800;margin-top:10px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{background:#fff;color:#111;border:1px solid #999}.msg{padding:12px;border-radius:10px;background:#eee;margin-top:10px}</style><style>
body{background:#f1f2f3;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:url('./logo-demo.svg') center 240px / min(92vw,620px) auto no-repeat;opacity:.12;pointer-events:none;z-index:0}.hero,.w{position:relative;z-index:1}.hero{text-align:center;background:linear-gradient(145deg,#090909,#202020);border-radius:0 0 24px 24px;padding:18px 22px 24px}.salon-logo{display:block;width:172px;max-width:70%;height:auto;margin:0 auto 14px;filter:invert(1);mix-blend-mode:screen}.hero h2{font-size:26px;margin:8px 0 10px}.hero>div{font-size:15px;line-height:1.5;color:#dedede}.c{background:rgba(255,255,255,.93);border-color:#e1ddd5;border-radius:18px;box-shadow:0 8px 26px #1515150a}label{font-size:14px;margin:14px 0 6px}input,select{background:#fff;border-color:#cbc9c3}button{border-radius:12px}#search,#confirmBooking{background:linear-gradient(135deg,#171717,#2e2920);border:1px solid #b6904e;min-height:54px}button:disabled{opacity:.6;cursor:wait}.slot{border-color:#c4b79c}.slot:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c9aa65;outline-offset:3px}
.booking-confirmation{padding:24px 18px;text-align:center;background:rgba(255,255,255,.98);border:1px solid #d9e8dd;border-radius:18px;margin-top:18px;box-shadow:0 8px 24px #14482b12;scroll-margin-top:18px}.booking-confirmation.review{border-color:#dfcda8}.confirmation-check{width:76px;height:76px;margin:0 auto 18px;background:#17833e;color:#fff;border:8px solid #eaf6ed;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;line-height:1}.booking-confirmation h3{font-size:clamp(22px,6vw,28px);line-height:1.2;margin:0 0 10px;overflow-wrap:break-word}.confirmation-subtitle{font-size:16px;line-height:1.5;color:#5f656b;margin:0 0 20px}.confirmation-when{border-top:1px solid #c9aa65;border-bottom:1px solid #c9aa65;padding:18px 0;margin:18px 0;display:grid;gap:8px}.confirmation-date{font-size:22px;font-weight:800}.confirmation-time{font-size:32px;font-weight:900}.confirmation-details{margin:0;text-align:left}.confirmation-details>div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:16px;line-height:1.4}.confirmation-details dt{color:#646b73}.confirmation-details dd{margin:0;text-align:right;font-weight:700;overflow-wrap:anywhere}.confirmation-details dt,.confirmation-details dd{flex:1;min-width:0}.confirmation-duration{font-size:14px;color:#646b73;margin:14px 0 0}.booking-confirmation .slot{margin-top:12px}.booking-confirmation:focus{outline:none}
@media(prefers-reduced-motion:no-preference){.booking-confirmation.success{animation:confirmation-in .25s ease-out}@keyframes confirmation-in{from{opacity:.5;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
@media(max-width:360px){.w{padding:12px}.booking-confirmation{padding:20px 12px}.confirmation-details>div{font-size:15px}}
</style><style>.demo-note{position:relative;z-index:2;background:#fbf3df;border-bottom:1px solid #dac494;padding:12px 16px;text-align:center;font:14px/1.5 Arial;color:#30261a}.demo-note button{width:auto;min-height:36px;margin:0 0 0 8px;padding:5px 12px;border:1px solid #af8f50;border-radius:8px;background:#fff;color:#30261a;font-weight:700}.demo-note a{color:#503b15;font-weight:700}.hero #demoBusinessName{display:block;margin-bottom:10px}</style><meta http-equiv="Content-Security-Policy" content="connect-src 'self'; worker-src 'self';"><script src="./demo-data.js?v=4"></script></head><body><div class="demo-note">Demonstração LT Soluções · Agendamento de teste. <a href="./">Ver painel</a></div><div class="hero"><img class="salon-logo" src="./logo-demo.svg" alt="Barbearia Demonstração"><b id="demoBusinessName">Barbearia Demonstração</b><h2>Agende seu horário</h2><div>Escolha o serviço, profissional e horário disponível.</div></div><main class="w"><div class="c"><label>Seu nome</label><input id="name"><label>WhatsApp</label><input id="phone"><label>Serviço</label><select id="service"><option value="1|Corte|35|30">Corte · R$ 35,00 · 30 min</option><option value="2|Barba|25|20">Barba · R$ 25,00 · 20 min</option><option value="3|Corte + Barba|55|50">Corte + Barba · R$ 55,00 · 50 min</option></select><label>Barbeiro</label><select id="barber"><option value="1|Profissional 1">Profissional 1</option><option value="2|Profissional 2">Profissional 2</option></select><label>Data</label><input id="date" type="date"><button id="search">Ver horários</button><div id="out"></div></div></main><script>
const URL=BarberDemo.baseURL,KEY='demo-local',fetch=BarberDemo.fetch;const $=x=>document.getElementById(x);let chosen=null,reserving=false;function today(){return BarberDemo.today()}$('date').min=today();$('date').value=today();function mi(t){let p=t.slice(0,5).split(':');return +p[0]*60 + +p[1]}function tm(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}async function rows(date,bid){let q=URL+'/rest/v1/barbershop_public_bookings?select=start_time,duration_minutes,status&booking_date=eq.'+date+'&barber_id=eq.'+bid+'&status=in.(Agendado,Confirmado,Atendido)';let r=await fetch(q,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Accept':'application/json'}});if(!r.ok)throw Error('Não foi possível consultar a agenda.');return r.json()}
async function operatingHours(date,bid){let r=await fetch(URL+'/rest/v1/barbershop_public_hours?select=weekly&barber_id=eq.'+bid,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Accept':'application/json'},cache:'no-store'});if(!r.ok)throw Error('Não foi possível consultar os horários de atendimento. Tente novamente.');let data=await r.json();if(!data[0]||!data[0].weekly)throw Error('Horários de atendimento indisponíveis. Tente novamente.');return BarberDemo.schedule(bid,date,data[0].weekly)}
function withinHours(w,t,dur){if(!w||!w.active||!w.open||!w.close)return false;let start=mi(t),end=start+dur;return start>=mi(w.open)&&end<=mi(w.close)&&!(w.lunchStart&&w.lunchEnd&&start<mi(w.lunchEnd)&&end>mi(w.lunchStart))}
async function slots(){chosen=null;$('out').innerHTML='<div class="msg">Consultando agenda...</div>';try{await checkCatalogSelection();let s=$('service').value.split('|'),b=$('barber').value.split('|'),date=$('date').value,w=await operatingHours(date,+b[0]),used=await rows(date,+b[0]),dur=+s[3];if(!w||!w.active){$('out').innerHTML='<div class="msg">Não há atendimento neste dia.</div>';return}let a=[],now=new Date(),minToday=now.getHours()*60+now.getMinutes()+30;for(let n=mi(w.open);n+dur<=mi(w.close);n+=30){if(!withinHours(w,tm(n),dur))continue;if(date===today()&&n<minToday)continue;let busy=used.some(x=>n<mi(x.start_time)+x.duration_minutes&&n+dur>mi(x.start_time));if(!busy)a.push(tm(n))}$('out').innerHTML='<h3>Horários disponíveis</h3><div class="slots">'+a.map(t=>'<button class="slot" data-t="'+t+'">'+t+'</button>').join('')+'</div>';document.querySelectorAll('.slot').forEach(x=>x.onclick=()=>review(x.dataset.t))}catch(e){$('out').innerHTML='<div class="msg">'+e.message+'</div>'}}function review(t){let n=$('name').value.trim(),p=$('phone').value.trim();if(!n||!p){alert('Informe nome e WhatsApp.');return}let s=$('service').value.split('|'),b=$('barber').value.split('|');chosen={time:t,date:$('date').value,service:$('service').value,barber:$('barber').value};$('out').innerHTML=bookingConfirmationHtml(false,n,s,b,$('date').value,t);$('confirmBooking').onclick=()=>reserve(t);$('changeBooking').onclick=slots}async function reserve(t){if(reserving||!chosen)return;if(chosen.time!==t||chosen.date!==$('date').value||chosen.service!==$('service').value||chosen.barber!==$('barber').value){await slots();return}reserving=true;let btn=$('confirmBooking');if(btn){btn.disabled=true;btn.textContent='Confirmando...'}let bookingDate=chosen.date;try{await checkCatalogSelection();let n=$('name').value.trim(),p=$('phone').value.trim();if(!n||!p){alert('Informe nome e WhatsApp.');return}let s=$('service').value.split('|'),b=$('barber').value.split('|'),w=await operatingHours(bookingDate,+b[0]),fresh=await rows(bookingDate,+b[0]),start=mi(t),dur=+s[3];if(!withinHours(w,t,dur)){alert('O horário de atendimento foi alterado. Escolha um horário disponível.');await slots();return}if(fresh.some(x=>start<mi(x.start_time)+x.duration_minutes&&start+dur>mi(x.start_time))){alert('Este horário acabou de ser reservado. A agenda será atualizada.');await slots();return}let body={barber_id:+b[0],service_id:+s[0],client_name:n,client_phone:p,service_name:s[1],barber_name:b[1],booking_date:bookingDate,start_time:t,duration_minutes:+s[3],price:+s[2],status:'Agendado'};let r=await fetch(URL+'/rest/v1/barbershop_public_bookings',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Accept':'application/json','Prefer':'return=representation'},body:JSON.stringify(body)});if(r.ok){chosen=null;let created=await r.json();if(created&&created[0]&&created[0].id)fetch('https://barbearia-demo.invalid/functions/v1/demo-notification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'notifyBooking',bookingId:created[0].id})}).catch(()=>{});$('out').innerHTML=bookingConfirmationHtml(true,n,s,b,body.booking_date,t)}else{let e=await r.text();if(e.includes('outside_barbershop_hours')){alert('Este horário está fora do atendimento. A agenda será atualizada.');slots()}else if(e.includes('no_overlapping_public_bookings')||r.status===409){alert('Este horário acabou de ser reservado por outra pessoa. Escolha outro horário.');slots()}else $('out').innerHTML='<div class="msg"><b>Erro ao agendar.</b><br>'+r.status+' · '+e.replace(/[<>]/g,'')+'</div>'}}catch(e){alert('Não foi possível confirmar o agendamento. Confira a agenda antes de tentar novamente.')}finally{reserving=false;if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='Confirmar agendamento'}}}['service','barber','date'].forEach(id=>$(id).addEventListener('change',()=>{chosen=null;$('out').innerHTML=''}));$('search').onclick=slots;
let liveCatalog=null,catalogLoading=null;
const legacyServices=Array.from($('service').options).map(o=>{let p=o.value.split('|');return {id:+p[0],name:p[1],price:+p[2],duration:+p[3],active:true}});
const legacyBarbers=Array.from($('barber').options).map(o=>{let p=o.value.split('|');return {id:+p[0],name:p[1],active:true}});
function serviceValue(s){return [s.id,s.name,s.price,s.duration].join('|')}
function option(select,value,text){let o=document.createElement('option');o.value=value;o.textContent=text;select.appendChild(o)}
function catalogService(id,bid){let row=liveCatalog&&liveCatalog.find(r=>r.barber_id==bid);return row&&row.catalog&&row.catalog.barber.active&&row.catalog.services.find(s=>s.id==id&&s.active)}
function renderCatalog(keepService,keepBarber){let all=new Map();for(let row of liveCatalog||[])if(row.catalog&&row.catalog.barber.active)for(let s of row.catalog.services)if(s.active&&!all.has(s.id))all.set(s.id,s);$('service').replaceChildren();for(let s of all.values())option($('service'),serviceValue(s),s.name+' · '+s.duration+' min');if(keepService&&all.has(+keepService))$('service').value=serviceValue(all.get(+keepService));fillCatalogBarbers(keepBarber)}
function fillCatalogBarbers(keep){let sid=+$('service').value.split('|')[0];$('barber').replaceChildren();for(let row of liveCatalog||[]){let s=catalogService(sid,row.barber_id);if(s)option($('barber'),row.barber_id+'|'+row.catalog.barber.name,row.catalog.barber.name+' · R$ '+Number(s.price).toFixed(2).replace('.',','))}if(keep&&Array.from($('barber').options).some(o=>o.value.split('|')[0]==keep))$('barber').value=Array.from($('barber').options).find(o=>o.value.split('|')[0]==keep).value;applyCatalogPrice()}
function applyCatalogPrice(){let sid=+$('service').value.split('|')[0],bid=+$('barber').value.split('|')[0],s=catalogService(sid,bid);if(s){let o=$('service').selectedOptions[0];o.value=serviceValue(s);o.textContent=s.name+' · R$ '+Number(s.price).toFixed(2).replace('.',',')+' · '+s.duration+' min'}chosen=null;$('out').innerHTML='';$('search').disabled=!s}
async function loadCatalog(){if(catalogLoading)return catalogLoading;catalogLoading=(async()=>{let r=await fetch(URL+'/rest/v1/barbershop_public_hours?select=barber_id,catalog',{headers:{apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error('Não foi possível atualizar serviços e preços. Tente novamente.');let data=await r.json();let previous=JSON.stringify(liveCatalog);liveCatalog=data.map(row=>row.catalog?row:{barber_id:row.barber_id,catalog:{barber:legacyBarbers.find(b=>b.id==row.barber_id)||{id:row.barber_id,name:'Profissional',active:false},services:legacyServices}});if(previous!==JSON.stringify(liveCatalog))renderCatalog($('service').value.split('|')[0],$('barber').value.split('|')[0])})();try{await catalogLoading}finally{catalogLoading=null}}
async function checkCatalogSelection(){let selected=$('service').value,bid=$('barber').value;await loadCatalog();if(selected!==$('service').value||bid!==$('barber').value)throw Error('O serviço ou o preço foi atualizado. Confira a seleção e escolha novamente o horário.');if(!catalogService(+$('service').value.split('|')[0],+$('barber').value.split('|')[0]))throw Error('Selecione um serviço e um profissional disponível.')}
$('service').addEventListener('change',()=>fillCatalogBarbers());$('barber').addEventListener('change',applyCatalogPrice);$('search').disabled=true;loadCatalog().catch(e=>{$('out').textContent=e.message});


function confirmationEscape(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bookingConfirmationHtml(confirmed,n,s,b,date,t){let parts=date.split('-'),dateText=parts.length===3?parts[2]+'/'+parts[1]+'/'+parts[0]:date;return '<section class="booking-confirmation '+(confirmed?'success':'review')+'" '+(confirmed?'role="status" aria-live="polite"':'')+'>'+(confirmed?'<div class="confirmation-check" aria-hidden="true">✓</div>':'')+'<h3>'+(confirmed?'Agendamento confirmado!':'Confirme seu horário')+'</h3><p class="confirmation-subtitle">'+(confirmed?'Seu horário está reservado.':confirmationEscape(n)+', confira os dados antes de confirmar.')+'</p><div class="confirmation-when"><div class="confirmation-date">'+confirmationEscape(dateText)+'</div><div class="confirmation-time">'+confirmationEscape(t)+'</div></div><dl class="confirmation-details"><div><dt>Serviço</dt><dd>'+confirmationEscape(s[1])+'</dd></div><div><dt>Profissional</dt><dd>'+confirmationEscape(b[1])+'</dd></div><div><dt>Valor</dt><dd>R$ '+Number(s[2]).toFixed(2).replace('.',',')+'</dd></div></dl><p class="confirmation-duration">Duração: '+confirmationEscape(s[3])+' min</p>'+(confirmed?'':'<button id="confirmBooking">Confirmar agendamento</button><button id="changeBooking" class="slot">Escolher outro horário</button>')+'</section>'}
</script></body></html>
