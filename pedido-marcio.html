<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido | Marcio Bebidas</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6f8;color:#172033}header{background:#111827;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:12px 0}.cat{margin-top:22px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.name{font-weight:800}.muted{color:#6b7280;font-size:13px}.price{font-size:18px;font-weight:900}.qty{display:flex;align-items:center;gap:7px}.qty button{width:36px;height:36px;border:0;border-radius:9px;font-size:20px}.qty b{min-width:25px;text-align:center}.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:10px;padding:12px 16px;background:#111827;color:#fff;font-weight:800}.total{font-size:20px;font-weight:900}@media(max-width:600px){.wrap{padding:8px}.item{grid-template-columns:1fr}.qty{justify-content:flex-end}.bottom{padding:10px}.btn{padding:12px}}@media print{header,.bottom,.qty{display:none}.card{border:0}.wrap{padding:0}}</style></head><body><header><b>Marcio Bebidas</b><div style="font-size:12px;opacity:.75">Faça seu pedido</div></header><main class="wrap" id="app">Carregando...</main><div class="bottom" id="bottom" style="display:none"><div><div class="muted">Total</div><div class="total" id="total">R$ 0,00</div></div><button class="btn" onclick="confirmOrder()">Confirmar pedido</button></div><script>
const SB='https://wwietlvweqsxfpejhhis.supabase.co',KEY='sb_publishable_dArUUh2qpDqbzvjxXAEbNQ_hT6Y0y5y',token=new URLSearchParams(location.search).get('t');let link,cart={};const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function api(path,opt={}){let r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){if(!token)return app.innerHTML='<div class="card">Link inválido.</div>';try{let a=await api('marcio_order_links?token=eq.'+encodeURIComponent(token)+'&select=*');if(!a.length)throw Error();link=a[0];render()}catch(e){app.innerHTML='<div class="card"><b>Este link não está disponível.</b><p class="muted">Ele pode ter expirado ou sido encerrado.</p></div>'}}function render(){let groups={};link.catalog.forEach(p=>(groups[p.category]||(groups[p.category]=[])).push(p));app.innerHTML='<div class="card"><h2 style="margin:0">'+link.client_name+'</h2><div class="muted">Tabela: '+(link.price_table_name||'Padrão')+' · link válido até '+new Date(link.expires_at).toLocaleString('pt-BR')+'</div></div>'+Object.entries(groups).map(([cat,ps])=>'<section class="card cat"><h2>'+cat+'</h2>'+ps.map(p=>'<div class="item"><div><div class="name">'+p.name+'</div><div class="muted">'+p.unit+'</div><div class="price">'+R(p.price)+'</div></div><div class="qty"><button onclick="q('+p.id+',-1)">−</button><b id="q'+p.id+'">'+(cart[p.id]||0)+'</b><button onclick="q('+p.id+',1)">+</button></div></div>').join('')+'</section>').join('');bottom.style.display='flex';sum()}function q(id,d){let p=link.catalog.find(x=>x.id==id),n=Math.max(0,(cart[id]||0)+d);if(p.stock!=null&&n>p.stock)return alert('Quantidade acima do estoque disponível.');cart[id]=n;document.getElementById('q'+id).textContent=n;sum()}function sum(){let v=link.catalog.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0);total.textContent=R(v)}async function confirmOrder(){let items=link.catalog.filter(p=>cart[p.id]>0).map(p=>({product_id:p.id,name:p.name,unit:p.unit,qty:cart[p.id],unit_price:p.price,total:cart[p.id]*p.price}));if(!items.length)return alert('Adicione pelo menos um produto.');let v=items.reduce((s,x)=>s+x.total,0);if(!confirm('Confirmar pedido no valor de '+R(v)+'?'))return;try{let o=await api('marcio_customer_orders',{method:'POST',body:JSON.stringify({token,client_name:link.client_name,items,total:v,status:'Novo'})});app.innerHTML='<div class="card"><h2>Pedido enviado! ✅</h2><p>Seu pedido foi enviado para o Marcio Bebidas.</p><p><b>Total: '+R(v)+'</b></p><p class="muted">Pedido #'+o[0].id+'</p></div>';bottom.style.display='none'}catch(e){alert('Não foi possível enviar o pedido. Tente novamente.')}}load();
</script></body></html>
