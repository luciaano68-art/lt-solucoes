<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitações | LT Soluções</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#171717}.wrap{max-width:980px;margin:auto;padding:22px 14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border:1px solid #e1e4e8;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.04)}.muted{color:#6b7280;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}.code{font-weight:900;font-size:18px}.btn{border:0;border-radius:10px;background:#111;color:#fff;padding:10px 13px;font-weight:700;cursor:pointer}.light{background:#eceef1;color:#222}select{padding:9px;border:1px solid #ccd1d7;border-radius:9px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#fff4ce;font-size:12px;font-weight:700}.detail{display:none;border-top:1px solid #eee;margin-top:14px;padding-top:12px}.detail p{line-height:1.5}.section{margin:14px 0}.section b{display:block;margin-bottom:4px}.empty{text-align:center;padding:35px}</style></head><body><main class="wrap"><div class="top"><div><h1>Solicitações de Sistemas</h1><div class="muted">Área administrativa · LT Soluções</div></div><a class="btn light" href="./index.html">Voltar</a></div><div id="out" class="card empty">Carregando...</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script><script>
const URL='https://wwietlvweqsxfpejhhis.supabase.co',KEY='sb_publishable_dArUUh2qpDqbzvjxXAEbNQ_hT6Y0y5y';let rows=[];let pwd=sessionStorage.getItem('lt_admin_pwd')||'';
async function rpc(fn,body){let r=await fetch(URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){if(!pwd){pwd=prompt('Confirme sua senha de administrador:')||'';if(!pwd){location.href='./index.html';return}}try{rows=await rpc('lt_admin_list_requests',{p_password:pwd});sessionStorage.setItem('lt_admin_pwd',pwd);render()}catch(e){sessionStorage.removeItem('lt_admin_pwd');pwd='';alert('Senha incorreta ou acesso indisponível.');location.href='./index.html'}}
const arr=x=>(x&&x.length?x.join(', '):'—');const safe=x=>(x===null||x===undefined||x==='')?'—':String(x);const statuses=['Novo','Em análise','Proposta','Em desenvolvimento','Cliente ativo','Arquivado'];
function render(){let o=document.getElementById('out');if(!rows.length){o.className='card empty';o.innerHTML='<b>Nenhuma solicitação recebida ainda.</b>';return}o.className='';o.innerHTML=rows.map((r,i)=>'<div class="card"><div class="row"><div class="grow"><div class="code">'+r.code+' · '+safe(r.name)+'</div><div class="muted">'+new Date(r.created_at).toLocaleString('pt-BR')+' · '+safe(r.business_name)+' · '+safe(r.segment)+'</div></div><span class="badge">'+r.status+'</span><button class="btn light" onclick="toggle('+i+')">Ver respostas</button><button class="btn" onclick="pdf('+i+')">Baixar PDF</button></div><div class="detail" id="d'+i+'">'+details(r)+'<div class="row"><b>Status:</b><select onchange="statusChange('+i+',this.value)">'+statuses.map(s=>'<option '+(s===r.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div></div>').join('')}
function details(r){return '<div class="section"><b>Contato</b>'+safe(r.whatsapp)+' · '+safe(r.email)+'<br>'+safe(r.city_state)+'</div><div class="section"><b>Negócio</b>'+safe(r.business_description)+'<br>Equipe: '+safe(r.team_size)+' · Usuários: '+safe(r.users_count)+' · Dispositivos: '+arr(r.devices)+'</div><div class="section"><b>Como controla hoje</b>'+arr(r.current_control)+'</div><div class="section"><b>O que deseja controlar</b>'+arr(r.desired_modules)+'</div><div class="section"><b>Acesso dos clientes</b>'+arr(r.customer_access)+'</div><div class="section"><b>Estoque</b>Quantidade: '+safe(r.inventory_details?.quantity)+' · '+arr(r.inventory_details?.options)+'</div><div class="section"><b>Financeiro</b>'+arr(r.finance_details)+'</div><div class="section"><b>Nota Fiscal</b>'+safe(r.needs_invoice)+'</div><div class="section"><b>Necessidades específicas</b>'+safe(r.specific_needs)+'</div><div class="section"><b>Maior problema atual</b>'+safe(r.biggest_problem)+'</div><div class="section"><b>Sistema ideal</b>'+safe(r.ideal_system)+'</div><div class="section"><b>Arquivos / observações</b>'+safe(r.attachments_note)+'</div>'}
function toggle(i){let e=document.getElementById('d'+i);e.style.display=e.style.display==='block'?'none':'block'}
async function statusChange(i,s){try{await rpc('lt_admin_update_request_status',{p_password:pwd,p_id:rows[i].id,p_status:s});rows[i].status=s;render()}catch(e){alert('Não foi possível alterar o status.');load()}}
function pdf(i){let r=rows[i],J=window.jspdf?.jsPDF;if(!J){alert('Gerador de PDF ainda está carregando. Tente novamente.');return}let d=new J({unit:'mm',format:'a4'}),y=18;d.setFontSize(18);d.text('LT SOLUCOES',15,y);y+=8;d.setFontSize(12);d.text('Levantamento para Desenvolvimento de Sistema',15,y);y+=9;let items=[['Solicitacao',r.code],['Data',new Date(r.created_at).toLocaleString('pt-BR')],['Cliente',r.name],['Empresa',r.business_name],['WhatsApp',r.whatsapp],['E-mail',r.email],['Cidade / Estado',r.city_state],['Segmento',r.segment],['O que a empresa faz',r.business_description],['Equipe',r.team_size],['Usuarios do sistema',r.users_count],['Dispositivos',arr(r.devices)],['Controle atual',arr(r.current_control)],['O que deseja controlar',arr(r.desired_modules)],['Acesso dos clientes',arr(r.customer_access)],['Estoque','Quantidade: '+safe(r.inventory_details?.quantity)+' | '+arr(r.inventory_details?.options)],['Financeiro',arr(r.finance_details)],['Nota Fiscal',r.needs_invoice],['Necessidades especificas',r.specific_needs],['Maior problema atual',r.biggest_problem],['Sistema ideal',r.ideal_system],['Arquivos / observacoes',r.attachments_note]];d.setFontSize(10);for(let [a,b] of items){let lines=d.splitTextToSize(a+': '+safe(b),180);if(y+lines.length*5>282){d.addPage();y=18}d.text(lines,15,y);y+=lines.length*5+3}d.save((r.code||'LT-solicitacao')+'-'+(r.business_name||r.name||'cliente').replace(/[^a-z0-9]/gi,'-')+'.pdf')}
load();
</script></body></html>
