<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agenda Barbearia</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#161616;padding-bottom:82px}header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:10}header b{font-size:19px}.sub{font-size:12px;opacity:.7;margin-top:3px}.page{max-width:720px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #e4e6ea;border-radius:16px;padding:15px;margin:10px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:12px;background:#111;color:#fff;padding:13px 14px;font-weight:700;font-size:15px;min-height:46px}.btn.alt{background:#eceef1;color:#222}.btn.danger{background:#a92323}.btn.full{width:100%}input,select{width:100%;min-height:48px;border:1px solid #ccd0d5;border-radius:11px;padding:10px;font-size:16px;background:#fff}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.muted{color:#70757d;font-size:13px}.appt{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.time{font-size:20px;font-weight:800;min-width:58px}.grow{flex:1}.pill{font-size:12px;background:#eef0f3;border-radius:20px;padding:5px 8px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;border:0;padding:10px 2px 8px;font-size:11px;color:#555}.nav button span{display:block;font-size:21px;margin-bottom:2px}.nav button.on{font-weight:800;color:#000}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{border:1px solid #bbb;background:#fff;border-radius:11px;padding:12px 4px;font-weight:700}.slot.sel{background:#111;color:#fff}.day{border:1px solid #e5e5e5;border-radius:13px;padding:11px;margin:9px 0}.daytop{display:flex;justify-content:space-between;align-items:center}.hidden{display:none}.empty{text-align:center;color:#777;padding:25px 5px}@media(max-width:380px){.row{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}}</style></head><body>
<header><b id="title">Barbearia Mãe e Filho</b><div class="sub">Agenda de atendimento</div></header><main id="app" class="page"></main>
<nav class="nav"><button onclick="go('agenda')" id="nagenda"><span>📅</span>Agenda</button><button onclick="go('booking')" id="nbooking"><span>➕</span>Agendar</button><button onclick="go('services')" id="nservices"><span>✂️</span>Serviços</button><button onclick="go('barbers')" id="nbarbers"><span>👤</span>Barbeiros</button><button onclick="go('settings')" id="nsettings"><span>⚙️</span>Ajustes</button></nav>
<script>
var KEY='lt_barbearia_cliente1_v1',db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(!db)db={business:{name:'Barbearia Mãe e Filho'},services:[{id:1,name:'Corte',price:40,duration:30},{id:2,name:'Barba',price:30,duration:30}],barbers:[{id:1,name:'Carlos',weekly:week()}],appointments:[]};
function week(){var o={};for(var i=0;i<7;i++)o[i]={active:i>0&&i<7,open:'09:00',lunchStart:'12:00',lunchEnd:'13:30',close:'19:00'};return o}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s||'').replace(/[&<>"]/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]})}
function isoToday(){var d=new Date(),m=('0'+(d.getMonth()+1)).slice(-2),x=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+x}function br(d){if(!d)return'';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
var page='agenda';function go(p){page=p;render()}function nav(){['agenda','booking','services','barbers','settings'].forEach(function(x){document.getElementById('n'+x).className=page===x?'on':''})}
function render(){nav();document.getElementById('title').textContent=db.business.name;app.innerHTML=page==='agenda'?agenda():page==='booking'?booking():page==='services'?services():page==='barbers'?barbers():settings()}
function agenda(){var d=isoToday(),a=db.appointments.filter(function(x){return x.date===d}).sort(function(a,b){return a.time.localeCompare(b.time)});return '<h2>Hoje</h2><div class="muted">'+br(d)+'</div><div class="card">'+(a.length?a.map(function(x){return'<div class="appt"><div class="time">'+x.time+'</div><div class="grow"><b>'+esc(x.client)+'</b><div class="muted">'+esc(x.service)+' · '+esc(x.barber)+'</div></div><span class="pill">'+esc(x.status)+'</span></div>'}).join(''):'<div class="empty">Nenhum horário agendado hoje.</div>')+'</div><button class="btn full" onclick="go(\'booking\')">+ Novo agendamento</button>'}
function booking(){return'<h2>Novo agendamento</h2><div class="card"><label>Cliente</label><input id="client" placeholder="Nome do cliente"><label>WhatsApp</label><input id="phone" inputmode="tel" placeholder="(49) 99999-9999"><label>Serviço</label><select id="svc" onchange="drawSlots()">'+db.services.map(function(s){return'<option value="'+s.id+'">'+esc(s.name)+' · '+s.duration+' min · R$ '+Number(s.price).toFixed(2).replace('.',',')+'</option>'}).join('')+'</select><label>Barbeiro</label><select id="barb" onchange="drawSlots()">'+db.barbers.map(function(b){return'<option value="'+b.id+'">'+esc(b.name)+'</option>'}).join('')+'</select><label>Data</label><input id="date" type="date" value="'+isoToday()+'" onchange="drawSlots()"><label>Horários disponíveis</label><div id="slots" class="slots"></div><input id="chosen" type="hidden"><br><button class="btn full" onclick="book()">Confirmar agendamento</button></div>'}
function mins(t){var p=t.split(':');return+p[0]*60 + +p[1]}function tm(n){return('0'+Math.floor(n/60)).slice(-2)+':'+('0'+n%60).slice(-2)}
function getSlots(){var b=db.barbers.find(function(x){return x.id==barb.value}),s=db.services.find(function(x){return x.id==svc.value});if(!b||!s)return[];var dow=new Date(date.value+'T12:00:00').getDay(),w=b.weekly[dow];if(!w||!w.active)return[];var out=[],start=mins(w.open),end=mins(w.close),ls=mins(w.lunchStart),le=mins(w.lunchEnd);for(var n=start;n+s.duration<=end;n+=s.duration){if(n<le&&n+s.duration>ls)continue;var t=tm(n),busy=db.appointments.some(function(a){return a.date===date.value&&a.barberId==b.id&&a.time===t&&a.status!=='Cancelado'});if(!busy)out.push(t)}return out}
function drawSlots(){var el=document.getElementById('slots');if(!el)return;var a=getSlots();el.innerHTML=a.length?a.map(function(t){return'<button class="slot" onclick="pick(this,\''+t+'\')" type="button">'+t+'</button>'}).join(''):'<div class="muted" style="grid-column:1/-1">Sem horários disponíveis neste dia.</div>'}
function pick(el,t){document.querySelectorAll('.slot').forEach(function(x){x.classList.remove('sel')});el.classList.add('sel');chosen.value=t}
function book(){if(!client.value.trim()||!date.value||!chosen.value)return alert('Informe o cliente e escolha um horário.');var b=db.barbers.find(function(x){return x.id==barb.value}),s=db.services.find(function(x){return x.id==svc.value});db.appointments.push({id:Date.now(),client:client.value.trim(),phone:phone.value,date:date.value,time:chosen.value,barberId:b.id,barber:b.name,serviceId:s.id,service:s.name,price:s.price,status:'Agendado'});save();alert('Agendamento salvo.');go('agenda')}
function services(){return'<h2>Serviços</h2>'+db.services.map(function(s){return'<div class="card"><b>'+esc(s.name)+'</b><div class="muted">'+s.duration+' minutos · R$ '+Number(s.price).toFixed(2).replace('.',',')+'</div></div>'}).join('')+'<div class="card"><h3>Novo serviço</h3><label>Nome</label><input id="sn"><div class="row"><div><label>Preço</label><input id="sp" type="number" step=".01"></div><div><label>Duração (min)</label><input id="sd" type="number" value="30"></div></div><br><button class="btn full" onclick="addService()">Adicionar</button></div>'}
function addService(){if(!sn.value.trim())return;db.services.push({id:Date.now(),name:sn.value.trim(),price:+sp.value||0,duration:+sd.value||30});save();render()}
function barbers(){return'<h2>Barbeiros</h2>'+db.barbers.map(function(b){return'<div class="card"><b>'+esc(b.name)+'</b><div class="muted">Toque para configurar os horários de cada dia.</div><br><button class="btn alt full" onclick="editBarber('+b.id+')">Configurar horários</button></div>'}).join('')+'<div class="card"><h3>Novo barbeiro</h3><input id="bn" placeholder="Nome"><br><br><button class="btn full" onclick="addBarber()">Adicionar</button></div>'}
function addBarber(){if(!bn.value.trim())return;db.barbers.push({id:Date.now(),name:bn.value.trim(),weekly:week()});save();render()}
function editBarber(id){var b=db.barbers.find(function(x){return x.id===id});app.innerHTML='<button class="btn alt" onclick="render()">← Voltar</button><h2>'+esc(b.name)+'</h2><div class="card">'+['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map(function(n,i){var w=b.weekly[i];return'<div class="day"><div class="daytop"><b>'+n+'</b><label style="margin:0"><input style="width:auto;min-height:auto" id="a'+i+'" type="checkbox" '+(w.active?'checked':'')+'> Atende</label></div><div class="row"><div><label>Abre</label><input id="o'+i+'" type="time" value="'+w.open+'"></div><div><label>Fecha</label><input id="c'+i+'" type="time" value="'+w.close+'"></div><div><label>Almoço</label><input id="l'+i+'" type="time" value="'+w.lunchStart+'"></div><div><label>Retorna</label><input id="r'+i+'" type="time" value="'+w.lunchEnd+'"></div></div></div>'}).join('')+'<button class="btn full" onclick="saveBarber('+id+')">Salvar horários</button></div>'}
function saveBarber(id){var b=db.barbers.find(function(x){return x.id===id});for(var i=0;i<7;i++)b.weekly[i]={active:document.getElementById('a'+i).checked,open:document.getElementById('o'+i).value,close:document.getElementById('c'+i).value,lunchStart:document.getElementById('l'+i).value,lunchEnd:document.getElementById('r'+i).value};save();alert('Horários salvos.');render()}
function settings(){return'<h2>Ajustes</h2><div class="card"><label>Nome da barbearia</label><input id="business" value="'+esc(db.business.name)+'"><br><br><button class="btn full" onclick="db.business.name=business.value.trim()||db.business.name;save();render()">Salvar</button></div><div class="card"><b>Base exclusiva deste cliente</b><div class="muted">Este sistema não compartilha dados com outros clientes da LT Soluções.</div></div>'}
render();setTimeout(drawSlots,0);
</script></body></html>
