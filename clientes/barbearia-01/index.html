<div class="full10"><div class="f10h"><b>Barbearia Mãe e Filho</b><div style="font-size:12px;opacity:.7">Versão completa</div></div><main id="f10app" class="f10m"></main><nav id="f10nav" class="f10nav"></nav></div>
<script>
(function(){var K='maefilho_full10_v1',D;try{D=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}function wk(){var w={};for(var i=0;i<7;i++)w[i]={on:i>0,o:'09:00',ls:'12:00',le:'13:30',c:'19:00'};return w}if(!D)D={biz:{n:'Barbearia Mãe e Filho',a:'',w:'',logo:''},svc:[{id:1,n:'Corte',p:40,d:30},{id:2,n:'Barba',p:30,d:20},{id:3,n:'Corte + Barba',p:65,d:50}],bar:[{id:1,n:'Barbeiro 1',w:wk(),sv:[1,2,3]}],cli:[],apt:[],blk:[],hol:[]};function S(){localStorage.setItem(K,JSON.stringify(D))}function T(){var d=new Date;return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}function M(t){var p=t.split(':');return+p[0]*60 + +p[1]}function TM(n){return('0'+Math.floor(n/60)).slice(-2)+':'+('0'+n%60).slice(-2)}var P='agenda',tabs=[['agenda','Agenda'],['book','Agendar'],['clients','Clientes'],['services','Serviços'],['barbers','Barbeiros'],['holidays','Feriados'],['finance','Financeiro'],['settings','Ajustes']];function go(p){P=p;render()}function render(){var f10nav=document.getElementById('f10nav'),f10app=document.getElementById('f10app');f10nav.innerHTML=tabs.map(function(t){return'<button data-p="'+t[0]+'">'+t[1]+'</button>'}).join('');Array.from(f10nav.querySelectorAll('button')).forEach(function(b){b.onclick=function(){go(b.dataset.p)}});f10app.innerHTML=P==='agenda'?agenda():P==='book'?book():P==='clients'?clients():P==='services'?services():P==='barbers'?barbers():P==='holidays'?holidays():P==='finance'?finance():settings();wire()}function agenda(){var a=D.apt.filter(function(x){return x.dt===T()});return'<h2>Agenda do dia</h2><div class="f10c">'+(a.length?a.map(function(x){return'<p><b>'+x.t+' '+x.cn+'</b><br>'+x.sn+' · '+x.bn+'<br><select class="f10input st" data-id="'+x.id+'"><option>Agendado</option><option>Confirmado</option><option>Atendido</option><option>Cancelado</option><option>Não compareceu</option></select></p>'}).join(''):'Nenhum atendimento hoje.')+'</div><div class="f10grid"><button class="f10btn" id="week">Agenda da semana</button><button class="f10btn" id="block">Bloquear horário</button></div>'}function book(){return'<div class="f10c"><h2>'+D.biz.n+'</h2><div>'+D.biz.a+' '+D.biz.w+'</div>'+D.svc.map(function(s){return'<span>'+s.n+' R$ '+s.p+' · </span>'}).join('')+'</div><h2>Agendamento rápido</h2><div class="f10c"><input class="f10input" id="cn" placeholder="Nome"><br><br><input class="f10input" id="ph" placeholder="WhatsApp"><br><br><select class="f10input" id="sv">'+D.svc.map(function(s){return'<option value="'+s.id+'">'+s.n+' · '+s.d+' min</option>'}).join('')+'</select><br><br><select class="f10input" id="ba">'+D.bar.map(function(b){return'<option value="'+b.id+'">'+b.n+'</option>'}).join('')+'</select><br><br><input class="f10input" id="dt" type="date" value="'+T()+'"><br><br><button class="f10btn" id="slots">Ver horários disponíveis</button><div id="slotout"></div></div>'}function clients(){return'<h2>Clientes</h2>'+D.cli.map(function(c){var a=D.apt.filter(function(x){return x.cid===c.id}),done=a.filter(function(x){return x.st==='Atendido'}),future=a.filter(function(x){return x.dt>=T()&&x.st!=='Cancelado'});return'<div class="f10c"><b>'+c.n+'</b><br>'+c.p+'<p>Visitas: '+done.length+'<br>Último atendimento: '+(done.length?done[done.length-1].dt:'—')+'<br>Próximos: '+future.length+'</p></div>'}).join('')+'<div class="f10c">O cliente é cadastrado automaticamente no primeiro agendamento.</div>'}function services(){return'<h2>Serviços configuráveis</h2>'+D.svc.map(function(s){return'<div class="f10c"><b>'+s.n+'</b><br>R$ '+s.p+' · '+s.d+' minutos</div>'}).join('')+'<div class="f10c"><input class="f10input" id="sn" placeholder="Novo serviço"><div class="f10grid"><input class="f10input" id="sp" type="number" placeholder="Preço"><input class="f10input" id="sd" type="number" placeholder="Duração"></div><button class="f10btn" id="addsvc">Adicionar serviço</button></div>'}function barbers(){return'<h2>Vários barbeiros</h2>'+D.bar.map(function(b){return'<div class="f10c"><b>'+b.n+'</b><br>Agenda, horários e serviços próprios.<br><button class="f10btn editb" data-id="'+b.id+'">Configurar horários</button></div>'}).join('')+'<div class="f10c"><input class="f10input" id="bn" placeholder="Nome do barbeiro"><button class="f10btn" id="addbar">Adicionar</button></div>'}function holidays(){var al=D.hol.filter(function(h){var n=Math.ceil((new Date(h.dt+'T12:00:00')-new Date(T()+'T12:00:00'))/86400000);return n>=0&&n<=7&&!h.mode});return'<h2>Calendário de feriados e datas especiais</h2>'+(al.length?'<div class="f10c"><b>🔔 Decisão necessária em até 7 dias</b></div>':'')+D.hol.map(function(h){return'<div class="f10c"><b>'+h.n+'</b> · '+h.dt+' · '+(h.mode||'Pendente')+'<br><button class="f10btn edith" data-id="'+h.id+'">Definir funcionamento</button></div>'}).join('')+'<div class="f10c"><input class="f10input" id="hnm" placeholder="Feriado/data especial"><input class="f10input" id="hdt" type="date"><button class="f10btn" id="addhol">Adicionar</button></div>'}function finance(){var m=T().slice(0,7),a=D.apt.filter(function(x){return x.st==='Atendido'&&x.dt.slice(0,7)===m}),r=a.reduce(function(v,x){return v+x.price},0),d=a.filter(function(x){return x.dt===T()}).reduce(function(v,x){return v+x.price},0),ct={};a.forEach(function(x){ct[x.sn]=(ct[x.sn]||0)+1});var top=Object.keys(ct).sort(function(a,b){return ct[b]-ct[a]})[0]||'—';return'<h2>Financeiro simples</h2><div class="f10grid"><div class="f10c"><b>Faturamento hoje</b><h2>R$ '+d.toFixed(2)+'</h2></div><div class="f10c"><b>Faturamento mês</b><h2>R$ '+r.toFixed(2)+'</h2></div><div class="f10c"><b>Atendimentos</b><h2>'+a.length+'</h2></div><div class="f10c"><b>Ticket médio</b><h2>R$ '+(a.length?r/a.length:0).toFixed(2)+'</h2></div></div><div class="f10c">Serviço mais realizado: <b>'+top+'</b></div>'}function settings(){return'<h2>Página própria do barbeiro</h2><div class="f10c"><input class="f10input" id="logo" value="'+D.biz.logo+'" placeholder="Foto/logo URL"><input class="f10input" id="biz" value="'+D. q.dt===dt.value&&q.bid===b.id&&n<M(q.e)&&n+s.d>M(q.s)});if(!busy&&!bl)out.push(t)}slotout.innerHTML=out.map(function(t){return'<button class="f10btn pick" data-t="'+t+'">'+t+'</button> '}).join('')||'Sem horários.';document.querySelectorAll('.pick').forEach(function(x){x.onclick=function(){var p=ph.value.trim(),c=D.cli.find(function(q){return q.p===p});if(!c){c={id:Date.now(),n:cn.value,p:p};D.cli.push(c)}D.apt.push({id:Date.now()+1,cid:c.id,cn:cn.value,p:p,sid:s.id,sn:s.n,price:s.p,bid:b.id,bn:b.n,dt:dt.value,t:x.dataset.t,st:'Agendado'});S();alert('Agendamento salvo');go('agenda')}})}};if(addsvc)addsvc.onclick=function(){D.svc.push({id:Date.now(),n:sn.value,p:+sp.value,d:+sd.value});S();render()};if(addbar)addbar.onclick=function(){D.bar.push({id:Date.now(),n:bn.value,w:wk(),sv:D.svc.map(function(x){return x.id})});S();render()};document.querySelectorAll('.editb').forEach(function(e){e.onclick=function(){var b=D.bar.find(function(x){return x.id==e.dataset.id});for(var i=0;i<7;i++){var n=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][i],w=b.w[i];var on=confirm(n+': trabalha?');if(on){w.on=1;w.o=prompt(n+' abre',w.o);w.ls=prompt(n+' almoço',w.ls);w.le=prompt(n+' retorna',w.le);w.c=prompt(n+' fecha',w.c)}else w.on=0}S();alert('Horários salvos')}});if(addhol)addhol.onclick=function(){D.hol.push({id:Date.now(),n:hnm.value,dt:hdt.value,mode:''});S();render()};document.querySelectorAll('.edith').forEach(function(e){e.onclick=function(){var h=D.hol.find(function(x){return x.id==e.dataset.id}),m=prompt('fechado, normal, especial ou barbeiros','fechado');h.mode=m==='fechado'?'closed':m==='normal'?'normal':m==='especial'?'special':'barbers';if(h.mode==='special')h.hours={on:1,o:prompt('Abre','09:00'),ls:prompt('Almoço','12:00'),le:prompt('Retorna','13:30'),c:prompt('Fecha','20:00')};S();render()}});if(savebiz)savebiz.onclick=function(){D.biz={logo:logo.value,n:biz.value,a:addr.value,w:wa.value};S();render()}}function M(t){var p=t.split(':');return+p[0]*60 + +p[1]}function TM(n){return('0'+Math.floor(n/60)).slice(-2)+':'+('0'+n%60).slice(-2)}render()})();
