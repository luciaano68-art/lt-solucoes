function fixedClientsHtml(){return '<h2>Clientes fixos</h2><p class="muted">Reservas semanais por até 3 meses. O horário fica reservado na agenda e no link do cliente.</p><div class="card"><button class="btn full" id="fixedNew">+ Cadastrar cliente fixo</button><button class="btn alt full" id="fixedBack">Voltar para a agenda</button></div>'+(fixedSeries.length?fixedSeries.map(function(s){return '<div class="card"><b>'+hoursEscape(s.client_name)+'</b><div class="muted">'+hoursEscape(s.service_name)+' · '+hoursEscape(s.barber_name)+'</div><p><b>'+fixedDays[s.weekday]+' às '+String(s.start_time).slice(0,5)+'</b><br>'+s.duration_minutes+' min · '+money(s.price)+'<br>Período até '+fmt(s.end_date)+'<br><b>'+(s.active?(s.end_date<today()?'Período encerrado · pode renovar':'Reserva fixa ativa'):'Cliente fixo encerrado')+'</b></p><button class="btn alt full" data-fixed-view="'+s.id+'">Ver horários reservados</button>'+(s.active?'<button class="btn full" data-fixed-renew="'+s.id+'">Renovar por até 3 meses</button><button class="btn danger full" data-fixed-end="'+s.id+'">Encerrar próximas reservas</button>':'')+'</div>'}).join(''):'<div class="card">Nenhum cliente fixo cadastrado.</div>')}
function bindFixedClients(){var b=el('fixedClientsBtn');if(b)b.onclick=openFixedClients;var n=el('fixedNew');if(n)n.onclick=function(){fixedForm(null)};var back=el('fixedBack');if(back)back.onclick=function(){go('agenda')};[['[data-fixed-view]',fixedView],['[data-fixed-renew]',function(id){fixedForm(fixedSeries.find(function(s){return s.id===id}))}],['[data-fixed-end]',fixedEndForm]].forEach(function(pair){document.querySelectorAll(pair[0]).forEach(function(btn){btn.onclick=function(){pair[1](btn.getAttribute(pair[0].slice(1,-1)))}})})}
function fixedForm(series){page='fixed-form';fixedPreview=null;fixedDraft={id:series?series.id:fixedUUID(),series:series};var start=series?[today(),fixedNextDate(series.end_date)].sort().pop():today(),activeServices=db.services.filter(function(s){return s.active});el('app').innerHTML='<div id="fixedForm"><button class="btn alt" id="fixedFormBack">Voltar</button><h2>'+(series?'Renovar cliente fixo':'Cadastrar cliente fixo')+'</h2><div class="card">'+(!series?'<label>Cliente cadastrado (opcional)</label><select id="fixedClient"><option value="">Novo cliente / preencher dados</option>'+db.clients.map(function(c){return '<option value="'+hoursEscape(c.id)+'">'+hoursEscape(c.name)+' · '+hoursEscape(c.phone)+'</option>'}).join('')+'</select>':'<p>As novas reservas seguirão o mesmo serviço, profissional e horário.</p>')+'<label>Nome do cliente</label><input id="fixedName"><label>WhatsApp</label><input id="fixedPhone" type="tel"><label>Serviço</label><select id="fixedService">'+(series?'<option value="'+series.service_id+'">'+hoursEscape(series.service_name)+' · '+series.duration_minutes+' min · '+money(series.price)+'</option>':activeServices.map(function(s){return '<option value="'+s.id+'">'+hoursEscape(s.name)+' · '+s.duration+' min · '+money(s.price)+'</option>'}).join(''))+'</select><label>Profissional</label><select id="fixedBarber"></select><label>Dia da semana</label><select id="fixedWeekday">'+fixedDays.map(function(n,i){return '<option value="'+i+'">'+n+'</option>'}).join('')+'</select><label>Horário</label><input id="fixedTime" type="time" value="14:00"><div class="grid"><div><label>Data inicial</label><input id="fixedStart" type="date" min="'+start+'" value="'+start+'"></div><div><label>Reservar até</label><input id="fixedEnd" type="date" value="'+fixedAddMonths(start,3)+'" min="'+start+'" max="'+fixedAddMonths(start,3)+'"></div></div><p class="muted">Primeiro confira as datas. Horários ocupados, bloqueios e dias sem atendimento serão avisados antes de salvar.</p><button class="btn full" id="fixedCheck">Conferir datas</button></div><div id="fixedResult"></div></div>';el('fixedFormBack').onclick=openFixedClients;function fill(){var sid=+el('fixedService').value;el('fixedBarber').innerHTML=db.barbers.filter(function(b){return b.active&&(b.serviceIds||[]).indexOf(sid)>=0}).map(function(b){return '<option value="'+b.id+'">'+hoursEscape(b.name)+'</option>'}).join('')}fill();el('fixedWeekday').value=series?series.weekday:2;if(series){el('fixedName').value=series.client_name;el('fixedPhone').value=series.client_phone;el('fixedBarber').innerHTML='<option value="'+series.barber_id+'">'+hoursEscape(series.barber_name)+'</option>';el('fixedTime').value=String(series.start_time).slice(0,5);['fixedName','fixedPhone','fixedService','fixedBarber','fixedWeekday','fixedTime'].forEach(function(id){el(id).disabled=true})}else{el('fixedService').onchange=fill;el('fixedClient').onchange=function(){var c=db.clients.find(function(c){return String(c.id)===el('fixedClient').value});if(c){el('fixedName').value=c.name;el('fixedPhone').value=c.phone||''}}}el('fixedStart').onchange=function(){el('fixedEnd').min=el('fixedStart').value;el('fixedEnd').max=fixedAddMonths(el('fixedStart').value,3);el('fixedEnd').value=el('fixedEnd').max};el('fixedForm').querySelectorAll('input,select').forEach(function(input){input.addEventListener('change',function(){fixedPreview=null;el('fixedResult').innerHTML=''})});el('fixedCheck').onclick=function(){fixedCheck(false,false)}}
function fixedReadRequest(){if(!fixedDraft||!el('fixedStart'))throw Error('Abra o cadastro novamente.');var start=el('fixedStart').value,end=el('fixedEnd').value,clock=el('fixedTime').value,n=el('fixedName').value.trim(),p=el('fixedPhone').value.trim(),b=db.barbers.find(function(b){return b.id==el('fixedBarber').value}),service=db.services.find(function(s){return s.id==el('fixedService').value}),series=fixedDraft.series;if(!n||!p)throw Error('Informe nome e WhatsApp.');if(!b||!b.active||(!series&&(!service||!service.active)))throw Error('Selecione um serviço e um profissional ativo.');if(!start||!end||start<el('fixedStart').min||end<start||end>fixedAddMonths(start,3))throw Error('Escolha um período de até 3 meses a partir da data inicial.');if(!/^\d{2}:\d{2}$/.test(clock))throw Error('Informe o horário.');if(!fixedDates(start,end,+el('fixedWeekday').value).length)throw Error('O período não contém o dia da semana escolhido.');return {id:fixedDraft.id,client_name:n,client_phone:p,barber_id:b.id,barber_name:series?series.barber_name:b.name,service_id:series?series.service_id:service.id,service_name:series?series.service_name:service.name,duration_minutes:series?series.duration_minutes:+service.duration,price:series?+series.price:+service.price,weekday:+el('fixedWeekday').value,start_time:clock,start_date:start,end_date:end}}
function fixedEnrich(request){var b=db.barbers.find(function(b){return b.id===request.barber_id});request.excluded_dates=[];request.special_hours={};fixedDates(request.start_date,request.end_date,request.weekday).forEach(function(date){var h=db.holidays.find(function(h){return h.date===date});if(h&&h.mode&&h.mode!=='normal')request.special_hours[date]=specialSchedule(b,date)||{active:false};if(db.blocks.some(function(x){return x.date===date&&String(x.barberId)===String(b.id)&&mins(request.start_time)<mins(x.end)&&mins(request.start_time)+request.duration_minutes>mins(x.start)}))request.excluded_dates.push(date)});return request}
function fixedShowPreview(result){fixedPreview=result;var available=result.available||[],conflicts=result.conflicts||[],existing=result.existing||[];el('fixedResult').innerHTML='<div class="card"><h3>Confira as datas</h3>'+(result.message?'<p class="fixed-warning">'+hoursEscape(result.message)+'</p>':'')+'<p><b>'+available.length+' data(s) disponível(is)</b>'+(existing.length?'<br>'+existing.length+' data(s) já pertencem a esta reserva fixa.':'')+'</p>'+(available.length?'<div class="fixed-dates">'+available.map(function(d){return '<span>'+fmt(d)+'</span>'}).join('')+'</div>':'')+(conflicts.length?'<div class="fixed-warning"><b>'+conflicts.length+' data(s) sem reserva:</b><ul>'+conflicts.map(function(c){return '<li>'+fmt(c.date)+' · '+hoursEscape(c.reason)+'</li>'}).join('')+'</ul><p>Essas datas não serão reservadas. Nenhum agendamento existente será alterado.</p></div>':'')+(available.length?'<button class="btn full" id="fixedConfirm">'+(conflicts.length?'Reservar somente as datas disponíveis':'Confirmar reservas')+'</button>':'<p>Não há novas datas disponíveis neste período.</p>')+'</div>';var confirm=el('fixedConfirm');if(confirm)confirm.onclick=function(){fixedCheck(true,conflicts.length>0)}}
async function fixedCheck(commit,skip){if(fixedBusy)return;var request,snapshot;try{request=fixedReadRequest();snapshot=JSON.stringify(request)}catch(e){alert(e.message);return}if(commit&&!fixedPreview)return;fixedBusy=true;var check=el('fixedCheck'),confirm=el('fixedConfirm');if(check)check.disabled=true;if(confirm){confirm.disabled=true;confirm.textContent='Reservando...'}try{if(hoursReady)await hoursReady;if(!await syncPublicBookings())throw Error('Não foi possível consultar a agenda. Nenhuma nova reserva foi confirmada.');var hours=await readOnlineHours(),b=db.barbers.find(function(b){return b.id===request.barber_id}),row=hours.find(function(h){return h.barber_id==b.id});if(row)b.weekly=row.weekly;if(page!=='fixed-form'||snapshot!==JSON.stringify(fixedReadRequest()))return;fixedEnrich(request);var result=await fixedRpc('barbershop_recurring_plan',{p_request:request,p_commit:commit,p_skip_conflicts:skip});if(page!=='fixed-form')return;if(!commit&&snapshot!==JSON.stringify(fixedReadRequest()))return;if(result.committed){(result.bookings||[]).forEach(mergeBooking);save();await syncPublicBookings();alert((result.created?result.created+' nova(s) reserva(s) confirmada(s).':'As reservas já estavam confirmadas.')+((result.existing||[]).length?' '+result.existing.length+' data(s) já estavam reservadas.':'')+((result.conflicts||[]).length?' '+result.conflicts.length+' data(s) ficaram sem reserva; confira a lista.':''));if((result.conflicts||[]).length){el('fixedResult').innerHTML='<div class="card"><h3>Reservas confirmadas</h3><p>'+result.created+' nova(s) reserva(s) na agenda.</p><div class="fixed-warning"><b>Datas que ficaram sem reserva</b><ul>'+result.conflicts.map(function(c){return '<li>'+fmt(c.date)+' · '+hoursEscape(c.reason)+'</li>'}).join('')+'</ul></div><button class="btn full" id="fixedDone">Ver clientes fixos</button></div>';fixedPreview=null;el('fixedDone').onclick=openFixedClients;check.hidden=true}else await openFixedClients()}else fixedShowPreview(result)}catch(e){alert(e.message);if(confirm&&confirm.isConnected)confirm.textContent=skip?'Reservar somente as datas disponíveis':'Confirmar reservas'}finally{fixedBusy=false;if(check&&check.isConnected)check.disabled=false;if(confirm&&confirm.isConnected)confirm.disabled=false}}
async function fixedView(id){page='fixed-view';el('app').innerHTML='<h2>Horários do cliente fixo</h2><div class="card">Consultando agenda...</div>';if(!await syncPublicBookings()){alert('Não foi possível consultar a agenda.');await openFixedClients();return}if(page!=='fixed-view')return;var s=fixedSeries.find(function(s){return s.id===id}),a=db.appointments.filter(function(a){return a.recurringId===id&&a.date>=today()}).sort(function(a,b){return(a.date+a.time).localeCompare(b.date+b.time)});el('app').innerHTML='<button class="btn alt" id="fixedViewBack">Voltar</button><h2>'+hoursEscape(s?s.client_name:'Cliente fixo')+'</h2><p class="muted">Cancelar um horário mantém as outras reservas deste cliente.</p>'+a.map(function(a){return '<div class="card"><b>'+fmt(a.date)+' às '+a.time+'</b><div class="muted">'+hoursEscape(a.serviceName)+' · '+hoursEscape(a.barberName)+'</div><p>'+hoursEscape(a.status)+'</p>'+(['Agendado','Confirmado'].indexOf(a.status)>=0&&(a.date>today()||a.time>=new Date().toTimeString().slice(0,5))?'<button class="btn danger full" data-fixed-cancel="'+a.id+'">Cancelar somente este horário</button>':'')+'</div>'}).join('')+(a.length?'':'<div class="card">Nenhuma reserva futura neste período.</div>');el('fixedViewBack').onclick=openFixedClients;document.querySelectorAll('[data-fixed-cancel]').forEach(function(btn){btn.onclick=function(){page='fixed';var a=db.appointments.find(function(a){return String(a.id)===btn.getAttribute('data-fixed-cancel')});if(a)cancelBox(a)}})}
