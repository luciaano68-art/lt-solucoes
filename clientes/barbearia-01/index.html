function specialSchedule(b,date){var h=db.holidays.find(function(x){return x.date===date});if(!h||h.mode==='normal'||!h.mode)return b.weekly[new Date(date+'T12:00:00').getDay()];if(h.mode==='closed')return{active:false};if(h.mode==='special')return h.hours;if(h.mode==='barbers'&&h.byBarber&&h.byBarber[b.id])return h.byBarber[b.id];return b.weekly[new Date(date+'T12:00:00').getDay()]}

function book(b,s,d,t){var n=el('clientName').value.trim(),p=el('clientPhone').value.trim();if(!n||!p)return alert('Informe nome e WhatsApp.');if(available(b,s,d).indexOf(t)<0)return alert('Esse horário não está mais disponível.');var c=db.clients.find(function(x){return x.phone===p});if(!c){c={id:Date.now(),name:n,phone:p};db.clients.push(c)}db.appointments.push({id:Date.now()+1,clientId:c.id,clientName:n,phone:p,serviceId:s.id,serviceName:s.name,price:s.price,barberId:b.id,barberName:b.name,date:d,time:t,status:'Agendado'});save();alert('Agendamento realizado.');go('agenda')}
function showWeek(){var h='<button class="btn alt" id="back">← Voltar</button><h2>Agenda da semana</h2>';for(var i=0;i<7;i++){var d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+i);var z=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2),a=db.appointments.filter(function(x){return x.date===z&&x.status!=='Cancelado'}).sort(function(a,b){return a.time.localeCompare(b.time)});h+='<div class="card"><b>'+fmt(z)+'</b>'+(a.length?a.map(appointmentCard).join(''):'<div class="muted">Sem agendamentos.</div>')+'</div>'}el('app').innerHTML=h;el('back').onclick=render;bind()}
function blockForm(){el('app').innerHTML='<button class="btn alt" id="back">← Voltar</button><h2>Bloqueio de horários</h2><div class="card"><label>Barbeiro</label><select id="blockBarber">'+db.barbers.map(function(b){return '<option value="'+b.id+'">'+b.name+'</option>'}).join('')+'</select><label>Data</label><input id="blockDate" type="date" value="'+today()+'"><div class="grid"><div><label>Início</label><input id="blockStart" type="time"></div><div><label>Fim</label><input id="blockEnd" type="time"></div></div><label>Motivo</label><select id="blockReason"><option>Almoço</option><option>Folga</option><option>Compromisso</option><option>Férias</option><option>Outro</option></select><button class="btn full" id="saveBlock">Salvar bloqueio</button></div>';el('back').onclick=render;el('saveBlock').onclick=function(){if(!el('blockStart').value||!el('blockEnd').value)return alert('Informe início e fim.');db.blocks.push({id:Date.now(),barberId:+el('blockBarber').value,date:el('blockDate').value,start:el('blockStart').value,end:el('blockEnd').value,reason:el('blockReason').value});save();alert('Bloqueio salvo.');go('agenda')}}
function barberForm(id){var b=db.barbers.find(function(x){return x.id===id}),names=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];el('app').innerHTML='<button class="btn alt" id="back">← Voltar</button><h2>'+b.name+'</h2><div class="card"><b>Serviços que realiza</b>'+db.services.map(function(s){return '<label><input class="barberService" style="width:auto;min-height:auto" type="checkbox" value="'+s.id+'" '+(b.serviceIds.indexOf(s.id)>=0?'checked':'')+'> '+s.name+'</label>'}).join('')+'</div>'+names.map(function(n,i){var w=b.weekly[i];return '<div class="card"><b>'+n+'</b><label><input id="active'+i+'" style="width:auto;min-height:auto" type="checkbox" '+(w.active?'checked':'')+'> Atende</label><div class="grid"><input id="open'+i+'" type="time" value="'+w.open+'"><input id="close'+i+'" type="time" value="'+w.close+'"><input id="ls'+i+'" type="time" value="'+w.lunchStart+'"><input id="le'+i+'" type="time" value="'+w.lunchEnd+'"></div></div>'}).join('')+'<button class="btn full" id="saveBarber">Salvar configuração</button>';el('back').onclick=render;el('saveBarber').onclick=function(){for(var i=0;i<7;i++)b.weekly[i]={active:el('active'+i).checked,open:el('open'+i).value,close:el('close'+i).value,lunchStart:el('ls'+i).value,lunchEnd:el('le'+i).value};b.serviceIds=Array.from(document.querySelectorAll('.barberService:checked')).map(function(x){return +x.value});save();render()}}
function holidayForm(id){var h=db.holidays.find(function(x){return x.id===id});el('app').innerHTML='<button class="btn alt" id="back">← Voltar</button><h2>'+h.name+' · '+fmt(h.date)+'</h2><div class="card"><button class="btn full mode" data-mode="closed">Fechado</button><br><br><button class="btn full mode" data-mode="normal">Horário normal</button><br><br><button class="btn full mode" data-mode="special">Horário especial para todos</button><br><br><button class="btn full mode" data-mode="barbers">Configurar por barbeiro</button></div>';el('back').onclick=render;document.querySelectorAll('.mode').forEach(function(x){x.onclick=function(){var m=x.dataset.mode;h.mode=m;if(m==='special')h.hours={active:true,open:prompt('Abre','09:00'),lunchStart:prompt('Almoço','12:00'),lunchEnd:prompt('Retorna','13:30'),close:prompt('Fecha','20:00')};if(m==='barbers'){h.byBarber={};db.barbers.forEach(function(b){var works=confirm(b.name+' trabalhará?');h.byBarber[b.id]=works?{active:true,open:prompt('Abre - '+b.name,'09:00'),lunchStart:prompt('Almoço - '+b.name,'12:00'),lunchEnd:prompt('Retorna - '+b.name,'13:30'),close:prompt('Fecha - '+b.name,'20:00')}:{active:false}})}save();render()}})}
try{render();syncPublicBookings();setInterval(syncPublicBookings,15000)}catch(err){document.getElementById('app').innerHTML='<h2>Erro ao abrir a agenda</h2><div class="card"><b>'+String(err.message||err)+'</b></div>';}
})();
