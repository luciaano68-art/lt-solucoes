<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#15171a}header{background:#101820;color:white;padding:18px}.wrap{max-width:1180px;margin:auto}.brand{font-size:22px;font-weight:900}.tag{font-size:12px;opacity:.7;margin-top:3px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:#101820;color:#fff}.btn.soft{background:#e9edf1;color:#15171a}.btn.ok{background:#e8f7ee;color:#176b39}.btn.danger{background:#fdeaea;color:#a92323}.card{background:white;border:1px solid #e1e4e8;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #1018200c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric b{display:block;font-size:24px;margin-top:8px}.muted{color:#69717a}.hero{display:flex;justify-content:space-between;gap:14px;align-items:center}.public{max-width:680px;margin:22px auto}.service{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin:8px 0}.slots{display:flex;gap:8px;flex-wrap:wrap}.slot{border:1px solid #ccd2d8;background:#fff;border-radius:9px;padding:9px 11px;cursor:pointer}.slot.sel{background:#101820;color:white}.slot.busy{opacity:.35;cursor:not-allowed}input,select{width:100%;padding:11px;border:1px solid #d7dce1;border-radius:9px;margin:5px 0 12px}label{font-size:12px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left}th{font-size:11px;text-transform:uppercase;color:#6b7280}.modalbg{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:12px;border-radius:10px;background:#eef8f2;color:#176b39;margin:10px 0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}.wrap{padding-left:13px;padding-right:13px}table{font-size:13px}}

 body{padding-bottom:78px;background:#f3f4f6}header{padding:14px 12px;position:sticky;top:0;z-index:20}.brand{font-size:18px}.tag{font-size:11px}
 .wrap{padding-left:10px;padding-right:10px}.wrap>.tabs:first-child{display:grid;grid-template-columns:1fr 1fr;position:sticky;top:59px;background:#f3f4f6;padding:8px 0;margin:0;z-index:18}
 .hero{gap:8px}.hero h1,.hero h2{margin:5px 0;font-size:22px}.hero>.btn{width:100%;font-size:16px;padding:14px}

 .service{align-items:flex-start;flex-direction:column;padding:12px}.service>div:last-child{width:100%;display:flex;gap:6px;flex-wrap:wrap}.service .btn{flex:1;padding:10px 8px}

 table,thead,tbody,tr,th,td{display:block}table tr{background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin:10px 0;padding:10px}table tr:first-child{display:none}table td{border:0;padding:5px 3px}table td:empty{display:none}table select{margin:4px 0}

<header><div class="wrap"><div class="brand">LT AGENDA · BARBEARIA</div><div class="tag">Agenda simples para usar direto no celular</div></div></header>
<div class="wrap" id="app"></div><div id="modal"></div>
<script>
const KEY='mae_filho_completo_v4';
let db;
try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){db=null}
db=db||{
 business:{name:'Barbearia Mãe e Filho',phone:'(49) 99999-9999',address:'Centro',open:'09:00',close:'19:00',interval:30},
 barbers:[{id:1,name:'Carlos',active:true},{id:2,name:'Rafael',active:true}],
 services:[{id:1,name:'Corte',duration:30,price:40,active:true},{id:2,name:'Barba',duration:30,price:30,active:true},{id:3,name:'Corte + Barba',duration:60,price:65,active:true}],
 appointments:[],clients:[],blocks:[],specialDates:[]
};
if(!db.business.days) db.business.days=[1,2,3,4,5,6];
if(!db.business.weekly) db.business.weekly={};
if(!db.specialDates) db.specialDates=[];
const y=new Date().getFullYear();
const fixedHolidays=[['01-01','Confraternização Universal'],['04-21','Tiradentes'],['05-01','Dia do Trabalho'],['09-07','Independência do Brasil'],['10-12','Nossa Senhora Aparecida'],['11-02','Finados'],['11-15','Proclamação da República'],['11-20','Dia Nacional de Zumbi e da Consciência Negra'],['12-25','Natal']];
[y,y+1].forEach(yr=>fixedHolidays.forEach(h=>{let date=yr+'-'+h[0];if(!db.specialDates.some(x=>x.date===date&&x.autoHoliday))db.specialDates.push({id:'h'+date,date,name:h[1],type:'Feriado nacional',autoHoliday:true,decision:'pending',specialByBarber:{}})}));
[0,1,2,3,4,5,6].forEach(d=>{if(!db.business.weekly[d])db.business.weekly[d]={active:db.business.days.includes(d),open:db.business.open||'09:00',lunchStart:db.business.lunchStart||'12:00',lunchEnd:db.business.lunchEnd||'13:30',close:db.business.close||'19:00'};});
if(!db.business.lunchStart) db.business.lunchStart='12:00';
if(!db.business.lunchEnd) db.business.lunchEnd='13:30';
db.barbers.forEach(b=>{if(!b.weekly)b.weekly={};});
let view='admin',tab='today',selectedSlot='';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
window.onerror=function(msg,src,line,col,err){let box=document.getElementById('fatalError');if(!box){box=document.createElement('div');box.id='fatalError';box.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;z-index:9999;background:#fff0f0;border:2px solid #c33;border-radius:12px;padding:12px;font:14px Arial;color:#7a1111';document.body.appendChild(box)}box.innerHTML='<b>O sistema encontrou um erro.</b><br>Atualize a página. Se continuar, envie esta mensagem: '+String(msg)+' (linha '+line+')';return false};
const money=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>new Date().toISOString().slice(0,10);
function nav(){return '<div class="tabs"><button class="btn '+(view==='admin'?'':'soft')+'" onclick="view=\'admin\';render()">Painel do barbeiro</button><button class="btn '+(view==='public'?'':'soft')+'" onclick="view=\'public\';render()">Página do cliente</button></div>'}
function render(){app.innerHTML=nav()+(view==='public'?publicPage():adminPage())}
function adminPage(){let t=today(),aps=db.appointments.filter(a=>a.date===t&&a.status!=='Cancelado'),done=aps.filter(a=>a.status==='Atendido'),rev=done.reduce((s,a)=>s+a.price,0);
return holidayAlerts()+'<div class="hero"><div><h1>'+db.business.name+'</h1><div class="muted">Agenda e gestão da barbearia</div></div><button class="btn" onclick="manualBooking()">+ Agendamento</button></div>'+
'<div class="grid"><div class="card metric">Agendamentos hoje<b>'+aps.length+'</b></div><div class="card metric">Atendidos<b>'+done.length+'</b></div><div class="card metric">Faturamento hoje<b>'+money(rev)+'</b></div><div class="card metric">Clientes<b>'+db.clients.length+'</b></div></div>'+
'<div class="tabs"><button class="btn '+(tab==='today'?'':'soft')+'" onclick="tab=\'today\';render()">Agenda</button><button class="btn '+(tab==='calendar'?'':'soft')+'" onclick="tab=\'calendar\';render()">Calendário</button><button class="btn '+(tab==='services'?'':'soft')+'" onclick="tab=\'services\';render()">Serviços</button><button class="btn '+(tab==='barbers'?'':'soft')+'" onclick="tab=\'barbers\';render()">Barbeiros</button><button class="btn '+(tab==='clients'?'':'soft')+'" onclick="tab=\'clients\';render()">Clientes</button><button class="btn '+(tab==='settings'?'':'soft')+'" onclick="tab=\'settings\';render()">Configurações</button></div>'+({today:agenda,calendar:calendarPage,services,barbers,clients,settings}[tab])()
function agenda(){let a=db.appointments.slice().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));return '<div class="card"><div class="hero"><div><h2>Agenda</h2><div class="muted">Próximos horários</div></div><button class="btn soft" onclick="blockTime()">Bloquear horário</button></div><table><tr><th>Data</th><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Barbeiro</th><th>Status</th><th>Ações</th></tr>'+ (a.length?a.map(x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+x.time+'</td><td>'+x.client+'</td><td>'+x.service+'</td><td>'+x.barber+'</td><td>'+x.status+'</td><td><select onchange="setStatus('+x.id+',this.value)"><option>'+x.status+'</option>'+['Agendado','Confirmado','Atendido','Cancelado','Não compareceu'].filter(s=>s!==x.status).map(s=>'<option>'+s+'</option>').join('')+'</select></td></tr>').join(''):'<tr><td colspan="7">Nenhum agendamento ainda.</td></tr>')+'</table></div>'}
function daysUntil(date){let a=new Date(today()+'T12:00:00'),b=new Date(date+'T12:00:00');return Math.ceil((b-a)/86400000)}
function holidayAlerts(){let x=db.specialDates.filter(d=>{let n=daysUntil(d.date);return n>=0&&n<=7&&d.decision==='pending'}).sort((a,b)=>a.date.localeCompare(b.date));if(!x.length)return '';return '<div class="card" style="border:2px solid #e8b44c"><h3>🔔 Lembretes de datas especiais</h3>'+x.map(d=>'<div class="service"><div><b>'+d.name+'</b><div class="muted">'+fmtDate(d.date)+' · faltam '+daysUntil(d.date)+' dia(s). Defina como será o atendimento.</div></div><button class="btn" onclick="configureSpecial(\''+d.id+'\')">Definir horário</button></div>').join('')+'</div>'}
function calendarPage(){let list=db.specialDates.slice().sort((a,b)=>a.date.localeCompare(b.date));return holidayAlerts()+'<div class="hero"><div><h2>Calendário da barbearia</h2><div class="muted">Feriados, folgas e datas com horários diferentes.</div></div><button class="btn" onclick="newSpecialDate()">+ Data especial</button></div><div class="card"><table><tr><th>Data</th><th>Evento</th><th>Funcionamento</th><th>Ação</th></tr>'+list.map(d=>'<tr><td>'+fmtDate(d.date)+'</td><td><b>'+d.name+'</b><div class="muted">'+d.type+'</div></td><td>'+decisionText(d)+'</td><td><button class="btn soft" onclick="configureSpecial(\''+d.id+'\')">Configurar</button> '+(!d.autoHoliday?'<button class="btn danger" onclick="deleteSpecial(\''+d.id+'\')">Excluir</button>':'')+'</td></tr>').join('')+'</table></div>'}
function decisionText(d){return d.decision==='closed'?'Fechado':d.decision==='normal'?'Horário normal':d.decision==='special'?'Horário especial':d.decision==='barbers'?'Por barbeiro':'Pendente'}
function newSpecialDate(){openM('<h2>Nova data especial</h2><label>Data</label><input id="spdate" type="date"><label>Nome</label><input id="spname" placeholder="Feriado municipal, evento, folga..."><button class="btn" onclick="saveNewSpecial()">Adicionar</button>')}
function saveNewSpecial(){if(!spdate.value||!spname.value)return alert('Informe data e nome.');db.specialDates.push({id:'s'+Date.now(),date:spdate.value,name:spname.value,type:'Data especial',autoHoliday:false,decision:'pending',specialByBarber:{}});save();closeM();render()}
function deleteSpecial(id){db.specialDates=db.specialDates.filter(x=>x.id!==id);save();render()}
function configureSpecial(id){let d=db.specialDates.find(x=>String(x.id)===String(id)),sp=d.special||{open:'09:00',lunchStart:'12:00',lunchEnd:'13:30',close:'19:00'};openM('<h2>'+d.name+'</h2><div class="muted">'+fmtDate(d.date)+'</div><label>Como será o atendimento?</label><select id="spdecision" onchange="toggleSpecialFields()"><option value="pending" '+(d.decision==='pending'?'selected':'')+'>Ainda não definido</option><option value="closed" '+(d.decision==='closed'?'selected':'')+'>Fechado</option><option value="normal" '+(d.decision==='normal'?'selected':'')+'>Horário normal do dia</option><option value="special" '+(d.decision==='special'?'selected':'')+'>Horário especial para todos</option><option value="barbers" '+(d.decision==='barbers'?'selected':'')+'>Configurar por barbeiro</option></select><div id="specialFields"><div class="row"><div><label>Abre</label><input id="spo" type="time" value="'+sp.open+'"></div><div><label>Fecha para almoço</label><input id="spls" type="time" value="'+sp.lunchStart+'"></div><div><label>Retorna do almoço</label><input id="sple" type="time" value="'+sp.lunchEnd+'"></div><div><label>Fecha expediente</label><input id="spc" type="time" value="'+sp.close+'"></div></div><div id="perBarber">'+db.barbers.filter(b=>b.active!==false).map(b=>{let q=(d.specialByBarber||{})[b.id]||sp;return '<div class="card" style="box-shadow:none"><b>'+b.name+'</b><label><input style="width:auto" type="checkbox" id="spba'+b.id+'" '+(q.active!==false?'checked':'')+'> Atende nesta data</label><div class="row"><input id="spbo'+b.id+'" type="time" value="'+q.open+'"><input id="spbls'+b.id+'" type="time" value="'+q.lunchStart+'"><input id="spble'+b.id+'" type="time" value="'+q.lunchEnd+'"><input id="spbc'+b.id+'" type="time" value="'+q.close+'"></div></div>'}).join('')+'</div></div><button class="btn" onclick="saveSpecial(\''+d.id+'\')">Salvar decisão</button>');setTimeout(toggleSpecialFields,0)}
function toggleSpecialFields(){let v=spdecision.value,s=document.querySelector('#specialFields .row'),p=document.getElementById('perBarber');if(s)s.style.display=v==='special'?'grid':'none';if(p)p.style.display=v==='barbers'?'block':'none'}
function saveSpecial(id){let d=db.specialDates.find(x=>String(x.id)===String(id));d.decision=spdecision.value;if(d.decision==='special')d.special={active:true,open:spo.value,lunchStart:spls.value,lunchEnd:sple.value,close:spc.value};if(d.decision==='barbers'){d.specialByBarber={};db.barbers.filter(b=>b.active!==false).forEach(b=>d.specialByBarber[b.id]={active:document.getElementById('spba'+b.id).checked,open:document.getElementById('spbo'+b.id).value,lunchStart:document.getElementById('spbls'+b.id).value,lunchEnd:document.getElementById('spble'+b.id).value,close:document.getElementById('spbc'+b.id).value})}save();closeM();render()}
function services(){return '<div class="hero"><div><h2>Serviços</h2><div class="muted">Preço e duração definem os horários disponíveis.</div></div><button class="btn" onclick="editService()">+ Serviço</button></div><div class="card">'+db.services.filter(s=>s.active).map(s=>'<div class="service"><div><b>'+s.name+'</b><div class="muted">'+s.duration+' min · '+money(s.price)+'</div></div><div><button class="btn soft" onclick="editService('+s.id+')">Editar</button> <button class="btn danger" onclick="disableService('+s.id+')">Inativar</button></div></div>').join('')+'</div>'}
function barbers(){let active=db.barbers.filter(b=>b.active!==false),inactive=db.barbers.filter(b=>b.active===false);return '<div class="hero"><div><h2>Barbeiros</h2><div class="muted">Cada profissional pode ter sua própria jornada e agenda.</div></div><button class="btn" onclick="editBarber()">+ Barbeiro</button></div><div class="card">'+active.map(b=>'<div class="service"><div><b>'+b.name+'</b><div class="muted">'+barberScheduleText(b)+'</div></div><div><button class="btn soft" onclick="editBarber('+b.id+')">Editar</button> <button class="btn danger" onclick="disableBarber('+b.id+')">Inativar</button> <button class="btn danger" onclick="deleteBarber('+b.id+')">Excluir</button></div></div>').join('')+(inactive.length?'<h3>Inativos</h3>'+inactive.map(b=>'<div class="service"><b>'+b.name+'</b><div><button class="btn ok" onclick="reactivateBarber('+b.id+')">Reativar</button> <button class="btn soft" onclick="editBarber('+b.id+')">Editar</button> <button class="btn danger" onclick="deleteBarber('+b.id+')">Excluir</button></div></div>').join(''):'')+'</div>'}
function clients(){return '<div class="card"><h2>Clientes</h2><table><tr><th>Nome</th><th>WhatsApp</th><th>Visitas</th><th>Último atendimento</th></tr>'+db.clients.map(c=>{let a=db.appointments.filter(x=>x.phone===c.phone),last=a.length?a.slice().sort((x,y)=>y.date.localeCompare(x.date))[0].date:'-';return '<tr><td>'+c.name+'</td><td>'+c.phone+'</td><td>'+a.length+'</td><td>'+(last==='-'?'-':fmtDate(last))+'</td></tr>'}).join('')+'</table></div>'}
function weeklyEditor(prefix,weekly){let names=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];return names.map((n,d)=>{let x=weekly&&weekly[d]?weekly[d]:{active:false,open:'09:00',lunchStart:'12:00',lunchEnd:'13:30',close:'19:00'};return '<div class="card" style="box-shadow:none"><div class="hero"><b>'+n+'</b><label><input style="width:auto;margin-right:6px" type="checkbox" id="'+prefix+'a'+d+'" '+(x.active?'checked':'')+'>Atende</label></div><div class="row"><div><label>Abre</label><input id="'+prefix+'o'+d+'" type="time" value="'+x.open+'"></div><div><label>Fecha para almoço</label><input id="'+prefix+'ls'+d+'" type="time" value="'+x.lunchStart+'"></div><div><label>Retorna do almoço</label><input id="'+prefix+'le'+d+'" type="time" value="'+x.lunchEnd+'"></div><div><label>Fecha expediente</label><input id="'+prefix+'c'+d+'" type="time" value="'+x.close+'"></div></div></div>'}).join('')}
function readWeekly(prefix){let w={};[0,1,2,3,4,5,6].forEach(d=>w[d]={active:document.getElementById(prefix+'a'+d).checked,open:document.getElementById(prefix+'o'+d).value,lunchStart:document.getElementById(prefix+'ls'+d).value,lunchEnd:document.getElementById(prefix+'le'+d).value,close:document.getElementById(prefix+'c'+d).value});return w}
function settings(){let b=db.business;return '<div class="card"><h2>Configurações da barbearia</h2><div class="row"><div><label>Nome da barbearia</label><input id="bn" value="'+b.name+'"></div><div><label>WhatsApp</label><input id="bp" value="'+b.phone+'"></div><div><label>Endereço</label><input id="ba" value="'+b.address+'"></div></div><h3>Horários por dia da semana</h3><p class="muted">Configure cada dia separadamente. Desmarque “Atende” nos dias em que a barbearia estiver fechada.</p>'+weeklyEditor('biz',b.weekly)+'<button class="btn" onclick="saveSettings()">Salvar configurações</button></div>'}
function publicPage(){let b=db.business;return '<div class="public"><div class="card"><h1>'+b.name+'</h1><div class="muted">'+b.address+' · '+b.phone+'</div><h2>Agende seu horário</h2><p class="muted">Escolha o serviço, profissional e horário. Cadastro rápido, sem senha.</p><label>Seu nome</label><input id="pubName" placeholder="Nome"><label>WhatsApp</label><input id="pubPhone" placeholder="(00) 00000-0000"><label>Serviço</label><select id="pubService" onchange="selectedSlot=\'\';drawSlots()">'+db.services.filter(s=>s.active).map(s=>'<option value="'+s.id+'">'+s.name+' · '+s.duration+' min · '+money(s.price)+'</option>').join('')+'</select><label>Barbeiro</label><select id="pubBarber" onchange="selectedSlot=\'\';drawSlots()">'+db.barbers.filter(b=>b.active).map(b=>'<option value="'+b.id+'">'+b.name+'</option>').join('')+'</select><label>Data</label><input id="pubDate" type="date" min="'+today()+'" value="'+today()+'" onchange="selectedSlot=\'\';drawSlots()"><label>Horários disponíveis</label><div id="slots" class="slots"></div><button class="btn" style="width:100%;margin-top:18px" onclick="bookPublic()">Confirmar agendamento</button></div></div>'}
function drawSlots(){let el=document.getElementById('slots');if(!el)return;let date=pubDate.value,barber=db.barbers.find(b=>b.id==pubBarber.value),service=db.services.find(s=>s.id==pubService.value);if(!barber||!service)return;let sch=getDaySchedule(barber,date);if(!sch.active){el.innerHTML='<span class="muted">Este barbeiro não atende neste dia.</span>';return}let slots=makeDaySlots(sch,service.duration);el.innerHTML=slots.length?slots.map(t=>{let busy=isBusy(date,t,barber.id,service.duration);return '<button class="slot '+(busy?'busy ':'')+(selectedSlot===t?'sel':'')+'" '+(busy?'disabled':'onclick="selectedSlot=\''+t+'\';drawSlots()"')+'>'+t+'</button>'}).join(''):'<span class="muted">Nenhum horário disponível.</span>'}
function isBusy(date,time,barber,duration){let start=min(time),end=start+duration;return db.appointments.some(a=>a.date===date&&a.barberId===barber&&a.status!=='Cancelado'&&overlap(start,end,min(a.time),min(a.time)+a.duration))||db.blocks.some(b=>b.date===date&&b.barberId===barber&&overlap(start,end,min(b.start),min(b.end)))}
function overlap(a,b,c,d){return a<d&&c<b}function min(t){let x=t.split(':').map(Number);return x[0]*60+x[1]}function hm(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function getDaySchedule(b,date){let d=db.specialDates.find(x=>x.date===date);if(d){if(d.decision==='closed')return {active:false};if(d.decision==='special')return d.special;if(d.decision==='barbers'&&d.specialByBarber&&d.specialByBarber[b.id])return d.specialByBarber[b.id]}let dow=new Date(date+'T12:00:00').getDay(),bw=b&&b.weekly&&b.weekly[dow];return bw||db.business.weekly[dow]||{active:false,open:'09:00',lunchStart:'12:00',lunchEnd:'13:30',close:'19:00'}}
