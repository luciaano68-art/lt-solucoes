<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar | Barbearia Mãe e Filho</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#171717}.w{max-width:520px;margin:auto;padding:16px}.hero{background:#111;color:#fff;padding:22px;border-radius:0 0 20px 20px}.c{background:#fff;border:1px solid #ddd;border-radius:14px;padding:15px;margin:12px 0}label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}input,select,button{width:100%;min-height:48px;border-radius:10px;font-size:16px}input,select{border:1px solid #bbb;padding:10px}button{border:0;background:#111;color:#fff;font-weight:800;margin-top:10px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{background:#fff;color:#111;border:1px solid #999}.msg{padding:12px;border-radius:10px;background:#eee;margin-top:10px}</style><style>
body{background:#f1f2f3;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:url('./logo-mae-filho.png') center 240px / min(92vw,620px) auto no-repeat;opacity:.12;pointer-events:none;z-index:0}.hero,.w{position:relative;z-index:1}.hero{text-align:center;background:linear-gradient(145deg,#090909,#202020);border-radius:0 0 24px 24px;padding:18px 22px 24px}.salon-logo{display:block;width:172px;max-width:70%;height:auto;margin:0 auto 14px;filter:invert(1);mix-blend-mode:screen}.hero h2{font-size:26px;margin:8px 0 10px}.hero>div{font-size:15px;line-height:1.5;color:#dedede}.c{background:rgba(255,255,255,.93);border-color:#e1ddd5;border-radius:18px;box-shadow:0 8px 26px #1515150a}label{font-size:14px;margin:14px 0 6px}input,select{background:#fff;border-color:#cbc9c3}button{border-radius:12px}#search,#confirmBooking{background:linear-gradient(135deg,#171717,#2e2920);border:1px solid #b6904e;min-height:54px}button:disabled{opacity:.6;cursor:wait}.slot{border-color:#c4b79c}.slot:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c9aa65;outline-offset:3px}
.booking-confirmation{padding:24px 18px;text-align:center;background:rgba(255,255,255,.98);border:1px solid #d9e8dd;border-radius:18px;margin-top:18px;box-shadow:0 8px 24px #14482b12;scroll-margin-top:18px}.booking-confirmation.review{border-color:#dfcda8}.confirmation-check{width:76px;height:76px;margin:0 auto 18px;background:#17833e;color:#fff;border:8px solid #eaf6ed;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;line-height:1}.booking-confirmation h3{font-size:clamp(22px,6vw,28px);line-height:1.2;margin:0 0 10px;overflow-wrap:break-word}.confirmation-subtitle{font-size:16px;line-height:1.5;color:#5f656b;margin:0 0 20px}.confirmation-when{border-top:1px solid #c9aa65;border-bottom:1px solid #c9aa65;padding:18px 0;margin:18px 0;display:grid;gap:8px}.confirmation-date{font-size:22px;font-weight:800}.confirmation-time{font-size:32px;font-weight:900}.confirmation-details{margin:0;text-align:left}.confirmation-details>div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:16px;line-height:1.4}.confirmation-details dt{color:#646b73}.confirmation-details dd{margin:0;text-align:right;font-weight:700;overflow-wrap:anywhere}.confirmation-details dt,.confirmation-details dd{flex:1;min-width:0}.confirmation-duration{font-size:14px;color:#646b73;margin:14px 0 0}.booking-confirmation .slot{margin-top:12px}.booking-confirmation:focus{outline:none}
@media(prefers-reduced-motion:no-preference){.booking-confirmation.success{animation:confirmation-in .25s ease-out}@keyframes confirmation-in{from{opacity:.5;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
@media(max-width:360px){.w{padding:12px}.booking-confirmation{padding:20px 12px}.confirmation-details>div{font-size:15px}}
</style></head><body><div class="hero"><img class="salon-logo" src="./logo-mae-filho.png" alt="Barbearia Mãe &amp; Filho"><h2>Agende seu horário</h2><div>Escolha o serviço, profissional e horário disponível.</div></div><main class="w"><div class="c"><label>Seu nome</label><input id="name"><label>WhatsApp</label><input id="phone"><label>Serviço</label><select id="service"><option value="1|Corte|40|30">Corte · R$ 40,00 · 30 min</option><option value="2|Barba|30|20">Barba · R$ 30,00 · 20 min</option><option value="3|Corte + Barba|65|50">Corte + Barba · R$ 65,00 · 50 min</option></select><label>Barbeiro</label><select id="barber"><option value="1|Luiz Henrique">Luiz Henrique</option><option value="2|Giseli">Giseli</option></select><label>Data</label><input id="date" type="date"><button id="search">Ver horários</button><div id="out"></div></div></main><script>
const URL='https://wwietlvweqsxfpejhhis.supabase.co',KEY='sb_publishable_dArUUh2qpDqbzvjxXAEbNQ_hT6Y0y5y';const $=x=>document.getElementById(x);let chosen=null,reserving=false;function today(){let d=new Date;return d.toISOString().slice(0,10)}$('date').min=today();$('date').value=today();function mi(t){let p=t.slice(0,5).split(':');return +p[0]*60 + +p[1]}function tm(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}async function rows(date,bid){let q=URL+'/rest/v1/barbershop_public_bookings?select=start_time,duration_minutes,status&booking_date=eq.'+date+'&barber_id=eq.'+bid+'&status=in.(Agendado,Confirmado,Atendido)';let r=await fetch(q,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Accept':'application/json'}});if(!r.ok)throw Error('Não foi possível consultar a agenda.');return r.json()}async function slots(){chosen=null;$('out').innerHTML='<div class="msg">Consultando agenda...</div>';try{let s=$('service').value.split('|'),b=$('barber').value.split('|'),date=$('date').value,used=await rows(date,+b[0]),dur=+s[3],day=new Date(date+'T12:00:00').getDay();if(day===0){$('out').innerHTML='<div class="msg">Não há atendimento neste dia.</div>';return}let a=[],now=new Date(),minToday=now.getHours()*60+now.getMinutes()+30;for(let n=540;n+dur<=1140;n+=30){if(n<810&&n+dur>720)continue;if(date===today()&&n<minToday)continue;let busy=used.some(x=>n<mi(x.start_time)+x.duration_minutes&&n+dur>mi(x.start_time));if(!busy)a.push(tm(n))}$('out').innerHTML='<h3>Horários disponíveis</h3><div class="slots">'+a.map(t=>'<button class="slot" data-t="'+t+'">'+t+'</button>').join('')+'</div>';document.querySelectorAll('.slot').forEach(x=>x.onclick=()=>review(x.dataset.t))}catch(e){$('out').innerHTML='<div class="msg">'+e.message+'</div>'}}function review(t){let n=$('name').value.trim(),p=$('phone').value.trim();if(!n||!p){alert('Informe nome e WhatsApp.');return}let s=$('service').value.split('|'),b=$('barber').value.split('|');chosen={time:t,date:$('date').value,service:$('service').value,barber:$('barber').value};$('out').innerHTML=bookingConfirmationHtml(false,n,s,b,$('date').value,t);$('confirmBooking').onclick=()=>reserve(t);$('changeBooking').onclick=slots}async function reserve(t){if(reserving||!chosen)return;if(chosen.time!==t||chosen.date!==$('date').value||chosen.service!==$('service').value||chosen.barber!==$('barber').value){await slots();return}reserving=true;let btn=$('confirmBooking');if(btn){btn.disabled=true;btn.textContent='Confirmando...'}let bookingDate=chosen.date;try{let n=$('name').value.trim(),p=$('phone').value.trim();if(!n||!p){alert('Informe nome e WhatsApp.');return}let s=$('service').value.split('|'),b=$('barber').value.split('|'),fresh=await rows(bookingDate,+b[0]),start=mi(t),dur=+s[3];if(fresh.some(x=>start<mi(x.start_time)+x.duration_minutes&&start+dur>mi(x.start_time))){alert('Este horário acabou de ser reservado. A agenda será atualizada.');await slots();return}let body={barber_id:+b[0],service_id:+s[0],client_name:n,client_phone:p,service_name:s[1],barber_name:b[1],booking_date:bookingDate,start_time:t,duration_minutes:+s[3],price:+s[2],status:'Agendado'};let r=await fetch(URL+'/rest/v1/barbershop_public_bookings',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Accept':'application/json','Prefer':'return=representation'},body:JSON.stringify(body)});if(r.ok){chosen=null;let created=await r.json();if(created&&created[0]&&created[0].id)fetch('https://wwietlvweqsxfpejhhis.supabase.co/functions/v1/barbershop-push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'notifyBooking',bookingId:created[0].id})}).catch(()=>{});$('out').innerHTML=bookingConfirmationHtml(true,n,s,b,body.booking_date,t)}else{let e=await r.text();if(e.includes('no_overlapping_public_bookings')||r.status===409){alert('Este horário acabou de ser reservado por outra pessoa. Escolha outro horário.');slots()}else $('out').innerHTML='<div class="msg"><b>Erro ao agendar.</b><br>'+r.status+' · '+e.replace(/[<>]/g,'')+'</div>'}}catch(e){alert('Não foi possível confirmar o agendamento. Confira a agenda antes de tentar novamente.')}finally{reserving=false;if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='Confirmar agendamento'}}}['service','barber','date'].forEach(id=>$(id).addEventListener('change',()=>{chosen=null;$('out').innerHTML=''}));$('search').onclick=slots;

function confirmationEscape(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bookingConfirmationHtml(confirmed,n,s,b,date,t){let parts=date.split('-'),dateText=parts.length===3?parts[2]+'/'+parts[1]+'/'+parts[0]:date;return '<section class="booking-confirmation '+(confirmed?'success':'review')+'" '+(confirmed?'role="status" aria-live="polite"':'')+'>'+(confirmed?'<div class="confirmation-check" aria-hidden="true">✓</div>':'')+'<h3>'+(confirmed?'Agendamento confirmado!':'Confirme seu horário')+'</h3><p class="confirmation-subtitle">'+(confirmed?'Seu horário está reservado.':confirmationEscape(n)+', confira os dados antes de confirmar.')+'</p><div class="confirmation-when"><div class="confirmation-date">'+confirmationEscape(dateText)+'</div><div class="confirmation-time">'+confirmationEscape(t)+'</div></div><dl class="confirmation-details"><div><dt>Serviço</dt><dd>'+confirmationEscape(s[1])+'</dd></div><div><dt>Profissional</dt><dd>'+confirmationEscape(b[1])+'</dd></div><div><dt>Valor</dt><dd>R$ '+Number(s[2]).toFixed(2).replace('.',',')+'</dd></div></dl><p class="confirmation-duration">Duração: '+confirmationEscape(s[3])+' min</p>'+(confirmed?'':'<button id="confirmBooking">Confirmar agendamento</button><button id="changeBooking" class="slot">Escolher outro horário</button>')+'</section>'}
</script></body></html>
