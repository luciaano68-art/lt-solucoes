<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#164f43"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://wwietlvweqsxfpejhhis.supabase.co"><title>Autorizar clientes — Meu Financeiro</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="../icon-192.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="./admin.css"></head><body><main class="admin-shell"><header class="admin-header"><div class="eyebrow">MEU FINANCEIRO</div><h1>Autorizar clientes</h1><p class="muted">Confira os pedidos e libere o acesso após falar com seu cliente.</p></header><section class="card"><form id="controlAccess" hidden><label for="controlKey">Código exclusivo de controle</label><input id="controlKey" type="password" minlength="43" maxlength="43" autocomplete="off" required><button type="submit">Entrar no controle</button><p class="muted">Use o mesmo código do seu painel de autorização.</p></form><div class="admin-tools"><button id="adminInstall" type="button" class="secondary">Instalar painel no celular</button><button id="adminNotifications" type="button" disabled>Ativar notificações</button><button id="adminPushTest" type="button" class="text-button" hidden>Conferir notificação</button><button id="reload" type="button" class="text-button">Atualizar cadastros</button></div><p id="notificationStatus" class="muted" role="status">Ative os avisos neste aparelho para receber novos pedidos.</p><p id="status" role="status"></p></section><section class="admin-counts" aria-label="Pedidos"><div class="card"><strong id="pendingCount">—</strong><span>Aguardando acesso</span></div><div class="card"><strong id="resetCount">—</strong><span>Pedidos de reset</span></div><div class="card"><strong id="activeCount">—</strong><span>Clientes autorizados</span></div><div class="card"><strong id="pausedCount">—</strong><span>Clientes pausados</span></div></section><label for="clientFilter">Visualizar clientes</label><select id="clientFilter"><option value="all">Todos os clientes</option><option value="pending">Aguardando autorização</option><option value="active">Autorizados</option><option value="paused">Pausados</option><option value="reset">Pedidos de recuperação</option><option value="deleted">Cadastros excluídos</option></select><div id="registrations"></div></main><script type="module" src="../admin.js"></script></body></html>
