    if(v instanceof Date&&!Number.isNaN(v.getTime())){
      const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    if(typeof v==='number'&&Number.isFinite(v)){
      const d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000);
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
    }
    const x=String(v).trim();
    if(/^\d+(?:\.\d+)?$/.test(x)){
      const serial=Number(x);
      if(Number.isFinite(serial)&&serial>20000&&serial<80000){
        const d=new Date(Date.UTC(1899,11,30)+Math.floor(serial)*86400000);
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
      }
    }
    let m=x.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})(?:\s+.*)?$/);
    if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
    m=x.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);
    if(m) return `${m[1]}-${m[2]}-${m[3]}`;
    // Alguns XLSX exportados pelo Consumer chegam como texto de Date do JavaScript.
    // Aceitamos somente quando existe ano/mes/dia completos; jamais caimos em todayISO().
    const d=new Date(x);
    if(!Number.isNaN(d.getTime()) && /\b20\d{2}\b/.test(x)){
      const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');
      return `${y}-${mo}-${da}`;
    }
    return '';
  }
  function fiado10SingleDayFromName(name){
    const x=String(name||'');
    const m=x.match(/\[(\d{2})-(\d{2})-(\d{4})\s+\d{4}\s*-\s*(\d{2})-(\d{2})-(\d{4})\s+\d{4}\]/);
    if(!m) return '';
    const a=`${m[3]}-${m[2]}-${m[1]}`,b=`${m[6]}-${m[5]}-${m[4]}`;
    return a===b?a:'';
  }

  async function importConsumerFiadoPair(files){
    const selected=[...(files||[])];
    if(selected.length!==2){
      throw new Error('Selecione exatamente 2 arquivos juntos: Finalizados como Fiado + Histórico de Itens Vendidos.');
    }

    const parsed=[];
    for(const file of selected){
      const rows=await readConsumerRows(file);
      if(rows.length<2) throw new Error(`O arquivo ${file.name} está vazio.`);
      parsed.push({file,rows,kind:identifyConsumerFiadoReport(rows,file.name)});
    }
    const ordersSource=parsed.find(x=>x.kind==='orders');
    const itemsSource=parsed.find(x=>x.kind==='items');
    if(!ordersSource||!itemsSource){
      throw new Error('Não consegui identificar os dois relatórios. Use os arquivos “Finalizados como Fiado” e “Histórico de Itens Vendidos” exportados do mesmo período.');
    }

    const oh=ordersSource.rows[0];
    const oc={
      code:consumerHeaderIndex(oh,['Código','Codigo']),
      customer:consumerHeaderIndex(oh,['Cliente']),
      openDate:consumerHeaderIndex(oh,['Data Abertura']),
      closeDate:consumerHeaderIndex(oh,['Data Fechamento']),
      itemTotal:consumerHeaderIndex(oh,['Tot. Itens','Total Itens']),
      delivery:consumerHeaderIndex(oh,['Valor Entrega']),
      total:consumerHeaderIndex(oh,['Total']),
      status:consumerHeaderIndex(oh,['Status'])
    };
    if([oc.code,oc.customer,oc.itemTotal,oc.delivery,oc.total].some(i=>i<0)){
      throw new Error('O relatório Finalizados como Fiado não possui todas as colunas necessárias (Código, Cliente, Tot. Itens, Valor Entrega e Total).');
    }

    const ih=itemsSource.rows[0];
    const ic={
      code:consumerHeaderIndex(ih,['Cod. Ped.','Cod Ped','Código Pedido','Codigo Pedido']),
      name:consumerHeaderIndex(ih,['Nome Prod','Nome Produto']),
      qty:consumerHeaderIndex(ih,['Qtd.','Qtd','Quantidade']),
      total:consumerHeaderIndex(ih,['Valor. Tot. Item','Valor Tot Item','Valor Total Item']),
      date:consumerHeaderIndex(ih,['Data Fec. Ped.','Data Ab. Ped.','Data/Hora Item']),
      customer:consumerHeaderIndex(ih,['Cliente'])
    };
    if([ic.code,ic.name,ic.qty,ic.total].some(i=>i<0)){
      throw new Error('O Histórico de Itens não possui todas as colunas necessárias (Cod. Ped., Nome Prod, Qtd. e Valor. Tot. Item).');
    }

    const itemGroups=new Map();
    for(const row of itemsSource.rows.slice(1)){
      const code=String(row[ic.code]??'').trim();
      if(!code) continue;
      const entry=itemGroups.get(code)||{items:[],sum:0};
      const value=consumerMoneyValue(row[ic.total]);
      entry.items.push([String(row[ic.name]||'-').trim(),consumerMoneyValue(row[ic.qty]),value]);
      entry.sum+=value;
      itemGroups.set(code,entry);
    }

    const orders=[];
    const seenCodes=new Set();
    for(const row of ordersSource.rows.slice(1)){
      const code=String(row[oc.code]??'').trim();
      const customer=normalizeConsumerName(row[oc.customer]);
      if(!code||!customer||seenCodes.has(code)) continue;
      seenCodes.add(code);
      const itemTotal=consumerMoneyValue(row[oc.itemTotal]);
      const delivery=consumerMoneyValue(row[oc.delivery]);
      const total=Number(consumerMoneyValue(row[oc.total]).toFixed(2));
      const rawDate=(oc.closeDate>=0?row[oc.closeDate]:null)||(oc.openDate>=0?row[oc.openDate]:null);
      const date=fiado10StrictOrderDate(rawDate)||fiado10SingleDayFromName(ordersSource.file.name);
      if(!date) throw new Error(`Pedido #${code} ficou sem data válida. Importação cancelada para não alterar datas antigas.`);
      const details=itemGroups.get(code)||{items:[],sum:0};
      orders.push({code,customer,date,itemTotal,delivery,total,details});
    }
    if(!orders.length) throw new Error('Nenhum pedido de fiado foi encontrado no relatório.');

    const missing=orders.filter(o=>!o.details.items.length);
    const divergent=orders.filter(o=>Math.abs(Number(o.details.sum.toFixed(2))-Number(o.itemTotal.toFixed(2)))>0.02);
    if(missing.length||divergent.length){
      const examples=[...missing.slice(0,4).map(o=>`#${o.code} sem itens`),...divergent.slice(0,4).map(o=>`#${o.code}: itens ${money(o.details.sum)} x Consumer ${money(o.itemTotal)}`)];
      throw new Error(`Importação bloqueada: ${missing.length} pedido(s) sem itens e ${divergent.length} divergência(s).\n\n${examples.join('\n')}`);
    }

    const data=ensureFiadosData();
    data.orderDetails=Array.isArray(data.orderDetails)?data.orderDetails:[];
    data.imports=Array.isArray(data.imports)?data.imports:[];
    const existingTxByOrder=new Map((data.transactions||[]).filter(t=>t.source==='consumer_fiado_order'&&t.orderNumber).map(t=>[String(t.orderNumber),t]));
    const existingDetailByOrder=new Map(data.orderDetails.filter(o=>o?.n).map(o=>[String(o.n),o]));
    const newOrders=orders.filter(o=>!existingTxByOrder.has(o.code));
    const updateOrders=orders.filter(o=>existingTxByOrder.has(o.code));
    const duplicated=updateOrders.length;
    const deliveryOrders=orders.filter(o=>o.delivery>0);
    const productTotal=orders.reduce((sum,o)=>sum+o.itemTotal,0);
    const deliveryTotal=orders.reduce((sum,o)=>sum+o.delivery,0);
    const grandTotal=orders.reduce((sum,o)=>sum+o.total,0);
    const newTotal=newOrders.reduce((sum,o)=>sum+o.total,0);
    const uniqueCustomers=new Set(orders.map(o=>normalizeImportHeader(o.customer))).size;

    const preview=[
      'PRÉVIA DA IMPORTAÇÃO',
      '',
      `Pedidos encontrados: ${orders.length}`,
      `Clientes: ${uniqueCustomers}`,
      `Pedidos novos: ${newOrders.length}`,
      `Já importados (serão conferidos/atualizados): ${duplicated}`,
      `Pedidos com entrega: ${deliveryOrders.length}`,
      `Produtos: ${money(productTotal)}`,
      `Taxas de entrega: ${money(deliveryTotal)}`,
      `TOTAL DO RELATÓRIO: ${money(grandTotal)}`,
      '',
      `Valor novo que será lançado: ${money(newTotal)}`,
      `Pedidos existentes que serão corrigidos se necessário: ${updateOrders.length}`,
      '',
      'Confirmar importação?'
    ].join('\n');
    if(!confirm(preview)) return;

    const importId='consumer_fiado_pair_'+Date.now();
    let createdCustomers=0;
    let correctedOrders=0;

    for(const order of updateOrders){
      const tx=existingTxByOrder.get(order.code);
      let customer=findFiadoCustomerByName(order.customer);
      if(!customer && tx) customer=data.customers.find(c=>c.id===tx.customerId)||null;
      if(!customer){
        customer={id:uid('fiado_consumer'),name:order.customer,phone:'',notes:'Importado do Consumer',createdAt:new Date().toISOString(),active:true,invoiceSent:false};
        data.customers.push(customer);
        createdCustomers++;
      }
      if(tx){
        const oldAmount=Number(tx.amount||0);
        tx.customerId=customer.id;
        tx.date=order.date;
        tx.amount=order.total;
        tx.itemTotal=order.itemTotal;
        tx.delivery=order.delivery;
        tx.description=order.delivery>0?`Pedido #${order.code} - total oficial ${money(order.total)} · produtos ${money(order.itemTotal)} · entrega ${money(order.delivery)}`:`Pedido #${order.code} - total oficial ${money(order.total)}`;
        tx.lastImportId=importId;
        tx.updatedAt=new Date().toISOString();
        if(Math.abs(oldAmount-order.total)>0.005) correctedOrders++;
      }
      const detail=existingDetailByOrder.get(order.code);
      if(detail){
        detail.c=customer.id; detail.d=order.date; detail.a=order.total; detail.itemTotal=order.itemTotal; detail.delivery=order.delivery; detail.i=order.details.items;
      }else{
        data.orderDetails.push({c:customer.id,d:order.date,n:order.code,a:order.total,itemTotal:order.itemTotal,delivery:order.delivery,i:order.details.items});
      }
    }

    for(const order of newOrders){
      let customer=findFiadoCustomerByName(order.customer);
      if(!customer){
        customer={id:uid('fiado_consumer'),name:order.customer,phone:'',notes:'Importado do Consumer',createdAt:new Date().toISOString(),active:true,invoiceSent:false};
        data.customers.push(customer);
        createdCustomers++;
      }
      data.transactions.push({
        id:uid('fiado_tx'),customerId:customer.id,type:'debit',date:order.date,amount:order.total,
        orderNumber:order.code,description:order.delivery>0?`Pedido #${order.code} - total oficial ${money(order.total)} · produtos ${money(order.itemTotal)} · entrega ${money(order.delivery)}`:`Pedido #${order.code} - total oficial ${money(order.total)}`,
        source:'consumer_fiado_order',importId,createdAt:new Date().toISOString(),itemTotal:order.itemTotal,delivery:order.delivery
      });
      data.orderDetails.push({
        c:customer.id,d:order.date,n:order.code,a:order.total,itemTotal:order.itemTotal,delivery:order.delivery,i:order.details.items
      });
    }

    data.imports.push({
      id:importId,type:'consumer_fiado_pair',files:[ordersSource.file.name,itemsSource.file.name],createdAt:new Date().toISOString(),
      orders:orders.length,newOrders:newOrders.length,duplicates:duplicated,total:newTotal,deliveryTotal:newOrders.reduce((s,o)=>s+o.delivery,0)
    });
    await saveRemoteNow();
    alert(`Importação concluída.\n\n${newOrders.length} pedido(s) novo(s)\n${createdCustomers} cliente(s) novo(s)\n${money(newTotal)} lançado(s) em Fiados.`);
    fiadosPage();
  }

  async function importConsumerBalances(file){
    const rows=await readConsumerRows(file);
    if(rows.length<2) throw new Error('O relatório está vazio.');
    const cols=detectConsumerColumns(rows[0],'balance');
    if(cols.customer<0||cols.amount<0) throw new Error('Não encontrei as colunas Cliente e Saldo/Valor no relatório.');
    const data=ensureFiadosData();
    let created=0,updated=0,ignored=0;
    const changes=[];
    for(const row of rows.slice(1)){
      const name=normalizeConsumerName(row[cols.customer]);
      if(!name) continue;
      const target=consumerMoneyValue(row[cols.amount]);
      if(!Number.isFinite(target)) { ignored++; continue; }
      let customer=findFiadoCustomerByName(name);
      if(!customer){
        customer={id:uid('fiado_consumer'),name,phone:cols.phone>=0?String(row[cols.phone]||'').trim():'',notes:'Importado do Consumer',createdAt:new Date().toISOString(),active:true,invoiceSent:false};
        data.customers.push(customer); created++;
      }else{
        if(cols.phone>=0 && !customer.phone) customer.phone=String(row[cols.phone]||'').trim();
        updated++;
      }
      const current=fiadoBalance(customer.id);
      const diff=Number((target-current).toFixed(2));
      if(Math.abs(diff)>0.005){
        changes.push({customerId:customer.id,name,current,target,diff});
      }
    }
    if(!changes.length && !created){
      alert('Relatório conferido. Os saldos já estão iguais aos do Consumer.');
      return;
    }
    const totalTarget=changes.reduce((s,x)=>s+x.target,0);
    const ok=confirm(`Consumer: ${created} cliente(s) novo(s), ${updated} já existente(s), ${changes.length} saldo(s) para atualizar.\n\nConfirmar atualização?`);
    if(!ok) return;
    const importId='consumer_balance_'+Date.now();
    changes.forEach(x=>{
      if(x.diff>0){
        data.transactions.push({id:uid('fiado_tx'),customerId:x.customerId,type:'debit',date:todayISO(),amount:x.diff,orderNumber:'',description:'Ajuste de saldo importado do Consumer',source:'consumer_balance',importId,createdAt:new Date().toISOString(),hiddenFromMonthly:true});
      }else{
        data.transactions.push({id:uid('fiado_tx'),customerId:x.customerId,type:'payment',date:todayISO(),amount:Math.abs(x.diff),orderNumber:'',description:'Ajuste de saldo importado do Consumer',source:'consumer_balance',importId,createdAt:new Date().toISOString(),hiddenFromMonthly:true});
      }
    });
    data.imports=data.imports||[];
    data.imports.push({id:importId,type:'consumer_balance',fileName:file.name,createdAt:new Date().toISOString(),rows:rows.length-1});
    await saveRemoteNow();
    alert('Fiados atualizados com o relatório do Consumer.');
    fiadosPage();
  }

  // TESSARO_FIADOS_RECEBIMENTOS_IDEMPOTENTES_V9_20260831
  function fiado9StrictDate(v){
    if(v===null||v===undefined||v==='')return '';
    if(v instanceof Date&&!isNaN(v)){const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}
    if(typeof v==='number'&&isFinite(v)){const d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
    const x=String(v).trim();
    if(/^\d+(?:\.\d+)?$/.test(x)){
      const serial=Number(x);
      if(Number.isFinite(serial)&&serial>20000&&serial<80000){
        const d=new Date(Date.UTC(1899,11,30)+Math.floor(serial)*86400000);
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
      }
    }
    let m=x.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})(?:\s+.*)?$/);if(m)return `${m[3]}-${m[2]}-${m[1]}`;
    m=x.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
    m=x.match(/^(\d{2})[\/-](\d{2})[\/-](\d{2})(?:\D|$)/);if(m)return `20${m[3]}-${m[2]}-${m[1]}`;
    const d=new Date(x);if(!Number.isNaN(d.getTime())&&/\b20\d{2}\b/.test(x)){const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return `${y}-${mo}-${da}`}
    return '';
  }
  function fiado9Header(headers,names){
    const hs=(headers||[]).map(x=>normalizeImportHeader(String(x||'')));
    for(const name of names){const n=normalizeImportHeader(name);const i=hs.findIndex(h=>h===n);if(i>=0)return i}
    for(const name of names){const n=normalizeImportHeader(name);const i=hs.findIndex(h=>h.includes(n));if(i>=0)return i}
    return -1;
  }
  function fiado9ReceiptKey(name,date,amount,origin){return `${normalizeImportHeader(name)}|${date}|${Number(amount||0).toFixed(2)}|${normalizeImportHeader(origin||'')}`}

  // TESSARO_FIADOS_RECEBIMENTOS_V14_20260901
  function fiado14SingleDayFromFileName(name){
    const x=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    let m=x.match(/(\d{2})-(\d{2})-(\d{2,4})\s+(?:a|ate|-)\s+(\d{2})-(\d{2})-(\d{2,4})/i);
    if(!m) m=x.match(/\[(\d{2})-(\d{2})-(\d{4})\s+\d{4}\s*-\s*(\d{2})-(\d{2})-(\d{4})\s+\d{4}\]/);
    if(!m)return '';
    const year=v=>String(v).length===2?`20${v}`:String(v);
    const a=`${year(m[3])}-${m[2]}-${m[1]}`,b=`${year(m[6])}-${m[5]}-${m[4]}`;
    return a===b?a:'';
  }

  // TESSARO_FIADOS_RECEBIMENTOS_CANCELAMENTO_V17_20260901
  function fiado17FileRange(name){
    const x=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const m=x.match(/(\d{2})-(\d{2})-(\d{2,4})\s+(?:a|ate|-)\s+(\d{2})-(\d{2})-(\d{2,4})/i);
    if(!m)return null;
    const year=v=>String(v).length===2?`20${v}`:String(v);
    return {start:`${year(m[3])}-${m[2]}-${m[1]}`,end:`${year(m[6])}-${m[5]}-${m[4]}`};
  }

  async function importConsumerReceipts(file){
    const rows=await readConsumerRows(file);
    if(rows.length<2) throw new Error('O relatório está vazio.');
    const headers=rows[0]||[];
    // TESSARO_FIADOS_IMPORTADORES_V13_20260901
    const customerCol=fiado9Header(headers,['Cliente','Nome Cliente','Cliente / Fornecedor','Nome do Cliente']);
    const amountCol=fiado9Header(headers,['Total Recebido','Valor Recebido','Recebido','Valor do Recebimento','Valor']);
    const dateCol=fiado9Header(headers,['Recebido Em','Recebido em','Data Recebimento','Data do Recebimento','Data/Hora Recebimento','Data Hora Recebimento','Data Pagamento','Data do Pagamento','Pagamento','Data']);
    const originCol=fiado9Header(headers,['Origem','Tipo','Forma Pagamento','Forma de Pagamento','Forma','Meio de Pagamento']);
    if(customerCol<0||amountCol<0) throw new Error('Não encontrei as colunas Cliente e Total Recebido no relatório.');
    const singleDayFileDate=fiado14SingleDayFromFileName(file?.name||'');
    const fileRange=fiado17FileRange(file?.name||'');
    const today=todayISO();
    // Exceção segura para relatório mensal aberto exatamente no primeiro dia do período:
    // nesse momento ainda não existem dias anteriores dentro do arquivo para confundir a data.
    const firstDayRangeDate=(!singleDayFileDate&&fileRange&&fileRange.start===today)?today:'';
    const safeFileDate=singleDayFileDate||firstDayRangeDate;
    if(dateCol<0&&!safeFileDate) throw new Error('O relatório não traz a data de cada recebimento. Para evitar baixa em dia errado, use o relatório de um único dia ou importe o relatório mensal no primeiro dia do período.');

    const data=ensureFiadosData();
    data.pendingReceipts=Array.isArray(data.pendingReceipts)?data.pendingReceipts:[];
    data.transactions=Array.isArray(data.transactions)?data.transactions:[];
    const existingKeys=new Set();
    for(const t of data.transactions){
      if(t.source!=='consumer_receipt')continue;
      if(t.importKey)existingKeys.add(String(t.importKey));
      const c=(data.customers||[]).find(x=>x.id===t.customerId);
      if(c&&t.date)existingKeys.add(fiado9ReceiptKey(c.name,t.date,t.amount,String(t.description||'').replace(/^Recebimento Consumer\s*-?\s*/i,'')));
    }
    const fileSeen=new Set(),candidates=[],unmatched=[];let skippedDuplicate=0,invalidDate=0,corrected=0;
    for(const row of rows.slice(1)){
      const name=normalizeConsumerName(row[customerCol]);
      const amount=consumerMoneyValue(row[amountCol]);
      if(!name||amount<=0)continue;
      const date=(dateCol>=0?fiado9StrictDate(row[dateCol]):'')||safeFileDate;
      if(!date){invalidDate++;continue;}
      const origin=originCol>=0?String(row[originCol]||'').trim():'';
      const key=fiado9ReceiptKey(name,date,amount,origin);
      if(fileSeen.has(key)||existingKeys.has(key)){skippedDuplicate++;continue}
      fileSeen.add(key);
      let customer=findFiadoCustomerByName(name);
      if(!customer){
        // TESSARO_FIADOS_CLIENTE_NOVO_RECEBIMENTO_V15_20260901
        // Se o Consumer traz um recebimento de um cliente ainda inexistente no Tessaro,
        // cria o cadastro mínimo com o mesmo padrão já usado pelos importadores de pedidos/saldos.
        // O recebimento entra normalmente como payment, podendo gerar haver quando for antecipado.
        customer={id:uid('fiado_consumer'),name,phone:'',notes:'Importado do Consumer',createdAt:new Date().toISOString(),active:true,invoiceSent:false};
        data.customers.push(customer);
      }
      // Duplicidade real ja foi verificada por cliente + data + valor + origem.
      // Pagamentos iguais em dias diferentes sao recebimentos distintos.
      candidates.push({customer,amount,date,origin,key});
    }
    if(invalidDate) throw new Error(`${invalidDate} recebimento(s) ficaram sem data válida. Nada novo foi baixado. Confira o relatório.`);
    if(!candidates.length&&!unmatched.length&&corrected===0){alert(skippedDuplicate?'Todos os recebimentos deste relatório já foram importados. Nenhuma baixa foi duplicada.':'Nenhum recebimento válido foi encontrado.');return}
    const total=candidates.reduce((s,r)=>s+r.amount,0);
    const preview=['PRÉVIA DOS FIADOS RECEBIDOS','',`Novas baixas: ${candidates.length}`,`Valor das novas baixas: ${money(total)}`,`Já existentes/duplicados ignorados: ${skippedDuplicate}`,`Registros antigos corrigidos sem nova baixa: ${corrected}`,`Sem cliente correspondente: ${unmatched.length}`,'','Confirmar?'].join('\n');
    if(!confirm(preview))return;

  async function cancelCurrentFiadoInvoices(){
    const data=ensureFiadosData();
    data.invoices=Array.isArray(data.invoices)?data.invoices:[];
    const activePeriods=[...new Set(data.invoices.filter(inv=>inv.status!=='cancelled'&&inv.period).map(inv=>String(inv.period)))].sort().reverse();
    if(!activePeriods.length){alert('Não há fechamento ativo para cancelar.');return;}
    const suggested=activePeriods[0];
    const entered=prompt('Informe o mês do fechamento que deseja cancelar no formato AAAA-MM.',suggested);
    if(entered===null)return;
    const period=String(entered||'').trim();
    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(period)){alert('Mês inválido. Use o formato AAAA-MM.');return}
    const current=data.invoices.filter(inv=>inv.period===period && inv.status!=='cancelled');
    if(!current.length){alert('Não há fechamento ativo para o período informado.');return;}
    const sent=current.filter(inv=>inv.status==='sent').length;
    const total=current.reduce((s,inv)=>s+Number(inv.amount||0),0);
    const extra=sent?`

ATENÇÃO: ${sent} fatura(s) já foram marcadas como enviadas.`:'';
    if(!confirm(`Cancelar o fechamento das ${current.length} fatura(s) deste mês?
Total do fechamento: ${money(total)}${extra}

Isso não altera os saldos nem os pagamentos; apenas cancela estas faturas fechadas.`)) return;
    const now=new Date().toISOString();
    current.forEach(inv=>{inv.status='cancelled';inv.cancelledAt=now;});
    await saveRemoteNow();
    alert('Fechamento cancelado com sucesso. Os saldos dos clientes foram preservados.');
    fiadosPage();
  }

  async function closeAllFiadoInvoices(){
    const data=ensureFiadosData();
    data.invoices=Array.isArray(data.invoices)?data.invoices:[];
    // TESSARO_FIADOS_PERIODO_FATURA_V16_20260901
    // O fechamento nunca deve assumir automaticamente o mês de hoje.
    // Nos primeiros dias do mês, sugerimos o mês anterior, mas o usuário confirma explicitamente.
    const nowDate=new Date(),suggestDate=new Date(nowDate.getFullYear(),nowDate.getMonth()-(nowDate.getDate()<=5?1:0),1);
    const suggested=`${suggestDate.getFullYear()}-${String(suggestDate.getMonth()+1).padStart(2,'0')}`;
    const entered=prompt('Informe o mês de referência das faturas no formato AAAA-MM.\nExemplo: 2026-08',suggested);
    if(entered===null)return;
    const period=String(entered||'').trim();
    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(period)){alert('Mês inválido. Use o formato AAAA-MM, por exemplo 2026-08.');return}
    // TESSARO_FIADOS_FECHAMENTO_HISTORICO_V18_20260901
    // Para fechar mês anterior, usa o saldo existente NO FIM daquele mês.
    // Movimentos de setembro (ou meses seguintes) não podem alterar a fatura de agosto.
    const periodEnd=period+'-31';
    const balanceAtPeriodEnd=customerId=>(data.transactions||[])
      .filter(t=>String(t.customerId||'')===String(customerId||'') && String(t.date||'')<=periodEnd)
      .reduce((sum,t)=>sum+((t.type==='payment'||t.type==='credit')?-Number(t.amount||0):Number(t.amount||0)),0);
    const openCustomers=(data.customers||[]).filter(c=>{
      if(fiadoCurrentInvoice(c.id,period)) return false;
      const bal=balanceAtPeriodEnd(c.id);
      const debtor=bal>0.005;
      const settled=Math.abs(bal)<=0.005 && fiadoCustomerHadMonthlyPurchases(c.id,period);
      return debtor||settled;
    });
    if(!openCustomers.length){
      alert('Não há faturas ou extratos quitados novos para fechar neste mês.');
      return;
    }
    const total=openCustomers.reduce((s,c)=>s+Math.max(0,balanceAtPeriodEnd(c.id)),0);
    const settledCount=openCustomers.filter(c=>Math.abs(balanceAtPeriodEnd(c.id))<=0.005).length;
    const label=period.split('-').reverse().join('/');
    if(!confirm(`Fechar ${openCustomers.length} fatura(s)/extrato(s) referentes a ${label}?\
\
Faturas com saldo a receber: ${openCustomers.length-settledCount}\
Extratos quitados (R$ 0,00): ${settledCount}\
Total a receber: ${money(total)}\
\
Clientes quitados não entram no total a receber e nenhum saldo será alterado.`)) return;
    const now=new Date().toISOString();
    openCustomers.forEach(c=>{
      const rawBalance=balanceAtPeriodEnd(c.id);
      const amount=Math.abs(rawBalance)<=0.005?0:Number(rawBalance.toFixed(2));
      data.invoices.push({
        id:uid('fiado_invoice'),
        customerId:c.id,
        period,
        amount,
        closedAt:now,
        statementDate:periodEnd,
        status:'closed',
        sentAt:null,
        source:'consumer_balance_snapshot',
        kind:amount===0?'settled_statement':'receivable_invoice'
      });
      c.invoiceSent=false;
      c.invoiceSentAt=null;
    });
    await saveRemoteNow();
    alert(`${openCustomers.length} fatura(s)/extrato(s) fechada(s). ${settledCount} quitada(s) em R$ 0,00. Total a receber: ${money(total)}.`);
    fiadosPage();
  }

    const month=todayISO().slice(0,7);

    // Mantém a operação do mês atual, mas a tabela mostra o fechamento ativo mais recente.
    // Assim, no início de setembro, as faturas já fechadas de agosto continuam disponíveis
    // para conferência, PDF e marcação de envio, sem alterar saldo ou período.
    const activeInvoicePeriods=[...new Set((data.invoices||[]).filter(inv=>inv.status!=='cancelled'&&inv.period).map(inv=>String(inv.period)))].sort().reverse();
    const invoiceMonth=activeInvoicePeriods[0]||month;
    const grossReceivables=customers.reduce((sum,c)=>sum+Math.max(0,fiadoBalance(c.id)),0);
    const totalHaveres=customers.reduce((sum,c)=>sum+Math.max(0,-fiadoBalance(c.id)),0);
    const totalOpen=Number((grossReceivables-totalHaveres).toFixed(2));
    const customersOpen=customers.filter(c=>fiadoBalance(c.id)>0.005).length;
    const haverCustomers=customers.filter(c=>fiadoBalance(c.id)<-0.005).sort((a,b)=>fiadoBalance(a.id)-fiadoBalance(b.id));
    const customersHaver=haverCustomers.length;
    data.invoices=Array.isArray(data.invoices)?data.invoices:[];
    // TESSARO_FIADOS_CONTADORES_FATURAS_V22_20260901
    const currentInvoices=data.invoices.filter(inv=>inv.period===invoiceMonth&&inv.status!=='cancelled');
    // TESSARO_FIADOS_CICLO_GESTAO_V38_20260905
    // Separa a fatura fechada do consumo feito depois do fechamento.
    // Pagamentos posteriores quitam primeiro a fatura antiga; eventual excedente abate o consumo novo.
    const fiadoInvoiceState=(customerId,inv)=>{
      if(!inv){
        const current=Math.max(0,fiadoBalance(customerId));
        return {invoiceOpen:0,newOpen:current,paidAfter:0,newDebits:current};
      }
      const statementDate=String(inv.statementDate||'');
      const after=(data.transactions||[]).filter(t=>
        String(t.customerId||'')===String(customerId||'') &&
        (!statementDate || String(t.date||'')>statementDate) &&
        t.hiddenFromMonthly!==true
      );
      const payments=after.filter(t=>t.type==='payment'||t.type==='credit').reduce((sum,t)=>sum+Number(t.amount||0),0);
      const debits=after.filter(t=>t.type!=='payment'&&t.type!=='credit'&&t.source!=='consumer_opening_snapshot').reduce((sum,t)=>sum+Number(t.amount||0),0);
      const invoiceAmount=Math.max(0,Number(inv.amount||0));
      const invoiceOpen=Math.max(0,Number((invoiceAmount-payments).toFixed(2)));
      const excess=Math.max(0,payments-invoiceAmount);
      const newOpen=Math.max(0,Number((debits-excess).toFixed(2)));
      return {invoiceOpen,newOpen,paidAfter:payments,newDebits:debits};
    };
    const invoiceStates=currentInvoices.map(inv=>({inv,state:fiadoInvoiceState(inv.customerId,inv)}));
    const invoicesSent=invoiceStates.filter(x=>x.state.invoiceOpen>0.005&&x.inv.status==='sent').length;
    const invoicesPending=invoiceStates.filter(x=>x.state.invoiceOpen>0.005&&x.inv.status==='closed').length;
    const invoicesClosed=invoicesSent+invoicesPending;
    // TESSARO_FIADOS_FATURAS_ABERTAS_DIRECT_V42_20260912
    const openInvoiceRows=invoiceStates.filter(x=>x.state.invoiceOpen>0.005).map(x=>{
      const customer=customers.find(c=>String(c.id)===String(x.inv.customerId))||{id:x.inv.customerId,name:'Cliente'};
      const original=Math.max(0,Number(x.inv.amount||0));
      const received=Math.min(original,Math.max(0,Number(x.state.paidAfter||0)));
      return {customer,inv:x.inv,original,received,open:Number(x.state.invoiceOpen||0)};
    }).sort((a,b)=>b.open-a.open);
    const openInvoicesTotal=Number(openInvoiceRows.reduce((sum,x)=>sum+x.open,0).toFixed(2));
    const monthPayments=data.transactions.filter(t=>t.type==='payment'&&!t.hiddenFromMonthly&&String(t.date||'').startsWith(month)).reduce((s,t)=>s+Number(t.amount||0),0);
    const pendingReceipts=data.pendingReceipts.filter(r=>r.status==='pending');
    const selected=customers.find(c=>c.id===fiadoSelectedCustomerId)||null;
    const statement=selected ? data.transactions.filter(t=>t.customerId===selected.id).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.createdAt||'').localeCompare(String(a.createdAt||''))) : [];

        <div class="card metric purple"><div class="metric-icon">✉</div><span>Faturas fechadas</span><strong>${invoicesClosed}</strong><small>${invoicesPending} a enviar · ${invoicesSent} enviada(s)</small></div>
        <div class="card metric green" id="openInvoicesDirectCard" role="button" tabindex="0" title="Clique para ver quem ainda falta receber" style="cursor:pointer"><div class="metric-icon">$</div><span>Faturas em aberto</span><strong>${money(openInvoicesTotal)}</strong><small>${openInvoiceRows.length} cliente(s) · clique para ver</small></div>
        <div class="card metric green"><div class="metric-icon">✓</div><span>Recebido no mês</span><strong>${money(monthPayments)}</strong><small>pagamentos confirmados</small></div>

          ${customers.length?customers.map(c=>{
            const bal=fiadoBalance(c.id);
            const invoice=fiadoCurrentInvoice(c.id,invoiceMonth);
            const invoiceState=fiadoInvoiceState(c.id,invoice);
            return `<tr data-fiado-customer-row="${esc(c.id)}" data-fiado-search="${esc(`${c.name||''} ${c.phone||''} ${c.notes||''}`.toLowerCase())}">

              <td>${invoice

              ${haverCustomers.length?haverCustomers.map(c=>{const haver=Math.abs(fiadoBalance(c.id));return `<tr><td><strong>${esc(c.name)}</strong>${c.phone?`<br><small class="muted">${esc(c.phone)}</small>`:''}</td><td style="text-align:right"><strong style="color:#067647">${money(haver)}</strong></td><td><button class="btn secondary" data-haver-open-account="${esc(c.id)}">Abrir conta</button></td></tr>`;}).join(''):`<tr><td colspan="3" class="empty">Nenhum cliente com haver.</td></tr>`}

  function renderApp(){
    if(!session){
      showLogin();
      return;
    }

    if(session.role==='master'){
      const internalCompany=(db.companies||[]).find(c=>String(c.cnpj||'').replace(/\D/g,'')==='28851513000125')
        ||(db.companies||[]).find(c=>String(c.name||'').toLowerCase().includes('tessaro'))
        ||(db.companies||[]).find(c=>companyStatus(c)==='active');
      if(internalCompany){
        const internalUser=(db.users||[]).find(u=>u.companyId===internalCompany.id);
        setSession({role:'client',email:session.email||'',companyId:internalCompany.id,userId:internalUser?.id||'internal_user'});
        dashboardPage();
        return;
      }
      masterDashboard();
      return;
    }

    if(session.role==='representative'){
      const representative=(db.representatives||[]).find(r=>r.id===session.representativeId);
      if(!representative){
        setSession(null);
        showLogin('Conta de representante não encontrada.');
        return;
      }
      repDashboardPage();
      return;
    }

    const company=db.companies.find(c=>c.id===session.companyId);
    if(!company || companyStatus(company)!=='active'){
      setSession(null);
      showLogin('Acesso bloqueado ou vencido.');
      return;
    }

    prototypeAccessSelector();
  }

  supabaseClient.auth.onAuthStateChange((_event,authSession)=>{
    onlineUser=authSession?.user||null;
  });



  window.addEventListener('unhandledrejection',event=>{
    console.error('Erro não tratado:',event.reason);
  });

  window.addEventListener('error',event=>{
    console.error('Erro de execução:',event.error||event.message);
  });

  // Cópia de desenvolvimento: sincronização remota desativada por enquanto.

  window.addEventListener('beforeinstallprompt',(event)=>{
    event.preventDefault();
    deferredInstallPrompt=event;
    const button=document.querySelector('#installAppBtn');
    if(button) button.style.display='block';
  });

  window.addEventListener('appinstalled',()=>{
    deferredInstallPrompt=null;
    const button=document.querySelector('#installAppBtn');
    if(button) button.style.display='none';
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./service-worker.js?v=43',{updateViaCache:'none'}).then(reg=>reg.update()).catch(error=>{
        console.warn('Service Worker não registrado:',error);
      });
    });
  }

  initializeOnline().catch(error=>{
    console.error(error);
    showLogin(error.message||'Falha ao conectar ao banco online.');
  });
})();
</script>
</body>
</html>
