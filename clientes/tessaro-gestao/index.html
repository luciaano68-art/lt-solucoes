  function normalizeImportHeader(value){
    return String(value||'')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,' ');
  }

  function findImportColumn(headers, aliases){
    const normalized=headers.map(normalizeImportHeader);
    return normalized.findIndex(header=>aliases.some(alias=>header===alias || header.includes(alias)));
  }

  function parseCsvText(textValue){
    const rows=[];
    let row=[];
    let value='';
    let quoted=false;

    for(let i=0;i<textValue.length;i++){
      const char=textValue[i];
      const next=textValue[i+1];

      if(char==='"'){
        if(quoted && next==='"'){
          value+='"';
          i++;
        }else{
          quoted=!quoted;
        }
      }else if((char===',' || char===';' || char==='\t') && !quoted){
        row.push(value.trim());
        value='';
      }else if((char==='\n' || char==='\r') && !quoted){
        if(char==='\r' && next==='\n') i++;
        row.push(value.trim());
        if(row.some(cell=>cell!=='')) rows.push(row);
        row=[];
        value='';
      }else{
        value+=char;
      }
    }

    row.push(value.trim());
    if(row.some(cell=>cell!=='')) rows.push(row);
    return rows;
  }

  function bytesToUint32(bytes,offset){
    return (
      bytes[offset] |
      (bytes[offset+1]<<8) |
      (bytes[offset+2]<<16) |
      (bytes[offset+3]<<24)
    )>>>0;
  }

  function bytesToUint16(bytes,offset){
    return bytes[offset] | (bytes[offset+1]<<8);
  }

  async function unzipXlsx(buffer){
    const bytes=new Uint8Array(buffer);
    let eocd=-1;

    for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--){
      if(bytesToUint32(bytes,i)===0x06054b50){
        eocd=i;
        break;
      }
    }

    if(eocd<0) throw new Error('Arquivo Excel inválido.');

    const centralSize=bytesToUint32(bytes,eocd+12);
    const centralOffset=bytesToUint32(bytes,eocd+16);
    const files={};
    let pointer=centralOffset;
    const end=centralOffset+centralSize;

    while(pointer<end){
      if(bytesToUint32(bytes,pointer)!==0x02014b50) break;

      const method=bytesToUint16(bytes,pointer+10);
      const compressedSize=bytesToUint32(bytes,pointer+20);
      const uncompressedSize=bytesToUint32(bytes,pointer+24);
      const fileNameLength=bytesToUint16(bytes,pointer+28);
      const extraLength=bytesToUint16(bytes,pointer+30);
      const commentLength=bytesToUint16(bytes,pointer+32);
      const localOffset=bytesToUint32(bytes,pointer+42);
      const fileName=new TextDecoder().decode(
        bytes.slice(pointer+46,pointer+46+fileNameLength)
      );

      if(bytesToUint32(bytes,localOffset)!==0x04034b50){
        throw new Error('Estrutura interna do Excel inválida.');
      }

      const localNameLength=bytesToUint16(bytes,localOffset+26);
      const localExtraLength=bytesToUint16(bytes,localOffset+28);
      const dataStart=localOffset+30+localNameLength+localExtraLength;
      const compressed=bytes.slice(dataStart,dataStart+compressedSize);

      let data;
      if(method===0){
        data=compressed;
      }else if(method===8){
        if(typeof DecompressionStream==='undefined'){
          throw new Error('Este navegador não suporta a leitura offline de Excel. Use Chrome ou Edge atualizado.');
        }
        const stream=new Blob([compressed])
          .stream()
          .pipeThrough(new DecompressionStream('deflate-raw'));
        data=new Uint8Array(await new Response(stream).arrayBuffer());
      }else{
        throw new Error(`Método de compactação não suportado (${method}).`);
      }

      if(uncompressedSize && data.length!==uncompressedSize){
        // Some Excel writers include descriptors; the XML can still be valid.
      }

      files[fileName]=data;
      pointer+=46+fileNameLength+extraLength+commentLength;
    }

    return files;
  }

  function xmlText(files,path){
    const bytes=files[path];
    if(!bytes) return '';
    return new TextDecoder('utf-8').decode(bytes);
  }

  function excelColumnNumber(reference){
    const letters=String(reference||'').match(/[A-Z]+/i)?.[0]?.toUpperCase()||'A';
    let result=0;
    for(const letter of letters){
      result=result*26+(letter.charCodeAt(0)-64);
    }
    return result-1;
  }

  async function parseXlsxFile(file){
    const files=await unzipXlsx(await file.arrayBuffer());
    const parser=new DOMParser();

    const workbookXml=xmlText(files,'xl/workbook.xml');
    const workbookRelsXml=xmlText(files,'xl/_rels/workbook.xml.rels');
    if(!workbookXml) throw new Error('Planilha do Excel não encontrada.');

    const workbookDoc=parser.parseFromString(workbookXml,'application/xml');
    const firstSheet=workbookDoc.querySelector('sheet');
    if(!firstSheet) throw new Error('O arquivo não possui nenhuma aba.');

    const relId=
      firstSheet.getAttribute('r:id') ||
      firstSheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');

    let sheetPath='xl/worksheets/sheet1.xml';

    if(relId && workbookRelsXml){
      const relsDoc=parser.parseFromString(workbookRelsXml,'application/xml');
      const relationship=[...relsDoc.querySelectorAll('Relationship')]
        .find(rel=>rel.getAttribute('Id')===relId);

      if(relationship){
        let target=relationship.getAttribute('Target')||'worksheets/sheet1.xml';
        target=target.replace(/^\/+/,'');
        sheetPath=target.startsWith('xl/')?target:`xl/${target.replace(/^\.\//,'')}`;
      }
    }

    const sharedStrings=[];
    const sharedXml=xmlText(files,'xl/sharedStrings.xml');

    if(sharedXml){
      const sharedDoc=parser.parseFromString(sharedXml,'application/xml');
      sharedDoc.querySelectorAll('si').forEach(si=>{
        sharedStrings.push(
          [...si.querySelectorAll('t')].map(node=>node.textContent||'').join('')
        );
      });
    }

    const sheetXml=xmlText(files,sheetPath);
    if(!sheetXml) throw new Error('Não foi possível abrir a primeira aba da planilha.');

    const sheetDoc=parser.parseFromString(sheetXml,'application/xml');
    const rows=[];

    sheetDoc.querySelectorAll('sheetData > row').forEach(rowNode=>{
      const row=[];
      rowNode.querySelectorAll('c').forEach(cell=>{
        const index=excelColumnNumber(cell.getAttribute('r'));
        const type=cell.getAttribute('t');
        let value='';

        if(type==='inlineStr'){
          value=[...cell.querySelectorAll('is t')].map(node=>node.textContent||'').join('');
        }else{
          value=cell.querySelector('v')?.textContent||'';
          if(type==='s') value=sharedStrings[Number(value)]??'';
          if(type==='b') value=value==='1'?'Sim':'Não';
        }

        row[index]=String(value).trim();
      });

      while(row.length && row[row.length-1]===undefined) row.pop();
      if(row.some(cell=>String(cell??'').trim()!=='')) rows.push(row.map(cell=>cell??''));
    });

    return rows;
  }

  async function parseProductImportFile(file){
    const name=file.name.toLowerCase();

    if(name.endsWith('.xlsx')){
      return parseXlsxFile(file);
    }

    if(name.endsWith('.csv') || name.endsWith('.txt')){
      return parseCsvText(await file.text());
    }

    throw new Error('Selecione um arquivo .xlsx ou .csv.');
  }

  function downloadProductsImportTemplate(){

  function importProductRows(rows){
    if(!rows.length) throw new Error('A planilha está vazia.');

    const headers=rows[0].map(value=>String(value||'').trim());

    const productCol=findImportColumn(headers,['produto','nome do produto','item','descricao','descrição']);
    const categoryCol=findImportColumn(headers,['categoria','grupo']);
    const unitCol=findImportColumn(headers,['unidade','un','medida']);
    const codeCol=findImportColumn(headers,['codigo','código','codigo interno','código interno','sku']);
    const notesCol=findImportColumn(headers,['observacao','observação','obs','detalhes']);

    if(productCol<0){
      throw new Error('Não encontrei a coluna Produto. Use o modelo disponível no sistema.');
    }

    const summary={
      imported:0,
      skipped:0,
      categoriesCreated:0,
      errors:[]
    };

    rows.slice(1).forEach((row,rowIndex)=>{
      const productName=String(row[productCol]||'').trim();
      if(!productName) return;

      const categoryName=categoryCol>=0?String(row[categoryCol]||'').trim():'Sem categoria';
      const unit=unitCol>=0?String(row[unitCol]||'').trim().toUpperCase():'UN';
      const code=codeCol>=0?String(row[codeCol]||'').trim():'';
      const notes=notesCol>=0?String(row[notesCol]||'').trim():'';

      const duplicateName=db.products.some(product=>
        product.companyId===session.companyId &&
        product.name.trim().toLowerCase()===productName.toLowerCase()
      );

      const duplicateCode=code && db.products.some(product=>
        product.companyId===session.companyId &&
        String(product.code||'').trim().toLowerCase()===code.toLowerCase()
      );

      if(duplicateName || duplicateCode){
        summary.skipped++;
        summary.errors.push(`Linha ${rowIndex+2}: ${productName} já cadastrado.`);
        return;
      }

      let category=db.categories.find(item=>
        item.companyId===session.companyId &&
        item.name.trim().toLowerCase()===(categoryName||'Sem categoria').toLowerCase()
      );

      if(!category){
        category={
          id:uid('cat'),
          companyId:session.companyId,
          name:categoryName||'Sem categoria'
        };
        db.categories.push(category);
        summary.categoriesCreated++;
      }

      db.products.push({
        id:uid('prod'),
        companyId:session.companyId,
        name:productName,
        categoryId:category.id,
        unit:unit||'UN',
        code,
        notes
      });

      summary.imported++;
    });

    save();
    return summary;
  }

  async function copyText(value){
    try{
      await navigator.clipboard.writeText(value);
      return true;
    }catch{
      const input=document.createElement('textarea');
      input.value=value;
      input.style.position='fixed';
      input.style.opacity='0';
      document.body.appendChild(input);
      input.select();
      const ok=document.execCommand('copy');
      input.remove();
      return ok;
    }
  }




  function requestedOffer(response,productName){
    const offers=responseOffers(response);
    return offers.find(offer=>offer.requested===true) ||
      offers.find(offer=>offer.brand===productName) ||
      offers[0] ||
      null;
  }

  function alternativeOffers(response,productName){
    const requested=requestedOffer(response,productName);
    return responseOffers(response).filter(offer=>offer!==requested);
  }

  function collectSimpleOffers(prefix,productId,productName){
    const offers=[];
    const requestedPrice=moneyInputValue(
      document.querySelector(`[data-${prefix}-requested-price="${productId}"]`)
    );

    if(requestedPrice>0){
      offers.push({
        brand:productName,
        price:requestedPrice,
        requested:true
      });
    }

    document.querySelectorAll(`[data-${prefix}-alt-row="${productId}"]`).forEach(row=>{
      const brand=row.querySelector(`[data-${prefix}-alt-brand]`)?.value.trim()||'';
      const price=moneyInputValue(row.querySelector(`[data-${prefix}-alt-price]`));

      if(brand && price>0){
        offers.push({
          brand,
          price,
          requested:false
        });
      }
    });

    return offers;
  }

  function addAlternativeRow(prefix,productId,brand='',price=0){
    const container=document.querySelector(`[data-${prefix}-alt-list="${productId}"]`);
    if(!container) return;

    const row=document.createElement('div');
    row.className='simple-alt-row';
    row.dataset[`${prefix}AltRow`]=productId;
    row.setAttribute(`data-${prefix}-alt-row`,productId);

    row.innerHTML=`
      <input data-${prefix}-alt-brand placeholder="Outra marca / produto" value="${esc(brand)}">
      <input
        data-money
        data-raw-value="${Number(price||0)}"
        data-${prefix}-alt-price
        value="${Number(price||0)}"
        inputmode="numeric"
        placeholder="R$ 0,00">
      <button class="btn danger" type="button" data-remove-alt>Excluir</button>
    `;

    container.appendChild(row);
    bindMoneyMasks(row);
    row.querySelector('[data-remove-alt]').onclick=()=>row.remove();
  }

  function responseOffers(response){
    const offers=Array.isArray(response?.offers)
      ? response.offers
          .map(offer=>({
            brand:String(offer?.brand||'').trim(),
            price:Number(offer?.price||0)
          }))
          .filter(offer=>offer.brand && offer.price>0)
      : [];

    if(offers.length) return offers;

    const legacyPrice=Number(response?.price||0);
    const legacyBrand=String(response?.brand||'').trim();
    return legacyPrice>0
      ? [{brand:legacyBrand||'Sem marca informada',price:legacyPrice}]
      : [];
  }

  function cheapestOffer(response){
    const offers=responseOffers(response);
    return offers.length
      ? offers.reduce((best,current)=>current.price<best.price?current:best)
      : null;
  }

  function collectBrandOffers(prefix,productId,predefinedBrands){
    const offers=[];

    (predefinedBrands||[]).slice(0,5).forEach((brand,index)=>{
      const input=document.querySelector(`[data-${prefix}-brand-price="${productId}|${index}"]`);
      const price=moneyInputValue(input);
      if(price>0) offers.push({brand,price});
    });

    const otherBrand=document.querySelector(`[data-${prefix}-other-brand="${productId}"]`)?.value.trim()||'';
    const otherPrice=moneyInputValue(
      document.querySelector(`[data-${prefix}-other-price="${productId}"]`)
    );

    if(otherBrand && otherPrice>0){
      offers.push({brand:otherBrand,price:otherPrice});
    }

    return offers;
  }

  function publicSelectedBrand(productId){
    const selected=document.querySelector(
      `input[name="public_brand_${productId}"]:checked`
    );

    if(selected){
      if(selected.value==='__other__'){
        return document.querySelector(`[data-public-brand-other="${productId}"]`)?.value.trim()||'';
      }
      return selected.value;
    }

    return document.querySelector(`[data-public-brand-other="${productId}"]`)?.value.trim()||'';
  }

  function supplierHistoryPage(supplierId){
    const supplier=companyData(db.suppliers).find(s=>s.id===supplierId);
    if(!supplier){suppliersPage();return;}

    const quotations=companyData(db.quotations).filter(q=>q.suppliers.includes(supplier.id));
    const answered=quotations.filter(q=>{
      const responses=q.responses?.[supplier.id]||{};
      return q.items.some(item=>{
        const response=responses[item.productId];
        return response && (response.unavailable || Number(response.price||0)>0);
      });
    });

    const orders=companyData(db.orders).filter(o=>o.supplierId===supplier.id);
    const totalPurchased=orders.reduce((sum,o)=>sum+Number(o.total||0),0);

    let victories=0;
    quotations.forEach(q=>{
      q.items.forEach(item=>{
        const valid=q.suppliers.map(id=>({
          id,
          price:Number(q.responses?.[id]?.[item.productId]?.price||0),
          unavailable:Boolean(q.responses?.[id]?.[item.productId]?.unavailable)
        })).filter(x=>!x.unavailable && x.price>0);
        if(valid.length){
          const winner=valid.reduce((a,b)=>b.price<a.price?b:a);
          if(winner.id===supplier.id) victories++;
        }
      });
    });

    const respondedItems=answered.reduce((sum,q)=>sum+q.items.filter(item=>{
      const r=q.responses?.[supplier.id]?.[item.productId];
      return r && (r.unavailable || Number(r.price||0)>0);
    }).length,0);

    const unavailableItems=answered.reduce((sum,q)=>sum+q.items.filter(item=>
      Boolean(q.responses?.[supplier.id]?.[item.productId]?.unavailable)
    ).length,0);

    const lastOrder=orders.slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];
    const rep=supplier.representativeId
      ? (db.representatives||[]).find(r=>r.id===supplier.representativeId)
      : null;
    const lastVisit=rep
      ? (db.visits||[]).filter(v=>v.representativeId===rep.id && v.companyId===session.companyId && v.status==='completed')
          .sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]
      : null;

    layout(`
      <div class="page-head">
        <div>
          <h1>${esc(supplier.name)}</h1>
          <p class="muted">Histórico comercial e desempenho deste fornecedor.</p>
        </div>
        <button class="btn secondary" id="backSupplierHistory">Voltar</button>
      </div>

      <section class="grid metrics">
        <div class="card metric blue"><div class="metric-icon">$</div><span>Total comprado</span><strong>${money(totalPurchased)}</strong><small>em ${orders.length} pedido(s)</small></div>
        <div class="card metric green"><div class="metric-icon">✓</div><span>Cotações respondidas</span><strong>${answered.length}</strong><small>${quotations.length?Math.round(answered.length/quotations.length*100):0}% de resposta</small></div>
        <div class="card metric purple"><div class="metric-icon">★</div><span>Itens vencedores</span><strong>${victories}</strong><small class="alt">melhor preço</small></div>
        <div class="card metric teal"><div class="metric-icon">!</div><span>Itens indisponíveis</span><strong>${unavailableItems}</strong><small>${respondedItems?Math.round(unavailableItems/respondedItems*100):0}% das respostas</small></div>
      </section>

      <section class="card">
        <div class="form-grid">
          <div><label>Última compra</label><input value="${lastOrder?formatDateBR(lastOrder.createdAt):'Nenhuma'}" disabled></div>
          <div><label>Última visita</label><input value="${lastVisit?formatDateBR(lastVisit.date):'Não registrada'}" disabled></div>
          <div><label>Representante</label><input value="${esc(rep?.name||supplier.contact||'-')}" disabled></div>
          <div><label>Status favorito</label><input value="${supplier.favorite?'Fornecedor favorito':'Fornecedor comum'}" disabled></div>
        </div>
      </section>
    `,'suppliers');

    document.querySelector('#backSupplierHistory').onclick=suppliersPage;
  }

      const previousStatus=quotation.status;
      quotation.status='closed';

      button.disabled=true;
      button.textContent='Encerrando...';

      try{
        await saveRemoteNow();
        await quotationsPage();
      }catch(error){
        quotation.status=previousStatus;
        localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
        alert('Não foi possível encerrar a cotação.');
        button.disabled=false;
        button.textContent='Encerrar';
      }
    });
    document.querySelectorAll('[data-del-q]').forEach(button=>button.onclick=async()=>{
      const quotationId=button.dataset.delQ;
      const quotation=db.quotations.find(q=>q.id===quotationId);

      if(!quotation){
        alert('Cotação não encontrada.');
        return;
      }

      const confirmed=confirm(
        `Excluir definitivamente a cotação "${quotation.name}"?\n\n`+
        `As respostas dos fornecedores desta cotação também serão apagadas. `+
        `Pedidos já gerados serão preservados.`
      );

      if(!confirmed) return;

      const backup=JSON.parse(JSON.stringify(db.quotations));
      button.disabled=true;
      button.textContent='Excluindo...';

      db.quotations=db.quotations.filter(q=>q.id!==quotationId);

      try{
        await saveRemoteNow();
        alert('Cotação excluída com sucesso.');
        await quotationsPage();
      }catch(error){
        db.quotations=backup;
        localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
        console.error('Erro ao excluir cotação:',error);
        alert('Não foi possível excluir a cotação. Verifique a conexão e tente novamente.');
        button.disabled=false;
        button.textContent='Excluir';
      }
    });
  }

  function editQuotationPage(quotationId){
    const quotation=db.quotations.find(
      q=>q.id===quotationId && q.companyId===session.companyId
    );

    if(!quotation){
      alert('Cotação não encontrada.');
      quotationsPage();
      return;
    }

    if(quotation.status==='closed'){
      alert('Esta cotação está encerrada. Reabra ou crie uma nova cotação para alterar os itens.');
      quotationsPage();
      return;
    }

    const products=companyData(db.products);
    const suppliers=companyData(db.suppliers);
    const categories=companyData(db.categories)
      .sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));

    const originalItems=new Map(
      (quotation.items||[]).map(item=>[
        item.productId,
        JSON.parse(JSON.stringify(item))
      ])
    );

    const selected=new Map(
      (quotation.items||[]).map(item=>[
        item.productId,
        JSON.parse(JSON.stringify(item))
      ])
    );

    let activeCategory='';

    const renderResults=()=>{
      const search=(document.querySelector('#editQuoteProductSearch')?.value||'')
        .trim()
        .toLowerCase();

      const available=products
        .filter(product=>{
          const category=categories.find(c=>c.id===product.categoryId);
          const haystack=`${product.name} ${category?.name||''}`.toLowerCase();
          const matchesSearch=!search||haystack.includes(search);
          const matchesCategory=!activeCategory||product.categoryId===activeCategory;
          return matchesSearch&&matchesCategory&&!selected.has(product.id);
        })
        .sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));

      const result=document.querySelector('#editQuoteProductResults');
      if(!result) return;

      result.innerHTML=available.map(product=>{
        const category=categories.find(c=>c.id===product.categoryId);
        return `<div class="product-result">
          <div>
            <strong>${esc(product.name)}</strong><br>
            <span class="muted">${esc(category?.name||'Sem categoria')} · ${esc(product.unit||'')}</span>
          </div>
          <button class="btn primary" type="button" data-edit-add-product="${product.id}">
            Adicionar
          </button>
        </div>`;
      }).join('')||`<div class="selected-empty">Nenhum produto encontrado.</div>`;

      const count=document.querySelector('#editQuoteSearchCount');
      if(count) count.textContent=`${available.length} produto(s) encontrado(s)`;

      document.querySelectorAll('[data-edit-add-product]').forEach(button=>{
        button.onclick=()=>{
          const product=products.find(p=>p.id===button.dataset.editAddProduct);
          if(!product) return;

          selected.set(product.id,{
            productId:product.id,
            quantity:1,
            requestedPackQty:0,
            revision:1,
            changedAt:new Date().toISOString(),
            changeNote:'Item adicionado na edição da cotação'
          });

          renderResults();
          renderSelected();
        };
      });
    };

    const renderSelected=()=>{
      const container=document.querySelector('#editSelectedProducts');
      if(!container) return;

      const items=[...selected.values()];

      container.innerHTML=items.map(item=>{
        const product=products.find(p=>p.id===item.productId);
        const category=categories.find(c=>c.id===product?.categoryId);

        return `<article class="selected-product">
          <div class="page-head" style="margin-bottom:10px">
            <div>
              <strong>${esc(product?.name||'Produto')}</strong><br>
              <span class="muted">${esc(category?.name||'Sem categoria')} · ${esc(product?.unit||'')}</span>
            </div>

            <div>

              <input
                type="number"
                min="0.001"
                step="0.001"
                data-edit-qty="${item.productId}"
                value="${Number(item.quantity||0)}">
            </div>

            <div>
              <label>Quantidade por fardo/caixa <span class="muted">(opcional)</span></label>
              <input

                step="0.001"
                data-edit-pack="${item.productId}"

              <label>Mensagem sobre a alteração</label>
              <input
                data-edit-note="${item.productId}"
                value="${esc(item.changeNote||'')}"
                placeholder="Ex.: quantidade alterada ou item incluído">
            </div>
          </div>
        </article>`;
      }).join('')||`<div class="selected-empty">Nenhum item selecionado.</div>`;

      const count=document.querySelector('#editSelectedCount');
      if(count) count.textContent=`${items.length} item(ns) selecionado(s)`;

      document.querySelectorAll('[data-edit-remove-product]').forEach(button=>{
        button.onclick=()=>{
          selected.delete(button.dataset.editRemoveProduct);
          renderResults();

        input.oninput=()=>{
          const item=selected.get(input.dataset.editQty);
          if(item) item.quantity=Number(input.value||0);

          const item=selected.get(input.dataset.editPack);
          if(item) item.requestedPackQty=Number(input.value||0);
        };
      });

      document.querySelectorAll('[data-edit-note]').forEach(input=>{
        input.oninput=()=>{
          const item=selected.get(input.dataset.editNote);
          if(item) item.changeNote=input.value;
        };
      });

          <div class="form-grid">
            <div>
              <label>Pesquisar produto</label>
              <input id="editQuoteProductSearch" placeholder="Digite o nome do produto">
            </div>
            <div>
              <label>Filtrar por categoria</label>
              <select id="editQuoteCategoryFilter">
                <option value="">Todas as categorias</option>
                ${categories.map(category=>`
                  <option value="${category.id}">${esc(category.name)}</option>
                `).join('')}
              </select>

      const submitButton=event.submitter;
      if(submitButton){
        submitButton.disabled=true;
        submitButton.textContent='Salvando alterações...';
      }

      const items=[...selected.values()];
      const selectedSuppliers=suppliers
        .filter(supplier=>document.querySelector(`[data-edit-supplier="${supplier.id}"]`)?.checked)
        .map(supplier=>supplier.id);

      if(!items.length){
        alert('A cotação precisa ter pelo menos um item.');
        if(submitButton){
          submitButton.disabled=false;
          submitButton.textContent='Salvar alterações';
        }
        return;
      }

      if(items.some(item=>Number(item.quantity)<=0)){
        alert('Informe uma quantidade válida para todos os itens.');
        if(submitButton){
          submitButton.disabled=false;
          submitButton.textContent='Salvar alterações';
        }
        return;
      }

      if(!selectedSuppliers.length){
        alert('Selecione pelo menos um fornecedor.');
        if(submitButton){
          submitButton.disabled=false;
          submitButton.textContent='Salvar alterações';
        }
        return;
      }

      const now=new Date().toISOString();

      const updatedItems=items.map(item=>{
        const original=originalItems.get(item.productId);

        if(!original){
          return {
            ...item,
            revision:1,
            changedAt:now,
            changeNote:item.changeNote||'Item adicionado na edição da cotação'
          };
        }

        const changed=
          Number(original.quantity)!==Number(item.quantity) ||
          Number(original.requestedPackQty||0)!==Number(item.requestedPackQty||0);

        return {
          ...item,
          revision:changed?Number(original.revision||1)+1:Number(original.revision||1),
          changedAt:changed?now:(original.changedAt||quotation.createdAt),
          changeNote:changed
            ? (item.changeNote||'Item alterado pelo comprador')
            : (original.changeNote||item.changeNote||'')
        };
      });

      const removedProductIds=[...originalItems.keys()]
        .filter(productId=>!selected.has(productId));

      quotation.name=document.querySelector('#editQuoteName').value.trim();
      quotation.deadline=document.querySelector('#editQuoteDeadline').value||null;
      quotation.items=updatedItems;
      quotation.suppliers=selectedSuppliers;
      quotation.updatedAt=now;

      quotation.responses=quotation.responses||{};

      removedProductIds.forEach(productId=>{
        Object.values(quotation.responses).forEach(responseGroup=>{
          if(responseGroup&&typeof responseGroup==='object'){
            delete responseGroup[productId];
          }
        });

        if(quotation.allocations){
          delete quotation.allocations[productId];
        }
      });

      Object.keys(quotation.responses).forEach(supplierId=>{
        if(!selectedSuppliers.includes(supplierId)){
          delete quotation.responses[supplierId];
        }
      });

      try{
        await saveRemoteNow();

        const {data:verification,error:verificationError}=await supabaseClient
          .from('platform_state')
          .select('data')
          .eq('id','main')
          .single();

        if(verificationError) throw verificationError;

        const savedQuotation=(verification?.data?.quotations||[])
          .find(item=>item.id===quotation.id);

        if(
          !savedQuotation ||
          savedQuotation.name!==quotation.name ||
          Number(savedQuotation.items?.length||0)!==Number(quotation.items.length)
        ){
          throw new Error('O Supabase não confirmou a alteração da cotação.');
        }

        db={
          ...db,
          ...verification.data
        };
        localStorage.setItem(STORAGE_KEY,JSON.stringify(db));

        alert('Cotação salva com sucesso.');
        await quotationsPage();
      }catch(error){
        console.error('Erro ao editar cotação:',error);
        alert(
          'Não foi possível salvar a cotação. '+
          (error?.message||'Verifique a conexão e tente novamente.')
        );

        if(submitButton){
          submitButton.disabled=false;
          submitButton.textContent='Salvar alterações';
        }
      }
    };

    renderResults();
    renderSelected();
  }

  function lastHistoricalPrice(productId,currentQuotationId,supplierId=null){
    const current=db.quotations.find(q=>q.id===currentQuotationId);
    const currentDate=new Date(current?.createdAt||0);

    const candidates=(db.quotations||[])
      .filter(q=>q.id!==currentQuotationId)
      .filter(q=>q.companyId===session.companyId)
      .filter(q=>new Date(q.createdAt||0)<=currentDate)
      .sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));

    for(const quote of candidates){
      const item=(quote.items||[]).find(i=>i.productId===productId);
      if(!item) continue;

      const supplierIds=supplierId?[supplierId]:(quote.suppliers||[]);
      for(const sid of supplierIds){
        const response=quote.responses?.[sid]?.[productId];
        const price=Number(response?.price||0);
        if(price>0 && !response?.unavailable){
          return {
            price,
            quotationId:quote.id,
            quotationName:quote.name,
            date:quote.createdAt,
            supplierId:sid
          };
        }
      }
    }
    return null;
  }

  function priceIncreaseAlert(productId,currentQuotationId,supplierId,currentPrice){
    const previous=lastHistoricalPrice(productId,currentQuotationId,supplierId);
    if(!previous){
      return `<div class="price-history-neutral">Primeira cotação — sem preço anterior para comparação.</div>`;
    }

    const current=Number(currentPrice||0);
    const difference=current-previous.price;
    const percent=previous.price>0?(difference/previous.price)*100:0;

    if(percent>=10){
      return `<div class="price-increase-alert">
        <strong>⚠️ Aumento de preço detectado</strong>
        <span>Anterior: ${money(previous.price)} · Atual: ${money(current)}</span>
        <span>Aumento: ${money(difference)} (${percent.toFixed(2).replace('.',',')}%)</span>
        <small>Comparado com ${esc(previous.quotationName||'cotação anterior')} de ${formatDateBR(previous.date)}</small>
      </div>`;
    }

    if(percent>0){
      return `<div class="price-history-neutral">
        Preço anterior: ${money(previous.price)} · aumento de ${percent.toFixed(2).replace('.',',')}%
      </div>`;
    }

    return `<div class="price-history-good">
      Preço anterior: ${money(previous.price)} · sem aumento relevante
    </div>`;
  }

  async function quotationProposalsPage(quotationId){
    try{
      await loadRemoteState();
    }catch(error){
      console.warn('Não foi possível atualizar as propostas:',error);
    }

    const q=db.quotations.find(x=>x.id===quotationId && x.companyId===session.companyId);
    if(!q){quotationsPage();return;}

    const products=companyData(db.products);
    const suppliers=companyData(db.suppliers);
    q.responses=q.responses||{};
    q.allocations=q.allocations||{};
    q.selectedPaymentTerms=q.selectedPaymentTerms||{};
    q.selectedBrands=q.selectedBrands||{};

    q.suppliers.forEach(supplierId=>{
      const options=q.responses?.[supplierId]?._meta?.paymentOptions||[];
      const current=q.selectedPaymentTerms[supplierId];

      if(options.length===1){
        q.selectedPaymentTerms[supplierId]=options[0];
      }else if(current && !options.includes(current)){
        q.selectedPaymentTerms[supplierId]='';
      }
    });

    const rows=q.items.map((item,index)=>{
      const product=products.find(p=>p.id===item.productId);

      const validPrices=q.suppliers.flatMap(supplierId=>{
        const response=q.responses?.[supplierId]?.[item.productId]||{};
        if(response.unavailable) return [];
        return responseOffers(response).map(offer=>({
          supplierId,
          brand:offer.brand,
          price:Number(offer.price||0),
          unavailable:false
        }));

    const updateSummaries=()=>{
      q.items.forEach(item=>{
        const total=q.suppliers.reduce((sum,supplierId)=>{
          const input=document.querySelector(`[data-allocation="${item.productId}|${supplierId}"]`);
          return sum+Number(input?.value||0);
        },0);
        const summary=document.querySelector(`[data-allocation-summary="${item.productId}"]`);
        if(summary){
          const requested=Number(item.quantity);
          const extra=total-requested;
          summary.textContent=extra>0
            ? `Alocado: ${total} de ${requested} · ${extra} a mais`
            : `Alocado: ${total} de ${requested}`;
          summary.className=extra>0?'allocation-warning':'allocation-ok';
        }
      });
    };

    const collect=async()=>{
      q.allocations=q.allocations||{};
      q.items.forEach(item=>{
        q.allocations[item.productId]=q.allocations[item.productId]||{};
        q.suppliers.forEach(supplierId=>{
          const input=document.querySelector(`[data-allocation="${item.productId}|${supplierId}"]`);
          q.allocations[item.productId][supplierId]=Number(input?.value||0);

      });
      q.suppliers.forEach(supplierId=>{
        const options=q.responses?.[supplierId]?._meta?.paymentOptions||[];
        const select=document.querySelector(`[data-proposal-payment="${supplierId}"]`);

        if(options.length===1){
          q.selectedPaymentTerms[supplierId]=options[0];
        }else if(select){
          q.selectedPaymentTerms[supplierId]=select.value;
        }
      });

      q.items.forEach(item=>{
        q.selectedBrands[item.productId]=q.selectedBrands[item.productId]||{};
        q.suppliers.forEach(supplierId=>{
          const selected=document.querySelector(
            `input[data-brand-choice="${item.productId}|${supplierId}"]:checked`
          );
          if(selected) q.selectedBrands[item.productId][supplierId]=selected.value;
        });
      });
      const suppliersWithPurchase=q.suppliers.filter(supplierId=>
        q.items.some(item=>Number(q.allocations?.[item.productId]?.[supplierId]||0)>0)
      );

      const missingPayment=suppliersWithPurchase.find(supplierId=>
        !(q.selectedPaymentTerms?.[supplierId]||'').trim()
      );

      if(missingPayment){
        const supplier=suppliers.find(item=>item.id===missingPayment);
        throw new Error(`Escolha a condição de pagamento da proposta de ${supplier?.name||'fornecedor'}.`);
      }

      q.updatedAt=new Date().toISOString();
      await saveRemoteNow();
    };

    document.querySelectorAll('[data-proposal-payment]').forEach(select=>{
      select.onchange=()=>{
        q.selectedPaymentTerms[select.dataset.proposalPayment]=select.value;
      };
    });

    document.querySelectorAll('[data-allocation]').forEach(input=>input.oninput=updateSummaries);
    document.querySelector('#backQuotes').onclick=quotationsPage;
    document.querySelector('#saveAllocations').onclick=async()=>{
      const button=document.querySelector('#saveAllocations');
      button.disabled=true;
      button.textContent='Salvando...';

      try{
        await collect();
        alert('Distribuição de quantidades salva.');
        await quotationProposalsPage(q.id);
      }catch(error){
        alert('Não foi possível salvar a distribuição: '+(error?.message||'erro desconhecido'));
        button.disabled=false;
        button.textContent='Salvar distribuição';
      }
    };
    document.querySelector('#generateOrders').onclick=async()=>{
      try{
        await collect();
        await generateOrdersFromQuotation(q.id);
      }catch(error){
        alert('Não foi possível preparar os pedidos: '+(error?.message||'erro desconhecido'));
      }
    };

    updateSummaries();
  }

  async function generateOrdersFromQuotation(quotationId){
    const q=db.quotations.find(x=>x.id===quotationId && x.companyId===session.companyId);
    if(!q){alert('Cotação não encontrada.');return;}

    const suppliers=companyData(db.suppliers);
    const products=companyData(db.products);
    q.responses=q.responses||{};
    q.allocations=q.allocations||{};

    const grouped={};
    const errors=[];
    const overbuyItems=[];

    q.items.forEach(item=>{
      const product=products.find(p=>p.id===item.productId);
      const allocations=q.allocations[item.productId]||{};
      const totalAllocated=q.suppliers.reduce((sum,supplierId)=>sum+Number(allocations[supplierId]||0),0);

      if(totalAllocated>Number(item.quantity)){
        overbuyItems.push({
          name:product?.name||'Produto',
          requested:Number(item.quantity),
          allocated:totalAllocated
        });
      }

      if(totalAllocated===0){
        q.unpurchasedItems=q.unpurchasedItems||[];
        if(!q.unpurchasedItems.includes(item.productId)) q.unpurchasedItems.push(item.productId);
        return;
      }

      q.unpurchasedItems=(q.unpurchasedItems||[]).filter(id=>id!==item.productId);

      q.suppliers.forEach(supplierId=>{
        const quantity=Number(allocations[supplierId]||0);
        if(quantity<=0) return;

        const response=q.responses?.[supplierId]?.[item.productId]||{};
        const offers=responseOffers(response);
        const chosenBrand=q.selectedBrands?.[item.productId]?.[supplierId]||offers[0]?.brand||'';
        const chosenOffer=offers.find(offer=>offer.brand===chosenBrand)||offers[0]||null;

        if(response.unavailable || !chosenOffer || Number(chosenOffer.price||0)<=0){
          errors.push(`${product?.name||'Produto'}: fornecedor sem preço disponível`);
          return;
        }

        grouped[supplierId]=grouped[supplierId]||[];
        grouped[supplierId].push({
          productId:item.productId,
          quantity,
          unitPrice:Number(chosenOffer.price),
          total:Number(chosenOffer.price)*quantity,
          brand:chosenOffer.brand||'',
          packQty:Number(response.packQty||0),
          availableQty:Number(response.availableQty||0),
          deliveryStart:q.responses?.[supplierId]?._meta?.deliveryStart||'',
          deliveryEnd:q.responses?.[supplierId]?._meta?.deliveryEnd||'',
          priceValidUntil:q.responses?.[supplierId]?._meta?.priceValidUntil||'',
          paymentTerms:q.selectedPaymentTerms?.[supplierId] ||
            q.responses?.[supplierId]?._meta?.paymentOptions?.[0] || ''
        });
      });
    });

    if(errors.length){
      alert('Corrija antes de gerar os pedidos:\n\n'+errors.join('\n'));
      return;
    }

    if(!Object.keys(grouped).length){
      alert('Nenhum item foi distribuído para compra.');
      return;
    }

    if(overbuyItems.length){
      const details=overbuyItems
        .map(item=>`${item.name}: solicitado ${item.requested}, comprando ${item.allocated}`)
        .join('\n');

      const confirmed=confirm(
        'ATENÇÃO: você está comprando uma quantidade maior do que a solicitada na cotação.\n\n'+
        details+
        '\n\nEstá ciente e deseja continuar para aproveitar o preço?'
      );

      if(!confirmed) return;
    }

    const existing=companyData(db.orders).filter(o=>o.quotationId===q.id);
    if(existing.length && !confirm('Já existem pedidos desta cotação. Deseja substituí-los pelas quantidades atuais?')) return;

    db.orders=db.orders.filter(o=>!(o.companyId===session.companyId && o.quotationId===q.id));

    Object.entries(grouped).forEach(([supplierId,items])=>{
      db.orders.push({
        id:uid('order'),
        companyId:session.companyId,
        quotationId:q.id,
        quotationName:q.name,
        supplierId,
        createdAt:new Date().toISOString(),
        status:'new',
        viewedAt:null,
        launchedAt:null,
        items,
        total:items.reduce((sum,item)=>sum+item.total,0),
        selectedPaymentTerm:q.selectedPaymentTerms?.[supplierId] ||
          q.responses?.[supplierId]?._meta?.paymentOptions?.[0] || ''
      });
    });

    q.status='closed';
    q.ordersGeneratedAt=new Date().toISOString();
    q.updatedAt=new Date().toISOString();
    await saveRemoteNow();

    const supplierNames=Object.keys(grouped).map(id=>suppliers.find(s=>s.id===id)?.name||'Fornecedor');
    const skipped=(q.unpurchasedItems||[]).length;
    alert('Pedidos gerados para: '+supplierNames.join(', ')+'.'+(skipped?` ${skipped} item(ns) ficaram sem compra.`:''));
    ordersPage();
  }


  function pdfSafeText(value){
    const replacements={
      '–':'-','—':'-','“':'"','”':'"','‘':"'",'’':"'",'…':'...',
      '•':'-','º':'o','ª':'a'
    };

    return String(value??'')
      .split('')
      .map(char=>replacements[char]??char)
      .join('')
      .replace(/[^\x20-\xFF]/g,'?');
  }

  function pdfEscapeText(value){
    return pdfSafeText(value)
      .replace(/\\/g,'\\\\')
      .replace(/\(/g,'\\(')
      .replace(/\)/g,'\\)');
  }

  function pdfWrapText(value,maxLength=86){
    const words=pdfSafeText(value).split(/\s+/).filter(Boolean);
    const lines=[];
    let line='';

    words.forEach(word=>{
      const candidate=line?`${line} ${word}`:word;
      if(candidate.length>maxLength && line){
        lines.push(line);
        line=word;
      }else{
        line=candidate;
      }
    });

    if(line) lines.push(line);
    return lines.length?lines:[''];
  }

  function buildSimplePdf(title,lines){
    const pageLineLimit=44;
    const allLines=[
      {text:title,bold:true,size:16},
      {text:'',size:11},
      ...lines
    ];

    const pages=[];
    for(let i=0;i<allLines.length;i+=pageLineLimit){
      pages.push(allLines.slice(i,i+pageLineLimit));
    }

    const objects=[];
    const addObject=(content)=>{
      objects.push(content);
      return objects.length;
    };

    const catalogId=addObject('');
    const pagesId=addObject('');
    const fontRegularId=addObject('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const fontBoldId=addObject('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pageIds=[];

    pages.forEach(pageLines=>{
      const commands=['BT','40 800 Td'];

      pageLines.forEach((line,index)=>{
        const size=Number(line.size||11);
        const font=line.bold?'/F2':'/F1';
        if(index>0) commands.push('0 -17 Td');
        commands.push(`${font} ${size} Tf`);
        commands.push(`(${pdfEscapeText(line.text)}) Tj`);
      });

      commands.push('ET');
      const stream=commands.join('\n');
      const contentId=addObject(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
      const pageId=addObject(
        `<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595 842] `+
        `/Resources << /Font << /F1 ${fontRegularId} 0 R /F2 ${fontBoldId} 0 R >> >> `+
        `/Contents ${contentId} 0 R >>`
      );
      pageIds.push(pageId);
    });

    objects[catalogId-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
    objects[pagesId-1]=`<< /Type /Pages /Kids [${pageIds.map(id=>`${id} 0 R`).join(' ')}] /Count ${pageIds.length} >>`;

    let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    const offsets=[0];

    objects.forEach((object,index)=>{
      offsets[index+1]=pdf.length;
      pdf+=`${index+1} 0 obj\n${object}\nendobj\n`;
    });

    const xrefOffset=pdf.length;
    pdf+=`xref\n0 ${objects.length+1}\n`;
    pdf+='0000000000 65535 f \n';

    for(let i=1;i<=objects.length;i++){
      pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
    }

    pdf+=`trailer\n<< /Size ${objects.length+1} /Root ${catalogId} 0 R >>\n`;
    pdf+=`startxref\n${xrefOffset}\n%%EOF`;

    const bytes=new Uint8Array(pdf.length);
    for(let i=0;i<pdf.length;i++) bytes[i]=pdf.charCodeAt(i)&255;
    return new Blob([bytes],{type:'application/pdf'});
  }

      commands.push(textCmd('PRODUTO',margin+8,tableTop+8,8,true,'1 1 1'));
      commands.push(textCmd('MARCA',278,tableTop+8,8,true,'1 1 1'));
      commands.push(textCmd('QTD.',380,tableTop+8,8,true,'1 1 1'));
      commands.push(textCmd('UNITARIO',438,tableTop+8,8,true,'1 1 1'));
      commands.push(textCmd('TOTAL',514,tableTop+8,8,true,'1 1 1'));

      let y=tableTop-8;
      pageItems.forEach((item,rowIndex)=>{
        const productLines=wrap(`${item.index}. ${item.product}`,31).slice(0,2);
        const rowHeight=productLines.length>1?48:40;
        y-=rowHeight;

        if(rowIndex%2===0){
          commands.push('0.975 0.98 0.99 rg');
          commands.push(`${margin} ${y} ${pageWidth-margin*2} ${rowHeight} re f`);
        }

        commands.push('0.87 0.89 0.92 RG');
        commands.push(`${margin} ${y} ${pageWidth-margin*2} ${rowHeight} re S`);

        commands.push(textCmd(productLines[0],margin+8,y+rowHeight-16,9,true));
        if(productLines[1]){
          commands.push(textCmd(productLines[1],margin+8,y+rowHeight-29,8,false,'0.25 0.28 0.33'));
        }
        if(item.packQty){
          commands.push(textCmd(`Caixa/fardo: ${item.packQty}`,margin+8,y+7,7,false,'0.42 0.46 0.52'));
        }

        commands.push(textCmd(item.brand,278,y+rowHeight/2-3,8,false));
        commands.push(textCmd(`${item.quantity} ${item.unit}`,380,y+rowHeight/2-3,8,true));
        commands.push(textCmd(money(item.unitPrice),438,y+rowHeight/2-3,8,false));
        commands.push(textCmd(money(item.total),514,y+rowHeight/2-3,8,true));
      });

      // Total only on final page
      if(pageIndex===pages.length-1){
        const totalY=Math.max(bottomMargin+55,y-52);
        commands.push('0.025 0.122 0.286 rg');
        commands.push(`370 ${totalY} 187 42 re f`);
        commands.push(textCmd('TOTAL DO PEDIDO',382,totalY+25,8,true,'0.7 0.78 0.88'));
        commands.push(textCmd(money(order.total),382,totalY+8,16,true,'1 1 1'));

        if(order.buyerNotes){
          const notes=wrap(`Observacoes: ${order.buyerNotes}`,80).slice(0,2);
          commands.push(textCmd(notes[0],margin,totalY+26,8,true,'0.22 0.25 0.3'));
          if(notes[1]) commands.push(textCmd(notes[1],margin,totalY+13,8,false,'0.22 0.25 0.3'));
        }
      }

      // Footer
      commands.push('0.82 0.84 0.87 RG');
      commands.push(`${margin} 34 ${pageWidth-margin*2} 0 l S`);
      commands.push(textCmd('Documento gerado pelo Tessaro Cotacoes.',margin,20,7,false,'0.45 0.48 0.53'));
      commands.push(textCmd(`Pagina ${pageIndex+1} de ${pages.length}`,505,20,7,false,'0.45 0.48 0.53'));

      const stream=commands.join('\n');
      const contentId=addObject(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
      const pageId=addObject(
        `<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] `+
        `/Resources << /Font << /F1 ${fontRegularId} 0 R /F2 ${fontBoldId} 0 R >> >> `+
        `/Contents ${contentId} 0 R >>`
      );
      pageIds.push(pageId);
    });

    objects[catalogId-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
    objects[pagesId-1]=`<< /Type /Pages /Kids [${pageIds.map(id=>`${id} 0 R`).join(' ')}] /Count ${pageIds.length} >>`;

    let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    const offsets=[0];

    objects.forEach((object,index)=>{
      offsets[index+1]=pdf.length;
      pdf+=`${index+1} 0 obj\n${object}\nendobj\n`;
    });

    const xrefOffset=pdf.length;
    pdf+=`xref\n0 ${objects.length+1}\n`;
    pdf+='0000000000 65535 f \n';

    for(let index=1;index<=objects.length;index++){
      pdf+=String(offsets[index]).padStart(10,'0')+' 00000 n \n';
    }

    pdf+=`trailer\n<< /Size ${objects.length+1} /Root ${catalogId} 0 R >>\n`;
    pdf+=`startxref\n${xrefOffset}\n%%EOF`;

    const bytes=new Uint8Array(pdf.length);
    for(let index=0;index<pdf.length;index++) bytes[index]=pdf.charCodeAt(index)&255;
    return new Blob([bytes],{type:'application/pdf'});
  }


  function orderPdfFile(order,supplier,company,products){
    const blob=buildOrderPdf(order,supplier,company,products);
    const fileName=`PEDIDO_${order.id.slice(-8)}_${pdfSafeText(supplier?.name||'FORNECEDOR').replace(/\s+/g,'_')}.pdf`;
    return {blob,fileName};
  }


  function downloadBlob(blob,fileName){
    const link=document.createElement('a');
    link.href=URL.createObjectURL(blob);
    link.download=fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(link.href),1500);
  }

  async function shareOrderPdf(order,supplier,company,products){
    const {blob,fileName}=orderPdfFile(order,supplier,company,products);
    const file=new File([blob],fileName,{type:'application/pdf'});
    const message=`Olá ${supplier?.contact||supplier?.name||''}, segue o pedido #${order.id.slice(-8)} da ${company?.name||'empresa'}.`;

    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      try{
        await navigator.share({
          title:`Pedido #${order.id.slice(-8)}`,
          text:message,
          files:[file]
        });
        return;
      }catch(error){
        if(error?.name==='AbortError') return;
      }
    }

    downloadBlob(blob,fileName);

    const phone=String(supplier?.whatsapp||'').replace(/\D/g,'');
    const url=phone
      ? `https://wa.me/55${phone.replace(/^55/,'')}?text=${encodeURIComponent(message+' O PDF foi baixado; anexe-o nesta conversa.')}`
      : `https://wa.me/?text=${encodeURIComponent(message+' O PDF foi baixado; anexe-o nesta conversa.')}`;

    window.open(url,'_blank','noopener');
    alert('O PDF foi baixado. O WhatsApp será aberto para você anexar o arquivo.');
  }

  function responseIsCompleted(response){
    return Boolean(response?.unavailable) || Number(response?.price||0)>0;
  }

  function orderStatusLabel(status){
    const labels={
      new:'Novo',
      viewed:'Visualizado',
      launched:'Pedido lançado',
      completed:'Concluído',
      delivered:'Entregue',
      draft:'Novo',
      sent:'Pedido lançado'
    };
    return labels[status]||'Novo';
  }

  function orderStatusClass(status){
    if(status==='viewed') return 'viewed';
    if(status==='launched'||status==='sent') return 'launched';
    if(status==='completed'||status==='delivered') return 'completed';
    return 'new';
  }

  function repQuotationAnswerPage(quotationId,supplierId){
    const quotation=(db.quotations||[]).find(q=>q.id===quotationId);
    const supplier=(db.suppliers||[]).find(s=>s.id===supplierId && s.representativeId===session.representativeId);

    if(!quotation||!supplier){
      repQuotationsPage();
      return;
    }

    const company=db.companies.find(c=>c.id===quotation.companyId);
    const products=(db.products||[]).filter(p=>p.companyId===quotation.companyId);
    quotation.responses=quotation.responses||{};
    quotation.responses[supplier.id]=quotation.responses[supplier.id]||{};
    const meta=quotation.responses[supplier.id]._meta||{};
    const rep=representativeRecord();
    const savedTemplates=Array.isArray(rep?.paymentTemplates)
      ? rep.paymentTemplates.filter(item=>item&&item.active!==false&&item.name)
      : [];
    const savedOptions=savedTemplates.length
      ? savedTemplates.map(item=>item.name)
      : (Array.isArray(rep?.paymentOptions)?rep.paymentOptions:[]);
    const selectedOptions=Array.isArray(meta.paymentOptions)?meta.paymentOptions:[];

    const pendingItems=quotation.items.filter(item=>{
      const response=quotation.responses[supplier.id][item.productId];

          <div><label>Pedido mínimo nesta proposta (R$)</label><input id="repProposalMinimum" data-money data-raw-value="${meta.minimumOrder??rep?.minimumOrder??0}" value="${meta.minimumOrder??rep?.minimumOrder??0}"></div>
          <div><label>Frete grátis acima de (R$)</label><input id="repProposalFreeShipping" data-money data-raw-value="${meta.freeShippingAbove??rep?.freeShippingAbove??0}" value="${meta.freeShippingAbove??rep?.freeShippingAbove??0}"></div>
          <div><label>Observação comercial</label><input id="repProposalCommercialNotes" value="${esc(meta.commercialNotes??rep?.commercialNotes??'')}"></div>
        </div>
      </section>

      <section class="card">
        <h2>Período de entrega</h2>
        <p class="muted">Informe uma única vez o período previsto para entregar os itens desta cotação.</p>
        <div class="delivery-range">
          <div><label>Entrega a partir de</label><input id="deliveryStart" type="date" value="${esc(meta.deliveryStart||'')}" required></div>
          <div><label>Entrega até</label><input id="deliveryEnd" type="date" value="${esc(meta.deliveryEnd||'')}" required></div>
        </div>
        <div style="margin-top:16px">
          <label>Preço válido até</label>
          <input id="priceValidUntil" type="date" value="${esc(meta.priceValidUntil||'')}" required>
          <small class="muted">Informe até qual data o comprador pode enviar o pedido mantendo estes preços.</small>
        </div>
      </section>

      ${pendingItems.length
        ? `<div class="notice info">${pendingItems.length} item(ns) novo(s) ou alterado(s) precisam de resposta. Os demais permanecem bloqueados para não alterar respostas anteriores.</div>`
        : `<div class="notice success">Todos os itens estão respondidos. Nenhuma nova alteração pendente.</div>`}

      <form id="repAnswerForm" class="grid">
        ${quotation.items.map((item,index)=>{
          const product=products.find(p=>p.id===item.productId);
          const response=quotation.responses[supplier.id][item.productId]||{};
          const unavailable=Boolean(response.unavailable);
          const needsResponse=!response || new Date(item.changedAt||quotation.createdAt) > new Date(response.submittedAt||0);

          if(!needsResponse){
            return `<article class="rep-answer-card">
              <h3>${index+1}. ${esc(product?.name||'Produto')}</h3>
              <div class="locked-answer">
                Resposta já enviada e preservada:
                ${response.unavailable ? 'Item indisponível' : `${money(response.price)} · Marca ${esc(response.brand||'-')} · ${response.packQty||'-'} por fardo/caixa`}
              </div>
            </article>`;
          }

          return `<article class="rep-answer-card">
            <h3>${index+1}. ${esc(product?.name||'Produto')}
              ${item.revision>1?`<span class="revision-badge">Novo / Editado</span>`:''}
            </h3>
            <p class="muted">Quantidade solicitada: ${item.quantity} ${esc(product?.unit||'')}</p>
            ${item.requestedPackQty
              ? `<div class="pack-note">O comprador informou referência de ${item.requestedPackQty} unidade(s) por fardo/caixa.</div>`
              : `<div class="pack-note">Informe abaixo quantas unidades vêm no fardo/caixa para evitar erro de comunicação.</div>`}
            ${item.changeNote?`<div class="notice info" style="margin-top:10px"><strong>Mensagem do comprador:</strong> ${esc(item.changeNote)}</div>`:''}

            <div class="availability-row">
              <strong>Disponibilidade:</strong>
              <label><input type="radio" name="availability_${item.productId}" value="available" data-availability="${item.productId}" ${!unavailable?'checked':''}> Disponível</label>
              <label><input type="radio" name="availability_${item.productId}" value="unavailable" data-availability="${item.productId}" ${unavailable?'checked':''}> Indisponível / Não possui</label>
            </div>

            <div class="rep-answer-grid" data-fields="${item.productId}" style="${unavailable?'display:none':''}">
              <div style="grid-column:1/-1">
                <label>Preço do item solicitado</label>
                <div class="requested-offer-row">
                  <strong>${esc(product?.name||'Produto solicitado')}</strong>
                  <input
                    data-money
                    data-raw-value="${Number(requestedOffer(response,product?.name||'')?.price||0)}"
                    data-rep-requested-price="${item.productId}"
                    value="${Number(requestedOffer(response,product?.name||'')?.price||0)}"
                    inputmode="numeric"
                    placeholder="R$ 0,00">
                </div>

                <div class="simple-alt-header">
                  <div>
                    <strong>Outras marcas que você pode oferecer</strong>
                    <small class="muted">Opcional. Adicione quantas alternativas desejar.</small>
                  </div>
                  <button class="btn secondary" type="button" data-rep-add-alt="${item.productId}">
                    + Outra marca
                  </button>
                </div>

                <div class="simple-alt-list" data-rep-alt-list="${item.productId}">
                  ${alternativeOffers(response,product?.name||'').map(offer=>`
                    <div class="simple-alt-row" data-rep-alt-row="${item.productId}">
                      <input data-rep-alt-brand placeholder="Outra marca / produto" value="${esc(offer.brand)}">
                      <input
                        data-money
                        data-raw-value="${Number(offer.price||0)}"
                        data-rep-alt-price
                        value="${Number(offer.price||0)}"
                        inputmode="numeric"
                        placeholder="R$ 0,00">
                      <button class="btn danger" type="button" data-remove-alt>Excluir</button>
                    </div>
                  `).join('')}
                </div>
              </div>
              <div><label>Quantidade que vem no fardo/caixa</label><input type="number" min="0" step="1" data-rep-pack="${item.productId}" value="${response.packQty||item.requestedPackQty||''}" placeholder="Opcional. Ex.: 6"></div>
              <div><label>Observação do item</label><input data-rep-note="${item.productId}" value="${esc(response.notes||'')}"></div>
            </div>

            <div class="unavailable-box" data-unavailable-message="${item.productId}" style="${unavailable?'':'display:none'}">
              Este item será informado ao comprador como indisponível.
            </div>
          </article>`;
        }).join('')}

        ${pendingItems.length?`<div class="mobile-sticky-submit"><button class="btn success" type="submit" style="width:100%">Enviar somente itens novos/alterados</button></div>`:''}
      </form>
    `,'repQuotations');

    document.querySelector('#backRepQuotes').onclick=repQuotationsPage;


    document.querySelectorAll('[data-rep-add-alt]').forEach(button=>{
      button.onclick=()=>addAlternativeRow('rep',button.dataset.repAddAlt);
    });

    document.querySelectorAll('[data-rep-alt-row] [data-remove-alt]').forEach(button=>{
      button.onclick=()=>button.closest('[data-rep-alt-row]')?.remove();
    });

    document.querySelectorAll('[data-availability]').forEach(radio=>radio.onchange=()=>{
      const productId=radio.dataset.availability;
      const unavailable=document.querySelector(`input[name="availability_${productId}"]:checked`).value==='unavailable';
      document.querySelector(`[data-fields="${productId}"]`).style.display=unavailable?'none':'grid';
      document.querySelector(`[data-unavailable-message="${productId}"]`).style.display=unavailable?'block':'none';
    });

    const form=document.querySelector('#repAnswerForm');
    if(form){
      form.onsubmit=async(event)=>{
        event.preventDefault();

        const submitButton=event.submitter;

        const deliveryStart=document.querySelector('#deliveryStart').value;
        const deliveryEnd=document.querySelector('#deliveryEnd').value;
        const priceValidUntil=document.querySelector('#priceValidUntil').value;

        if(!deliveryStart||!deliveryEnd){alert('Informe as duas datas do período de entrega.');return;}
        if(!priceValidUntil){alert('Informe até qual data os preços são válidos.');return;}
        if(deliveryEnd<deliveryStart){alert('A data final não pode ser anterior à inicial.');return;}

        for(const item of pendingItems){
          const unavailable=document.querySelector(`input[name="availability_${item.productId}"]:checked`).value==='unavailable';
          const product=products.find(product=>product.id===item.productId);
          const offers=collectSimpleOffers(
            'rep',
            item.productId,
            product?.name||'Produto solicitado'
          );
          if(!unavailable && !offers.length){
            alert('Informe o preço do item solicitado ou pelo menos uma alternativa, ou marque o item como indisponível.');
            return;
          }
        }

        const paymentOptions=savedOptions.filter((option,index)=>
          document.querySelector(`[data-rep-payment-option="${index}"]`)?.checked
        );
        const customPayment=document.querySelector('#repCustomPayment').value.trim();
        if(customPayment) paymentOptions.push(customPayment);
        if(!paymentOptions.length){
          alert('Selecione ou informe pelo menos uma condição de pagamento.');
          return;
        }

        if(submitButton){
          submitButton.disabled=true;
          submitButton.textContent='Enviando resposta...';
        }

        quotation.responses[supplier.id]._meta={
          deliveryStart,
          deliveryEnd,
          priceValidUntil,
          paymentOptions,
          customPayment,
          minimumOrder:moneyInputValue('#repProposalMinimum'),
          freeShippingAbove:moneyInputValue('#repProposalFreeShipping'),
          commercialNotes:document.querySelector('#repProposalCommercialNotes').value.trim(),
          submittedAt:new Date().toISOString()
        };

        pendingItems.forEach(item=>{
          const unavailable=document.querySelector(`input[name="availability_${item.productId}"]:checked`).value==='unavailable';
          const product=products.find(product=>product.id===item.productId);
          const offers=unavailable?[]:collectSimpleOffers(
            'rep',
            item.productId,
            product?.name||'Produto solicitado'
          );
          const cheapest=offers.length
            ? offers.reduce((best,current)=>current.price<best.price?current:best)
            : null;

          quotation.responses[supplier.id][item.productId]={
            unavailable,
            offers,
            price:unavailable?0:Number(cheapest?.price||0),
            packQty:unavailable?0:Number(document.querySelector(`[data-rep-pack="${item.productId}"]`).value||0),
            brand:unavailable?'':String(cheapest?.brand||''),
            notes:unavailable?'Item indisponível / não possui no catálogo':document.querySelector(`[data-rep-note="${item.productId}"]`).value.trim(),
            submittedAt:new Date().toISOString(),
            answeredRevision:item.revision||1
          };
        });

        quotation.updatedAt=new Date().toISOString();

        try{
          const responsePayload=quotation.responses[supplier.id]||{};

          const {data,error}=await supabaseClient.rpc(
            'submit_public_platform_response',
            {
              p_quotation_id:quotation.id,
              p_supplier_id:supplier.id,
              p_response:responsePayload
            }
          );

          if(error) throw error;
          if(data?.success===false){
            throw new Error(data?.message||'O servidor recusou a resposta.');
          }

          localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
          alert('Resposta enviada e recebida no painel do comprador.');
          await repQuotationsPage();
        }catch(error){
          console.error('Erro ao enviar resposta:',error);
          alert('Não foi possível enviar a resposta ao comprador: '+(error?.message||'verifique a conexão'));

          if(submitButton){
            submitButton.disabled=false;
            submitButton.textContent='Enviar somente itens novos/alterados';
          }
        }
      };
    }
  }

          refreshed.paymentTemplates.some(item=>item?.name);

        if(saveButton){
          saveButton.disabled=false;
          saveButton.textContent='Salvar condições';
        }
      }
    };

  function productQuotationStats(){
    const products=companyData(db.products);
    const quotations=companyData(db.quotations);
    const suppliers=companyData(db.suppliers);

    return products.map(product=>{
      const related=[];

      quotations.forEach(quotation=>{
        const item=(quotation.items||[]).find(i=>i.productId===product.id);
        if(!item) return;

        const validPrices=(quotation.suppliers||[]).map(supplierId=>{
          const price=Number(quotation.responses?.[supplierId]?.[product.id]?.price||0);
          return {supplierId,price};
        }).filter(entry=>entry.price>0);

        const winner=validPrices.length
          ? validPrices.reduce((best,current)=>current.price<best.price?current:best)
          : null;

        related.push({
          quotationId:quotation.id,
          date:quotation.updatedAt||quotation.createdAt,
          quantity:Number(item.quantity||0),
          winner,
          prices:validPrices
        });
      });

      const last=related.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||null;
      const allPrices=related.flatMap(entry=>entry.prices.map(price=>price.price));
      const winningSuppliers=related
        .filter(entry=>entry.winner)
        .map(entry=>entry.winner.supplierId);

      let topWinner=null;
      if(winningSuppliers.length){
        const counts={};
        winningSuppliers.forEach(id=>counts[id]=(counts[id]||0)+1);
        const winnerId=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0];
        topWinner=suppliers.find(s=>s.id===winnerId)||null;
      }

      const now=new Date();
      const lastDate=last?new Date(last.date):null;
      const daysWithoutQuote=lastDate && !Number.isNaN(lastDate.getTime())
        ? Math.max(0,Math.floor((now-lastDate)/86400000))
        : null;

      return {
        product,
        quoteCount:related.length,
        lastDate:last?.date||null,
        daysWithoutQuote,
        averagePrice:allPrices.length
          ? allPrices.reduce((sum,value)=>sum+value,0)/allPrices.length
          : null,
        minPrice:allPrices.length?Math.min(...allPrices):null,
        topWinner,
        neverQuoted:related.length===0
      };
    });
  }

  function purchaseIntelligencePage(){
    const categories=companyData(db.categories);
    const stats=productQuotationStats();
    let inactivityFilter='30';
    let categoryFilter='';
    let search='';
    const selected=new Set();

    const filteredMostQuoted=()=>stats
      .filter(item=>{
        const categoryMatch=!categoryFilter || item.product.categoryId===categoryFilter;
        const searchMatch=!search || `${item.product.name} ${categories.find(c=>c.id===item.product.categoryId)?.name||''}`
          .toLowerCase().includes(search);
        return categoryMatch && searchMatch;
      })
      .sort((a,b)=>b.quoteCount-a.quoteCount || a.product.name.localeCompare(b.product.name,'pt-BR'))
      .slice(0,20);

    const filteredInactive=()=>stats
      .filter(item=>{
        const threshold=Number(inactivityFilter||0);
        const inactiveMatch=
          inactivityFilter==='never'
            ? item.neverQuoted
            : item.neverQuoted || Number(item.daysWithoutQuote||0)>=threshold;

        const categoryMatch=!categoryFilter || item.product.categoryId===categoryFilter;
        const searchMatch=!search || `${item.product.name} ${categories.find(c=>c.id===item.product.categoryId)?.name||''}`
          .toLowerCase().includes(search);

        return inactiveMatch && categoryMatch && searchMatch;
      })
      .sort((a,b)=>{
        if(a.neverQuoted && !b.neverQuoted) return -1;
        if(!a.neverQuoted && b.neverQuoted) return 1;
        return Number(b.daysWithoutQuote||0)-Number(a.daysWithoutQuote||0);
      });

    const render=()=>{
      const most=filteredMostQuoted();
      const inactive=filteredInactive();

      document.querySelector('#mostQuotedBody').innerHTML=

  async function loadFiadoDetailPayload(){
    const imported=Array.isArray(db.fiados?.orderDetails)?db.fiados.orderDetails:[];
    const parts=Array.isArray(db.fiados?.detailPayloadParts)?db.fiados.detailPayloadParts:[];
    let legacy=[];
    if(parts.length){
      try{
        const base64=parts.join('');
        const binary=atob(base64);
        const compressed=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
        if(typeof DecompressionStream==='undefined') throw new Error('Navegador sem suporte à descompactação.');
        const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
        const text=await new Response(stream).text();
        const parsed=JSON.parse(text);
        legacy=Array.isArray(parsed)?parsed:[];
      }catch(error){
        console.error('Erro ao abrir detalhamento antigo dos fiados:',error);
      }
    }
    const map=new Map();
    [...legacy,...imported].forEach(order=>{
      const key=String(order?.n||'');
      if(key) map.set(key,order);
    });

    // A transação oficial do pedido é a fonte da data exibida.
    // Assim, um detalhe antigo ou uma reimportação jamais troca a data visual do pedido.
    const txByOrder=new Map((db.fiados?.transactions||[])
      .filter(t=>t?.source==='consumer_fiado_order'&&t?.orderNumber&&t?.date)
      .map(t=>[String(t.orderNumber),String(t.date)]));

    return [...map.values()].map(order=>{
      const key=String(order?.n||'');
      const officialDate=txByOrder.get(key);
      return officialDate?{...order,d:officialDate}:order;
    });
  }

  function consumerMoneyValue(value){
    if(typeof value==='number') return Number.isFinite(value)?value:0;
    let raw=String(value??'').trim().replace(/R\$/gi,'').replace(/\s/g,'');
    if(!raw) return 0;
    if(raw.includes(',') && raw.includes('.')) raw=raw.replace(/\./g,'').replace(',','.');
    else if(raw.includes(',')) raw=raw.replace(',','.');
    const n=Number(raw.replace(/[^0-9.-]/g,''));
    return Number.isFinite(n)?n:0;
  }

  function consumerDateValue(value){
    if(value===null||value===undefined||value==='') return todayISO();
    // O leitor XLSX pode devolver a célula como Date. Antes ela virava uma string
    // como "Thu Aug 27 2026..." e caía incorretamente na data de hoje.
    if(value instanceof Date && !Number.isNaN(value.getTime())){
      const y=value.getFullYear(),m=String(value.getMonth()+1).padStart(2,'0'),d=String(value.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    if(typeof value==='number'){
      const d=new Date(Date.UTC(1899,11,30)+value*86400000);
      return d.toISOString().slice(0,10);
    }
    const text=String(value).trim();
    const br=text.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
    if(br) return `${br[3]}-${br[2].padStart(2,'0')}-${br[1].padStart(2,'0')}`;
    const iso=text.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return iso[0];
    const parsed=new Date(text);
    if(!Number.isNaN(parsed.getTime())){
      const y=parsed.getFullYear(),m=String(parsed.getMonth()+1).padStart(2,'0'),d=String(parsed.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    console.warn('Data do Consumer não reconhecida:',value);
    return todayISO();
  }

  function consumerHeaderIndex(headers,aliases){
    const normalized=headers.map(normalizeImportHeader);
    for(const alias of aliases){
      const target=normalizeImportHeader(alias);
      const exact=normalized.findIndex(h=>h===target);
      if(exact>=0) return exact;
    }
    return normalized.findIndex(h=>aliases.some(alias=>h.includes(normalizeImportHeader(alias))));
  }

    return '';
