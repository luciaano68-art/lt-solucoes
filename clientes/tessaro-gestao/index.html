<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TESSARO PDV PROTOTIPO — LT Soluções</title>
  <meta name="theme-color" content="#061f49">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tessaro PDV">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./tessaro-app-icon.svg" type="image/svg+xml">
  <style>

:root{
  --bg:#f4f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e5eaf1;
  --primary:#1556d8;--primary2:#061f49;--accent:#16bd69;--warning:#f7b32b;--danger:#e5484d;
  --purple:#7047eb;--shadow:0 8px 24px rgba(15,39,74,.08);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);background:var(--bg)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}
h1,h2,h3,p{margin-top:0}.grid{display:grid;gap:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.brand-lockup{display:flex;align-items:center;gap:14px}.brand-mark{width:62px;height:62px;display:grid;place-items:center;flex:0 0 auto}
.brand-mark svg{width:60px;height:60px;overflow:visible;filter:drop-shadow(0 8px 12px rgba(0,0,0,.22))}.brand-copy{line-height:.9}.brand-tessaro{font-size:28px;font-weight:1000;letter-spacing:.055em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand-cotacoes{font-size:13px;font-weight:950;letter-spacing:.33em;color:#24d27f;margin-top:8px}.brand-slogan{font-size:10px;color:#cbd9eb;margin-top:9px;line-height:1.3}
.auth-wrap{min-height:100vh;background:linear-gradient(135deg,#031a3e 0%,#06275b 68%,#07356e 100%);display:grid;grid-template-columns:minmax(0,1fr) 440px;position:relative;overflow:hidden}
.auth-wrap:before{content:"";position:absolute;inset:auto -8% -34% 5%;height:72%;background:
  radial-gradient(circle at 60% 20%,rgba(21,86,216,.26),transparent 42%),
  repeating-radial-gradient(ellipse at 55% 95%,rgba(21,86,216,.15) 0 1px,transparent 1px 11px);
  transform:rotate(-8deg);pointer-events:none}
.auth-hero{position:relative;z-index:1;padding:54px 56px 42px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.auth-hero-content{max-width:660px}.auth-hero .brand-mark{width:116px;height:116px}.auth-hero .brand-mark svg{width:112px;height:112px}
.auth-hero .brand-tessaro{font-size:64px;letter-spacing:.02em}.auth-hero .brand-cotacoes{font-size:25px;letter-spacing:.38em;margin-top:15px}
.auth-hero .brand-slogan{display:none}.auth-headline{font-size:30px;line-height:1.15;margin:42px 0 30px;max-width:540px}
.benefits{display:grid;gap:22px;max-width:560px}.benefit{display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:center}
.benefit i{width:52px;height:52px;border-radius:13px;border:1px solid rgba(62,144,255,.38);display:grid;place-items:center;color:#24d27f;font-style:normal;font-size:23px;background:rgba(2,22,53,.32)}
.benefit strong{display:block;font-size:16px;margin-bottom:4px}.benefit span{color:#d5e0ef;line-height:1.45}.auth-footer-line{border-top:1px solid rgba(255,255,255,.2);padding-top:25px;color:#d2dfef;font-size:16px}
.auth-panel{position:relative;z-index:2;display:grid;place-items:center;padding:34px 44px 34px 0}.auth-card{width:100%;background:#fff;border-radius:18px;padding:30px;box-shadow:0 22px 70px rgba(0,0,0,.25)}
.auth-card h2{font-size:26px;margin-bottom:6px}.auth-tabs{display:flex;gap:8px;margin:18px 0}.auth-tabs button{flex:1}.auth-mobile-brand{display:none}
.notice{padding:12px;border-radius:10px;margin-bottom:14px}.notice.info{background:#e8f2ff;color:#173d68}.notice.success{background:#e4f8ec;color:#176b3a}.notice.error{background:#fee2e2;color:#991b1b}
label{font-size:12px;font-weight:800;color:#344054;display:block;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #cfd7e3;border-radius:9px;padding:11px 12px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,86,216,.12)}textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--primary);color:#fff}.btn.success{background:var(--accent);color:#fff}.btn.secondary{background:#edf3ff;color:var(--primary)}
.btn.warn{background:#fff3d6;color:#935f00}.btn.danger{background:#fee2e2;color:#991b1b}
.app{min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{background:linear-gradient(180deg,#061f49,#031632);padding:25px 14px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-brand{padding:0 8px 26px}.sidebar .brand-mark{width:52px;height:52px}.sidebar .brand-mark svg{width:50px;height:50px}
.sidebar .brand-tessaro{font-size:20px}.sidebar .brand-cotacoes{font-size:9px;letter-spacing:.32em;margin-top:5px}.sidebar .brand-slogan{display:none}
.sidebar nav{display:grid;gap:5px}
.nav-section-title{font-size:10px;font-weight:900;letter-spacing:.14em;color:#7f9abb;padding:16px 13px 5px;margin-top:3px}
.sidebar kbd{float:right;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:1px 5px;font-size:9px;color:#dce8f8;font-family:inherit}
.quick-ops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.quick-op{border:0;border-radius:14px;padding:20px;text-align:left;cursor:pointer;background:#fff;box-shadow:var(--shadow);border:1px solid var(--line)}
.quick-op strong{display:block;font-size:18px;margin:8px 0 4px}.quick-op span{color:var(--muted);font-size:12px}.quick-op kbd{float:right;background:#eef3ff;border:1px solid #cad8f2;border-radius:6px;padding:3px 7px;color:#1556d8}
@media(max-width:900px){.quick-ops{grid-template-columns:1fr 1fr}.sidebar kbd{display:none}}
.sidebar button{border:0;background:transparent;color:#e5edf8;padding:12px 13px;border-radius:8px;text-align:left;cursor:pointer;font-weight:650}
.sidebar button:hover,.sidebar button.active{background:linear-gradient(90deg,#1556d8,#1769ee);color:#fff}.nav-icon{display:inline-grid;width:25px;place-items:center;margin-right:7px;font-style:normal}
.sidebar .spacer{flex:1}.sidebar-profile{border-top:1px solid rgba(255,255,255,.13);padding:18px 8px 4px;display:flex;align-items:center;gap:10px;color:#fff}
.avatar{width:37px;height:37px;border-radius:50%;background:#1769ee;display:grid;place-items:center;font-weight:900}.profile-copy{min-width:0}.profile-copy strong{display:block;font-size:12px}.profile-copy span{font-size:10px;color:#b8c9df}
.content{padding:26px;min-width:0;max-width:1540px;width:100%;margin:0 auto}.dashboard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}
.dashboard-head h1{font-size:28px;margin-bottom:4px}.dashboard-tools{display:flex;gap:10px}.tool-chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;font-size:12px;font-weight:750}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.page-head h1{font-size:26px;margin-bottom:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{position:relative;padding-left:66px;min-height:102px}
.metric-icon{position:absolute;left:18px;top:20px;width:37px;height:37px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:18px}
.metric.blue .metric-icon{background:#1769ee}.metric.green .metric-icon{background:#20bd69}.metric.purple .metric-icon{background:#7047eb}.metric.teal .metric-icon{background:#11ad84}
.metric span{display:block;font-size:10px;font-weight:850;color:#536174;text-transform:uppercase}.metric strong{display:block;font-size:24px;margin:5px 0 7px}
.metric small{color:#13965b;font-weight:750}.metric small.alt{color:#6552c8}
.insights-grid{display:grid;grid-template-columns:1.22fr .78fr;gap:16px}.chart-card{min-height:318px}.chart-title{font-size:16px;margin-bottom:18px}
.chart-value{font-size:29px;font-weight:900}.chart-up{display:inline-block;background:#dcf8e8;color:#12854d;border-radius:7px;padding:5px 8px;font-size:12px;margin-left:8px}
.mini-chart{height:185px;margin-top:12px}.mini-chart svg{width:100%;height:100%}.donut-layout{display:grid;grid-template-columns:1fr .8fr;align-items:center;gap:12px;height:230px}
.donut{width:172px;height:172px;border-radius:50%;background:conic-gradient(#1769ee 0 18%,#f7b32b 18% 40%,#20bd69 40% 100%);display:grid;place-items:center;margin:auto}
.donut:after{content:"";width:108px;height:108px;border-radius:50%;background:#fff}.donut-center{position:absolute;text-align:center}.donut-center strong{font-size:30px;display:block}
.legend{display:grid;gap:14px;font-size:12px}.legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:2px}
.bottom-grid{display:grid;grid-template-columns:1.45fr .55fr;gap:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}
.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:#59677a}.table tbody tr:hover{background:#f8fbff}
.badge{display:inline-flex;padding:5px 9px;border-radius:7px;font-size:11px;font-weight:800}.badge.active{background:#dce9ff;color:#1756bd}.badge.pending{background:#fff2d9;color:#9a5c00}.badge.blocked{background:#e1f8ea;color:#167544}
.rank-list{display:grid;gap:14px}.rank-row{font-size:12px}.rank-top{display:flex;justify-content:space-between;gap:8px}.rank-bar{height:5px;background:#e7ecf2;border-radius:99px;margin-top:7px;overflow:hidden}.rank-fill{height:100%;background:#20bd69}
.feature-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.feature-item{display:flex;align-items:center;gap:10px;padding:0 17px;border-right:1px solid var(--line);font-size:12px;font-weight:800;color:#18355e}.feature-item:last-child{border-right:0}.feature-icon{font-size:25px;color:#1556d8}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.company-card{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.linkbox{display:flex;gap:8px;align-items:center}.linkbox input{flex:1}
.empty{padding:28px;text-align:center;color:var(--muted)}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#eef2f7;padding:4px 8px;border-radius:8px}
.top-company{display:flex;align-items:center;gap:10px}.top-company-logo{width:42px;height:42px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:3px}
.logo-preview{width:140px;height:140px;border-radius:18px;border:1px dashed #b9c4d1;background:#f8fafc;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-weight:800}
.logo-preview img{width:100%;height:100%;object-fit:contain;padding:8px}.theme-preview{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.theme-preview-head{padding:18px;background:var(--primary);color:#fff;font-weight:900}.theme-preview-body{padding:18px;background:var(--card)}
.color-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.color-input{height:48px;padding:4px}
@media(max-width:1120px){.metrics{grid-template-columns:repeat(2,1fr)}.bottom-grid,.insights-grid{grid-template-columns:1fr}.feature-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){
  .auth-wrap{grid-template-columns:1fr}.auth-hero{display:none}.auth-panel{padding:22px}.auth-mobile-brand{display:block;background:#061f49;border-radius:13px;padding:15px;margin-bottom:18px}
  .shell{grid-template-columns:1fr}.sidebar{height:auto;position:sticky;z-index:10;padding:10px;overflow:auto}.sidebar-brand,.sidebar-profile{display:none}.sidebar nav{display:flex;gap:5px}.sidebar button{white-space:nowrap}
  .content{padding:15px}.dashboard-head{flex-direction:column}.metrics{grid-template-columns:1fr}.donut-layout{grid-template-columns:1fr;height:auto}.feature-strip{grid-template-columns:1fr}
  .feature-item{border-right:0;border-bottom:1px solid var(--line);padding:12px}.feature-item:last-child{border-bottom:0}.form-grid,.color-row{grid-template-columns:1fr}
}


.price-box{background:#e9f7ef;border:1px solid #a9dfbf;border-radius:10px;padding:10px 12px;color:#087443;font-weight:900;font-size:18px;white-space:nowrap}
.unavailable-box{background:#fff0f0;border:1px solid #f3b6b6;border-radius:10px;padding:10px;color:#a51f1f;font-weight:800}
.availability-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.availability-row label{display:inline-flex;align-items:center;gap:6px;margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
.availability-row input{width:auto}
.allocation-input{min-width:90px;text-align:center;font-weight:800}
.allocation-ok{color:#087443;font-weight:900}
.allocation-warning{color:#a15c00;font-weight:900}
.delivery-range{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.order-status{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900}
.order-status.new{background:#e8f1ff;color:#1556d8}.order-status.viewed{background:#fff2d9;color:#9a5c00}
.order-status.launched{background:#e1f8ea;color:#167544}.order-status.completed{background:#eee8ff;color:#6242c7}
@media(max-width:820px){.delivery-range{grid-template-columns:1fr}.allocation-input{min-width:74px}}


.revision-badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff0c7;color:#8a5a00;font-size:11px;font-weight:900;margin-left:6px}
.locked-answer{background:#f5f7fa;border:1px solid var(--line);border-radius:10px;padding:12px;color:#59677a}
.pack-note{background:#eef6ff;border:1px solid #c7ddff;border-radius:10px;padding:10px 12px;color:#164d91;font-size:12px}
.partial-order-note{background:#fff8e8;border:1px solid #f3d38b;border-radius:10px;padding:11px;color:#875a00;font-weight:750}
.quote-edit-grid{display:grid;gap:12px}
.quote-item-edit{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}


.delivery-highlight{display:inline-flex;align-items:center;gap:8px;background:#fff5cc;border:1px solid #f1cf58;color:#775100;border-radius:10px;padding:9px 12px;font-weight:900;font-size:12px;margin-top:8px}
.delivery-highlight strong{color:#5d3f00}
.unit-chip{display:inline-flex;padding:5px 9px;border-radius:999px;background:#edf3ff;color:#1556d8;font-size:11px;font-weight:900}
.unit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.unit-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center}
@media(max-width:820px){.unit-grid{grid-template-columns:1fr 1fr}}


.best-price-cell{background:#e7f8ee!important;border:2px solid #35b86b!important}
.best-price-box{background:#16a85d;color:#fff;border-radius:10px;padding:10px 12px;font-weight:1000;font-size:18px;display:inline-block}
.other-price-box{background:#eef3f8;color:#24364a;border-radius:10px;padding:10px 12px;font-weight:900;font-size:18px;display:inline-block}
.category-section{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.category-title{background:#f2f6fb;padding:12px 14px;font-weight:900;color:#173b68;border-bottom:1px solid var(--line)}
.category-products{padding:12px;display:grid;gap:10px}
.quote-search{max-width:480px}
.validity-highlight{display:inline-flex;align-items:center;gap:8px;background:#eef4ff;border:1px solid #bcd0ff;color:#173f86;border-radius:10px;padding:9px 12px;font-weight:900;font-size:12px;margin-top:8px}
.order-history-note{background:#eef9f2;border:1px solid #bfe5cc;color:#1a6d3e;border-radius:10px;padding:10px 12px;font-weight:800}


.product-picker{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.9fr);gap:16px}
.product-results,.selected-products{border:1px solid var(--line);border-radius:12px;background:#fff;min-height:360px}
.product-results-head,.selected-products-head{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:900;background:#f7f9fc}
.product-list{padding:10px;display:grid;gap:8px;max-height:520px;overflow:auto}
.product-result{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
.product-result:hover{border-color:#9bb9ea;background:#f8fbff}
.selected-list{padding:10px;display:grid;gap:10px;max-height:520px;overflow:auto}
.selected-product{border:1px solid #bfd3f4;border-radius:10px;padding:12px;background:#f8fbff}
.selected-empty{padding:30px;text-align:center;color:var(--muted)}
.category-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.category-filter-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer}
.category-filter-btn.active{background:#1556d8;color:#fff;border-color:#1556d8}
.warning-overbuy{background:#fff0d6;border:1px solid #efc66b;color:#7c5200;border-radius:10px;padding:10px 12px;font-weight:900}
@media(max-width:900px){.product-picker{grid-template-columns:1fr}}


.rep-answer-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px}
.rep-answer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.print-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.print-sheet{background:#fff;color:#111;padding:24px;border:1px solid #d9dfe8;border-radius:12px}
.print-sheet h1,.print-sheet h2,.print-sheet h3{color:#111}
.print-table{width:100%;border-collapse:collapse}
.print-table th,.print-table td{border:1px solid #bfc7d1;padding:8px;text-align:left;font-size:12px}
.visit-notification{background:linear-gradient(135deg,#fff8dc,#fff1b5);border:1px solid #ebc95f;border-radius:14px;padding:16px;margin-bottom:16px}
.visit-notification strong{color:#6b4b00}
.mobile-sticky-submit{position:sticky;bottom:0;background:rgba(255,255,255,.96);padding:12px;border-top:1px solid var(--line);z-index:5}
@media(max-width:700px){
  .rep-answer-grid{grid-template-columns:1fr}
  .rep-answer-card{padding:12px}
  .rep-answer-card h3{font-size:17px}
  .auth-card{padding:20px}
  .content{padding:10px}
  .page-head{align-items:stretch;flex-direction:column}
  .print-sheet{padding:12px}
}
@media print{
  body{background:#fff!important}
  .sidebar,.print-toolbar,.btn,.dashboard-head,.page-head{display:none!important}
  .shell{display:block!important}
  .content{padding:0!important;max-width:none!important}
  .print-sheet{border:0!important;box-shadow:none!important;padding:0!important}
}


.dashboard-top-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;margin-bottom:16px}
.next-visit-mini{background:#fff;border:1px solid var(--line);border-left:4px solid #e6b800;border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.next-visit-mini h3{font-size:14px;margin-bottom:8px}
.next-visit-mini p{font-size:12px;margin-bottom:6px}
.quote-search-panel{position:sticky;top:10px;z-index:4;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 8px 20px rgba(15,39,74,.08)}
.quote-search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.search-count{font-size:12px;color:var(--muted);margin-top:8px}
.visit-status-missed{background:#fee2e2;color:#991b1b}
.visit-status-completed{background:#e1f8ea;color:#167544}
.visit-status-scheduled{background:#fff2d9;color:#9a5c00}
@media(max-width:900px){
  .dashboard-top-grid{grid-template-columns:1fr}
  .next-visit-mini{order:2}
  .quote-search-row{grid-template-columns:1fr}
}


    /* MOBILE / PWA */
    .install-app-btn{
      display:none;
      width:100%;
      margin-top:10px;
    }

    @media (max-width: 768px){
      body{
        overflow-x:hidden;
        padding-bottom:env(safe-area-inset-bottom);
      }

      .app-shell{
        display:block !important;
        min-height:100vh;
      }

      .sidebar{
        position:sticky !important;
        top:0;
        left:0;
        width:100% !important;
        height:auto !important;
        min-height:auto !important;
        z-index:1000;
        padding:10px 12px !important;
        padding-top:calc(10px + env(safe-area-inset-top)) !important;
        border-radius:0 !important;
        overflow-x:auto;
        overflow-y:hidden;
        box-shadow:0 8px 22px rgba(5,25,55,.18);

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return clone(defaultData);
      const parsed = JSON.parse(raw);
      return {

        ...parsed,

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));

    if(publicMode && publicQuotationId && publicSupplierId){
      clearTimeout(remoteSaveTimer);
      remoteSaveTimer=setTimeout(async()=>{

          p_quotation_id:publicQuotationId,
          p_supplier_id:publicSupplierId,
          p_response:response
        });

      },150);
      return;

    if(!onlineUser) return;

      const {error}=await supabaseClient

        .upsert({
          id:'main',
          data:db,
          updated_at:new Date().toISOString()
        },{onConflict:'id'});

    },250);

  async function saveRemoteNow(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    const payload={
      id:'main',
      data:db,
      updated_at:new Date().toISOString()
    };
    const {data,error}=await supabaseClient
      .from('platform_state')
      .upsert(payload,{onConflict:'id'})
      .select('updated_at')
      .single();
    if(error) throw error;
    return data;
  }



  function parseBRL(value){
    if(typeof value==='number') return Number.isFinite(value)?value:0;
    const raw=String(value||'').replace(/[^\d]/g,'');
    return Number(raw||0)/100;
  }

  function formatBRLInput(value){
    return new Intl.NumberFormat('pt-BR',{
      style:'currency',
      currency:'BRL'
    }).format(parseBRL(value));
  }

  function bindMoneyMasks(scope=document){
    scope.querySelectorAll('[data-money]').forEach(input=>{
      if(input.dataset.moneyBound==='1') return;
      input.dataset.moneyBound='1';
      input.setAttribute('inputmode','numeric');
      input.type='text';

      const initial=Number(input.dataset.rawValue||input.value||0);
      input.dataset.rawValue=String(initial);
      input.value=new Intl.NumberFormat('pt-BR',{
        style:'currency',
        currency:'BRL'
      }).format(initial);

      input.addEventListener('input',()=>{
        const numeric=parseBRL(input.value);
        input.dataset.rawValue=String(numeric);
        input.value=new Intl.NumberFormat('pt-BR',{
          style:'currency',
          currency:'BRL'
        }).format(numeric);
      });

      input.addEventListener('focus',()=>{
        setTimeout(()=>input.setSelectionRange(input.value.length,input.value.length),0);
      });
    });
  }

  function moneyInputValue(selector){
    const input=typeof selector==='string'?document.querySelector(selector):selector;
    if(!input) return 0;
    return Number(input.dataset.rawValue||parseBRL(input.value)||0);
  }

  function setSession(value){
    session = value;
    if(value) sessionStorage.setItem(SESSION_KEY, JSON.stringify(value));
    else sessionStorage.removeItem(SESSION_KEY);
  }

  function daysFrom(dateString){
    if(!dateString) return null;
    const ms = new Date(dateString+'T23:59:59') - new Date();
    return Math.ceil(ms/86400000);
  }

  function companyStatus(company){
    if(company.status === 'blocked') return 'blocked';
    if(company.status === 'pending') return 'pending';
    if(company.status === 'active'){
      if(company.expiresAt && daysFrom(company.expiresAt) < 0) return 'blocked';
      return 'active';
    }
    return company.status || 'pending';
  }

  function root(html){ document.querySelector('#root').innerHTML = html; }


  async function loadRemoteState(){
    const {data,error}=await supabaseClient
      .from('platform_state')
      .select('data')
      .eq('id','main')
      .maybeSingle();

    if(error) throw error;

    if(data?.data){
      const remote=data.data||{};
      db={
        ...clone(defaultData),
        ...remote,
        settings:{...defaultData.settings,...(remote.settings||{})},
        master:{...defaultData.master,...(remote.master||{})},
        companies:Array.isArray(remote.companies)?remote.companies:[],
        users:Array.isArray(remote.users)?remote.users:[],
        categories:Array.isArray(remote.categories)?remote.categories:[],
        products:Array.isArray(remote.products)?remote.products:[],
        suppliers:Array.isArray(remote.suppliers)?remote.suppliers:[],
        quotations:Array.isArray(remote.quotations)?remote.quotations:[],
        orders:Array.isArray(remote.orders)?remote.orders:[],
        representatives:Array.isArray(remote.representatives)?remote.representatives:[],
        visits:Array.isArray(remote.visits)?remote.visits:[],
        units:Array.isArray(remote.units)?remote.units:clone(defaultData.units||[])
      };
    }else{
      db=clone(defaultData);
      const {error:insertError}=await supabaseClient
        .from('platform_state')
        .insert({id:'main',data:db});
      if(insertError) throw insertError;
    }

    localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
  }

  function resolveLocalSessionByEmail(email){
    const normalized=String(email||'').trim().toLowerCase();

    if(normalized===MASTER_EMAIL){
      return {role:'master',email:normalized};
    }

    const user=(db.users||[]).find(u=>
      String(u.email||'').trim().toLowerCase()===normalized
    );
    if(user){
      return {
        role:'client',
        email:user.email,
        companyId:user.companyId,
        userId:user.id
      };
    }

    const rep=(db.representatives||[]).find(r=>
      String(r.email||'').trim().toLowerCase()===normalized
    );
    if(rep){
      return {
        role:'representative',
        email:rep.email,
        representativeId:rep.id
      };
    }

    return null;
  }


  function friendlyAuthError(error){
    const message=String(error?.message||'').toLowerCase();

    if(message.includes('email rate limit exceeded') || message.includes('rate limit')){
      return 'O Supabase bloqueou temporariamente novos e-mails de confirmação. Aguarde alguns minutos e tente novamente, ou desative temporariamente a confirmação de e-mail durante os testes.';
    }

    if(message.includes('user already registered') || message.includes('already registered')){
      return 'Este e-mail ainda existe no Supabase Authentication. Exclua-o em Authentication > Users ou use “Esqueci minha senha”.';
    }

    if(message.includes('email not confirmed')){
      return 'Confirme o e-mail recebido antes de entrar.';
    }

    if(message.includes('invalid login credentials')){
      return 'E-mail ou senha incorretos.';
    }

    return error?.message||'Não foi possível concluir a operação.';
  }


  async function ensureRepresentativeRegistration(user){
    const metadata=user?.user_metadata||{};
    const role=metadata.role||'';
    if(role!=='representative') return null;

    const payload={
      full_name:metadata.full_name||user.email,
      company_name:metadata.company_name||'',
      whatsapp:metadata.whatsapp||'',
      city:metadata.city||'',
      state:metadata.state||'',
      email:String(user.email||'').trim().toLowerCase()
    };

    const {data,error}=await supabaseClient.rpc(
      'register_platform_representative',
      {p_payload:payload}
    );

    if(error) throw error;
    if(!data?.success) throw new Error(data?.message||'Não foi possível preparar o painel do representante.');

    await loadRemoteState();
    return resolveLocalSessionByEmail(user.email);
  }

  async function onlineSignIn(email,password){
    const result=await supabaseClient.auth.signInWithPassword({email,password});

    if(result.error){
      throw new Error(
        result.error.message==='Email not confirmed'
          ? 'Confirme o e-mail recebido antes de entrar.'
          : 'E-mail ou senha incorretos.'
      );
    }

    onlineUser=result.data.user;
    await loadRemoteState();

    let localSession=resolveLocalSessionByEmail(email);

    if(!localSession && onlineUser?.user_metadata?.role==='representative'){
      localSession=await ensureRepresentativeRegistration(onlineUser);
    }

    if(!localSession){
      await supabaseClient.auth.signOut();
      onlineUser=null;
      throw new Error('O e-mail existe, mas ainda não está vinculado a um perfil liberado.');
    }

    setSession(localSession);
    return localSession;
  }

  async function applyInitialConsumerFiadosLoad(){
    const importId='consumer_2026_08_25_1911';
    const alreadyImported=Array.isArray(db.fiados?.imports) && db.fiados.imports.some(item=>item?.id===importId);
    if(alreadyImported) return false;

    const response=await fetch('data/fiados_carga_20260825_1911.b64',{cache:'no-store'});
    if(!response.ok) throw new Error('Não foi possível abrir a carga inicial dos fiados.');

    const base64=(await response.text()).trim();
    const binary=atob(base64);
    const compressed=Uint8Array.from(binary,char=>char.charCodeAt(0));

    if(typeof DecompressionStream==='undefined'){
      throw new Error('Este navegador não suporta a carga inicial compactada. Use Chrome ou Edge atualizado.');
    }

    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const payloadText=await new Response(stream).text();
    const payload=JSON.parse(payloadText);

    db.fiados=payload;
    await saveRemoteNow();
    return true;
  }

    const params=new URLSearchParams(location.search);

  async function internalTessaroLogin(username,password){
    const normalized=String(username||'').trim().toUpperCase();
    if(normalized!=='LUCIANO') throw new Error('Usuário ou senha incorretos.');

    const bytes=new TextEncoder().encode(String(password||''));
    const digest=await crypto.subtle.digest('SHA-256',bytes);
    const hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
    if(hash!=='dc6603302bac0f4fa375f467bf3d27647688bdd4b8e15989ebbb91d96c994857'){
      throw new Error('Usuário ou senha incorretos.');
    }

    const activeCompanies=(db.companies||[]).filter(c=>companyStatus(c)==='active');
    const internalCompany=(db.companies||[]).find(c=>String(c.name||'').toLowerCase().includes('tessaro'))
      || activeCompanies.find(c=>c.id!=='company_demo')
      || activeCompanies[0]
      || (db.companies||[])[0];
    if(!internalCompany) throw new Error('Empresa Tessaro não encontrada na base.');

    const internalUser=(db.users||[]).find(u=>u.companyId===internalCompany.id);
    onlineUser={id:'internal_tessaro',email:'',local:true};
    setSession({role:'client',email:'',companyId:internalCompany.id,userId:internalUser?.id||'internal_user',localUser:'LUCIANO'});
    renderApp();
  }

    `);
    document.querySelector('#loginForm').onsubmit=async e=>{

  function renderRequestForm(){
    document.querySelector('#tabLogin').className='btn secondary';

    document.querySelector('#authBody').innerHTML = `

        <button class="btn success" type="submit">Criar conta</button>
      </form>
    `;
    document.querySelector('#requestForm').onsubmit = async(e) => {
      e.preventDefault();

      const submitButton=e.submitter;
      if(submitButton){
        submitButton.disabled=true;
        submitButton.textContent='Criando conta...';
      }

      const codeValue=document.querySelector('#accessCode').value.trim().toUpperCase();
      const email=document.querySelector('#requestEmail').value.trim().toLowerCase();
      const password=document.querySelector('#requestPassword').value.trim();

      if(password.length<6){
        alert('A senha deve ter pelo menos 6 caracteres.');
        if(submitButton){
          submitButton.disabled=false;
          submitButton.textContent='Criar conta';
        }
        return;
      }

      const payload={
        company_name:document.querySelector('#companyName').value.trim(),
        cnpj:document.querySelector('#companyCnpj').value.trim(),
        responsible:document.querySelector('#responsible').value.trim(),
        whatsapp:document.querySelector('#whatsapp').value.trim(),
        city:document.querySelector('#city').value.trim(),
        state:document.querySelector('#state').value.trim().toUpperCase(),
        email
      };

      try{
        const signup=await supabaseClient.auth.signUp({
          email,
          password,
          options:{
            data:{
              role:'buyer',
              full_name:payload.responsible
            }
          }
        });

        if(signup.error){
          throw signup.error;
        }

        const {data:registration,error:registrationError}=await supabaseClient.rpc(
          'redeem_platform_access_code',
          {
            p_code:codeValue,
            p_payload:payload
          }
        );

        if(registrationError){
          throw registrationError;
        }

        if(!registration?.success){
          throw new Error(registration?.message||'Código inválido ou já utilizado.');
        }

        if(signup.data.session){
          onlineUser=signup.data.user;
          await loadRemoteState();

          const localSession=resolveLocalSessionByEmail(email);
          if(!localSession){
            throw new Error('A conta foi criada, mas não foi possível carregar o acesso.');
          }

          setSession(localSession);

          if(registration.status==='active'){
            renderApp();
          }else{
            await supabaseClient.auth.signOut();
            onlineUser=null;
            setSession(null);
            showLogin('Cadastro enviado. Aguarde a aprovação do administrador.');
          }
          return;
        }

        showLogin(
          registration.status==='active'
            ? 'Conta criada. Confirme o e-mail recebido e depois entre.'
            : 'Cadastro enviado. Confirme o e-mail e aguarde a aprovação do administrador.'
        );
      }catch(error){
        alert(friendlyAuthError(error));
        if(submitButton){
          submitButton.disabled=false;
          submitButton.textContent='Criar conta';
        }
      }
    };
  }

      </form>
    `;

    document.querySelector('#representativeRegisterForm').onsubmit=async(e)=>{
      e.preventDefault();

      const button=e.submitter;
      if(button){
        button.disabled=true;
        button.textContent='Criando conta...';
      }

      const email=document.querySelector('#repRegisterEmail').value.trim().toLowerCase();
      const password=document.querySelector('#repRegisterPassword').value.trim();

      const payload={
        full_name:document.querySelector('#repRegisterName').value.trim(),
        company_name:document.querySelector('#repRegisterCompany').value.trim(),
        whatsapp:document.querySelector('#repRegisterWhatsapp').value.trim(),
        city:document.querySelector('#repRegisterCity').value.trim(),
        state:document.querySelector('#repRegisterState').value.trim().toUpperCase(),
        email
      };

      try{
        let authResult=await supabaseClient.auth.signUp({
          email,
          password,
          options:{
            data:{
              role:'representative',
              full_name:payload.full_name,
              company_name:payload.company_name,
              whatsapp:payload.whatsapp,
              city:payload.city,
              state:payload.state
            }
          }
        });

        const noNewIdentity=
          authResult.data?.user &&
          Array.isArray(authResult.data.user.identities) &&
          authResult.data.user.identities.length===0;

        if(authResult.error || noNewIdentity){
          const loginResult=await supabaseClient.auth.signInWithPassword({email,password});

          if(loginResult.error){
            throw new Error(
              noNewIdentity
                ? 'Este e-mail já está cadastrado. Use a senha correta ou peça ao Master uma senha temporária.'
                : loginResult.error.message
            );
          }

          authResult=loginResult;
        }

        const authUser=authResult.data.user||authResult.data.session?.user;
        if(!authUser){
          throw new Error('Não foi possível criar ou localizar a conta no Supabase.');
        }

        onlineUser=authUser;

        const {data:registration,error:registrationError}=await supabaseClient.rpc(
          'register_platform_representative',
          {p_payload:payload}
        );

        if(registrationError) throw registrationError;
        if(!registration?.success){
          throw new Error(registration?.message||'Não foi possível cadastrar o representante.');
        }

        await loadRemoteState();
        const localSession=resolveLocalSessionByEmail(email);

        if(authResult.data.session && localSession){
          setSession(localSession);
          renderApp();
          return;
        }

        showLogin('Conta criada. Confirme o e-mail recebido e depois entre.');
      }catch(error){
        alert(friendlyAuthError(error));
        if(button){
          button.disabled=false;
          button.textContent='Criar conta de representante';
        }
      }
    };
  }

  function resizeLogo(file){
    return new Promise((resolve, reject) => {
      if(!file){ resolve(''); return; }
      if(!file.type.startsWith('image/')){ reject(new Error('Selecione um arquivo de imagem.')); return; }
      if(file.size > 3 * 1024 * 1024){ reject(new Error('A imagem deve ter no máximo 3 MB.')); return; }

      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Não foi possível ler a imagem.'));
      reader.onload = () => {
        const image = new Image();
        image.onerror = () => reject(new Error('Imagem inválida.'));
        image.onload = () => {
          const max = 360;
          const scale = Math.min(max / image.width, max / image.height, 1);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0,0,canvas.width,canvas.height);
          ctx.drawImage(image,0,0,canvas.width,canvas.height);
          resolve(canvas.toDataURL('image/png', 0.9));
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // TESSARO_CARNES_V1_20260831
  const CARNES_PADRAO=[
    'Bife de Frango','Bife de Gado','Bisteca de Gado','Bisteca Suína','Carne de Gado Panela','Carne de Porco Picada',
    'Churrasco de Gado (Alcatra)','Churrasco de Gado (Costela)','Churrasco de Porco','Coxa','Coxa Sobrecoxa','Linguiça',
    'Carne Moída','Carne para Strogonoff','Churrasco de Gado (Maminha)','Churrasco de Gado (Dianteiro)'
  ];
  function carnesInit(){
    if(!db.carnes||typeof db.carnes!=='object') db.carnes={items:CARNES_PADRAO.map((name,i)=>({id:'carne_'+(i+1),name,active:true})),entries:[],days:{}};
    if(!Array.isArray(db.carnes.items)) db.carnes.items=CARNES_PADRAO.map((name,i)=>({id:'carne_'+(i+1),name,active:true}));
    if(!Array.isArray(db.carnes.entries)) db.carnes.entries=[];
    if(!db.carnes.days||typeof db.carnes.days!=='object'||Array.isArray(db.carnes.days)) db.carnes.days={};
  }
  function carnesN(v){return Math.max(0,Number(String(v??'0').replace(',','.'))||0)}
  function carnesKg(v){return `${Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:3})} kg`}
  function carnesEntryDate(e){return String(e?.date||'').slice(0,10)}
  // TESSARO_CARNES_FIX_CUSTO_SOBRA_ANTERIOR_V26_20260901
  function carnesPrev(carneId,date){
    carnesInit();
    const rows=db.carnes.entries
      .filter(e=>e.carneId===carneId&&carnesEntryDate(e)<date)
      .sort((a,b)=>carnesEntryDate(a).localeCompare(carnesEntryDate(b))||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    if(!rows.length)return {qty:0,cost:0};
    let qty=0, cost=0;
    for(const r of rows){
      const sobra=carnesN(r.sobra);
      if(r?.historical===true && r?.source==='PLANILHA 100%' && carnesN(r.custoMedio)>0){
        qty=sobra;
        cost=carnesN(r.custoMedio);
        continue;
      }
      const retirada=carnesN(r.retirada);
      const preco=carnesN(r.preco);
      const perda=carnesN(r.perda);
      const total=qty+retirada;
      const valorTotal=(qty*cost)+(retirada*preco);
      const aproveitavel=Math.max(0,total-perda);
      const novoCusto=aproveitavel>0?valorTotal/aproveitavel:(preco>0?preco:cost);
      qty=sobra;
      if(novoCusto>0) cost=novoCusto;
    }
    return {qty,cost};
  }

  // TESSARO_CARNES_FORMULAS_PLANILHA_20260901
  function carnesCalc(row){
    if(row?.historical===true && row?.source==='PLANILHA 100%'){
      return {...row,
        sobraAnterior:carnesN(row.sobraAnterior),
        total:carnesN(row.total),
        aproveitavel:carnesN(row.aproveitavel),
        custoMedio:carnesN(row.custoMedio),
        usado:carnesN(row.usado),
        custoUsado:carnesN(row.custoUsado),
        custoSobra:row.custoSobra!=null?carnesN(row.custoSobra):carnesN(row.sobra)*carnesN(row.custoMedio)
      };
    }

    // Mesma lógica da planilha validada:
    // TOTAL DISPONÍVEL = SOBRA ANTERIOR + NOVA RETIRADA
    // QUANTIDADE USADA = TOTAL DISPONÍVEL - PERDA - SOBRA FINAL
    // CUSTO MÉDIO/KG APÓS PERDA = VALOR TOTAL DISPONÍVEL / (TOTAL DISPONÍVEL - PERDA)
    // CUSTO USADO NO DIA = QUANTIDADE USADA * CUSTO MÉDIO/KG APÓS PERDA
    const prev=carnesPrev(row.carneId,row.date);
    const sobraAnterior=carnesN(prev.qty);
    const custoAnterior=carnesN(prev.cost);
    const retirada=carnesN(row.retirada);
    const preco=carnesN(row.preco);
    const perda=carnesN(row.perda);
    const sobra=carnesN(row.sobra);

    const total=sobraAnterior+retirada;
    const valorAnterior=sobraAnterior*custoAnterior;
    const valorNovaRetirada=retirada*preco;
    const valorTotal=valorAnterior+valorNovaRetirada;
    const aproveitavel=Math.max(0,total-perda);
    const usado=Math.max(0,total-perda-sobra);
    const custoMedio=aproveitavel>0?valorTotal/aproveitavel:0;
    const custoUsado=usado*custoMedio;
    const custoSobra=sobra*custoMedio;

    // TESSARO_CARNES_CUSTO_SOBRA_20260901
    return {...row,
      sobraAnterior,
      custoAnterior,
      total,
      aproveitavel,
      usado,
      custoMedio,
      custoUsado,
      custoSobra,
      valorAnterior,
      valorNovaRetirada,
      valorTotal
    };
  }

  function carnesDayRows(date){carnesInit();return db.carnes.entries.filter(e=>e.date===date).map(carnesCalc)}
  function carnesDayTotals(date){
    const rows=carnesDayRows(date), custo=rows.reduce((a,e)=>a+e.custoUsado,0), kg=rows.reduce((a,e)=>a+e.usado,0), d=db.carnes.days[date]||{};
    const hasHistoricalTotal=d.total!==undefined&&d.total!==null&&d.total!=='';
    const fat=hasHistoricalTotal?carnesN(d.total):carnesN(d.almoco)+carnesN(d.marmitas);
    return {rows,custo,kg,almoco:carnesN(d.almoco),marmitas:carnesN(d.marmitas),fat,historicalTotal:hasHistoricalTotal?carnesN(d.total):null,pct:fat?custo/fat*100:0};
  }

  // TESSARO_CARNES_V3_EDICAO_MOEDA_20260831
  function carnesForm(date,items,existing=null){
    const host=document.querySelector('#carModal'), isEdit=!!existing, e=existing||{};
    host.innerHTML=`<div class="card" style="border:2px solid var(--primary);position:relative"><h3>${isEdit?'Editar lançamento':'Novo lançamento'}</h3><p class="muted">Sobra anterior e cálculos são automáticos.</p><div class="form-grid"><div><label>Carne</label><select id="carItem">${items.map(x=>`<option value="${x.id}" ${x.id===e.carneId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div><label>Preço da nova retirada (R$/kg)</label><input id="carPreco" data-money data-raw-value="${e.preco||0}" value="${e.preco||0}"></div><div><label>Nova retirada (kg)</label><input id="carRet" inputmode="decimal" value="${e.retirada??''}" placeholder="0,000"></div><div><label>Perda / limpeza (kg)</label><input id="carPerda" inputmode="decimal" value="${e.perda??''}" placeholder="0,000"></div><div><label>Sobra final (kg)</label><input id="carSobra" inputmode="decimal" value="${e.sobra??''}" placeholder="0,000"></div><div><label>Observação</label><input id="carObs" value="${esc(e.obs||'')}" placeholder="Opcional"></div></div><div id="carPreview" class="notice info" style="margin-top:14px"></div><div class="actions"><button class="btn success" id="carConfirm">${isEdit?'Salvar alterações':'Salvar lançamento'}</button><button class="btn secondary" id="carCancel">Cancelar</button></div></div>`;

  const FIN_STORAGE_KEY='tessaro_financeiro_conciliacao_v1';
  const FIN_CATEGORIES=['Venda PIX','Cartão / Getnet','Fornecedor','Funcionários','Impostos','Tarifas / Juros','Empréstimos / Parcelas','Transferência entre contas','Aplicação / Resgate','Saque / Dinheiro','Outros'];
  let finState=(()=>{try{return JSON.parse(localStorage.getItem(FIN_STORAGE_KEY))||{imports:[],selected:null}}catch{return {imports:[],selected:null}}})();

  function finSave(){localStorage.setItem(FIN_STORAGE_KEY,JSON.stringify(finState))}
  function finNum(v){return Number(String(v||'0').replace(/\./g,'').replace(',','.'))||0}
  function finMoney(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0))}
  function finNorm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()}
  function finCategory(desc,value){
    const d=finNorm(desc);
    if(d.includes('RECEBIMENTO PIX')) return {category:'Venda PIX',status:'ok'};
    if(d.includes('GETNET')) return {category:'Cartão / Getnet',status:'ok'};
    if((d.includes('PIX') && d.includes('TESSARO LANCH')) || (d.includes('RECEBIMENTO PIX')&&d.includes('TESSARO'))) return {category:'Transferência entre contas',status:'ok'};
    if(d.includes('LIQUIDACAO BOLETO')) return {category:'Fornecedor',status:'ok'};
    if(d.includes('PAGAMENTO PIX') && /(MORANDI|DISTRIB|FRIBAZ|OESA|SANTANA|NESTLE|MILENIUM|ALESSIO|CELESC|INFORLINE|CONTARP)/.test(d)) return {category:'Fornecedor',status:'ok'};
    if(d.includes('PAGAMENTO PIX') && /(MAIARA|TAUANE|MARIZETE|ROBSON|DELURDES)/.test(d)) return {category:'Funcionários',status:'ok'};
    if(d.includes('ARRECADACAO') || d.includes('SECRETARIA DE ESTAD') || d.includes('CEF MATRIZ')) return {category:'Impostos',status:'ok'};
    if(d.includes('IOF') || d.includes('JUROS') || d.includes('TARIFA')) return {category:'Tarifas / Juros',status:'ok'};
    if(d.includes('PARCELA') || d.includes('CONTR ROTATIVO')) return {category:'Empréstimos / Parcelas',status:'ok'};
    if(d.includes('APLIC') || d.includes('RESG.')) return {category:'Aplicação / Resgate',status:'ok'};
    if(d.includes('SAQUE') || d.includes('DEP DINHEIRO')) return {category:'Saque / Dinheiro',status:'ok'};
    if(d.includes('PAGAMENTO PIX') && d.includes('TESSARO')) return {category:'Transferência entre contas',status:'ok'};
    return {category:'Outros',status:'pending'};
  }

  function finReclassify(t,category){t.category=category;t.status=category==='Outros'?'pending':'ok';finSave();finRenderCurrent()}

  async function finExtractPdf(file,onProgress){
    const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
    const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;
    let lines=[];
    for(let n=1;n<=pdf.numPages;n++){
      const page=await pdf.getPage(n), tc=await page.getTextContent();
      const rows={};
      tc.items.forEach(it=>{
        const y=Math.round((it.transform?.[5]||0)*2)/2;
        (rows[y]||(rows[y]=[])).push({x:it.transform?.[4]||0,s:it.str||''});
      });
      Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
        const line=rows[y].sort((a,b)=>a.x-b.x).map(x=>x.s).join(' ').replace(/\s+/g,' ').trim();
        if(line) lines.push(line);
      });
      onProgress?.(Math.round(n/pdf.numPages*100));
    }
    return {text:lines.join('\n'),lines,pages:pdf.numPages};
  }

  function finParse(text,lines,fileName,pages){
    const all=finNorm(text);
    const bank=all.includes('SICREDI')?'Sicredi':all.includes('SICOOB')?'Sicoob':all.includes('CAIXA')?'Caixa':all.includes('BANCO DO BRASIL')?'Banco do Brasil':'Banco não identificado';
    const acct=(text.match(/Conta:\s*([\d.-]+)/i)||text.match(/CONTA\s+([\d.-]+)/i)||[])[1]||'';
    const assoc=(text.match(/Associado:\s*(.+)/i)||[])[1]?.trim()||'';
    const tx=[];
    const dateRx=/^(\d{2}\/\d{2}\/\d{4})\s+(.+?)\s+(-?\d{1,3}(?:\.\d{3})*,\d{2})\s+(-?\d{1,3}(?:\.\d{3})*,\d{2})$/;
    for(const line of lines){
      const m=line.match(dateRx); if(!m) continue;
      const value=finNum(m[3]);
      let desc=m[2].trim();
      const cls=finCategory(desc,value);
      tx.push({id:'fin_'+Date.now()+'_'+tx.length,date:m[1],description:desc,value,balance:finNum(m[4]),category:cls.category,status:cls.status});
    }
    if(!tx.length) throw new Error('Não consegui identificar lançamentos neste PDF. Para o primeiro teste, use o extrato bancário completo (como o PDF do Sicredi).');
    return {id:'imp_'+Date.now(),createdAt:new Date().toISOString(),fileName,bank,account:acct,holder:assoc,pages,transactions:tx};
  }

  function finSummary(imp){
    const t=imp?.transactions||[];
    const entradas=t.filter(x=>x.value>0).reduce((a,x)=>a+x.value,0);
    const saidas=t.filter(x=>x.value<0).reduce((a,x)=>a+Math.abs(x.value),0);
    const pix=t.filter(x=>x.category==='Venda PIX').reduce((a,x)=>a+Math.max(0,x.value),0);
    const cartao=t.filter(x=>x.category==='Cartão / Getnet').reduce((a,x)=>a+Math.max(0,x.value),0);
    const pend=t.filter(x=>x.status==='pending').length;
    return {entradas,saidas,pix,cartao,pend,total:t.length};
  }

  function finRenderCurrent(){
    const imp=finState.imports.find(x=>x.id===finState.selected)||finState.imports[0]||null;
    if(imp && finState.selected!==imp.id){finState.selected=imp.id;finSave()}
    const q=(document.querySelector('#finSearch')?.value||'').toLowerCase();
    const cat=document.querySelector('#finCat')?.value||'';
    const st=document.querySelector('#finStatus')?.value||'';
    const body=document.querySelector('#finBody'); if(!body)return;
    let rows=(imp?.transactions||[]).filter(t=>(!q||(t.description+' '+t.date).toLowerCase().includes(q))&&(!cat||t.category===cat)&&(!st||t.status===st));
    body.innerHTML=rows.length?rows.map(t=>`<tr>
      <td>${esc(t.date)}</td><td>${esc(t.description)}</td>
      <td class="fin-amount ${t.value>=0?'in':'out'}">${finMoney(t.value)}</td><td>${finMoney(t.balance)}</td>
      <td><select class="fin-category" data-fin-cat="${t.id}">${FIN_CATEGORIES.map(c=>`<option ${c===t.category?'selected':''}>${esc(c)}</option>`).join('')}</select></td>
      <td><span class="fin-status ${t.status==='ok'?'ok':'pending'}">${t.status==='ok'?'Classificado':'Pendente'}</span></td>
    </tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhum lançamento encontrado.</td></tr>';
    document.querySelectorAll('[data-fin-cat]').forEach(el=>el.onchange=()=>{const t=imp.transactions.find(x=>x.id===el.dataset.finCat);if(t)finReclassify(t,el.value)});
    const sm=finSummary(imp);
    const sets=[['finEntradas',sm.entradas],['finSaidas',sm.saidas],['finPix',sm.pix],['finCartao',sm.cartao]];sets.forEach(([id,v])=>{const e=document.querySelector('#'+id);if(e)e.textContent=finMoney(v)});
    const pe=document.querySelector('#finPending');if(pe)pe.textContent=sm.pend;
    const te=document.querySelector('#finTotal');if(te)te.textContent=sm.total+' lançamentos';
  }

  function finExportCsv(){

  function fin2Uid(p='fin'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}

  function fin2N(v){if(typeof v==='number')return v;let x=String(v||'').trim().replace(/R\$\s?/gi,'').replace(/\s/g,'');if(x.includes(',')&&x.includes('.'))x=x.replace(/\./g,'').replace(',','.');else if(x.includes(','))x=x.replace(',','.');return Number(x)||0}
  function fin2Today(){return new Date().toISOString().slice(0,10)}
  function fin2Account(id){return fin2State.accounts.find(a=>a.id===id)}
  function fin2Balance(id){const a=fin2Account(id);if(!a)return 0;let b=Number(a.opening||0);for(const m of fin2State.movements){if(m.accountId===id)b+=m.direction==='in'?Number(m.amount||0):-Number(m.amount||0);if(m.transferTo===id)b+=Number(m.amount||0)}return Number(b.toFixed(2))}
  function fin2Available(){return fin2State.accounts.filter(a=>a.active!==false&&['cash','cash_store','bank'].includes(a.type)).reduce((s,a)=>s+fin2Balance(a.id),0)}
  function fin2Investments(){return fin2State.accounts.filter(a=>a.active!==false&&a.type==='investment').reduce((s,a)=>s+fin2Balance(a.id),0)}
  function fin2Capital(){return fin2State.accounts.filter(a=>a.active!==false&&a.type==='capital').reduce((s,a)=>s+fin2Balance(a.id),0)}
  function fin2Patrimony(){return fin2Available()+fin2Investments()+fin2Capital()}

  function fin2TryReconcilePayable(m){
    if(!m||m.direction!=='out')return null;
    const amount=Number(m.amount||0);
    const candidates=(fin2State.payables||[]).filter(p=>{
      if(p.bankReconciled)return false;

    m.description=m.description||p.description;

  function fin2SyncLegacyStatements(){

    fin2State.syncedBankImports=Array.isArray(fin2State.syncedBankImports)?fin2State.syncedBankImports:[];
    let imports=0,movements=0,reconciled=0;
    for(const imp of finState.imports){
      if(!imp?.id||fin2State.syncedBankImports.includes(imp.id))continue;
      const accountId=fin2BankAccountId(imp.bank);
      if(!accountId)continue;
      const txs=Array.isArray(imp.transactions)?imp.transactions:[];
      if(!txs.length)continue;
      const first=txs[0],firstVal=Number(first.value||0),firstBal=Number(first.balance||0);

        account.openingDate=fin2IsoFromBrDate(first.date);
      }
      for(const t of txs){
        const val=Number(t.value||0);if(!val)continue;
        const bankTxId=`bank_${imp.id}_${t.id||movements}`;
        if(fin2State.movements.some(m=>m.bankTxId===bankTxId))continue;
        const m={id:fin2Uid('mov'),bankTxId,bankImportId:imp.id,date:fin2IsoFromBrDate(t.date),accountId,direction:val>=0?'in':'out',amount:Math.abs(val),category:t.category||'Outros',description:t.description||'',source:'bank_statement',transferTo:'',reconciled:false,createdAt:new Date().toISOString()};

    fin2Save();const matched=fin6ReconcileAll();alert(`Contas a Pagar importadas.\n${added} nova(s), ${updated} atualizada(s).\n${matched} conciliada(s) automaticamente com o extrato.`);financeiroPage()

  function fin2Payables(){const rows=(fin2State.payables||[]).slice().sort((a,b)=>String(b.launchDate||'').localeCompare(String(a.launchDate||'')));const open=rows.filter(x=>normalizeImportHeader(x.status)!=='pago');const paid=rows.filter(x=>normalizeImportHeader(x.status)==='pago');const openTotal=open.reduce((a,x)=>a+Number(x.expected||0),0);const paidTotal=paid.reduce((a,x)=>a+Number(x.paid||0),0);return `${fin2Nav()}<section class="fin2-grid"><div class="fin2-kpi"><span>Contas importadas</span><strong>${rows.length}</strong></div><div class="fin2-kpi"><span>Em aberto</span><strong>${fin2Money(openTotal)}</strong></div><div class="fin2-kpi"><span>Pagas no Consumer</span><strong>${fin2Money(paidTotal)}</strong></div><div class="fin2-kpi"><span>A conciliar no banco</span><strong>${paid.filter(x=>!x.bankReconciled).length}</strong></div></section><section class="card" style="margin-top:16px"><div class="page-head"><div><h2>Contas a pagar</h2><p class="muted">Importe diretamente a Lista de Contas a Pagar exportada do Consumer.</p></div><button class="btn primary" id="fin2ImportPayables">Importar Contas a Pagar</button></div><input type="file" id="fin2PayablesFile" accept=".xlsx,.csv" class="hidden"><div class="fin2-note" style="margin-bottom:14px"><strong>Importante:</strong> “Pago” no Consumer significa que a despesa foi baixada lá. No Tessaro ela só fica conciliada quando encontrarmos o pagamento correspondente no extrato do banco.</div><div class="table-wrap"><table class="fin2-table"><thead><tr><th>Lançamento</th><th>Vencimento</th><th>Categoria</th><th>Descrição / Fornecedor</th><th>Previsto</th><th>Pago</th><th>Data pag.</th><th>Status</th><th>Banco</th></tr></thead><tbody>${rows.length?rows.slice(0,300).map(x=>`<tr><td>${esc(formatDateBR(x.launchDate))}</td><td>${esc(formatDateBR(x.dueDate))}</td><td>${esc(x.category)}</td><td><strong>${esc(x.description)}</strong></td><td>${fin2Money(x.expected)}</td><td>${fin2Money(x.paid)}</td><td>${x.paidDate?esc(formatDat   function fin2Reconcile(){const pend=fin2State.movements.filter(m=>!m.reconciled&&!m.transferTo);return `${fin2Nav()}<section class="card"><h2>Como funciona a conciliação</h2><div class="fin2-note"><strong>1.</strong> Importe o extrato do banco em PDF. &nbsp; <strong>2.</strong> O Tessaro tenta identificar pagamentos, recebimentos e transferências. &nbsp; <strong>3.</strong> O que não tiver certeza fica <b>A conferir</b>. &nbsp; <strong>4.</strong> Você clica em Resolver e escolhe para onde foi o dinheiro.</div><div class="fin2-actions" style="margin-top:14px"><button class="btn primary" id="fin2LegacyReconcile">Importar extrato bancário</button></div></section><section class="fin2-two"><div class="card"><h2>Automático quando houver certeza</h2><p class="muted">Transferências entre bancos, aplicações e pagamentos conhecidos serão vinculados sem criar receita ou despesa em duplicidade.</p></div><div class="card"><h2>A conferir</h2><div class="fin2-cash-value">${pend.length}</div><p class="muted">Somente estas movimentações precisam da sua decisão.</p></div></section><section class="card"><h2>Resolver divergências</h2><div class="table-wrap"><table class="fin2-table"><thead><tr><th>Data</th><th>Conta</th><th>Descrição</th><th>Valor</th><th>Ação</th></tr></thead><tbody>${pend.length?pend.slice(0,100).map(m=>`<tr><td>${esc(formatDateBR(m.date))}</td><td>${esc(fin2Account(m.accountId)?.name||'')}</td><td>${esc(m.description||'')}</td><td class="${m.direction==='in'?'fin2-pos':'fin2-neg'}">${m.direction==='in'?'+':'-'} ${fin2Money(m.amount)}</td><td><button class="btn primary" data-fin2-resolve="${m.id}">Resolver</button></td></tr>`).join(''):`<tr><td colspan="5" class="fin2-empty">Nenhuma movimentação pendente.</td></tr>`}</tbody></table></div></section><div class="fin2-note"><strong>Exemplo:</strong> apareceu <b>- R$ 10.000,00 no Sicredi</b> e não apareceu a outra ponta. Clique em <b>Resolver</b> → escolha <b>Aplicação - Sicredi</b>. O Tessaro registra como transferênc   function fin2Modal(html){const wrap=document.createElement('div');wrap.id='fin2Modal';wrap.style.cssText='position:fixed;inset:0;background:rgba(3,22,50,.56);z-index:99999;display:grid;place-items:center;padding:18px';wrap.innerHTML=`<div class="card" style="width:min(620px,96vw);max-height:90vh;overflow:auto;margin:0">${html}</div>`;document.body.appendChild(wrap);return wrap}

  function fin2MovementModal(pref={}){const accounts=fin2State.accounts.filter(a=>a.active!==false);const w=fin2Modal(`<div class="page-head"><div><h2>Nova movimentação</h2><p class="muted">Registre somente o que não vier automaticamente do Consumer/extrato.</p></div><button class="btn secondary" id="fin2X">Fechar</button></div><div class="fin2-form"><div><label>Data</label><input id="fmDate" type="date" value="${pref.date||fin2Today()}"></div><div><label>Tipo</label><select id="fmType"><option value="in">Entrada</option><option value="out" ${pref.direction==='out'?'selected':''}>Saída</option><option value="transfer" ${pref.type==='transfer'?'selected':''}>Transferência entre contas</option></select></div><div><label>Conta de origem</label><select id="fmAccount">${accounts.map(a=>`<option value="${a.id}" ${pref.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div id="fmDestWrap" class="hidden"><label>Destino</label><select id="fmDest">${accounts.map(a=>`<option value="${a.id}" ${pref.transferTo===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div><label>Valor (R$)</label><input id="fmAmount" inputmode="decimal" value="${pref.amount||''}" placeholder="0,00"></div><div><label>Categoria</label><select id="fmCat"><option>Venda / Recebimento</option><option>Fornecedor</option><option>Funcionários</option><option>Impostos</option><option>Tarifas / Juros</option><option>Cartão / Fatura</option><option>Saque / Dinheiro</option><option>Transferência entre contas</option><option>Outros</option></select></div><div style="grid-column:1/-1"><label>Descrição</label><input id="fmDesc" value="${esc(pref.description||'')}" placeholder="Ex.: retirada do caixa para guardar"></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" id="fmSave">Salvar movimentação</button><button class="btn secondary" id="fmCancel">Cancelar</button></div>`);fin2MoneyInput(w.querySelector('#fmAmount'));const type=w.quer   function fin2EditAccount(id){const a=fin2Account(id);if(!a)return;const w=fin2Modal(`<div class="page-head"><div><h2>${esc(a.name)}</h2><p class="muted">Defina o saldo real de partida desta conta.</p></div><button class="btn secondary" id="fin2X">Fechar</button></div><div class="fin2-form"><div><label>Saldo inicial (R$)</label><input id="faOpening" value="${a.opening||0}" inputmode="decimal"></div><div><label>Data do saldo inicial</label><input id="faDate" type="date" value="${a.openingDate||fin2Today()}"></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" id="faSave">Salvar saldo inicial</button></div>`);fin2MoneyInput(w.querySelector('#faOpening'));w.querySelector('#fin2X').onclick=fin2Close;w.querySelector('#faSave').onclick=()=>{a.opening=fin2N(w.querySelector('#faOpening').value);a.openingDate=w.querySelector('#faDate').value;fin2Save();fin2Close();financeiroPage()}}
  function fin2CountCash(){const expected=fin2Balance('cash');const w=fin2Modal(`<div class="page-head"><div><h2>Conferir caixa</h2><p class="muted">Você só precisa contar quando quiser conferir o valor físico.</p></div><button class="btn secondary" id="fin2X">Fechar</button></div><div class="fin2-kpi"><span>Valor esperado</span><strong>${fin2Money(expected)}</strong></div><div style="margin-top:14px"><label>Valor contado no caixa (R$)</label><input id="fcCount" inputmode="decimal" placeholder="0,00"></div><div id="fcDiff" class="fin2-note" style="margin-top:12px">Informe o valor contado para ver a diferença.</div><div class="actions" style="margin-top:16px"><button class="btn primary" id="fcSave">Registrar conferência</button></div>`);w.querySelector('#fin2X').onclick=fin2Close;const inp=w.querySelector('#fcCount'),diff=w.querySelector('#fcDiff');fin2MoneyInput(inp);inp.oninput=()=>{const d=fin2N(inp.value)-expected;diff.innerHTML=`Diferença: <strong class="${d===0?'fin2-pos':d<0?'fin2-neg':''}">${fin2Money(d)}</strong>`};w.querySelector('#fcSave').onclick=()=>{const counted=fin2N(inp.value);fin2State.cashClosings.unshift({id:fin2Uid('cashcheck'),date:fin2Today(),expected,counted,difference:Number((counted-expected).toFixed(2)),createdAt:new Date().toISOString()});fin2Save();fin2Close();financeiroPage()}}

  function fin2ResolvePending(id){const m=fin2State.movements.find(x=>x.id===id);if(!m)return;const opts=fin2State.accounts.filter(a=>a.active!==false&&a.id!==m.accountId);const w=fin2Modal(`<div class="page-head"><div><h2>Resolver movimentação</h2><p class="muted">${esc(fin2Account(m.accountId)?.name||'')} • ${fin2Money(m.amount)} • ${esc(m.description||'Sem descrição')}</p></div><button class="btn secondary" id="fin2X">Fechar</button></div><label>Para onde foi o dinheiro?</label><select id="frDest"><option value="">Selecione...</option>${opts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}<option value="expense">Foi uma despesa</option></select><div class="fin2-note" style="margin-top:12px">Ao escolher outra conta, o sistema registra como transferência interna. Não vira receita nem despesa.</div><div class="actions" style="margin-top:16px"><button class="btn primary" id="frSave">Conciliar</button></div>`);w.querySelector('#fin2X').onclick=fin2Close;w.querySelector('#frSave').onclick=()=>{const d=w.querySelector('#frDest').value;if(!d)return alert('Selecione o destino.');if(d==='expense'){m.reconciled=true;m.reconcileType='expense'}else{m.transferTo=d;m.category='Transferência entre contas';m.reconciled=true;m.reconcileType='transfer'};fin2State.reconciliations.unshift({id:fin2Uid('rec'),movementId:m.id,destination:d,date:fin2Today(),manual:true});fin2Save();fin2Close();financeiroPage()}}

  function fin2Bind(){document.querySelectorAll('[data-fin2-tab]').forEach(b=>b.onclick=()=>{fin2Tab=b.dataset.fin2Tab;financeiroPage()});document.querySelector('#fin2QuickMove')?.addEventListener('click',()=>fin2MovementModal());document.querySelector('#fin2CashMove')?.addEventListener('click',()=>fin2MovementModal({accountId:'cash'}));document.querySelector('#fin2AddMove')?.addEventListener('click',()=>fin2MovementModal());document.querySelector('#fin2ToGuarded')?.addEventListener('click',()=>fin2MovementModal({type:'transfer',accountId:'cash',transferTo:'guarded',description:'Retirada do caixa para dinheiro guardado'}));document.querySelector('#fin2Deposit')?.addEventListener('click',()=>fin2MovementModal({type:'transfer',accountId:'guarded',transferTo:'sicredi',description:'Depósito de dinheiro guardado no banco'}));document.querySelector('#fin2CountCash')?.addEventListener('click',fin2CountCash);document.querySelectorAll('[data-fin2-edit-account]').forEach(b=>b.onclick=()=>fin2EditAccount(b.dataset.fin2EditAccount));document.querySelectorAll('[data-fin2-del]').forEach(b=>b.onclick=()=>{if(!confirm('Excluir esta movimentação?'))return;fin2State.movements=fin2State.movements.filter(m=>m.id!==b.dataset.fin2Del);fin2Save();financeiroPage()});document.querySelector('#fin2LegacyReconcile')?.addEventListener('click',financeiroPageLegacy);document.querySelectorAll('[data-fin2-resolve]').forEach(b=>b.onclick=()=>fin2ResolvePending(b.dataset.fin2Resolve));const ar=document.querySelector('#fin4ImportReceivables'),arf=document.querySelector('#fin4ReceivablesFile');if(ar&&arf){ar.onclick=()=>arf.click();arf.onchange=async()=>{const f=arf.files?.[0];if(!f)return;try{await fin4ImportReceivables(f)}catch(e){console.error(e);alert('Não foi possível importar: '+(e.message||e))}finally{arf.value=''}}} const rb=document.querySelector('#fin5ImportReceipts'),rf=document.querySelector('#fin5ReceiptsFile');if(rb&&rf){rb.onclick=()=>rf.click();rf.onchange=async()=>{const f=rf.files?.[0   function financeiroPage(){fin2SyncLegacyStatements();let body='';if(fin2Tab==='cash')body=fin2Cash();else if(fin2Tab==='accounts')body=fin2Accounts();else if(fin2Tab==='movements')body=fin2Movements();else if(fin2Tab==='payables')body=fin2Payables();else if(fin2Tab==='receivables')body=fin4Receivables();else if(fin2Tab==='reconcile')body=fin2Reconcile();else body=fin2Overview();layout(`<header class="page-head"><div><h1>Financeiro</h1><p class="muted">Caixa, dinheiro guardado, bancos, despesas e conciliação do restaurante.</p></div><div class="actions"><button class="btn secondary" id="fin2ResetTests">Zerar Financeiro</button><button class="btn secondary" id="fin2NewMove">+ Lançamento</button></div></header>${body}`,'financeiro');document.querySelector('#fin2ResetTests')?.addEventListener('click',()=>{if(!confirm('Zerar SOMENTE o Financeiro? Isso apaga saldos, extratos, movimentações, contas a pagar/receber e conciliações de teste. Fiados e Cotações não serão alterados.'))return;fin6Reset();alert('Financeiro zerado por completo.');financeiroPage()});document.querySelector('#fin2NewMove')?.addEventListener('click',()=>fin2MovementModal());fin2Bind()}

  function generateTemporaryPassword(){
    const upper='ABCDEFGHJKLMNPQRSTUVWXYZ';
    const lower='abcdefghijkmnopqrstuvwxyz';
    const numbers='23456789';
    const symbols='@#$%&*!';
    const all=upper+lower+numbers+symbols;
    let password=
      upper[Math.floor(Math.random()*upper.length)] +
      lower[Math.floor(Math.random()*lower.length)] +
      numbers[Math.floor(Math.random()*numbers.length)] +
      symbols[Math.floor(Math.random()*symbols.length)];

    for(let i=0;i<8;i++){
      password+=all[Math.floor(Math.random()*all.length)];
    }

    return password.split('').sort(()=>Math.random()-.5).join('');
  }

  function openMasterPasswordReset(email,label){
    const temporary=generateTemporaryPassword();

    root(`
      <div class="auth-wrap" style="grid-template-columns:1fr">
        <section class="auth-panel">
          <div class="auth-card" style="width:min(520px,100%)">
            <h2>Redefinir senha</h2>
            <p class="muted">
              Usuário: <strong>${esc(label)}</strong><br>
              E-mail: <strong>${esc(email)}</strong>
            </p>

            <div class="notice info">
              Crie uma senha temporária e envie ao usuário. Ele poderá alterá-la depois em “Esqueci minha senha”.
            </div>

            <form id="masterPasswordResetForm" class="grid">
              <div>
                <label>Nova senha temporária</label>
                <input id="masterTemporaryPassword" type="text" minlength="8" value="${esc(temporary)}" required>
              </div>

              <div class="actions">
                <button class="btn secondary" id="generateAnotherPassword" type="button">Gerar outra</button>
                <button class="btn primary" type="submit">Salvar nova senha</button>
                <button class="btn secondary" id="cancelMasterPasswordReset" type="button">Cancelar</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    `);

    document.querySelector('#generateAnotherPassword').onclick=()=>{
      document.querySelector('#masterTemporaryPassword').value=generateTemporaryPassword();
    };

    document.querySelector('#cancelMasterPasswordReset').onclick=()=>{
      if(session?.role==='master'){
        masterPasswordReturnPage==='masterRepresentatives'
          ? masterRepresentativesPage()
          : companiesPage();
      }else{
        showLogin();
      }
    };

    document.querySelector('#masterPasswordResetForm').onsubmit=async(e)=>{
      e.preventDefault();

      const newPassword=document.querySelector('#masterTemporaryPassword').value.trim();
      if(newPassword.length<8){
        alert('A senha precisa ter pelo menos 8 caracteres.');
        return;
      }

      const button=e.submitter;
      if(button){
        button.disabled=true;
        button.textContent='Salvando...';
      }

      try{
        const {data,error}=await supabaseClient.rpc(
          'master_reset_platform_user_password',
          {
            p_email:email,
            p_new_password:newPassword
          }
        );

        if(error) throw error;
        if(!data?.success) throw new Error(data?.message||'Não foi possível redefinir a senha.');

        await navigator.clipboard?.writeText(newPassword).catch(()=>{});
        alert(`Senha temporária criada com sucesso.\n\nE-mail: ${email}\nSenha: ${newPassword}\n\nA senha também foi copiada.`);
        companiesPage();
      }catch(error){
        alert(error.message||'Erro ao redefinir a senha.');
        if(button){
          button.disabled=false;
          button.textContent='Salvar nova senha';
        }
      }
    };
  }

  async function deleteCompanyAccess(companyId){
    const company=db.companies.find(c=>c.id===companyId);
    if(!company) return;

    const user=(db.users||[]).find(u=>u.companyId===companyId);
    const email=user?.email||'';

    const firstConfirm=confirm(
      `Excluir definitivamente a empresa "${company.name}"?\n\n`+
      `Isso apagará o acesso, o e-mail de login e todos os dados da empresa.`
    );
    if(!firstConfirm) return;

    const typed=prompt(`Digite EXCLUIR para confirmar a remoção de ${company.name}:`);
    if(typed!=='EXCLUIR'){
      alert('Exclusão cancelada.');
      return;
    }

    try{
      const {data,error}=await supabaseClient.rpc(
        'delete_platform_company_and_user',
        {
          p_company_id:companyId,
          p_email:email
        }
      );

      if(error) throw error;
      if(!data?.success) throw new Error(data?.message||'Não foi possível excluir.');

      await loadRemoteState();
      alert('Empresa, dados e e-mail de acesso excluídos.');
      companiesPage();
    }catch(error){
      alert(error.message||'Erro ao excluir a empresa.');
    }
  }

  async function setCompanyStatus(id,status){
    const company=db.companies.find(x=>x.id===id);
    if(!company) return;

    const backup=JSON.parse(JSON.stringify(company));

    company.status=status;
    if(status==='active' && (!company.expiresAt || daysFrom(company.expiresAt)<0)){
      const date=new Date();
      date.setDate(date.getDate()+30);
      company.expiresAt=date.toISOString().slice(0,10);
    }

    try{
      await saveRemoteNow();
      companiesPage();
    }catch(error){
      Object.assign(company,backup);
      localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
      alert('Não foi possível alterar o status da empresa.');
    }
  }

  async function renewCompany(id){
    const company=db.companies.find(x=>x.id===id);
    if(!company) return;

    const backup=JSON.parse(JSON.stringify(company));
    const base=company.expiresAt && new Date(company.expiresAt)>new Date()
      ? new Date(company.expiresAt)
      : new Date();

    base.setDate(base.getDate()+30);
    company.expiresAt=base.toISOString().slice(0,10);
    company.status='active';

    try{
      await saveRemoteNow();
      companiesPage();
    }catch(error){
      Object.assign(company,backup);
      localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
      alert('Não foi possível renovar a empresa.');
    }
  }
